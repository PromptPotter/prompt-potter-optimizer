# The default every `{name}/dataset.yaml::campaign` and every upload's draft is laid over — what
# one leaves unsaid, it says this. The merge rule is `assets/datasets/CLAUDE.md` § A dataset file is
# a partial. A node's template is its connector's (`Connector.node_templates`).
campaign:
  scoring: label_match(predicted, ground_truth)
  optimization:
    degradation_threshold: 0.4
    budget: {rounds: 5}
