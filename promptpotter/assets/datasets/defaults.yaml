# The default every `{name}/dataset.yaml::campaign` and every upload's draft is laid over — what
# one leaves unsaid, it says this. The merge rule is `assets/datasets/CLAUDE.md` § A dataset file is
# a partial. Every campaign default lives here and nowhere in code: each `CampaignConfig` field this
# file names is required there, and a layer states any subset of an instance's keys. An instance
# whose absence means something else (a `lives`, a judge) is held here by none, so its declaration
# states every key. A node's template is its connector's (`Connector.node_templates`).
campaign:
  sp_budget_origin: 40
  task_framing: committed
  scoring: label_match(predicted, ground_truth)
  display_metric: fitness
  hard_sample_order: info_gain
  dataset_split: {bench: 0, demo: 0, tolerance: 0}
  run_seed: 0
  bench_trigger: manual
  optimization:
    optimizer: potter
    # No shots by default: no split here holds out a demo pool, so a dataset that wants them names
    # its pool and its `k_max` (justlogic does).
    nodes:
      l1_generate: {config: {k_max: 0}}
    # The bench runs every optimizer on one model, so a head-to-head compares optimizers alone:
    # head-to-head jl-optmodel-1 measured MiniMax ~20x faster per call than `qwen/qwen3.7-flash`
    # at no measured loss in held-out lift (docs/research/benchmarks.md); its host is the
    # registry's `default_route`. Never point a schema-bearing node at a new host without one call
    # checking it answers an instance of the schema: Cerebras behind `gpt-oss-120b` returned the
    # schema itself, DigitalOcean behind MiniMax a skeleton of it.
    call_target: {provider: openrouter, model: minimax/minimax-m3.1-flash}
    arm_gate: "off"
    degradation_threshold: 0.4
    degradation_fatal_fastpath: true
    elimination_n_min: 6
    panel_gate: strict
    lift_reference: best_so_far
    origin_gate: strict
    crowning_bar: posterior
    enable_2pl_graduation: true
    budget: {usd: 0.025, rounds: 5}
