source:
  hub: michaelchenkj/JustLogic
  rev: 98603ec6ea79c5da6c2e2c45f0ada2bfedad1e98
  recipe: columns
  split: train
  query: |-
    Premises:
    {paragraph}

    Claim: {question}

    Is the claim TRUE, FALSE, or Uncertain given the premises?
  truth: label
  stratum: depth
  per_stratum: 200

pipeline:
  # JustLogic (Chen 2025): a synthetic, knowledge-independent deductive benchmark, routed through
  # TermNorm /matches with the llm_only pipeline.
  connector: termnorm
  # One model under two ROUTES (`:nitro` and plain), and the `model` axis stays closed on it: this is
  # the L4 inner instrument, and opening the axis would let L1 flip the host while reporting a prompt,
  # which is the confound `route_order` is forbidden for, wearing a model name.
  available_models:
    - openai/gpt-oss-20b:nitro
    - openai/gpt-oss-20b
  description: >-
    Deductive reasoning: decide whether a claim follows from its premises — TRUE, FALSE or
    Uncertain.
  nodes:
    llm_only:
      # Depths 2-4 (iid mix), a wider inner instrument than d23; ':nitro' for throughput. Depth 4
      # lowers the origin and widens the optimizable band. The 2026-07-13 recon read d3+ as
      # collapsed-to-Uncertain and called it a capability wall; this cut RE-TESTS that as a hedge
      # the loop corrects in its first 2-3 rounds: 'Uncertain' is for genuine indeterminacy only.
      description: >-
        Reads the premises and the claim, reasons in a few short steps, and answers with one label.
      config:
        model: openai/gpt-oss-20b:nitro
        output_schema:
          type: object
          properties:
            reasoning:
              type: string
              description: At most five short steps, one line each.
            answer:
              type: string
              enum:
                - 'TRUE'
                - 'FALSE'
                - Uncertain
              description: The label.
          required:
            - reasoning
            - answer
          additionalProperties: false
        answer_fields:
          - answer
      optimizer:
        # `provider` is a cost lever, never an axis.
        param_keys: [temperature, max_tokens, reasoning_effort]
        observation_name: llm_only
        observation_mappings:
          - {pipeline_key: final_ranking, output_field: generated_text, is_llm: true}

campaign:
  display_metric: ability
  scoring:
    per_sample: label_match(predicted, ground_truth)
    # Cost is charged in TOKENS, not seconds. Latency is `tokens x provider_rate`, and only the
    # first factor is the prompt's: measured on one fixed cell set, the rate halved between two
    # runs (median 2.94s -> 1.50s, -49%) while tokens moved +7%. Charging seconds therefore
    # charged the weather, and because round 0 replays cached rows carrying an OLDER run's
    # `step_timings`, the origin alone paid it — 31 of its 40 cells sat above the 2s knee, so it
    # scored 0.371 against 0.500 accuracy while every same-day candidate scored ~1.00x. That
    # inverted the ranking: the origin came LAST for being measured on a slow day.
    #
    # 692 is C0's median `tokens` (input+output) on this dataset+model (40 cells, 2026-09-24), so
    # the origin sits at ~1.0x and only GROWTH past it is charged — which is what we want priced,
    # since the winning prompts grew +7%, +7%, +23% across three rounds while accuracy stayed flat.
    # Re-pin it on any model or origin change; it is a typed constant standing in for an
    # origin-relative term.
    # BOUNDED: the length factor falls from 1.0 at the pin toward 0.92 and never below, so length
    # can cost a cell at most 8% of its worth and accuracy dominates — the guarantee is
    # `docs/concepts/scoring-and-memory.md` § Composite. Smooth, so no token is a cliff.
    # `per_cell` rather than folding it into `per_sample`: a correct-but-expensive answer must stay
    # a HIT, or L1 is sent to repair reasoning that was right.
    per_cell: fitness * (0.92 + 0.08 * 692.0 / max(692.0, tokens))
  # The bench set the headline is read on; the search draws only the rest of the bank. An L4
  # inner cell ignores it — its drawn rows are its whole bank.
  # `demo` opens the shot surface, CAPO's `few_shot` and potter's `l1_generate.k_max` alike.
  # One split for both cuts, so `justlogic/d234-held`'s search and demo pools are `d234`'s rows; its
  # bench is the 30 it ranks plus its bank's 120 bench-only rows (`d234-held/README.md`).
  dataset_split:
    bench: 30
    demo: 50
  optimization:
    # Potter's knobs — the overlay on its manifest's nodes (assets/optimizers/potter/).
    nodes:
      adaptive_queue:
        config:
          sp_budget_round: 34
      l1_generate:
        config:
          n_variants: 3
      pobb:
        config:
          epsilon: 0.3
