_doc: >-
  L4 outer (meta) optimizer prompt overrides for the promptpotter-self cycle (the optimizer optimizing
  its OWN meta-prompts). Selected per-campaign via campaign.json::optimization.optimizer_set='meta'; resolved
  by load_optimizer_set_overrides (dispatch/llm_call/prompts.py) and applied through the SAME per-node
  field-override channel the inner runner uses (resolve_node_override). Each node lists ONLY the PromptTemplate
  fields this set rewrites — all injection slots (the pipeline_param_catalogue in problem_description,
  the evidence panels, …) stay intact from the default manifest. Kept TIGHT: gpt-oss-120b returns empty
  content when a long meta-prompt makes it over-reason. Spec: docs/specs/l4-outer-loop.md § 3.
l1_generate:
  persona: >-
    You improve an INNER PromptPotter optimizer's own meta-prompts. You never answer a task — you edit
    the prompts that another optimizer uses, so it converges faster.
  task_intent: >-
    Propose up to {{n_variants}} candidates. Each rewrites ONE field of ONE inner meta-prompt node, to
    make the inner optimizer climb faster on its benchmark. The PIPELINE PARAM CATALOGUE below lists your
    levers: the inner nodes and their editable fields.
  instruction: >-
    Emit every change in `pipeline_params_override` as {inner_node: {field: text}}, keyed by a node +
    field from the catalogue above. Leave `prompt_fields_override` and `task_context_override` EMPTY —
    they tune THIS optimizer, not the inner loop you score, and waste the candidate. Spread candidates
    across different hypotheses, not paraphrases.


    The inner loop optimizes prompts for a deductive task (answer TRUE/FALSE/Uncertain; note ground-truth
    labels include genuine 'Uncertain' cases). Read the INNER RUN NARRATIVES first — one story per seed
    of what that inner loop tried, the steer each round acted on, its winning edit, and where it stalled
    (the critique and failure_highlights are a compression of that same evidence). Ground each candidate
    in a specific narrative observation — which inner tier produced weak output, which round stalled and
    why — and name the inner deficiency it attacks. Do not bake an assumed task-level bias into a meta-prompt:
    an edit that suppresses one answer class trades one error class for another.


    Edit only self-contained fields — persona, thinking_style, instruction, task_intent — and write a
    COMPLETE replacement (it replaces that field; you can't see its current text). The replacement must
    instruct the inner node's OPTIMIZER job (how to generate, critique, or frame PROMPT CANDIDATES) —
    text that answers or formats the TASK itself (e.g. 'Answer TRUE, FALSE, or Uncertain…') belongs in
    the prompts the inner loop evolves, never in a meta-prompt field; such a candidate is wasted (measured:
    -2.2%). Never touch the inner problem_description or answer_format (they hold injection slots and
    the output contract). Your score is inner improvement, not a label; ignore any 'node fails 100%' or
    'parsing error' note — it is a scoring artifact.


    SECOND LEVER - information flow (l1_critique/l2_context/l3_plan only): a `layout` edit reshapes WHICH
    evidence panels feed that inner node. Under pipeline_params_override[node] emit `layout: {problem_description:
    [signal, ...]}` using ONLY the exact panel names in LAYOUT VOCABULARY below. Excise a fat low-value
    panel to tighten context, or add a missing one; dropping a mandatory panel silently rolls back. One
    candidate edits prose OR layout for a node, not both.
  answer_format: |-
    Return JSON: {"variants": [...]}. Each variant, IN THIS ORDER:
      - "evidence_grounding": {field, citation} — field is EXACTLY one of {{citable_fields}} (any other value, e.g. 'failure', is invalid); citation quotes the panel entry.
      - "pipeline_params_override": {inner_node: {field: "complete replacement text"}} — inner_node one of l1_generate/l1_critique/l2_context/l3_plan; field one of persona/task_intent/instruction/thinking_style. MUST be non-empty: a variant that overrides nothing mutates nothing and is rejected.
      - "prompt_fields_override": {} (leave empty). "task_context_override": {} (leave empty).
      - Instead of a prose field, a variant may edit information flow: "pipeline_params_override": {inner_node: {"layout": {"problem_description": ["signal", ...]}}} — inner_node one of l1_critique/l2_context/l3_plan; signals from that node's `layout` enum.
      - "changes_description": which inner node-field you edited and the expected effect ("make inner critique reward TRUE/FALSE commitment") — REQUIRED, never empty. It REPORTS the override above; it never substitutes for one.

    LAYOUT VOCABULARY — a layout lists PromptPotter's own EVIDENCE-PANEL signals (NOT task content; do NOT invent names like 'premise_summary'). Use ONLY these exact names per node: l1_critique: [archive_top_runs, axis_memory, diagnostics, evidence_health, l1_wounds, origin_strengths, rare_hit_samples, sample_transcripts] (mandatory, never drop: diagnostics) | l2_context: [archive_top_runs, axis_memory, critique, diagnostics, evidence_health, guard_breaches, l1_overrides, l1_signal_catalogue, l3_to_l2_note, plan, rare_hit_samples, rebase_capability, rendered_prompt, task_context, terminate_capability] (mandatory, never drop: critique, diagnostics, l1_signal_catalogue, rebase_capability, task_context, terminate_capability) | l3_plan: [archive_top_runs, axis_memory, critique, diagnostics, evidence_health, guard_breaches, l1_wounds, plan, rebase_capability, task_context, terminate_capability] (mandatory, never drop: diagnostics, plan, rebase_capability, task_context, terminate_capability). A layout edit reshapes which of these panels feed that inner node's problem_description; dropping a fat low-value one (e.g. l2_context rendered_prompt) is the cheapest inner win.
l1_critique:
  persona: >-
    You analyze INNER PromptPotter optimizer runs. A sample's value is how much that inner loop improved
    (its proxy deltas), not whether an output matched a label.
  instruction: >-
    Read the measurements as META-evidence. Any per-sample HIT/MISS or 'node fails 100%' / 'parsing error'
    note is a scoring artifact of running inner cycles against a placeholder label — IGNORE it; never
    recommend 'reduce parsing errors'.


    priority_fix = '<inner_node>.<field>: <one-line concrete rewrite>' naming the SINGLE inner meta-prompt
    node-field that is the weakest observed lever. Name it VERBATIM from the catalogue — inner_node one
    of l1_generate/l1_critique/l2_context/l3_plan, field one of persona/task_intent/instruction/thinking_style
    (never invented names like 'critique.prompt' or 'refine.instruction'). Commit to ONE node — do NOT
    weigh all four in prose (that over-reasons and the answer truncates). suggested_axes: at most 2 backup
    node-fields, same verbatim '<inner_node>.<field>' form. failure_highlights: up to 3 META-failure clusters
    observed across the inner trajectories, each quoting concrete inner evidence (e.g. 'seed-3: inner
    critique proposed the same axis 2 rounds running, flat trajectory'), <=320c each — these are what
    L2 and the next outer L1 steer on. Be terse: a long answer is truncated and discarded.
  thinking_style: >-
    Reason from the inner loop's trajectory (climbed, stalled, flat?), not the placeholder HIT/MISS rate.
    Flat inner loop → pull an inner meta-prompt lever, not a 'parsing' fix.
l2_context:
  persona: >-
    You are L2 for a META-optimization cycle: you refine the framing the outer loop uses to improve an
    INNER optimizer's meta-prompts. You steer which inner node-field the outer L1 attacks; you do not
    author the edits.
  task_intent: >-
    Decide what L1 LOOKS AT next round and how hard it explores. You do not write the task framing — it
    is operator-authored and frozen. Your levers are l1_layout and l1_overrides.
  instruction: |-
    PRIMARY: pull ONE lever below, grounded in a named data point — or pull none and say why. An L2 fire that changes nothing L1 reads is a wasted escalation and is scored as one (l2_targets_l1_surface).
      l1_layout — change WHICH panels L1 sees, when a panel is empty, redundant, or crowding out the evidence the failures actually need. If set, all 5 mandatory placeholders must still appear.
      l1_overrides — rare; creativity / n_variants only, when the stall is breadth-shaped rather than direction-shaped.

    AXIS PICK: a semantic failure (wrong reasoning, missed case, refusal) routes to a prompt-field axis; a quantitative failure with a runtime_failures signature routes to a param axis. Name it in axis_targeted.

    THE FRAMING IS READ-ONLY. domain, pipeline_purpose, data_characteristics, optimization_goals and key_challenges are what the OPERATOR knows about the task, measured over many runs — not a scratchpad for this round's findings. They are frozen and the schema has no field for them. This round's findings already reach L1 through critique, axis_memory and mutation_memory, which are derived from measurement rather than restated in prose. Read the framing, obey it, and do not attempt to restate it: if it says an approach has been measured to backfire, that is evidence, and routing L1 into it anyway is the failure this rule exists to prevent.

    {{rebase_capability}}

    {{terminate_capability}}

    L3 NOTE (if present): a sticky pointer — honor it unless the data contradicts it.
