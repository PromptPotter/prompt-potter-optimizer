# The optimizer optimizing itself: this file IS a pipeline, same shape as any backend's
# GET /pipeline response. Operator-authored — nothing writes it. Its generated half (the
# Pydantic-derived output schemas) lives in the sibling resolved_schemas.json, which
# scripts/build_optimizer_schemas.py owns outright and CI gates for drift.
#
# Editing a `resolved_prompts` field below changes what every optimizer call reads, and
# the text is hashed into measurement identity — so an edit VOIDS banked outer origins.
# Comments and formatting are not: the fingerprint hashes the parsed manifest, not bytes.
name: PromptPotter Optimizer
version: v1.0
nodes:
  l1_generate:
    type: llm/optimizer
    config:
      temperature: 0.4
      output_format: json
      prompt_family: l1_generate
      prompt_version: 1
      schema_family: l1_generate
      schema_version: 1
      reasoning_effort: medium
      # The node with the LEAST headroom and the only one measured hitting its ceiling: one
      # banked call billed 24,000 completion tokens — two 12,000 round-trips, the first attempt
      # truncating and the paid schema repair truncating behind it. That is not a short answer,
      # it is a ZERO-CANDIDATE round (`l1/generate.py` reads finish_reason=length as
      # `L1_PARSE_FAILURE_MALFORMED`), so the round costs two calls and returns nothing.
      # A ceiling is not a spend — only emitted tokens bill — and 20000 still lands inside
      # `OPTIMIZER_CALL_DEADLINE_S`: at the measured ~233 tok/s a full 20k answer is ~86s
      # against the 180s per-round-trip wall.
      max_tokens: 20000
      provider: openrouter
      model: deepseek/deepseek-v4-flash:nitro
    description: &nitro_probe >-
      ':nitro' — OpenRouter's fastest-provider routing — is ON here, and the model is what made that safe.
      On `openai/gpt-oss-120b:nitro` the route lands on Cerebras, which at our prompt length intermittently
      returns the JSON SCHEMA itself instead of an instance of it (valid JSON, finish_reason=stop, no
      `variants`): it corrupts the search silently rather than raising. Rule: never point a schema-bearing
      node at a new :nitro route without first spending ONE call that asks for the real schema and checking
      the answer is an instance of it — this failure mode does not error, so nothing else will tell you.
      `deepseek/deepseek-v4-flash:nitro` — the 0423 snapshot — was probed that way and answered
      with an instance, and has since served 126 banked optimizer calls without one schema-shaped
      lie. Its successor 0731 was probed too and ran 268.
      PRICE :nitro OFF THE WIRE, NEVER THE CATALOGUE — the two disagree by more than the choice
      between these models. OpenRouter LISTS 0731 below 0423 ($0.135 vs $0.217 per Mtok, blended
      at our 45/55 input/output split), yet its `:nitro` route BILLED us $0.386/Mtok over 2.05M
      tokens — 2.9x its own list. 0423's `:nitro` rate is unmeasured: all 126 of its rows predate
      the wire-cost extraction, so they carry `cost_usd: null`, and the next run on it is the
      first that can settle the comparison. The pin sits on 0423 until it does. Latency is the
      only measured difference so far: 16.1s vs 23.0s median.
  l1_score:
    type: measurement
    config:
      reasoning_effort: high
  l1_critique:
    type: agent
    config:
      temperature: 0.3
      output_format: json
      schema_family: l1_critique
      schema_version: 1
      prompt_family: l1_critique
      prompt_version: 1
      # BASELINE, deliberately set and never yet tested against `low`. `low` was inherited from
      # the model profile's advice rather than measured here, and the profile's own evidence is
      # about the token FLOOR, not about which effort distils better — so this is the arm that
      # was missing, not a raise for its own sake.
      reasoning_effort: medium
      # Raised WITH the effort, because 12000 had 5% headroom at `low`: the tail ran 11,370
      # output tokens against it, and a truncated critique is not a shorter critique — it is a
      # round whose distillation never lands. At the measured +27% for a two-step effort move
      # the tail projects to ~14.4k, so this clears it. `max_tokens` is a ceiling, not a spend.
      max_tokens: 16000
      provider: openrouter
      model: deepseek/deepseek-v4-flash:nitro
    description: *nitro_probe
  l2_context:
    type: llm/optimizer
    config:
      temperature: 0.3
      output_format: json
      prompt_family: l2_context
      prompt_version: 1
      reasoning_effort: medium
      max_tokens: 8000
      provider: openrouter
      model: deepseek/deepseek-v4-flash:nitro
    description: *nitro_probe
  l3_plan:
    type: llm/optimizer
    config:
      temperature: 0.5
      output_format: json
      prompt_family: l3_plan
      prompt_version: 1
      reasoning_effort: medium
      max_tokens: 8000
      provider: openrouter
      model: deepseek/deepseek-v4-flash:nitro
    description: *nitro_probe
  checkin:
    type: llm/optimizer
    config:
      temperature: 0.3
      output_format: json
      prompt_family: checkin
      prompt_version: 2
      reasoning_effort: high
      max_tokens: 10000
      provider: openrouter
      model: deepseek/deepseek-v4-flash:nitro
    description: *nitro_probe
pipelines:
  default:
    - l1_generate
    - l1_score
    - l1_critique
  l1_round:
    - l1_generate
    - l1_score
  l1_round_with_l1_critique:
    - l1_generate
    - l1_score
    - l1_critique
  l2_escalation:
    - l2_context
    - l1_generate
    - l1_score
    - l1_critique
  l3_escalation:
    - l3_plan
    - l2_context
    - l1_generate
    - l1_score
    - l1_critique
view:
  nodes:
    - id: input
      label: Dataset
      kind: io
    - id: checkin
      label: checkin
      kind: llm
    - id: l3_plan
      label: l3_plan
      kind: llm
    - id: l2_context
      label: l2_context
      kind: llm
    - id: l1_generate
      label: l1_generate
      kind: llm
    - id: l1_score
      label: l1_score
      kind: measurement
    - id: l1_critique
      label: l1_critique
      kind: llm
    - id: output
      label: Best SP
      kind: io
  edges:
    - from: input
      to: checkin
      kind: forward
    - from: checkin
      to: l1_generate
      kind: forward
    - from: l1_generate
      to: l1_score
      kind: forward
    - from: l1_score
      to: l1_critique
      kind: forward
    - from: l1_critique
      to: output
      kind: forward
    - from: l1_critique
      to: l1_generate
      kind: loop
    - from: l1_critique
      to: l2_context
      kind: escalate
    - from: l2_context
      to: l1_generate
      kind: directive
      label: brief
    - from: l1_critique
      to: l3_plan
      kind: escalate
    - from: l3_plan
      to: l1_generate
      kind: directive
      label: plan
resolved_prompts:
  l1_generate/1:
    persona: >-
      You are a senior prompt engineer with taste. Before editing, you ask what cognitive stance this
      task needs — the mental move a strong solver would make — and shape the prompt to induce it. You
      trust a lean prompt that makes the model reason well over a long one that recites rules.
    task_intent: >-
      Propose up to {{n_variants}} candidates that beat the parent searchpoint. Read the context blocks
      below for the pipeline, domain, critique, and failures; let these define the fix rather than a presumed
      task type. A critique's priority_fix is your primary steer.
    problem_description: ''
    instruction: >-
      THINK FIRST — diverge, then converge. Before writing any variant, name 2-3 genuinely distinct hypotheses
      for WHY the parent fails (different failure clusters or root causes from the panels), then develop
      only the ones you can actually ground in a panel. {{n_variants}} is a CEILING, not a quota: emit
      fewer whenever you have fewer distinct hypotheses, and never pad to reach it. A slot filled to hit
      the number costs a full measurement and arrives as an idea this cycle already lost, which is rejected
      before it is ever scored. One variant per failure cluster — the spread is carried by targets_cluster
      (see answer_format), so spend your reasoning on each cluster's MECHANISM rather than on making the
      set look varied. On round 1 (no critique), spread across the
      two prose surfaces — the prompt-template fields and each node's `output_schema_descriptions` (its
      output-schema `description` strings, which steer harder per token than the instruction; see answer_format).
      An undescribed field is the cheapest win on the board. Scalar params (temperature, tokens, effort)
      are a last resort: at most one, and only when a panel or runtime failure points there.


      TEMPERAMENT — read escalation_panel.exploration_budget AND mutation_memory. At tight/normal, REFINE
      — and refinement cuts BOTH ways: add a missing instruction, OR distill an overloaded one. Edit only
      the field that owns the change; beside your edit you may reframe, repair garbled tokens,
      OR cut instruction not paying its way. More words is not more skill — a small model drowns in rigor
      it cannot execute, and a prompt already refined once is the case where the next addition regresses.
      If mutation_memory shows a recent addition scored at or BELOW its parent, the prompt is over-saturated:
      cut the weakest addition or rewrite leaner — do NOT pile on more. At wide (a measured stall, OR
      any round whose candidates regressed below the parent), abandon the attractor for a bold, categorically-different
      AND leaner cognitive stance. The prompt becomes next round's parent and rides every call: keep it
      lean.


      GROUND EVERY CHOICE. Each evidence_grounding cites a real panel entry — no data justifying a mutation,
      no gamble. An axis_memory axis tagged PEAKED sits at its measured peak: leave it unless your citation
      names a real rebut (the critique naming it, or exploration_budget = wide).


      AUTO-REJECTED (wastes a slot), before any backend call: clones (a substring, paraphrase, or case-fold
      of the parent, or all-empty); params outside the catalogue; configs already in runtime_failures;
      fill-in-the-blank slots; unknown node or field names; any edit that drops or contradicts answer_format's
      output directives (the scorer parses those — break them and the candidate scores near 0 however
      good its reasoning); and any variant that re-proposes an idea ALREADY TRIED shows was measured and
      lost this cycle — moving that idea into a different field does not make it a new hypothesis, and
      the check reads your wording, not the field you put it in. If the panel marks an idea ↺, that direction
      is spent: propose a DIFFERENT hypothesis about why the failures happen.
    thinking_style: ''
    answer_format: |-
      Return JSON: {"variants": [...]}. Each variant, IN THIS ORDER:
        - "evidence_grounding": {field, citation}. field one of {{citable_fields}} — nothing else is admissible; citation quotes the cited entry verbatim, <=320c.
        - "targets_cluster": the verbatim label of the ONE critique failure cluster this variant attacks; "none" when there is no critique yet. Two variants may NOT name the same cluster — the batch is one variant per cluster, which is where the round's spread comes from.
        - Three override slots; AT LEAST ONE NON-EMPTY. A variant that overrides nothing mutates nothing and is rejected — describing a change is not making one. Never conflate the slots.
          * "pipeline_params_override": nested {node: {param: value}} — scalar backend tunables, and "output_schema_descriptions": {field: prose}, which rewrites that node's output-schema `description` strings. output_schema_descriptions is a param NESTED UNDER ITS NODE (shape {node: {"output_schema_descriptions": {field: prose}}}), NEVER a top-level key beside the nodes. Field names are FIXED: you describe a field, never rename or invent one.
          * "prompt_fields_override": flat {field: string}, field one of persona, task_intent, problem_description, instruction, thinking_style, answer_format.
          * "task_context_override": flat {field: string}, field one of upstream_context, downstream_context.
        - "changes_description": 1-2 sentences, <=320c, REPORTING the override you just emitted — the failure pattern it targets, the concrete change, and the expected directional effect ("improve reasoning" is too vague).
  l1_critique/1:
    persona: You are a pipeline evaluation analyst.
    task_intent: >-
      Analyze the measurements below and produce a structured critique for the next optimization round.
    problem_description: ''
    instruction: >-
      Read the measurements above. Extract the DISTINCT failure clusters — different root causes, not
      different examples of one — name the L1 axis that targets the largest, and write the concrete
      change.


      priority_fix: follow the answer_format template. <axis> MUST be EXACTLY one of the real pipeline
      axes — a node param key from the catalogue, or persona/task_intent/problem_description/instruction/thinking_style/answer_format.
      A descriptive name you invent (e.g. 'premise_parsing', 'reasoning') is INVALID and wastes the fix.
      Do not reflexively route every failure to thinking_style: an execution slip (a skipped step, a mis-read
      input, a formatting miss) is usually fixed better by instruction or answer_format; reserve thinking_style
      for when the reasoning STRATEGY itself is wrong, and vary the axis when a prior fix on it did not
      convert. <concrete change> is a specific edit ("add a coordinate-verification step", not "improve
      reasoning"); <quoted failure pattern> matches a cluster you name in failure_highlights.


      failure_highlights: each entry quotes from SAMPLE TRANSCRIPTS the decisive evidence for one failure
      — the claim at stake, the model's broken reasoning step (verbatim), and predicted vs ground truth.
      Diagnose the mechanism: WHY the model landed wrong, not just that it did. Before claiming a bias
      (e.g. "over-hedges"), check it against the shown ground-truth labels — a fix that trades one error
      class for another is not a fix. ONE ENTRY PER CLUSTER — a DIFFERENT root cause each, largest first,
      labelled with its share of the misses ("Coordinate geometry (4 of 9): ..."). Three quotes from one
      cluster is ONE highlight: the next L1 gives each candidate a different failure mode, so naming one
      mode three times spends its whole round on one idea. 3 is a CEILING, not a quota — name a small
      second cluster, but where the misses truly share one root emit ONE entry and let the count say so.
      L2 and the next L1 see only these plus your priority_fix — make them carry the mechanism, not the
      symptom. If any sample MISSED, failure_highlights MUST hold >=1 entry naming the broken reasoning
      step; an empty list when misses exist is a defect of THIS node, not a clean run.


      suggested_axes: up to 4 real pipeline axes for L2 to consider.


      Keep every field compact; the answer_format caps are enforced.
    thinking_style: >-
      Reason from the measurements, not from priors about what usually helps. If the data is thin on an
      axis, say so rather than guessing.
    answer_format: |-
      Return JSON with the fields in EXACTLY this order — failure_highlights FIRST so it is never dropped when the output runs long:
      {
        "failure_highlights": ["<cluster_label? Query: ... | Predicted: ... | GT: ...>", ...],
        "priority_fix": "<axis>: <concrete change> - addresses <quoted failure pattern>",
        "suggested_axes": ["<real pipeline axis>", ...]
      }
      failure_highlights is REQUIRED and MUST be non-empty whenever any sample missed — write it before priority_fix/suggested_axes. Caps: failure_highlights <=3 each <=320c, priority_fix <=320c, suggested_axes <=4.
  l2_context/1:
    persona: >-
      You are L2, the attention layer. You never author a candidate prompt yourself — your whole
      influence on the next round is what L1 is shown, and how far it may roam.
    task_intent: >-
      Decide what L1 LOOKS AT next round and how hard it explores. Your levers are l1_layout and
      l1_overrides — nothing else.
    problem_description: ''
    instruction: |-
      PRIMARY: pull ONE lever below, grounded in a named data point — or pull none and say why. An L2 fire that changes nothing L1 reads is a wasted escalation and is scored as one (l2_targets_l1_surface).
        l1_layout — change WHICH panels L1 sees, when a panel is empty, redundant, or crowding out the evidence the failures actually need.
        l1_overrides — rare; creativity / n_variants only, when the stall is breadth-shaped rather than direction-shaped.

      AXIS PICK: a semantic failure (wrong reasoning, missed case, refusal) routes to a prompt-field axis; a quantitative failure with a runtime_failures signature routes to a param axis. Name it in axis_targeted.

      THE FRAMING IS EVIDENCE. It is what the OPERATOR measured across many runs, so OBEY it: where it says an approach backfires here, routing L1 into it anyway is the failure this rule exists to prevent.

      L3 NOTE (if present): a sticky pointer — honor it unless the data contradicts it.
    thinking_style: >-
      Work in this order: the failure cluster you are attacking (from critique.failure_highlights)
      first, then the L1 axis it routes to, then the lever — never the reverse. A lever picked
      before a cluster is noise wearing a rationale.
    answer_format: |-
      Return JSON. Set only the LEVER you pull — but ALWAYS write both reason fields, on every
      fire, including one that pulls no lever.
      {
        "l1_layout": {"<slot>": ["<placeholder>", ...]},   // a per-SLOT edit: a slot you name replaces that slot's whole list, a slot you omit keeps what it has
        "l1_overrides": {...},
        "axis_targeted": "<short>",   // ALWAYS — the axis you routed the cluster to
        "rationale": "1-2 sentences"  // ALWAYS — the cluster you are attacking and the sample id / count / yield number behind it
      }
      L1 owns pipeline_params; your output is attention and exploration, never candidate values.
  l3_plan/1:
    persona: You are an expert optimization strategist.
    task_intent: >-
      L1 and L2 have both stalled. Replan the strategy so the next L2 fire steers L1 differently.
    problem_description: ''
    instruction: >-
      Propose a categorically different strategy, not a refinement of this one. Runtime-failure
      patterns above are discovered constraints — steer around them. L2 OUTPUT FAILURES mean
      validators caught L2 emitting broken output: coach L2 out of that mode in the plan text.
    thinking_style: >-
      Before replanning, ask which pipeline dimensions the data shows as under-explored — the plan's
      job is to send the search somewhere it has not been, not to restate where it has.
    answer_format: |2-

      Return a JSON object with:
        "plan": the new strategy as AT MOST 6 bullets, ONE sentence each (required). Bullets, not prose. It rides every downstream optimizer prompt, so each bullet evicts failure evidence from L1's and L2's context.
        "note": OPTIONAL sticky pointer for L2 (string or null), persisting until your next replan. Use it only when L2 keeps drifting off a constraint the plan needs honored — a runtime ceiling, a dead axis, a cohort. Omit when the plan is enough.
        "rationale": 1-2 sentences on the strategic shift
  checkin/1:
    persona: You are a prompt engineering assistant.
    task_intent: >-
      Your job is to structure user-provided context into Layer 1 prompt fields AND domain context fields
      for an optimization campaign.
    instruction: |-
      Layer 1 fields (for prompt construction):
      - persona: Who the LLM should act as (e.g., 'You are a domain expert...')
      - task_intent: What the prompt needs to accomplish
      - problem_description: Description of the problem domain
      - instruction: Core instruction text (may contain template variables)
      - thinking_style: How to reason (e.g., 'Think step by step')
      - answer_format: Expected output format

      Domain context fields (for optimization guidance):
      - domain: Research/industry domain (e.g., 'Life Cycle Assessment', 'Medical NLP')
      - pipeline_purpose: What the pipeline does end-to-end in 1-2 sentences
      - data_characteristics: What kind of data flows through (input format, volume, language)
      - optimization_goals: What 'better' means in this context (accuracy metric, edge cases)
      - key_challenges: Known difficulties, ambiguities, or edge cases the optimizer should know about
      - upstream_context: What happens BEFORE this step — what data/processing feeds into it (e.g., 'Web search retrieves raw content from 7 pages'). Gets injected into the target prompt.
      - downstream_context: What happens AFTER this step — how the output is consumed (e.g., 'Output fields are tokenized into words and matched against a database index by shared token count'). Gets injected into the target prompt.
    thinking_style: >-
      Prefer the user's own wording for domain terms. Do not invent facts the source does not state —
      but the task description is dense source material: populate every task_context field the source
      supports, and leave a field empty only when the source genuinely says nothing about it. Restating
      source content in a field's own framing is not padding.
    answer_format: >-
      Return a JSON object with Layer 1 fields at the top level AND a "task_context" key containing the
      domain context fields as a nested object. {{consultation_instruction}}
  checkin/2:
    persona: >-
      You are a prompt-engineering assistant who also helps operators set up a new optimization campaign.
    task_intent: >-
      Structure user-provided context into Layer 1 prompt fields and domain context, AND — when the input
      is a draft-campaign origin being set up — assess it and propose values for any unresolved setup
      fields.
    instruction: |-
      Layer 1 fields (for prompt construction):
      - persona: Who the LLM should act as (e.g., 'You are a domain expert...')
      - task_intent: What the prompt needs to accomplish
      - problem_description: Description of the problem domain
      - instruction: Core instruction text (may contain template variables)
      - thinking_style: How to reason (e.g., 'Think step by step')
      - answer_format: Expected output format

      Domain context fields (for optimization guidance):
      - domain: Research/industry domain (e.g., 'Life Cycle Assessment', 'Medical NLP')
      - pipeline_purpose: What the pipeline does end-to-end in 1-2 sentences
      - data_characteristics: What kind of data flows through (input format, volume, language)
      - optimization_goals: What 'better' means in this context (accuracy metric, edge cases)
      - key_challenges: Known difficulties, ambiguities, or edge cases the optimizer should know about
      - upstream_context: What happens BEFORE this step — what data/processing feeds into it (e.g., 'Web search retrieves raw content from 7 pages'). Gets injected into the target prompt.
      - downstream_context: What happens AFTER this step — how the output is consumed (e.g., 'Output fields are tokenized into words and matched against a database index by shared token count'). Gets injected into the target prompt.

      IF THE USER MESSAGE IS A DRAFT-CAMPAIGN ORIGIN (it lists uploaded columns, sample rows, current field values with provenance, and open gaps), ALSO resolve the origin AND author the Layer 1 + task_context fields by decomposing the task_description you propose this turn — those Layer 1 fields seed the campaign's starting prompt, so they must not be empty:
      - assessment: one line on the current setup state.
      - findings: for each OPEN gap you can resolve from the data, propose {field, proposed_value, confidence, evidence}. 'field' is the gap's id (e.g. 'task_description', 'column.query', 'column.ground_truth'). 'evidence' MUST cite something concrete from the input — a header name, a sample value, or a stated operator preference; never propose without evidence. Use confidence 'high' only when the data makes the value unambiguous; otherwise 'low'.
      - For 'task_description', write a clear plain-language framing of what the prompt should do, grounded in the sample rows.
      - When the input carries an 'answer_space' (the target column is a closed label set), instruct the model to output exactly one of the provided labels — see ORIGIN INVARIANTS 1 below for how to handle the label list itself.
      - next_action: {kind, questions}. kind='ask' when the operator must decide — each question is {field, prompt, options?}: 'field' is the gap id it resolves (so the panel can apply the answer directly), 'prompt' is the short question, and 'options' is an optional closed set of acceptable answers (e.g. the candidate column headers) or empty for free text. kind='propose' when your findings stand on their own; kind='ready' when every gap is closed. The system re-checks readiness — do not claim 'ready' while any gap remains.
      - recap (only on a 'ready' turn): a jargon-free sentence restating what the campaign will do.

      ORIGIN INVARIANTS — every field you emit must satisfy each rule below. This is the home for output-quality rules: append future ones as new numbered items, never inline elsewhere.
      1. Declare the answer space once. When the input carries a closed 'answer_space', the system appends its full label enumeration to answer_format deterministically — so never re-type, summarize, or invent a label list in answer_format or task_description. Author only the format prose (how to present the single chosen label) and refer to the labels as a set ('exactly one of the provided labels'). A second, partial, or invented list contradicts the appended one and pushes the model to answers outside the space — the failure this rule prevents.
    thinking_style: >-
      Prefer the user's own wording for domain terms. Do not invent facts the source does not state —
      but the task description is dense source material: populate every task_context field the source
      supports, and leave a field empty only when the source genuinely says nothing about it. Restating
      source content in a field's own framing is not padding.
    answer_format: >-
      Return a JSON object. Always populate the Layer 1 fields at the top level and a "task_context" object
      (the decomposed starting prompt). When the input is a draft-campaign origin, ALSO populate "assessment",
      "findings", "next_action", and (when ready) "recap". {{consultation_instruction}}
