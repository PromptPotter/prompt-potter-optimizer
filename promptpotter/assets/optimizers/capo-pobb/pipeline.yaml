# capo-pobb — CAPO's walk with potter's `pobb` race in place of its paired t-test: a mix of two
# optimizers' members, selected with `optimization.optimizer: capo-pobb`. Every other node keeps
# CAPO's paper configuration; `capo/pipeline.yaml` cites each value's section.
name: capo-pobb
version: v1.0
# A mix answers to no paper: the picker serves it as the bench's own.
paper: null
available_models:
  - qwen/qwen3.7-flash
  - openai/gpt-6-luna
  - deepseek/deepseek-v4-flash:nitro
  - openai/gpt-oss-20b:nitro
  - openai/gpt-oss-120b:nitro
nodes:
  demo_pool:
    type: algorithm
    config:
      active: ['*']
  blocks:
    type: sampler
    config:
      block_size: 30
      max_blocks: 10
  mating:
    type: algorithm
    config:
      offspring: 4
  capo_crossover:
    type: llm
    config:
      prompt_family: capo_crossover
      prompt_version: 1
      temperature: 1.0
      reasoning_effort: none
      max_tokens: 8000
      provider: openrouter
      model: qwen/qwen3.7-flash
      rewrites: prompt
      field: instruction
  shot_crossover:
    type: algorithm
    config: {}
  capo_mutate:
    type: llm
    config:
      prompt_family: capo_mutate
      prompt_version: 1
      temperature: 1.0
      reasoning_effort: none
      max_tokens: 8000
      provider: openrouter
      model: qwen/qwen3.7-flash
      rewrites: prompt
      field: instruction
  few_shot:
    type: algorithm
    config:
      k_max: 5
  population_rejoin:
    type: algorithm
    config: {}
  # Potter's race at potter's configuration: an arm keeps measuring only while it could still
  # beat the leader (`methods/candidate-elimination.md`).
  pobb:
    type: eliminator
    config:
      epsilon: 0.15
      epsilon_floor: 0.15
      lock_in: 0.95
      lock_in_n_min: 8
      epsilon_elimination: true
      leader_lock_in: false
  score:
    type: measurement
    config: {}
  population:
    type: selector
    config:
      size: 10
  capo_init:
    type: llm
    config:
      prompt_family: capo_init
      prompt_version: 1
      temperature: 1.0
      reasoning_effort: none
      max_tokens: 8000
      provider: openrouter
      model: qwen/qwen3.7-flash
      size: 10
      k_max: 5
      length_penalty: 0.05
      rewrites: prompt
      field: instruction
  operator_seat:
    type: algorithm
    config:
      k_max: 5
pipelines:
  run_init:
    - demo_pool
  default:
    - blocks
    - mating
    - capo_crossover
    - shot_crossover
    - capo_mutate
    - few_shot
    - population_rejoin
    - pobb
    - score
    - population
  initial_population:
    - capo_init
  arm_gate:
    - operator_seat
initial_population_walks: before_default
resolved_prompts:
  capo_crossover/1:
    instruction: |-
      You receive two prompts for the following task: {{task_description}}
      Please merge the two prompts into a single coherent prompt. Maintain the key linguistic features from both original prompts:
      Prompt 1: {{mother}}
      Prompt 2: {{father}}

      Return the new prompt in the following format:
      <prompt>new prompt</prompt>.
  capo_mutate/1:
    instruction: |-
      You receive a prompt for the following task: {{task_description}}
      Please rephrase the prompt, preserving its core meaning while substantially varying the linguistic style.
      Prompt: {{instruction}}

      Return the new prompt in the following format:
      <prompt>new prompt </prompt>
  capo_init/1:
    instruction: |-
      Please create diverse prompts for the following task. They should be linguistically diverse (but always in English) and have varying lengths and complexities. This means some consist only of a short sentence with a rather high-level description while others elaborate on the task in little more detail.
      Task: {{task_description}}
      Explicitly state this expected format as part of the prompts. Create overall 15 prompts within quotes as an array:
