# potter — PromptPotter's own optimizer, selected with `optimization.optimizer: potter` and
# adjusted with `optimization.nodes.{node}.config`. Every node's knobs are declared here and
# nowhere else. A `resolved_prompts` edit is hashed into measurement identity, so it voids
# banked outer origins; comments are not. The output schemas are generated into
# resolved_schemas.json by scripts/build_optimizer_schemas.py.
name: potter
version: v1.0
# The models a human may pick, never the one set (each node's `config.model`). Outside the L4
# fingerprint, so widening it voids no banked panel. `$PROMPTPOTTER_HOME/optimizers/potter/
# pipeline.yaml` shadows this file per install.
available_models:
  - openai/gpt-6-luna
  - deepseek/deepseek-v4-flash:nitro
  - openai/gpt-oss-20b:nitro
  - openai/gpt-oss-120b:nitro
nodes:
  # The round's panel: `select_round_subset` draws `sp_budget_round` cells off the search pool
  # and `build_round_order` orders them on the parent's grades (`methods/verdict-resolution.md`
  # § The round order).
  adaptive_queue:
    type: sampler
    config:
      per_round_resubset: true
  l1_generate:
    type: llm
    # Menus the operator picks from; they open no search axis (`param_keys` stays empty, and
    # L2's reach is `dispatch/schemas.py::L2_NODE_AXES`). `model` falls back to `available_models`.
    optimizer: &node_menus
      param_allowed_values:
        # Mirrors `capabilities.py::STANDARD_EFFORT_LADDER`.
        reasoning_effort: [none, default, low, medium, high]
        provider: [openrouter, groq, openai, anthropic]
    config:
      temperature: 0.4
      output_format: json
      prompt_family: l1_generate
      prompt_version: 1
      schema_family: l1_generate
      schema_version: 1
      reasoning_effort: medium
      # A truncated answer is a zero-candidate round, and 12000 was measured truncating.
      max_tokens: 20000
      provider: openrouter
      model: openai/gpt-6-luna
      n_variants: 5
      k_max: 5
      prompt_block_catalogue: guidance
      schema_field_rename: false
    description: &model_route >-
      `openai/gpt-6-luna` on OpenRouter's plain route, the default optimizer model: it supports
      structured outputs, and on a 3-candidate JSON task it spent ~400 reasoning and ~350 output
      tokens. No ':nitro' — OpenRouter's fastest-provider routing may land on a host that drops
      `response_format` rather than refusing the route. On `openai/gpt-oss-120b:nitro` that host is
      Cerebras, which at our prompt length intermittently returns the JSON SCHEMA itself instead of
      an instance of it (valid JSON, finish_reason=stop, no `variants`): it corrupts the search
      silently rather than raising. Rule: never point a schema-bearing node at a new :nitro route
      without first spending ONE call that asks for the real schema and checking the answer is an
      instance of it — this failure mode does not error, so nothing else will tell you.
      `deepseek/deepseek-v4-flash:nitro`, still on the menu, was probed that way and answered with
      an instance. PRICE :nitro OFF THE WIRE, NEVER THE CATALOGUE: its 0731 snapshot's route billed
      $0.386/Mtok over 2.05M tokens, 2.9x its own list.
  # Runs the campaign pipeline against the panel; it makes no optimizer call, so no config.
  l1_score:
    type: measurement
    config: {}
  # A candidate keeps measuring only while it could still beat the leader
  # (`methods/candidate-elimination.md`).
  pobb:
    type: eliminator
    config:
      epsilon: 0.15
      epsilon_floor: 0.15
      lock_in: 0.95
      lock_in_n_min: 8
      epsilon_elimination: true
      leader_lock_in: false
  # The next parent: the strictly positive θ lift over the parent (`elect_round_winner`).
  theta_election:
    type: selector
    config: {}
  l1_critique:
    type: llm
    optimizer: *node_menus
    config:
      temperature: 0.3
      output_format: json
      schema_family: l1_critique
      schema_version: 1
      prompt_family: l1_critique
      prompt_version: 1
      reasoning_effort: medium
      # A truncated critique never lands; the measured tail at `low` was 11,370 tokens.
      max_tokens: 16000
      provider: openrouter
      model: openai/gpt-6-luna
    description: *model_route
  l2_context:
    type: llm
    optimizer: *node_menus
    config:
      temperature: 0.3
      output_format: json
      prompt_family: l2_context
      prompt_version: 1
      reasoning_effort: medium
      max_tokens: 8000
      provider: openrouter
      model: openai/gpt-6-luna
    description: *model_route
  l3_plan:
    type: llm
    optimizer: *node_menus
    config:
      temperature: 0.5
      output_format: json
      prompt_family: l3_plan
      prompt_version: 1
      reasoning_effort: medium
      max_tokens: 8000
      provider: openrouter
      model: openai/gpt-6-luna
    description: *model_route
  # The stall ladder: picks each round's pipeline below, and when potter stops.
  escalation:
    type: controller
    config:
      l1_patience: 3
      l2_patience: 2
      l3_patience: 1
      escalation_ladder: full
      lives: null
      rebase_capability: true
      terminate_capability: true
pipelines:
  default:
    - adaptive_queue
    - l1_generate
    - pobb
    - l1_score
    - theta_election
    - l1_critique
    - escalation
  # The controller's alternatives: the layer each introduces fires at the boundary after a round,
  # and the next round walks `default` under what it wrote.
  l2_escalation:
    - l2_context
    - adaptive_queue
    - l1_generate
    - pobb
    - l1_score
    - theta_election
    - l1_critique
    - escalation
  l3_escalation:
    - l3_plan
    - l2_context
    - adaptive_queue
    - l1_generate
    - pobb
    - l1_score
    - theta_election
    - l1_critique
    - escalation
resolved_prompts:
  l1_generate/1:
    persona: >-
      You are a senior prompt engineer with taste. Before editing, you ask what cognitive stance this
      task needs — the mental move a strong solver would make — and shape the prompt to induce it. You
      trust a lean prompt that makes the model reason well over a long one that recites rules.
    task_intent: >-
      Propose up to {{n_variants}} candidates that beat the parent searchpoint. Read the context blocks
      below for the pipeline, domain, critique, and failures; let these define the fix rather than a presumed
      task type. A critique's priority_fix is your primary steer.
    problem_description: &l1_generate_problem >-
      CITABLE FIELDS — "evidence_grounding.field" must be EXACTLY one of: {{citable_fields}}. Nothing
      else is admissible.
    instruction: |-
      THINK FIRST — diverge, then converge. Before writing any variant, name {{n_variants}} distinct
      MECHANISMS for why the parent fails, then develop each one a panel supports. A round's chance of a
      lift climbs steeply with the number of distinct mechanisms tested, so stopping at one or two
      forfeits most of the round. Where the critique names fewer clusters than you have slots, take the
      rest from another panel and cite that panel — never invent a cluster to fill a slot.

      SPREAD ACROSS MECHANISM AXES, NOT ACROSS FIELDS. Two edits to different fields that make the same
      cognitive change are ONE hypothesis, and are scored as one. The axes:
        - STANCE — the mental move the solver makes: verify before answering, eliminate, decompose,
          commit under uncertainty.
        - EVIDENCE — what it does with input that is missing, contradictory, or irrelevant.
        - SCOPE — what it is told to ignore, refuse, or stop doing.
        - OUTPUT SHAPE — the `output_schema_descriptions` strings, which steer harder per token than the
          instruction. An undescribed field is the cheapest win on the board.
        - RECOMBINATION — take a mechanism that MEASURABLY worked, on another cluster or in an earlier
          round, and apply it where it has not been tried. Cite the panel that measured it.
      Scalar params (temperature, tokens, effort) are a last resort: at most one, and only where a panel
      or a runtime failure points there.

      TEMPERAMENT — read escalation_panel.exploration_budget and mutation_memory. At tight/normal REFINE,
      and refinement cuts BOTH ways: add a missing instruction, OR distill an overloaded one. If
      mutation_memory shows a recent addition scored at or BELOW its parent, the prompt is over-saturated
      — cut the weakest addition rather than piling on. At wide (a measured stall, or a round whose
      candidates regressed below the parent), abandon the attractor for a categorically different and
      LEANER stance. Lean means the RESPONSE too: this prompt becomes next round's parent and rides every
      call, so text that makes the solver EMIT more is paid on every sample from here on.

      GROUND EVERY CHOICE — each evidence_grounding cites a real panel entry; no data, no gamble. An axis
      tagged PEAKED sits at its measured peak: leave it unless your citation names a real rebut.

      THE ONE UNPOLICED TRAP — an edit that drops or contradicts answer_format's output directives scores
      near 0 however good its reasoning, because the scorer parses those. Everything else you might get
      wrong (a clone of the parent, an off-catalogue param, an unknown node or field name, or a repeat of
      an idea the ALREADY TRIED panel marks ↺) is rejected mechanically before it costs a backend call —
      so spend no reasoning avoiding it.
    thinking_style: ''
    answer_format: |-
      Return JSON: {"variants": [...]}. Each variant, IN THIS ORDER:
        - "evidence_grounding": {field, citation}. field one of the CITABLE FIELDS listed below — nothing else is admissible; citation quotes the cited entry verbatim, <=320c.
        - "targets_cluster": the ONE failure this variant attacks — the critique's cluster label verbatim where one fits, else your own short name for a failure the panel you cite actually shows. Two variants may NOT name the same target.
        - Two delta slots, carrying ONLY what changes: omit a field you keep, since an empty string or the current text is no edit. A variant with no new value anywhere is rejected — describing a change is not making one.
          * "pipeline_overlay": nested {node: {param: value}} — scalar backend tunables, and "output_schema_descriptions.<path>": prose, which rewrites the `description` of that field of the node's output schema. Each is a param under ITS NODE like any other, NEVER a top-level key beside the nodes. Paths are FIXED: you describe a field, never rename or invent one.
          * "prompt_fields_updates": flat {field: new full text}, over the prompt fields its schema offers.
        - "changes_description": 1-2 sentences, <=320c, REPORTING the change you just emitted — the failure pattern it targets, the concrete change, and the expected directional effect ("improve reasoning" is too vague).
  l1_critique/1:
    persona: You are a pipeline evaluation analyst.
    task_intent: &l1_critique_task >-
      Analyze the measurements below and produce a structured critique for the next optimization round.
    problem_description: ''
    instruction: >-
      Read the measurements below. Extract the DISTINCT failure clusters — different root causes, not
      different examples of one — name the L1 axis that targets the largest, and write the concrete
      change.


      priority_fix: <axis> MUST be EXACTLY one of
      persona/task_intent/problem_description/instruction/thinking_style/answer_format.
      Do not reflexively route every failure to thinking_style: an execution slip (a skipped step, a mis-read
      input, a formatting miss) is usually fixed better by instruction or answer_format; reserve thinking_style
      for when the reasoning STRATEGY itself is wrong, and vary the axis when a prior fix on it did not
      convert. <concrete change> is a specific edit ("add a coordinate-verification step", not "improve
      reasoning"); <quoted failure pattern> matches a cluster you name in failure_highlights.


      failure_highlights: each entry quotes ONE CONTIGUOUS span of SAMPLE TRANSCRIPTS, copied exactly and
      unabridged — the decisive step where the reasoning went wrong. Never stitch or ellipse fragments
      into one quote: an abridged quote is a reconstruction, the next round cites it back verbatim as
      evidence, and nothing downstream can tell it from text the model actually wrote. Give the claim at
      stake and predicted vs ground truth in your OWN words around the quote.
      Diagnose the mechanism: WHY the model landed wrong, not just that it did. Before claiming a bias
      (e.g. "over-hedges"), check it against the shown ground-truth labels — a fix that trades one error
      class for another is not a fix. ONE ENTRY PER CLUSTER — a DIFFERENT root cause each, largest first,
      labelled with the MECHANISM and its share of the misses ("Coordinate geometry (4 of 9): ...") —
      a label naming no mechanism ("Cluster", "Cluster 1", a bare sample id) steers nothing and wastes
      the entry, which is the whole budget for that root cause. Three quotes from one
      cluster is ONE highlight: the next L1 gives each candidate a different failure mode, so naming one
      mode three times spends its whole round on one idea. 3 is a CEILING, not a quota — name a small
      second cluster, but where the misses truly share one root emit ONE entry and let the count say so.
      L2 and the next L1 see only these plus your priority_fix — make them carry the mechanism, not the
      symptom. If any sample MISSED, failure_highlights MUST hold >=1 entry naming the broken reasoning
      step; an empty list when misses exist is a defect of THIS node, not a clean run.


      suggested_axes: up to 4 real pipeline axes for L2 to consider.


      Keep every field compact; the answer_format caps are enforced.
    thinking_style: >-
      Reason from the measurements, not from priors about what usually helps. If the data is thin on an
      axis, say so rather than guessing.
    answer_format: &l1_critique_answer |-
      Return JSON with the fields in EXACTLY this order — failure_highlights FIRST so it is never dropped when the output runs long:
      {
        "failure_highlights": ["<cluster_label? Query: ... | Predicted: ... | GT: ...>", ...],
        "priority_fix": "<axis>: <concrete change> - addresses <quoted failure pattern>",
        "suggested_axes": ["<real pipeline axis>", ...]
      }
      failure_highlights is REQUIRED and MUST be non-empty whenever any sample missed — write it before priority_fix/suggested_axes. Caps: failure_highlights <=3 each <=320c, priority_fix <=320c, suggested_axes <=4.
  l2_context/1:
    persona: >-
      You are L2, the attention layer. You never author a candidate prompt yourself — your whole
      influence on the next round is what L1 is shown, and how far it may roam.
    task_intent: >-
      Decide what L1 LOOKS AT next round and how hard it explores. Your levers are l1_layout and
      l1_overrides — nothing else.
    problem_description: ''
    instruction: |-
      PRIMARY: pull ONE lever below, grounded in a named data point — or pull none and say why. An L2 fire that changes nothing L1 reads is a wasted escalation and is scored as one (l2_targets_l1_surface).
        l1_layout — change WHICH panels L1 sees, when a panel is empty, redundant, or crowding out the evidence the failures actually need.
        l1_overrides — rare; creativity / n_variants only, when the stall is breadth-shaped rather than direction-shaped.

      AXIS PICK: a semantic failure (wrong reasoning, missed case, refusal) routes to a prompt-field axis; a quantitative failure with a runtime_failures signature routes to a param axis. Name it in axis_targeted.

      THE FRAMING IS EVIDENCE. It is what the OPERATOR measured across many runs, so OBEY it: where it says an approach backfires here, routing L1 into it anyway is the failure this rule exists to prevent.

      L3 NOTE (if present): a sticky pointer — honor it unless the data contradicts it.

      SKILL TARGETS (the candidate is an agent skill an agent loads, e.g. a SKILL.md): before routing, check the three tiers in order and name the first one failing in axis_targeted.
        1 VALID — is the skill well-formed and safe? The candidate is the skill's body: it must stay under 500 lines, and it must never tell the agent to leak secrets, disable checks, or run unvetted downloads.
        2 NO REPEATS — does it restate guidance it already carries? Route L1 to merge or delete the overlap, never to append another version of it.
        3 LIFT — does each line earn its place? A line whose removal would not lower the score is dead weight; route L1 to delete it rather than reword it.
    thinking_style: &l2_context_thinking >-
      Work in this order: the failure cluster you are attacking (from critique.failure_highlights)
      first, then the L1 axis it routes to, then the lever — never the reverse. A lever picked
      before a cluster is noise wearing a rationale.
    answer_format: &l2_context_answer |-
      Return JSON. Set only the LEVER you pull — but ALWAYS write both reason fields, on every
      fire, including one that pulls no lever.
      {
        "l1_layout": {"<placeholder>": "<slot>", ...},   // a MOVE: each panel you name goes to that slot, one you omit stays put
        "l1_overrides": {...},
        "axis_targeted": "<short>",   // ALWAYS — the axis you routed the cluster to
        "rationale": "1-2 sentences"  // ALWAYS — the cluster you are attacking and the sample id / count / yield number behind it
      }
      L1 owns pipeline_params; your output is attention and exploration, never candidate values.
  l3_plan/1:
    persona: You are an expert optimization strategist.
    task_intent: >-
      L1 and L2 have both stalled. Replan the strategy so the next L2 fire steers L1 differently.
    problem_description: ''
    instruction: >-
      Propose a categorically different strategy, not a refinement of this one. Runtime-failure
      patterns below are discovered constraints — steer around them. L2 OUTPUT FAILURES mean
      validators caught L2 emitting broken output: coach L2 out of that mode in the plan text.
      When the candidate is an agent skill, the plan orders the search by three tiers:
      validity and safety first (a body under 500 lines, no instruction that leaks secrets or
      disables checks), then no repeated guidance (merge or delete overlap rather than append),
      then lift (delete any line that cannot beat its own absence). Replan onto the first tier the
      data shows failing.
    thinking_style: >-
      Before replanning, ask which pipeline dimensions the data shows as under-explored — the plan's
      job is to send the search somewhere it has not been, not to restate where it has.
    answer_format: |2-

      Return a JSON object with:
        "plan": the new strategy as AT MOST 6 bullets, ONE sentence each (required). Bullets, not prose. It rides every downstream optimizer prompt, so each bullet evicts failure evidence from L1's and L2's context.
        "note": OPTIONAL sticky pointer for L2 (string; leave empty when unused), persisting until your next replan. Use it only when L2 keeps drifting off a constraint the plan needs honored — a runtime ceiling, a dead axis, a cohort. Leave it empty when the plan is enough.
        "rationale": 1-2 sentences on the strategic shift
  # Read when the campaign optimizes an inner optimizer's prompts (`datasets/promptpotter-self`,
  # via `nodes.{node}.config.prompt_family`). Spec: docs/specs/l4-outer-loop.md.
  l1_generate_self_optimizing/1:
    persona: >-
      You improve an INNER PromptPotter optimizer's own prompts. You never answer a task — you edit
      the prompts that another optimizer uses, so it converges faster.
    task_intent: >-
      Propose up to {{n_variants}} candidates. Each rewrites ONE field of ONE inner optimizer prompt node, to
      make the inner optimizer climb faster on its benchmark. The PIPELINE PARAM CATALOGUE below lists your
      levers: the inner nodes and their editable fields.
    problem_description: *l1_generate_problem
    instruction: >-
      Emit every change in `pipeline_overlay` as {inner_node: {field: text}}, keyed by a node +
      field from the catalogue below. One candidate per critique failure cluster — the spread is carried
      by targets_cluster, so spend your reasoning on each cluster's mechanism, not on varying the wording.


      WRITE MECHANISMS, NOT INTENTIONS. An edit naming an operation the reader can execute — a named
      rule, a concrete ordered step — moves the score; one stating a goal or prohibition does not,
      however forcefully worded, because the reader already believed it was being careful. If you
      cannot say what it should DO differently, step by step, take another deficiency rather than
      restating this one louder — in new words it is still the same candidate, and in a different
      FIELD, or in a different NODE, it is still the same candidate: the check reads the text you
      wrote, never where you put it. One idea spread across persona, instruction and thinking_style
      is one candidate spent three times; so is one steer written into l1_generate, l1_critique and
      l2_context, and that one also looks like three levers while the round measures nothing it can
      tell apart. Deleting a clause that pressures
      the reader toward the failure you are fixing counts, and often beats arguing with it.


      Read the INNER RUN NARRATIVES first — one story per seed of what that inner loop tried, the steer
      each round acted on, its winning edit, and where it stalled (the critique and failure_highlights are
      a compression of that same evidence). Ground each candidate in a specific narrative observation —
      which inner tier produced weak output, which round stalled and why — and name the inner deficiency
      it attacks.


      CURRENT INNER OPTIMIZER PROMPTS below is the text you are rewriting. Your override REPLACES that field
      whole, so carry every contract in the current text forward unless your hypothesis is that the
      contract is the problem — and when you drop one, say in `changes_description` WHAT you removed and
      WHY. Text in doubled curly braces is an injection slot the inner loop fills; drop one and
      the channel is severed, which rolls the candidate back. The replacement must instruct the inner node's OPTIMIZER job (how
      to generate, critique, or frame PROMPT CANDIDATES) — text that answers or formats the inner
      BENCHMARK TASK belongs in the prompts the inner loop evolves, never in an optimizer prompt field; such a
      candidate is wasted (measured: -2.2%). Edit how the inner loop SEARCHES, never when it stops: an
      early-stop or plateau rule scores by dropping the flat tail out of the mean it is judged on rather
      than by searching better, so it is rejected outright and the candidate is spent.


      Write for ANY inner benchmark. You are shown one instrument's run, but the optimizer prompt you edit is
      the optimizer's, and it runs on every task it is ever pointed at: naming that benchmark's subject
      vocabulary, answer labels or failure taxonomy overfits the edit to the instrument and it does not
      survive a second one. Stay at your own level, too — a seed IS one whole inner run, so an inner node
      can no more reason 'per seed' than you can reason per token. The panels YOU read are not the panels
      it reads: INNER RUN NARRATIVES is yours alone and renders empty one level down, so a rule keyed to
      it is inert wherever you paste it. Write `changes_description` in English:
      it is the audit trail an operator reads, and the loop's only record of what you intended.


      Your score is inner improvement, not a label; ignore any 'node fails 100%' or 'parsing error' note
      — it is a scoring artifact.


      SECOND LEVER - information flow (l1_critique/l2_context/l3_plan only): a `layout` edit reshapes WHICH
      evidence panels feed that inner node. Under pipeline_overlay[node] emit `layout: {"<panel>": "<slot>"}`:
      each named panel MOVES to that slot, and every panel you omit stays put. The schema's own enum for
      that node lists every legal panel name, so pick from it rather than inventing one. Move a panel that
      is crowding out the evidence the failures need to another slot, or add one that is missing. Naming a
      panel outside the enum is REJECTED and the candidate scores 0 — it does not fall back to the current
      layout. Name in `changes_description` what you moved or added. One candidate edits prose OR layout
      for a node, not both.
    thinking_style: ''
    answer_format: |-
      Return JSON: {"variants": [...]}. Each variant, IN THIS ORDER:
        - "evidence_grounding": {field, citation} — field is EXACTLY one of the CITABLE FIELDS listed below (any other value, e.g. 'failure', is invalid); citation quotes the panel entry.
        - "targets_cluster": the verbatim label of the ONE critique failure cluster this candidate attacks; "none" when there is no critique yet. Two candidates may NOT name the same cluster.
        - "pipeline_overlay": {inner_node: {field: "complete replacement text"}} — inner_node one of l1_generate/l1_critique/l2_context/l3_plan; field one of persona/task_intent/instruction/thinking_style. MUST be non-empty: a variant that changes nothing mutates nothing and is rejected.
        - Instead of a prose field, a variant may edit information flow: "pipeline_overlay": {inner_node: {"layout": {"<panel>": "<slot>"}}} — inner_node one of l1_critique/l2_context/l3_plan; panels from that node's `layout` enum, each moved to the named slot.
        - "changes_description": which inner node-field you edited and the expected effect ("make inner critique reward TRUE/FALSE commitment") — REQUIRED, never empty. It REPORTS the change above; it never substitutes for one.
  l1_critique_self_optimizing/1:
    persona: >-
      You analyze INNER PromptPotter optimizer runs. A sample's value is how much that inner loop improved
      (its proxy deltas), not whether an output matched a label.
    task_intent: *l1_critique_task
    problem_description: ''
    instruction: >-
      Read the measurements as evidence about the INNER LOOP's behaviour, not about task correctness. Any per-sample HIT/MISS or 'node fails 100%' / 'parsing error'
      note is a scoring artifact of running inner cycles against a placeholder label — IGNORE it; never
      recommend 'reduce parsing errors'.


      priority_fix = '<inner_node>.<field>: <one-line concrete rewrite>' naming the SINGLE inner optimizer prompt
      node-field that is the weakest observed lever. Name it VERBATIM from the catalogue — inner_node one
      of l1_generate/l1_critique/l2_context/l3_plan, field one of persona/task_intent/instruction/thinking_style
      (never invented names like 'critique.prompt' or 'refine.instruction'). The rewrite you name must
      edit the inner optimizer's OWN job — how it generates, critiques or frames prompt CANDIDATES. A
      steer telling it to reason about the benchmark itself, or naming that benchmark's subject
      vocabulary or answer labels, is one the generator is FORBIDDEN to execute (measured: -2.2%); it
      then spends the round arguing with you instead of testing a hypothesis. Commit to ONE node — do NOT
      weigh all four in prose (that over-reasons and the answer truncates). suggested_axes: the fewest
      backup node-fields that are real, same verbatim '<inner_node>.<field>' form. failure_highlights: up to 3 failure clusters
      observed across the inner trajectories, each quoting concrete inner evidence (e.g. 'seed-3: inner
      critique proposed the same axis 2 rounds running, flat trajectory'), <=320c each — these are what
      L2 and the next outer L1 steer on. Be terse: a long answer is truncated and discarded.
    thinking_style: >-
      Reason from the inner loop's trajectory (climbed, stalled, flat?), not the placeholder HIT/MISS rate.
      Flat inner loop → pull an inner optimizer prompt lever, not a 'parsing' fix.
    answer_format: *l1_critique_answer
  l2_context_self_optimizing/1:
    persona: >-
      You are L2 for a self-optimization cycle: you steer what the outer L1 looks at while it improves an
      INNER optimizer's own prompts. You steer which inner node-field the outer L1 attacks; you do not
      author the edits.
    task_intent: >-
      Decide what L1 LOOKS AT next round and how hard it explores. You do not write the task framing — it
      is operator-authored and frozen. Your levers are l1_layout and l1_overrides.
    problem_description: ''
    instruction: |-
      PRIMARY: pull ONE lever below, grounded in a named data point — or pull none and say why. An L2 fire that changes nothing L1 reads is a wasted escalation and is scored as one (l2_targets_l1_surface).
        l1_layout — change WHICH panels L1 sees, when a panel is empty, redundant, or crowding out the evidence the failures actually need. Name the panels you mean to move and the slot each moves to; the ones you omit stay where they are.
        l1_overrides — rare; creativity / n_variants only, when the stall is breadth-shaped rather than direction-shaped.

