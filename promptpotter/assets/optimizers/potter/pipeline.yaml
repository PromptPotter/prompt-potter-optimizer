# potter — PromptPotter's own optimizer, selected with `optimization.optimizer: potter` and
# adjusted with `optimization.nodes.{node}.config`. Every node's knobs are declared here and
# nowhere else. A `resolved_prompts` edit is hashed into measurement identity, so it voids
# banked outer origins; comments are not. The output schemas are generated into
# resolved_schemas.json by scripts/build_optimizer_schemas.py.
name: potter
version: v1.0
# The models a human may pick, never the one set (`optimization.call_target`). Outside the L4
# fingerprint, so widening it voids no banked panel. `$PROMPTPOTTER_HOME/optimizers/potter/
# pipeline.yaml` shadows this file per install.
available_models:
  - minimax/minimax-m3.1-flash
  - qwen/qwen3.7-flash
  - openai/gpt-6-luna
  - deepseek/deepseek-v4-flash:nitro
  - openai/gpt-oss-20b:nitro
  - openai/gpt-oss-120b:nitro
  - anthropic/claude-haiku-5.5
  - z-ai/glm-5.3-flash
# The knobs a setup screen leads with, in order; presentation alone, outside the treatment.
main:
  - l1_generate.n_variants
  - l1_generate.recombine
  - mating.offspring
  - adaptive_queue.sp_budget_round
  - pobb.epsilon
  - escalation.escalation_ladder
nodes:
  # Run init's, both: the pools `l1_generate` draws from, seeded once before round 0's critique
  # reads them. The block pool leads with what earlier runs on this answer space earned.
  block_pool:
    type: algorithm
    config:
      active: ['*']
      packs: []
  demo_pool:
    type: algorithm
    config:
      active: ['*']
  # The round's panel: `AdaptiveQueue.draw` draws `sp_budget_round` cells off the search split
  # and `build_round_order` orders them on the parent's grades (`methods/verdict-resolution.md`
  # § The round order).
  adaptive_queue:
    type: sampler
    config:
      sp_budget_round: 20
      per_round_resubset: true
      strata: none
  l1_generate:
    type: llm
    makes: rewrites
    # Menus the operator picks from; they open no search axis (`param_keys` stays empty, and
    # L2's reach is its own member's `steers`). `model` falls back to `available_models`.
    optimizer: &node_menus
      param_allowed_values:
        # Mirrors `capabilities.py::STANDARD_EFFORT_LADDER`.
        reasoning_effort: [none, default, low, medium, high]
        provider: [openrouter, groq, openai]
    config:
      temperature: 0.4
      prompt_family: l1_generate
      prompt_version: 1
      schema_family: l1_generate
      schema_version: 1
      reasoning_effort: low
      # A truncated answer is a zero-candidate round, and 12000 was measured truncating.
      max_tokens: 20000
      n_variants: 5
      # Above the largest of 199 measured L1 proposals (+785 chars on the `run` C0's inner runs,
      # every one of them a growth).
      length_budget: 800
      k_max: 5
      pool_window: 8
      # Recombination by an LLM host, off at 0; `mating` + `locus_crossover` host it by a draw.
      recombine: 0
      recombination_host: l1_generate
      block_access: open
      schema_field_rename: false
      transcripts: 3
      transcript_chars: 2200
    description: >-
      L1 Generate: produces N candidate prompts from current framing + critique.
  # Crossover, off at 0: after L1's variants, each a main (higher θ of two from the population)
  # given a minority of its differing loci by a donor drawn alike from every round's measured.
  mating:
    type: algorithm
    makes: crossovers
    config:
      offspring: 0
      donor_from: measured
      tournament: 2
  locus_crossover:
    type: algorithm
    makes: donor sections
    config: {}
  # Runs the campaign pipeline against the panel; it makes no optimizer call, so no config.
  l1_score:
    type: measurement
    description: >-
      L1 Score: runs each candidate over the dataset, computes composite_fitness.
    config: {}
  # A candidate keeps measuring while its share of P(best of the field) holds; ε is a family-wise
  # share, so a field of six reads 1/6 apiece on a tie (`methods/candidate-elimination.md`).
  pobb:
    type: eliminator
    config:
      epsilon: 0.05
      epsilon_floor: 0.05
      epsilon_stop: true
  # The next parent: a θ lift over the parent its paired cells agree with (`elect_round_winner`).
  theta_election:
    type: selector
    config:
      admission: 0.85
  l1_critique:
    type: llm
    optimizer: *node_menus
    config:
      temperature: 0.3
      schema_family: l1_critique
      schema_version: 1
      prompt_family: l1_critique
      prompt_version: 1
      reasoning_effort: low
      # A truncated critique never lands; the measured tail at `low` was 11,370 tokens.
      max_tokens: 16000
      transcripts: 3
      transcript_chars: 2200
    description: >-
      L1 Critique: reads round results, writes the critique L1 Generate reads next round.
  l2_context:
    type: llm
    optimizer: *node_menus
    config:
      temperature: 0.3
      prompt_family: l2_context
      prompt_version: 1
      reasoning_effort: low
      max_tokens: 8000
    description: >-
      L2 Context: moves which panels L1 generation reads and how widely it explores. Fires on L1
      stall.
  l3_plan:
    type: llm
    optimizer: *node_menus
    config:
      temperature: 0.5
      prompt_family: l3_plan
      prompt_version: 1
      reasoning_effort: low
      max_tokens: 8000
    description: >-
      L3 Plan: rewrites the strategy. Fires on L2 stall.
  # The stall ladder: fires `l2_context` / `l3_plan` at the boundary after a round, and decides
  # when the ladder gives up; the next round walks `default` under what they wrote.
  escalation:
    type: controller
    config:
      l1_patience: 3
      l2_patience: 2
      l3_patience: 1
      escalation_ladder: full
      rebase_capability: true
      reelect_capability: true
      terminate_capability: true
pipelines:
  run_init:
    - block_pool
    - demo_pool
  default:
    - adaptive_queue
    - l1_generate
    - mating
    - locus_crossover
    - pobb
    - l1_score
    - theta_election
    - l1_critique
    - escalation
resolved_prompts:
  l1_generate/1:
    persona: >-
      You are a senior prompt engineer with taste. Before editing, you ask what cognitive stance this
      task needs — the mental move a strong solver would make — and shape the prompt to induce it. You
      spend words where they teach the solver a method, and nowhere else.
    task_intent: >-
      Propose exactly {{n_variants}} candidates that beat the parent searchpoint, each testing a
      different hypothesis. Read the context blocks below for the pipeline, domain, critique, and
      failures; let these define the fix rather than a presumed task type.
    problem_description: ''
    instruction: |-
      THINK FIRST — diverge, then converge. Before writing any variant, name {{n_variants}} distinct
      MECHANISMS for why the parent fails, then develop each one a panel supports. A round's chance of a
      lift climbs steeply with the number of distinct mechanisms tested. Where the critique names fewer
      clusters than you have slots, spend the spare slot on a SECOND mechanism for the largest cluster.

      NEW, NOT RESTATED. A mechanism an ALREADY TRIED row tested is the same hypothesis in other words
      or in another field, and it does not improve by being proposed again. The critique's priority_fix
      is one hypothesis among yours, never all of them.

      AN EDIT HOLDS FOR THE WHOLE CLUSTER. The change must help every row the cluster spans: a procedure
      for one row's problem, a worked answer to one query, or one row's vocabulary pasted into the
      instruction is a per-row patch the other rows never meet — and the scorer measures them all.

      SPREAD ACROSS MECHANISM AXES, NOT ACROSS FIELDS. Two edits to different fields that make the same
      cognitive change are ONE hypothesis. The axes:
        - STANCE — the mental move the solver makes: verify before answering, eliminate, decompose,
          commit under uncertainty.
        - EVIDENCE — what it does with input that is missing, contradictory, or irrelevant.
        - SCOPE — what it is told to ignore, refuse, or stop doing.
        - OUTPUT — how much the solver reasons before it answers is an axis like any other.
        - RECOMBINATION — take a mechanism that MEASURABLY worked, on another cluster or in an earlier
          round, and apply it where it has not been tried. Cite the panel that measured it.

      TEMPERAMENT — read escalation_panel.exploration_budget and mutation_memory. If mutation_memory
      shows a recent addition scored BELOW its parent, cut it rather than piling on. At wide (a
      measured stall, or a round whose candidates regressed below the parent), abandon the attractor for
      a categorically different stance. This prompt becomes next round's parent, so text that makes the
      solver EMIT more is paid on every sample from here on.

      GROUND EVERY CHOICE — each evidence_grounding cites a real panel entry; no data, no gamble. An axis
      tagged PEAKED sits at its measured peak: leave it unless your citation names a real rebut.
    thinking_style: ''
    answer_format: |-
      Return JSON: {"variants": [...]}. Each variant, IN THIS ORDER:
        - "evidence_grounding": {citation}: the shortest verbatim span of ONE panel line — never two lines joined, never your own words; a quote no panel holds is rejected mechanically.
        - "mechanism": the failure mechanism this variant tests and the concrete change that tests it, in one or two sentences, decided before the edits.
        - "targets_rows": the rows this variant's edit must hold for, as `[#id]` ids — at least 2, all from ONE cluster of the CRITIQUE panel where it lists clusters, else rows of one panel that fail the same way. Two variants share a cluster only as two DIFFERENT mechanisms for it.
        - "edits": the changes, at least one, each {at, op, anchor, text} on one field of CURRENT PROMPTS:
          * "at": the field as `node.field`.
          * "op": "replace" swaps the verbatim `anchor` span for `text`; "insert_after" puts `text` right after it; "delete" removes it (`text` empty). An empty `anchor` is the whole field.
          * Only what changes: a field you keep gets no edit, and an edit whose result equals the parent is rejected mechanically. Rewrite the sentence your change supersedes instead of appending beside it.
        - "pipeline_overlay": nested {node: {param: value}}, as its schema description states; null where nothing changes.
  l1_critique/1:
    persona: You are a pipeline evaluation analyst.
    task_intent: >-
      Analyze the measurements below and produce a structured critique for the next optimization round.
    problem_description: ''
    instruction: >-
      Extract the DISTINCT failure clusters — different root causes, not different examples of one —
      name the axis that targets the largest, and write the concrete change.


      priority_fix: <axis> is EXACTLY one of: {{critique_axes}}.
      Do not reflexively route every failure to thinking_style: an execution slip (a skipped step, a mis-read
      input, a formatting miss) is usually fixed better by instruction; reserve thinking_style
      for when the reasoning STRATEGY itself is wrong. <concrete change> is a specific edit ("add a
      coordinate-verification step", not "improve reasoning") testing a mechanism no ALREADY TRIED row
      tested — another axis or another kind of edit, never a tried one reworded or made "mandatory".


      failure_highlights: ONE ENTRY PER CLUSTER, largest first. A cluster is a MECHANISM that at least
      two rows a panel marks `[#id]` share, and as many as DETECTABLE MOVE names; an id no panel marks,
      or an earlier cluster holds, is struck, and a cluster left narrower is dropped mechanically; the other clusters stand: read every row of FAILING SAMPLES and put each id in the ONE cluster whose mechanism
      it shows; a row sharing none is no cluster and is left out. The next L1 targets a cluster by its
      rows and writes ONE edit that must hold for every row the cluster spans, so claim the mechanism
      in GENERAL terms and name the decisive step the rows' reasoning shares, as SAMPLE TRANSCRIPTS
      and each row's last step show it. Before claiming a bias (e.g. "over-hedges"), check it against
      the shown ground-truth labels — a fix that trades one error class for another is not a fix. L2
      and the next L1 see only these plus your priority_fix. An empty list when that many rows missed
      for one reason is a defect of THIS node, not a clean run.


      suggested_axes: more axes from the same list, for L2 to consider.
    thinking_style: >-
      Reason from the measurements, not from priors about what usually helps. If the data is thin on an
      axis, say so rather than guessing.
    answer_format: |-
      Return JSON with the fields in EXACTLY this order — failure_highlights FIRST so it is never dropped when the output runs long:
      {
        "failure_highlights": [{"sample_ids": [<id>, <id>, ...], "mechanism": "<a few words>", "claim": "<one sentence: why these rows land wrong>"}, ...],
        "priority_fix": "<axis>: <one sentence naming the change>",
        "suggested_axes": ["<axis>", ...]
      }
      failure_highlights: at most 3, each with >=2 sample_ids from the panels' `[#id]` marks; a row in two clusters counts in the first only. suggested_axes: at most 4.
  l2_context/1:
    persona: >-
      You are L2, the attention layer. You never author a candidate prompt yourself — your whole
      influence on the next round is what L1 is shown, and how far it may roam.
    task_intent: >-
      Decide what L1 LOOKS AT next round and how hard it explores. Your levers are l1_layout and
      l1_overrides, and recombinations where a RECOMBINATION POOL is shown — nothing else.
    problem_description: ''
    instruction: |-
      PRIMARY: pull ONE lever below, grounded in a named data point — or pull none and say why. An L2 fire that changes nothing L1 reads is a wasted escalation and is scored as one (l2_targets_l1_surface).
        l1_layout — add a panel CURRENT L1 LAYOUT does not list, when the failures need evidence it lacks. It renders with L1's other evidence, and no later fire removes it.
        l1_overrides — rare; temperature / n_variants only, when the stall is breadth-shaped rather than direction-shaped.

      AXIS PICK: a semantic failure (wrong reasoning, missed case, refusal) routes to a prompt-field axis; a quantitative failure with a runtime_failures signature routes to a param axis. Name it in axis_targeted.

      THE FRAMING IS EVIDENCE. It is what the OPERATOR measured across many runs, so OBEY it: where it says an approach backfires here, routing L1 into it anyway is the failure this rule exists to prevent.

      L3 NOTE (if present): a sticky pointer — honor it unless the data contradicts it.
    thinking_style: >-
      Work in this order: the failure cluster you are attacking (from critique.failure_highlights)
      first, then the L1 axis it routes to, then the lever — never the reverse. A lever picked
      before a cluster is noise wearing a rationale.
    answer_format: |-
      Return JSON. Set only the LEVER you pull, null for the rest — but ALWAYS write both reason
      fields, on every fire, including one that pulls no lever.
      {
        "l1_layout": {"problem_description": ["<panel>", ...]},
        "l1_overrides": {"temperature": <number or null>, "n_variants": <integer or null>},
        "axis_targeted": "<node>.<field> or <param>",   // ALWAYS — where the cluster's fix lands in the TARGET prompt, even when it shares a layout slot's name
        "rationale": "1-2 sentences"  // ALWAYS — the cluster you are attacking and the sample id / count / yield number behind it
      }
      L1 owns pipeline_params; your output is attention and exploration, never candidate values.
  l3_plan/1:
    persona: You are an expert optimization strategist.
    task_intent: >-
      L1 and L2 have both stalled. Replan the strategy so the next L2 fire steers L1 differently.
    problem_description: ''
    instruction: >-
      Propose a categorically different strategy, not a refinement of this one. Runtime-failure
      patterns below are discovered constraints — steer around them. L2 OUTPUT FAILURES mean
      validators caught L2 emitting broken output: coach L2 out of that mode in the plan text.
    thinking_style: >-
      Before replanning, name the pipeline dimensions the data shows as under-explored — the plan's
      job is to send the search somewhere it has not been, not to restate where it has.
    answer_format: |2-

      Return a JSON object with:
        "plan": the new strategy as AT MOST 6 bullets, ONE sentence each, <=800c in all (required). Each bullet is an instruction L2 or L1 acts on next round, naming the axis, panel or failure cluster it means — never a question, and never a step you still owe. It rides every downstream optimizer prompt, so each bullet evicts failure evidence from L1's and L2's context.
        "note": OPTIONAL sticky pointer for L2 (string, <=150c; leave empty when unused), persisting until your next replan. Use it only when L2 keeps drifting off a constraint the plan needs honored — a runtime ceiling, a dead axis, a cohort.
        "rationale": one sentence, <=125c, naming the under-explored dimension the plan moves the search to
