# The free tier — what a free account may run. Operator-edited; anything off this file is refused
# with `ask`'s two doors. Each model lists the values every gated parameter may take, launched or
# searched, lowest first: the first is a task node's launch default. A model or value not listed is
# refused. `default` (the provider's own rung) is listed only where it is known to resolve inside
# its entry. Per-model rungs: docs/operations/datasets.md § The model a dataset runs, and `registry._MODEL_PROFILES`.

# The nodes a free run's pipeline may hold.
task_nodes: [llm_only]
task_models:
  # Refuses `none` (HTTP 400); its `default` is `medium`.
  openai/gpt-oss-20b:nitro: {reasoning_effort: [low]}
  # 2026-10-27, justlogic.d234__710412 at none: 5 rounds for $0.058; the pick read 90% on 20
  # unseen cells (+0.075 [-0.058, +0.208] over the origin, not separated). `low` is unmeasured.
  qwen/qwen3.7-flash: {reasoning_effort: [none, low]}
# Potter's menu below the optimizer bar ($0.60 list output price per M), at the rungs it runs.
optimizer_models:
  qwen/qwen3.7-flash: {reasoning_effort: [none, low, medium]}
  openai/gpt-6-luna: {reasoning_effort: [low, medium]}
  deepseek/deepseek-v4-flash:nitro: {reasoning_effort: [none, low, medium]}
  openai/gpt-oss-20b:nitro: {reasoning_effort: [low, medium]}
  # Refuses `none` (HTTP 400).
  z-ai/glm-5.3-flash: {reasoning_effort: [low, medium]}
# Laid over a free account's check-in, as its last config layer.
campaign:
  sp_budget_origin: 20
  optimization:
    nodes:
      adaptive_queue:
        config:
          sp_budget_round: 20
ask:
  linkedin: https://www.linkedin.com/in/david-intelligence/
