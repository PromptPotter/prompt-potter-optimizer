name: Publish

# Publishing a GitHub Release IS the release: you write the notes, and the upload
# follows from publishing them — there is no second thing to remember. Manual dispatch
# runs the identical build and smoke and uploads nothing, which is how a release wheel
# gets proven before a release exists to carry it.
on:
  release:
    types: [published]
  workflow_dispatch:

# Denied by default: each job names the one scope it uses.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout; the artifact upload rides the runner's own token

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # First, before anything is built: nothing else in this repo pins the tag,
      # `pyproject.toml` and `CITATION.cff` together, and a version uploaded to an index
      # can neither be recalled nor re-uploaded. Skipped on dispatch, where there is no
      # tag to agree with.
      - name: The tag must match pyproject and CITATION.cff
        if: github.event_name == 'release'
        run: |
          declared=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cited=$(sed -n 's/^version: *//p' CITATION.cff)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME means $tagged, pyproject.toml says $declared"
            exit 1
          fi
          if [ "$cited" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME means $tagged, CITATION.cff says $cited"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # Second, and still before anything is built: the wheel carries the dashboard bundle, so
      # a known-vulnerable dependency in `webapp/package-lock.json` ships INSIDE the release —
      # and a published version can be neither recalled nor re-uploaded. Reads the lock, not an
      # install, so it answers before `npm ci` below. The exhaustive half — every open
      # Dependabot alert, both ecosystems, dismissals honoured — is `gate.py --release` at the
      # desk: a workflow's GITHUB_TOKEN is not documented to read Dependabot alerts, so that
      # one is a PAT away rather than a check that passes here by failing to look.
      - name: No high-severity advisories in the dashboard lock
        run: python3 scripts/gate.py --only npm-audit

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      # The same question of `uv.lock`, asked of PyPI's advisory database rather than of GitHub.
      - name: No known advisories in the Python lock
        run: python3 scripts/gate.py --only pip-audit

      # `scripts/gate.py::_PINNED_EXTRAS`, as in ci.yml: the gate below is taken in this env.
      - name: Install dependencies
        run: uv sync --extra dev --extra api --extra harbor --extra dspy --extra excel --frozen

      # CI gates `main`; a release is cut from a COMMIT, and the two are the same thing
      # only by habit. Running the one check list here is what makes the gate a property
      # of the artifact being published rather than of a branch that once passed.
      - name: Gate
        run: uv run python scripts/gate.py --py

      - name: Build the dashboard
        run: npm ci && npm run build
        working-directory: webapp

      # No `--no-webapp`, and that is the whole difference from ci.yml's wheel job. The
      # wheel CI proves is API-only, so three things are exercised for the first time
      # here: the `assets/webapp/**` package-data glob, the mount that reads it, and the
      # credential scan over a Next.js bundle — which inlines every NEXT_PUBLIC_* value.
      - name: Build the wheel
        run: uv run python scripts/build_release.py

      # Same shape as ci.yml's, plus the dashboard demand the API-only build cannot make.
      - name: Install it elsewhere and run it
        env:
          PROMPTPOTTER_SMOKE_EXPECT_WEBAPP: "1"
        run: |
          uv venv --seed "$RUNNER_TEMP/venv"
          wheel=(dist/*.whl)
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "${wheel[0]}[api]"
          mkdir -p "$RUNNER_TEMP/elsewhere" "$RUNNER_TEMP/home"
          cd "$RUNNER_TEMP/elsewhere"
          export PROMPTPOTTER_HOME="$RUNNER_TEMP/home"
          "$RUNNER_TEMP/venv/bin/promptpotter" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    # The environment name is half of the publisher's identity: PyPI's trusted-publisher
    # record names this repository, `publish.yml` AND `pypi` together, so no other
    # workflow in the repo can mint a token for the project.
    environment: pypi
    permissions:
      id-token: write # mint the OIDC token PyPI trades for a short-lived upload token
      contents: read

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist

      # No `with:` block, and none is missing. Under Trusted Publishing the action
      # exchanges the OIDC token above for an upload token that expires in minutes, so
      # this repository stores no PyPI credential at all — there is nothing to leak or
      # rotate. PEP 740 attestations are signed and attached by default.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
