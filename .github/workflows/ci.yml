name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # uv provisions Python 3.13 and installs the EXACT pinned graph from
      # uv.lock (--frozen fails if the lock drifted from pyproject). This is
      # what makes CI reproducible: a dependency only moves when uv.lock is
      # deliberately regenerated in a PR, never silently at install time.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra stats --extra dev --frozen

      - name: Lint
        run: uv run ruff check promptpotter/ tests/

      - name: Format check
        run: uv run ruff format --check promptpotter/ tests/

      - name: Dependency check
        run: uv run deptry .

      - name: Type check
        run: uv run mypy promptpotter/

      - name: Tests
        run: uv run pytest tests/ -q --tb=short --cov=promptpotter --cov-report=term-missing

  webapp:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Explicit type check — `next build` does not hard-fail on every type
      # error, so this is what makes tsconfig.json's strict mode enforced.
      - name: Type check
        run: npx tsc --noEmit

      # Vitest covers reader-side derivations (lib/derivations/...) against
      # frozen cycle fixtures at tests/fixtures/cycles/. Scope + recipe at
      # docs/developer/cycle-fixtures.md.
      - name: Tests
        run: npm run test

      # Candidate-list construction in components is banned. The spine is
      # `roundCandidates(dash)` (sole consumer of `liveL1Candidates`) +
      # the `useRoundCandidates` hook. Two surfaces re-deriving the same
      # candidate list independently is what produced the lineage/fitness
      # alignment bug; one centralized spine makes that drift impossible.
      # Single-field reads (`dash.origin`, `roundOf(dash)`) remain
      # allowed — they don't replicate the spine. Migration of the
      # remaining `liveL1Candidates` sites (FreqChart per-sample bucket,
      # HardSamplesHeatmap per-candidate marks, FitnessPanel evaluator
      # union) is a follow-up; each site needs its own derivation, not a
      # shared one.
      - name: Anti-rot — no liveL1Candidates outside the spine
        run: |
          violations=$(grep -RnlE 'liveL1Candidates' components/ \
            | grep -vE 'FreqChart\.tsx|HardSamplesHeatmap\.tsx|FitnessPanel\.tsx' \
            || true)
          if [ -n "$violations" ]; then
            echo "❌ liveL1Candidates is the candidate-spine constructor — only roundCandidates() and the three named follow-up sites may call it."
            echo "   New consumers must go through useRoundCandidates() or roundCandidates() in lib/derivations/round-candidates.ts."
            echo "$violations"
            exit 1
          fi

      - name: Build
        # Validate the exact shipped artifact: React Compiler pass + source
        # maps on (DEPLOY_BUILD=1). Bare `npm run build` is the fast local
        # preview path and would skip both.
        run: npm run build:deploy
