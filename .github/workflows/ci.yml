name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # `--frozen` is what makes CI reproducible: a dependency moves only when
      # uv.lock is deliberately regenerated, never silently at install time.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra stats --extra dev --frozen

      - name: Lint
        run: uv run ruff check promptpotter/ tests/

      - name: Format check
        run: uv run ruff format --check promptpotter/ tests/

      - name: Dependency check
        run: uv run deptry .

      - name: Type check
        run: uv run mypy promptpotter/

      # Fix by moving the shared piece into application/ — presentation imports
      # upward. The allowlist is CLI-seam debt; shrink it to zero.
      - name: Layering guard — application must not import presentation
        run: |
          ! grep -rn "from promptpotter.presentation\|import promptpotter.presentation" promptpotter/application/ --include=*.py \
            | grep -vE "presentation\.(views\.live\.display import LiveDisplay|cli\.session import (SessionCtx|load_session))"

      # Both surfaces are generated from Pydantic models. Ungated, a drifted
      # model ships a stale schema the webapp typechecks against and the LLM is
      # asked to fill.
      - name: Types contract (Pydantic → TS)
        run: |
          uv run python scripts/build_ts_types.py
          git diff --exit-code webapp/lib/api/types.generated.ts

      - name: Schema contract (Pydantic → optimizer resolved_schemas)
        run: |
          uv run python scripts/build_optimizer_schemas.py
          git diff --exit-code promptpotter/assets/optimizer/resolved_schemas.json

      # The SERVED surface. `m12-api-openapi.yaml` is hand-written and schema-first
      # (it declares command kinds before they are wired), so it cannot also describe
      # what runs — and it did not: 35 served endpoints, the whole /auth surface among
      # them, appeared in no document at all. The declared/wired partition it DOES own
      # is pinned separately by test_integrity.py.
      - name: API contract (FastAPI → served openapi)
        run: |
          uv run python scripts/build_openapi.py
          git diff --exit-code docs/specs/openapi.generated.json

      - name: Tests
        run: uv run pytest tests/ -q --tb=short --cov=promptpotter --cov-report=term-missing

  # The wheel is a shape we ship and never run. In a checkout every path function takes
  # its checkout branch, so `assets/benchmarks/` and `assets/webapp/` — the trees the
  # wheel actually serves — are read by no dev run and no test, and `pyproject.toml`'s
  # package-data list (delete it in a clean room and the wheel drops to ONE non-.py file)
  # is load-bearing with nothing behind it. This job is the only place any of that is
  # exercised.
  wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra stats --extra dev --frozen

      # `--no-webapp` deliberately: the dashboard export is the `webapp` job's subject,
      # and building it again here would double this job's runtime to re-check it.
      # build_release.py already verifies the ARTIFACT (required trees present, no
      # credentials, no stray caches) and deletes a wheel that fails.
      - name: Build the wheel
        run: uv run python scripts/build_release.py --no-webapp

      # Outside the checkout is the whole point — inside one, `source_checkout_root()`
      # answers yes and every assertion in the smoke script is vacuous. It refuses to run
      # from a source tree for that reason.
      - name: Install it elsewhere and run it
        run: |
          uv venv --python 3.13 --seed "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet dist/*.whl
          mkdir -p "$RUNNER_TEMP/elsewhere" "$RUNNER_TEMP/home"
          cd "$RUNNER_TEMP/elsewhere"
          export PROMPTPOTTER_HOME="$RUNNER_TEMP/home"
          "$RUNNER_TEMP/venv/bin/promptpotter" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

  webapp:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next build` does not hard-fail on every type error, so this is what
      # makes tsconfig.json's strict mode enforced.
      - name: Type check
        run: npx tsc --noEmit

      # Reader-side derivations against frozen cycle fixtures — see
      # docs/developer/cycle-fixtures.md.
      - name: Tests
        run: npm run test

      # Two surfaces re-deriving the candidate list is what produced the
      # lineage/fitness alignment bug. New consumers go through
      # useRoundCandidates() / lib/derivations/round-candidates.ts; the three
      # named components are migration debt, each owing its own derivation.
      - name: Anti-rot — no liveL1Candidates outside the spine
        run: |
          ! grep -RnlE 'liveL1Candidates' components/ lib/ app/ \
            | grep -vE '__tests__/|FreqChart\.tsx|HardSamplesHeatmap\.tsx|CandidatesCard\.tsx|lib/poll\.tsx|lib/derivations/round-candidates\.ts'

      # DEPLOY_BUILD=1 validates the shipped artifact: React Compiler pass +
      # source maps. Bare `npm run build` is the local preview path and skips both.
      - name: Build
        run: npm run build:deploy
