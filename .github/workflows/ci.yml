name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check promptpotter/ tests/

      - name: Format check
        run: ruff format --check promptpotter/ tests/

      - name: Dependency check
        run: deptry .

      - name: Type check
        run: mypy promptpotter/

      - name: Tests
        run: pytest tests/ -q --tb=short --cov=promptpotter --cov-report=term-missing
