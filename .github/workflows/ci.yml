name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # uv provisions Python 3.13 and installs the EXACT pinned graph from
      # uv.lock (--frozen fails if the lock drifted from pyproject). This is
      # what makes CI reproducible: a dependency only moves when uv.lock is
      # deliberately regenerated in a PR, never silently at install time.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra stats --extra dev --frozen

      - name: Lint
        run: uv run ruff check promptpotter/ tests/

      - name: Format check
        run: uv run ruff format --check promptpotter/ tests/

      - name: Dependency check
        run: uv run deptry .

      - name: Type check
        run: uv run mypy promptpotter/

      # Anti-rot for the package public surface (abstraction-shape guard).
      # External callers import a concept home from its package __init__, not a
      # deep submodule — a deep import re-leaks internals and re-scatters the
      # concept. Allowlist = the documented foundational exceptions (the
      # EscalationFSM state type, imported below the firing driver to avoid an
      # import cycle — see escalation/__init__). Extend the allowlist only with
      # a reason; the allowlist is the remaining-debt ledger.
      - name: Surface guard — no deep imports past a concept home
        run: |
          violations=$(grep -rn "from promptpotter.application.optimization.escalation\." promptpotter/ --include=*.py \
            | grep -v "/escalation/" \
            | grep -v "escalation.state import EscalationFSM" \
            || true)
          if [ -n "$violations" ]; then
            echo "❌ Deep import past the escalation concept home. Import from the package surface (from ...escalation import X)."
            echo "   Allowlisted exception: the foundational EscalationFSM via .state (cycle.py / resume.py)."
            echo "$violations"
            exit 1
          fi

      # Layering guard: application/ MUST NOT import presentation/ (the one
      # inversion that matters — presentation→application is the normal
      # direction). The view-emit machinery lives in application/views now;
      # ANSI/terminal rendering stays in presentation and imports upward.
      # Allowlist = the remaining CLI-seam debt (load_session/SessionCtx in
      # presentation/cli, and the LiveDisplay subscriber type) — a separate
      # follow-up arc; the allowlist is the debt ledger, shrink it to zero.
      - name: Layering guard — application must not import presentation
        run: |
          violations=$(grep -rn "from promptpotter.presentation\|import promptpotter.presentation" promptpotter/application/ --include=*.py \
            | grep -v "presentation.views.live import LiveDisplay" \
            | grep -v "presentation.cli.session import SessionCtx" \
            | grep -v "presentation.cli.session import load_session" \
            || true)
          if [ -n "$violations" ]; then
            echo "❌ application/ imports presentation/ — wrong direction. Move the shared piece into application/ (presentation imports upward)."
            echo "$violations"
            exit 1
          fi

      # Regenerate the TS type surface from the Pydantic models and fail on any
      # diff. Without this, a drifted model silently ships a stale
      # webapp/lib/api/types.generated.ts that the webapp typechecks against —
      # the generator's "CI re-runs this" contract was previously unenforced.
      - name: Types contract (Pydantic → TS)
        run: |
          uv run python scripts/build_ts_types.py
          git diff --exit-code webapp/lib/api/types.generated.ts

      # Same contract, other generated surface: the optimizer's committed
      # `resolved_schemas` are derived from OPTIMIZER_RESPONSE_MODELS. Ungated, a
      # changed response model ships a stale schema the LLM is then asked to fill.
      - name: Schema contract (Pydantic → optimizer resolved_schemas)
        run: |
          uv run python scripts/build_optimizer_schemas.py
          git diff --exit-code datasets/_optimizer/pipeline.json

      - name: Tests
        run: uv run pytest tests/ -q --tb=short --cov=promptpotter --cov-report=term-missing

  webapp:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: webapp

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Explicit type check — `next build` does not hard-fail on every type
      # error, so this is what makes tsconfig.json's strict mode enforced.
      - name: Type check
        run: npx tsc --noEmit

      # Vitest covers reader-side derivations (lib/derivations/...) against
      # frozen cycle fixtures at tests/fixtures/cycles/. Scope + recipe at
      # docs/developer/cycle-fixtures.md.
      - name: Tests
        run: npm run test

      # Candidate-list construction in components is banned. The spine is
      # `roundCandidates(dash)` (sole consumer of `liveL1Candidates`) +
      # the `useRoundCandidates` hook. Two surfaces re-deriving the same
      # candidate list independently is what produced the lineage/fitness
      # alignment bug; one centralized spine makes that drift impossible —
      # and is what lets the bars and the dendrogram beneath them share one
      # x-axis. Single-field reads (`dash.origin`, `roundOf(dash)`) remain
      # allowed — they don't replicate the spine. Migration of the
      # remaining `liveL1Candidates` sites (FreqChart per-sample bucket,
      # HardSamplesHeatmap per-candidate marks, CandidatesCard evaluator
      # union) is a follow-up; each site needs its own derivation, not a
      # shared one.
      - name: Anti-rot — no liveL1Candidates outside the spine
        run: |
          violations=$(grep -RnlE 'liveL1Candidates' components/ \
            | grep -vE 'FreqChart\.tsx|HardSamplesHeatmap\.tsx|CandidatesCard\.tsx' \
            || true)
          if [ -n "$violations" ]; then
            echo "❌ liveL1Candidates is the candidate-spine constructor — only roundCandidates() and the three named follow-up sites may call it."
            echo "   New consumers must go through useRoundCandidates() or roundCandidates() in lib/derivations/round-candidates.ts."
            echo "$violations"
            exit 1
          fi

      - name: Build
        # Validate the exact shipped artifact: React Compiler pass + source
        # maps on (DEPLOY_BUILD=1). Bare `npm run build` is the fast local
        # preview path and would skip both.
        run: npm run build:deploy
