name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the run of the commit it replaces. A push to main groups by commit,
# so no merged commit's run is ever cancelled or left queued behind the next one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Every job checks out and reads; none writes to the repository, a PR or a check.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The surface ledger counts the merge-base with `origin/main`, so main's history is fetched.
        with:
          fetch-depth: 0

      # `--frozen` is what makes CI reproducible: a dependency moves only when
      # uv.lock is deliberately regenerated, never silently at install time.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # One step, and deliberately: `scripts/gate.py` is the single declaration of
      # what this repo checks, so the desk and CI cannot drift apart. It also runs
      # every check even after one fails — as named steps these masked each other,
      # and each hidden failure cost another push to discover.
      - name: Gate
        run: uv run --frozen python scripts/gate.py --py

  # The wheel is a shape we ship and never run. In a checkout `assets/webapp/` — a tree
  # the wheel serves — is read by no dev run and no test, and `pyproject.toml`'s
  # package-data list (delete it in a clean room and the wheel drops to ONE non-.py file)
  # is load-bearing with nothing behind it. This job is the only place any of that is
  # exercised.
  wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # All three jobs sync the same lock into the same cache key, so only `check` saves it;
      # a second save loses the reservation race and warns on every push.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false

      - name: Install dependencies
        run: uv sync --extra dev --extra api --frozen

      # `--no-webapp` deliberately: the dashboard export is the `webapp` job's subject,
      # and building it again here would double this job's runtime to re-check it.
      # build_release.py already verifies the ARTIFACT (required trees present, no
      # credentials, no stray caches) and deletes a wheel that fails.
      - name: Build the wheel
        run: uv run python scripts/build_release.py --no-webapp

      # Outside the checkout is the whole point — inside one, `source_checkout_root()`
      # answers yes and every assertion in the smoke script is vacuous. It refuses to run
      # from a source tree for that reason.
      #
      # `[api]` because the smoke mounts the app: the wheel's own dependencies are the
      # engine's, and an extra is exactly what a consumer has to ask for.
      - name: Install it elsewhere and run it
        run: |
          uv venv --seed "$RUNNER_TEMP/venv"
          wheel=(dist/*.whl)
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "${wheel[0]}[api]"
          mkdir -p "$RUNNER_TEMP/elsewhere" "$RUNNER_TEMP/home"
          cd "$RUNNER_TEMP/elsewhere"
          export PROMPTPOTTER_HOME="$RUNNER_TEMP/home"
          "$RUNNER_TEMP/venv/bin/promptpotter" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_wheel.py"

  webapp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: webapp

      # `npm run lint` carries --cache, and WRITING that cache costs more than
      # linting without one — ~15s against ~10s on a cold full tree, against ~4s
      # warm. A runner that never restores it pays the write every run and
      # collects the read never, so the flag would be a regression here. Keyed
      # per commit with a prefix restore: each run reads the newest cache and
      # saves its own, and eslint re-lints whatever content actually moved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: webapp/.eslintcache
          key: eslint-${{ github.sha }}
          restore-keys: eslint-

      # The `playwright` check walks the `walk-world` check's run through the API
      # `e2e/serve.mjs` runs out of `.venv`. The gate syncs `.venv` to its pinned
      # extras itself, so that is this job's one sync. `--with-deps` because a
      # bare runner has none of Chromium's shared libraries.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          save-cache: false

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: webapp

      # Same one list as the `check` job — the webapp half of it. Runs from the
      # repo root; the checks that drive node cannot be changed by which
      # interpreter launched them, and the one that drives Python finds `.venv`.
      - name: Gate
        run: python3 scripts/gate.py --web
