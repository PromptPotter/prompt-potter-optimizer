pipeline:
  # Each outer cell runs an inner campaign on a cheap proxy benchmark, configured in `panel:`
  # below; docs/concepts/l4.md.
  description: >-
    Self-optimization: evolves the optimizer's own prompts, scored by the inner campaigns they run.

campaign:
  optimization:
    nodes:
      # = the panel size below, so every round is a census of it. Above it the queue has nothing
      # to select from; below it a round draws a subset, which this calibration panel does not.
      adaptive_queue:
        config:
          sp_budget_round: 6

panel:
  inner_benchmark: justlogic/d234
  # The panel is 6 cells because the OUTER loop's elimination floor is 4: at 2 cells PoBB could
  # never reach it, so nothing was ever eliminated, the outer δ ruler never warmed, and a dud
  # variant cost exactly as much as the winner. 6 > 4 makes all three work — and elimination is
  # what keeps the wider panel from costing proportionally more, since a dud is cut at 4 cells.
  #
  # The cell itself is trimmed to pay for that width: 4 rounds x 3 variants instead of 5 x 4.
  #
  # WHAT A CELL COSTS is unmeasured under this geometry (40 rows a round, up to the whole round
  # budget a cell, three benchmarks). The next C0 reads it off the cycle ledgers; quote it
  # from there, never from arithmetic over the knobs below.
  #
  # `max_inner_rounds` IS the estimand's budget, the width of the area `held_out_lift` reads, and
  # an inner run carries no lives to stop it short. Raising it changes what the panel measures and
  # costs proportional spend, so it is an operator decision, not a tuning detail; read a delta as
  # "how soon the search gains, over a 4-round budget".
  inner_benchmark_config:
    n_samples_per_inner_round: 40
    n_samples_origin: 40
    # Drawn beside the 40-row bank under the same seed and never searched: the scored
    # `held_out_lift` is read here.
    n_samples_bench: 20
    max_inner_rounds: 4
    inner_nodes:
      l1_generate:
        config:
          n_variants: 3
    inner_optimizer_temperature: 0.0
  # A seed picks WHICH 40 rows a cell draws (`application/scoring/seed_screen.py::draw_bank`, the ONE
  # spelling — the runner imports it, so a screened bank and a run bank cannot diverge).
  #
  # The panel spans THREE benchmarks, two seats each, so an edit that helps one task family and
  # hurts another reads as the mixture it is. Each inner campaign reads its own benchmark's δ
  # scale; an outer cell is filed under the outer run's ruler scope
  # (`bench/difficulty.py::session_ruler_scope`) and tagged with the dataset its inner campaign
  # measured (`Sample.measured_dataset`).
  # `hotpotqa-distractor` and `legalbench-fods` are the account's own definitions (tenant tier,
  # `termnorm`-backed); a sandbox resolves them at the account, beside the caches.
  #
  # RETIRED on `justlogic/d234`, each on the strongest evidence available for it:
  #   seed-1 — REWARDS COLLAPSE. Constant-answer floor 0.550 (exact) against origin reads of 0.525
  #     and 0.500: below on both, so a candidate that stops reasoning and answers a single label
  #     outscores the parent, every round.
  #   seed-5 — 11 of its 40 rows carried NO information (7 that nothing solved, 4 that everything
  #     solved): a 16-row instrument at a 40-row price. Its collapse reading did NOT hold on a second
  #     read; do not cite it.
  #   seed-4 — margin +0.021 over 6 settled passes: about ONE row in 40 of credit for reasoning.
  #   seed-7 — EXCLUDED from the pool (operator, 2026-08-02): lowest measured origin is how seed-5
  #     got a seat, and a fresh screen cannot tell hard from impossible. Do not re-propose it.
  #
  # THE LESSON THAT COST THE MOST: the floor is EXACT, the origin is MEASURED at ~0.08 SE per
  # 40-row pass, and only the measured side decides. Compare banks on the GAP (`reasoning_margin`),
  # never on floor or accuracy alone, and treat a thin positive margin as disqualifying. The
  # thin-margin rule is written here and nowhere in code: `seed_screen.py` disqualifies only
  # `class_floor > origin`.
  #
  # SEATED, each on its `seed-screen` line (margin = origin - constant-answer floor):
  #   justlogic/d234 seed-20 — origin 0.610, floor 0.350, margin +0.260 +/-0.023, 5 passes.
  #   justlogic/d234 seed-3  — margin +0.150 +/-0.018, 5 passes.
  #   hotpotqa-distractor seed-1 — origin 0.500, floor 0.025, margin +0.475 +/-0.000, 3 passes.
  #   hotpotqa-distractor seed-0 — origin 0.500, floor 0.100, margin +0.400 +/-0.014, 3 passes.
  #   legalbench-fods seed-0 — origin 0.525, floor 0.250, margin +0.275 +/-0.000, 3 passes.
  #   legalbench-fods seed-1 — origin 0.392, floor 0.200, margin +0.192 +/-0.017, 3 passes.
  # The 2026-11-11 records are `diagnostics/seed-screen-{dataset}-2026-11-11.json` in the account.
  #
  # Each task is its own sample's content address (`runner/inner/spawn.py::_extract_experiment`),
  # so a swapped or edited seat voids only its own banked cells; every other seat replays.
  tasks:
    - kind: seat
      id: justlogic-d234/seed-20
      run_seed: 20
    - kind: seat
      id: justlogic-d234/seed-3
      run_seed: 3
    - kind: seat
      id: hotpotqa-distractor/seed-1
      inner_dataset: hotpotqa-distractor
      run_seed: 1
    - kind: seat
      id: hotpotqa-distractor/seed-0
      inner_dataset: hotpotqa-distractor
      run_seed: 0
    - kind: seat
      id: legalbench-fods/seed-0
      inner_dataset: legalbench-fods
      run_seed: 0
    - kind: seat
      id: legalbench-fods/seed-1
      inner_dataset: legalbench-fods
      run_seed: 1
