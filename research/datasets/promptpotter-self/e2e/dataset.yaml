pipeline:
  # The browser walk's L4 fixture: the family's graph over the degenerate one-search-cell panel in
  # `panel:` below. It proves the recursion still spawns and scores end to end, cheaply enough to
  # run often, and measures nothing.
  description: >-
    Self-optimization smoke test: one small inner campaign per outer cell.

campaign:
  # Every number here is the smallest that still exercises the TRANSITION it belongs to, and
  # none of them is calibrated. `family.yaml::campaign` above this directory carries the reasoning
  # for the real values — the panel width that lets PoBB eliminate, the round count that makes a lift
  # falsifiable, the epsilon fitted to its own p_best stream. None of that survives at this size,
  # which is the point: this fixture exists to prove the L4 path RUNS — generate, score, elect,
  # carry a winner into the next round — and it is deliberately unable to MEASURE anything.
  optimizer_narrowing:
    l1_generate: &e2e_models
      param_allowed_values:
        model:
          - openai/gpt-6-luna
    l1_critique: *e2e_models
    l2_context: *e2e_models
    l3_plan: *e2e_models
    checkin: *e2e_models
  optimization:
    # Round 0 (the origin) plus two search rounds: the second carries the first's winner forward.
    # The inner campaigns stay at the floor of two rounds (`inner_campaign` below) — depth is what
    # costs money here, since every outer cell is a whole inner campaign.
    # The USD ceiling the browser walk runs under is a STOP, not a forecast: the fixture is
    # built to come in far below it, and the run halting there means the geometry drifted.
    budget: {usd: 0.05, rounds: 2}
    # Potter's knobs — the overlay on its manifest's nodes (assets/optimizers/potter/).
    nodes:
      # = the panel's search seats in dataset.yaml::panel. One cell.
      adaptive_queue:
        config:
          sp_budget_round: 1
      l1_generate:
        config:
          # NOT 1, and this is a correctness bound rather than a coverage nicety. An inner campaign id is
          # content-addressed on the arm's edits, so a single variant makes round 0's candidate
          # byte-identical to the origin — the same inner campaign, spawned twice, and the second spawn
          # hits `_continue_inner_campaign`'s "another producer owns it" guard and errors the only cell
          # on the panel. Two variants give the round a real candidate field and two distinct inner ids.
          n_variants: 2
      escalation:
        config:
          l1_patience: 1
          l2_patience: 1

panel:
  # The DEGENERATE panel — a plumbing fixture for the browser walk, not an instrument.
  #
  # `promptpotter-self/run` is the real one and this is not a cheaper version of it:
  # every property that makes that panel MEASURE something has been removed here on purpose. One
  # search cell, so PoBB can never reach its elimination floor of 4 and nothing is ever eliminated. Two
  # inner rounds, the floor the area is read over. One inner variant, so there is no candidate
  # field to select from. Two samples, so the inner θ is noise, and two held-out rows, the fewest
  # the area's paired t reads.
  #
  # The `inner_campaign` below names only the sizes; the family's lays the rest. Its bench draws by
  # `partition_bank`'s `stable_hash([seed, key])`, so seed 0 sits other rows than its screen did.
  #
  # READ NOTHING OFF A RUN OF THIS. It answers exactly one question — does the L4 spawn path still
  # work end to end — and any number it emits is an artefact of the geometry above.
  #
  # What a cell costs, what the cost floor is, and why the family's benchmark is not a shallower cut:
  # `README.md` beside this file owns all three. Do not restate them here — they are one argument
  # and it drifts the moment it has two homes.
  inner_campaign:
    sp_budget_origin: 2
    dataset_split: {bench: 2, tolerance: 0}
    optimization:
      budget: {rounds: 2}
      nodes:
        adaptive_queue: {config: {sp_budget_round: 2}}
        l1_generate: {config: {n_variants: 1}}
  tasks:
    # One search seat and one held-out seat: the fewest that turn the outer search and its bench over.
    - kind: seat
      id: justlogic-d234/seed-0
      run_seed: 0
    - kind: seat
      id: justlogic-d234/seed-1
      held_out: true
      run_seed: 1
