pipeline:
  connector: promptpotter
  # What an operator may steer the inner optimizer TO on a babysat fork. It must name the model
  # `assets/optimizers/potter/pipeline.yaml` runs on every node (minimax-m3.1-flash), or every run
  # silently sits in the taints-the-branch case the gate exists to mark; the others stay because
  # `pipeline.yaml::available_models` still offers them as sanctioned alternatives. Move this list
  # in the SAME commit as the manifest — it and `_MODEL_PROFILES` are the two that do not fail
  # loudly when they lag behind it.
  available_models: &pp_self_models
    - minimax/minimax-m3.1-flash
    - qwen/qwen3.7-flash
    - openai/gpt-6-luna
    - deepseek/deepseek-v4-flash:nitro
    - qwen/qwen3.8-27b:nitro
    - openai/gpt-oss-120b
  # No `nodes:` and no `pipelines:`: the graph is the inner optimizer's, which the connector serves
  # (`runner/inner/tasks.py::InnerCells.pipeline`) — every llm node the manifest the cells run
  # declares, on that manifest's walks. A dataset here overlays it as any dataset overlays its backend.

campaign:
  # The list above rides `optimizer_narrowing`, which is the ONE permitted set — what the optimizer
  # may pick where an axis is open, and what a human may steer to un-tainted where it is not. A
  # `param_allowed_values` entry REPLACES the node's own list rather than intersecting with it
  # (`PipelineSchema.narrow`), so this file may name a model the manifest predates. It is a
  # permission, not an instrument: no cell's pin (`domain/l4/cells.py::InnerTaskSpec`) reads it.
  optimizer_narrowing:
    l1_generate: &pp_self_narrowing
      param_allowed_values:
        model: *pp_self_models
    # `l1_score` is absent on purpose, and is the only node here that is: it is the measurement
    # node, so it runs no model and a permitted model set on it names nothing.
    l1_critique: *pp_self_narrowing
    l2_context: *pp_self_narrowing
    l3_plan: *pp_self_narrowing
    checkin: *pp_self_narrowing
  # ONE measurand: what the inner search DELIVERED on rows it never searched — `held_out_lift`, the
  # ADOPTED prompt's headline fitness on the cell's held-out bench minus the origin's, over the
  # round budget, so exploring costs nothing and a promotion that fits its own rows buys nothing.
  # Measured over a 39-cell panel, only a lift term discriminated between optimizer prompts; the
  # quality factors of a four-factor composite carried more seed variance than arm variance while
  # holding authority over the ordering. The search split's θ lift (`mean_round_delta`) is served beside it wherever the
  # inner series differences, and scores nothing: read on the rows the search selected on, it
  # is in-sample.
  # The re-anchor is LINEAR and only exists because `compile_scorer` refuses an empty formula and
  # its scorer clamps [0,1]: one headline point of lift is one fitness point, so the paired
  # estimator's reported effect IS the mean held-out lift — a number you can read, not merely order
  # by. The window is half a unit each side of zero: a 20-row bench moves in steps of 0.05, so a
  # cell clips only past ten rows of lift or loss. A `floored` cell measured no lift and scores 0.0.
  # Re-check here, not by intuition, once a banked corpus exists under this measurand.
  scoring:
    per_sample: 0.0 if floored else max(0.0, min(1.0, held_out_lift + 0.5))
  display_metric: ability
  # The bench is the seats a panel declares `held_out`, which the outer search never draws; the
  # origin and each outer adoption are graded on them once.
  dataset_split: {bench: 0}
  bench_trigger: every_adoption
  optimization:
    # What C0 and a round cost is unmeasured under the panel's geometry (40 rows a round, three
    # benchmarks, up to the whole round budget an inner run). The next C0 reads it off the
    # cycle ledgers; re-price `budget.usd` from there, never from arithmetic over the knobs.
    #
    # It must also be falsifiable: ONE optimizing round is a coin toss rather than a test of a
    # challenger, whatever the outer SE reads under the held-out measurand.
    budget: {usd: 5.0, rounds: 4}
    elimination_n_min: 4
    # Potter's knobs — the overlay on its manifest's nodes (assets/optimizers/potter/).
    nodes:
      # = a panel's search seats: the draw leaves out the parent's crowning seats, and the origin
      # panel tops every arm walked to its draw's end back up to all six (`round.py::read_origin_panel`).
      adaptive_queue:
        config:
          sp_budget_round: 6
      l1_generate:
        config:
          block_access: 'off'
          # No outer round is banked to set it from: 3 variants send at most 3 x 6 = 18 inner
          # campaigns a round, 3 x 4 = 12 once PoBB cuts each loser at `elimination_n_min`.
          n_variants: 3
          # The start renders 7,485 chars, so 4 rounds at this leave a subject of at most 15,485.
          # Outer round 1's rewrites moved +730 and +765.
          length_budget: 2000
          # A seat's whole inner run, every round and arm: 4.8–6.3k chars on the `run` C0. Placed
          # last in the generator's 11,000-char discretionary share, one or two fit whole.
          transcripts: 2
          transcript_chars: null
      # The critique reads every search seat's whole inner run.
      l1_critique:
        config:
          transcripts: null
          transcript_chars: null
      escalation:
        config:
          # No `optimization.lives`, and its absence is deliberate rather than an omission. It read
          # `start: 2` against `budget.rounds: 2`, so the bank could not reach zero before the
          # calendar did: hearts NEVER bound, they only relabelled the stop. `af6252` stopped
          # `lives_exhausted` on round 2, which is also exactly where `budget.rounds` would have
          # ended it, and nothing in the record says which fact stopped the run. Deleting the
          # inert knob changes no round, only the reason it reports. Re-add it with real
          # headroom (`start` well under `budget.rounds`) when the outer loop runs long enough for
          # a measurement-driven brake to mean something — the `lives_no_headroom` coupling
          # warns if it goes back in without it.
          # `budget.rounds: 4` is four search rounds past the origin. Stalled throughout, L2 steers
          # rounds 2 and 3 and L3 round 4 (default `l2_patience: 2`); at `l1_patience: 2`, round 3 alone.
          l1_patience: 1
      pobb:
        config:
          # Per-campaign, NOT the global default (0.15, whose false-cut curve was measured on the
          # general round corpus). Here one candidate-cell is a whole inner campaign, so the two
          # errors are priced very differently: a false cut loses one arm of a 3-variant round,
          # while a false survival spends the rest of a 6-cell panel on an arm already losing.
          # Racing at the global epsilon captured about a quarter of the headroom its own p_best
          # stream offered on `promptpotter-self__af6252`.
          epsilon: 0.30

panel:
  # Each outer cell runs an inner campaign on a cheap proxy benchmark; docs/concepts/l4.md. One
  # geometry for every member: each names only its seats, so a `dev` cell replays inside `run`.
  inner_benchmark: justlogic/d234
  # A panel searches 6 cells because the OUTER loop's elimination floor is 4: at 2 cells PoBB could
  # never reach it, so nothing was ever eliminated, the outer δ ruler never warmed, and a dud
  # variant cost exactly as much as the winner. 6 > 4 makes all three work — and elimination is
  # what keeps the wider panel from costing proportionally more, since a dud is cut at 4 cells.
  #
  # The cell itself is trimmed to pay for that width: 4 rounds x 3 variants instead of 5 x 4.
  #
  # Laid over each seat dataset's own `campaign:` block, as any campaign block is. Two facts follow:
  # - A round reads the first 40 search rows less the crowning cells, then refills from row 41
  #   (`members.py::AdaptiveQueue.draw`, `adaptive_queue_mechanism.py::covered_prefix`).
  # - `partition_bank` ranks rows by `stable_hash([seed, key])`, so the seats draw other rows than
  #   the seed screens below read: those screens no longer describe the seats.
  inner_campaign:
    sp_budget_origin: 40
    # `demo: 0` is load-bearing: justlogic's own `demo: 50` would open shots.
    dataset_split: {bench: 20, demo: 0, tolerance: 2}
    bench_trigger: every_adoption
    optimization:
      # The width of the area `held_out_lift` reads, and inside every cell's key.
      budget: {rounds: 4}
      determinism: {temperature: 0.0}
      nodes:
        adaptive_queue: {config: {sp_budget_round: 40, per_round_resubset: false}}
        l1_generate: {config: {n_variants: 3}}
  #
  # A panel spans THREE benchmarks, two search seats each, so an edit that helps one task family
  # and hurts another reads as the mixture it is. Each inner campaign reads its own benchmark's δ
  # scale; an outer cell is filed under the outer run's ruler scope
  # (`bench/difficulty.py::session_ruler_scope`) and tagged with the dataset its inner campaign
  # measured (`Sample.measured_dataset`).
  # `hotpotqa-distractor` and `legalbench-fods` are the account's own definitions (tenant tier,
  # `termnorm`-backed); a sandbox resolves them at the account, beside the caches.
  #
  # RETIRED on `justlogic/d234`, each on the strongest evidence available for it:
  #   seed-1 — REWARDS COLLAPSE. Constant-answer floor 0.550 (exact) against origin reads of 0.525
  #     and 0.500: below on both, so a candidate that stops reasoning and answers a single label
  #     outscores the parent, every round.
  #   seed-5 — 11 of its 40 rows carried NO information (7 that nothing solved, 4 that everything
  #     solved): a 16-row instrument at a 40-row price. Its collapse reading did NOT hold on a second
  #     read; do not cite it.
  #   seed-4 — margin +0.021 over 6 settled passes: about ONE row in 40 of credit for reasoning.
  #   seed-7 — EXCLUDED from the pool (operator, 2026-08-02): lowest measured origin is how seed-5
  #     got a seat, and a fresh screen cannot tell hard from impossible. Do not re-propose it.
  #
  # THE LESSON THAT COST THE MOST: the floor is EXACT, the origin is MEASURED at ~0.08 SE per
  # 40-row pass, and only the measured side decides. Compare banks on the GAP (`reasoning_margin`),
  # never on floor or accuracy alone, and treat a thin positive margin as disqualifying. The
  # thin-margin rule is written here and nowhere in code: an origin round's collapse verdict reads
  # only floor > origin.
  #
  # The six search seats were seated on 2026-11-11 screens of rows they no longer draw; `run`'s
  # three held-out seats are unscreened on purpose: pilots set seats (operator, 2026-11-15).
  #
  # A swapped seat voids only its own banked cells; an `inner_campaign` edit voids every seat's.
