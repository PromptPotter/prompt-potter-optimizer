version: '3.8'

services:
  promptpotter-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: promptpotter-optimizer
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    env_file:
      - ../.env
    volumes:
      # Mount source code for development (hot reload)
      - ../api:/app/api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - promptpotter-network

networks:
  promptpotter-network:
    driver: bridge
