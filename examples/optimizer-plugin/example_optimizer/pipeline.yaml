name: example
version: v1.0
available_models:
  - openai/gpt-oss-20b:nitro
nodes:
  example_draw:
    type: sampler
    config:
      size: 8
  propose:
    type: llm
    description: Rephrases the parent's instruction.
    config:
      prompt_family: propose
      prompt_version: 1
      temperature: 1.0
      max_tokens: 8000
      provider: openrouter
      model: openai/gpt-oss-20b:nitro
      variants: 2
      # The reply replaces the instruction alone; every other locus is the parent's.
      rewrites: instruction
  score:
    type: measurement
    config: {}
  example_keep:
    type: selector
    description: Keeps the best-scoring arm when it beats its parent.
    config: {}
pipelines:
  default:
    - example_draw
    - propose
    - score
    - example_keep
resolved_prompts:
  propose/1:
    instruction: |-
      Rephrase this prompt for the task: {{task_description}}
      Prompt: {{instruction}}

      Return the new prompt in the following format:
      <prompt>new prompt</prompt>
