# PromptPotter Control-remote — closed outbound event set
#
# This file is the source of truth for the outbound SSE event channel.
# Every `ProjectionEnvelope` variant (kind + payload schema) MUST be
# declared here BEFORE a record class is added to
# `promptpotter/domain/run_records.py::CycleRecord` or before a projection
# emits it as an SSE frame from `CycleLedgerTail`.
#
# Drift detection: the Python half is enforced at import — `ProjectionKind` is
# compared against the `CycleRecord` arms in `domain/projection_envelope.py` and
# raises on either direction. THIS file is still checked by review + AsyncAPI
# Studio CLI lint (no `test_contracts.py` — the structural/contract suite was cut
# to the silent-harm core, see tests/CLAUDE.md).
#
# Permanent contract: docs/adr/0001-m12-control-plane.md
# §0 definition: docs/architecture.md § State + persistence — the five I/O kinds
#
# Status: Profile A shipped. The closed outbound set is the FULL `CycleRecord`
# union — every `record_type` on the ledger is streamable — plus the
# projection-only `stream_snapshot`. A kind absent from the enum is dropped by
# `CycleLedgerTail` while its line index still advances, which shows up to clients
# as a `sequence` gap and trips the reconnect recipe in clause 4 below.
# **A record kind that is not listed here is not "filtered", it is a hole.**
#
# A payload property may carry `x-status`, with the two values and meaning
# `api-openapi.yaml`'s header defines.

asyncapi: 3.0.0

info:
  title: PromptPotter Control-remote event stream
  version: 0.0.0-profile-minus-1
  description: |
    The outbound Server-Sent Events channel for PromptPotter's interactive
    control plane. Every frame on the wire is a `ProjectionEnvelope` whose
    `kind` field discriminates the payload schema. The envelope is closed —
    no raw payload variants, no envelope variation.

    See `docs/adr/0001-m12-control-plane.md` for the permanent contract, the
    Profile gradient (A-E), and the 20-item security checklist. The
    snapshot-then-tail subscription contract (security boxes 13-15) is
    enforced at Profile A.

  contact:
    name: PromptPotter maintainers
  license:
    name: See repository LICENSE

servers:
  local:
    host: localhost:8001
    protocol: http
    description: Local dev (uvicorn + auth-off, Stage 0 / Profile B default).
  hosted:
    host: '{install}.promptpotter.com'
    protocol: https
    description: Hosted hub (Profile D - placeholder, OIDC required).
    variables:
      install:
        default: example
        description: Per-install hostname slug.

channels:
  cycleEvents:
    address: /campaigns/{campaign_id}/cycles/{cycle_id}/events:subscribe
    title: Cycle event stream
    summary: |
      SSE stream of every record appended to the canonical per-cycle ledger
      (`.runtime/ledger.jsonl`), plus a leading snapshot frame and periodic
      heartbeats. Sole writer: `CycleLedgerTail`
      (`infrastructure/projections/event_stream.py`) — a cross-process
      tail of that file, NOT an in-process projection.
    description: |
      Subscription contract (security boxes 13-15):
        1. Snapshot frame first. The first message on the stream is a
           `stream_snapshot` envelope whose payload is the cycle's served
           dashboard; its `sequence` is the ledger offset the tail picks
           up at.
        2. Then the live tail. Subsequent messages are individual record
           projections with strictly-increasing `sequence` (starting at
           the snapshot's).
        3. Heartbeat every 15 s during idle so proxies and clients can
           distinguish "no events" from "stream broken." It is an **SSE
           comment line** (`: ping`), emitted by `EventSourceResponse`
           (sse-starlette) — **not** a `heartbeat` event with a JSON payload.
           `EventSource` clients ignore it automatically; do not wait on it.
        4. Missed frames are detectable via `sequence` gap. Clients SHOULD
           re-subscribe to receive a fresh snapshot if a gap is observed.
           This only works because the `kind` enum covers EVERY ledger
           `record_type`: the tail advances its line index for a line it
           cannot map, so an unlisted kind would read as a gap and drive a
           spurious reconnect. A gap now means a genuinely malformed line.
        5. **This channel is the live tail only — it has no replay.**
           `snapshot_frame` parks one past the offset its dashboard is a fold
           of, so a subscriber never receives history through it. History is served by
           `GET /campaigns/{c}/cycles/{cy}/ray` (the family-wide, windowed,
           paged chronology), which is the replay endpoint referenced by
           `domain/projection_envelope.py`. Do not add a `since=` parameter
           here; that would be a second replay mechanism.
        6. **404 ONLY for an unknown cycle** (the cycle directory does not
           exist). A *running*, *paused*, and *finished* cycle all subscribe
           successfully. There is no process-wide registry and no "live stream
           to attach to": the stream is a **cross-process tail of the on-disk
           ledger** (`CycleLedgerTail`), so any reader can replay a finished
           cycle's frames from disk. The chat's snapshot-then-tail paint depends
           on exactly that.
    parameters:
      campaign_id:
        description: Target campaign id (matches `campaigns/{campaign_id}/`).
      cycle_id:
        description: Target cycle id (matches `cycles/{cycle_id}/`).
    bindings:
      http:
        type: response
        method: GET
        query:
          type: object
          properties:
            descend:
              type: string
              description: |
                Optional L4 descent. Walks into the previous hop's `.inner/<key>`
                sandbox one hop per id, so the chat/dashboard can follow the
                viewed leaf of a `CyclePath` into an inner campaign. Omitted =
                the top-level cycle addressed by the path ids.
    messages:
      projectionFrame:
        $ref: '#/components/messages/ProjectionFrame'

operations:
  subscribeCycleEvents:
    action: receive
    channel:
      $ref: '#/channels/cycleEvents'
    summary: |
      Client subscribes to the cycle's event stream. Sole writer is
      `CycleLedgerTail`. No multi-writer semantics, no broadcast-shape
      negotiation - the runtime owns the order.
    messages:
      - $ref: '#/channels/cycleEvents/messages/projectionFrame'

components:
  messages:
    ProjectionFrame:
      name: projectionFrame
      title: A single projection envelope on the SSE channel.
      summary: |
        Every non-heartbeat SSE frame is one of these. `event:` is always
        `projection`; `data:` is the serialized `ProjectionEnvelope`.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProjectionEnvelope'

    # No HeartbeatFrame message — the keepalive is untyped; channel contract clause 3.

  schemas:
    ProjectionEnvelope:
      type: object
      description: |
        Closed envelope shape. Every SSE frame outside of heartbeats has
        this exact shape - no raw payload variants, no envelope variation.
      required: [kind, cycle_id, sequence, payload, activity]
      additionalProperties: false
      properties:
        activity:
          $ref: '#/components/schemas/ActivityState'
        kind:
          type: string
          description: |
            The record kind discriminator. MUST be one of the kinds enumerated
            below. Adding a new kind requires updating this file first; the
            corresponding record class is then added to
            `promptpotter/domain/run_records.py::CycleRecord`.
          enum:
            # The ledger record kinds. Values mirror `record_type: Literal[...]`
            # in `promptpotter/domain/run_records.py`, and the set MUST cover the
            # whole `CycleRecord` union — see the status note at the top of this
            # file for why an omission is a sequence hole rather than a filter.
            - decision
            - llm_call_progress
            - llm_call
            - llm_call_start
            - phase
            - token_usage
            # Where the run stands, a fact per record.
            - run_phase
            - round_entered
            - round_proposed
            - round_closed
            - optimizer_state
            - round_standing
            # A backend attempt that failed and will be tried again
            # (`BackendWarningRecord`).
            - backend_warning
            # A provider's 429 episode on one sender — its open and each later
            # throttle, told to each ledger whose sends it holds
            # (`ProviderHoldRecord`), then its ease, told to each of them at
            # once (`ProviderEasedRecord`).
            - provider_hold
            - provider_eased
            # One arm's walk, a fact per record; `flight` alone names no arm.
            # `arm` is one arm's transition (`ArmRecord`), the earliest point
            # a chronology can name it.
            - arm
            - sample_started
            - sample_scored
            - flight
            - race_standing
            - race_catch_up
            # The cycle's read-once starting point (`CycleSeedRecord`). One
            # record at the head of a non-root cycle's own ledger; reads as
            # "this cycle was seeded from X" at the top of a fork's thread.
            - cycle_seed
            # Profile A: snapshot-then-tail boundary marker (projection-only,
            # no underlying record class - synthesized by the tail).
            - stream_snapshot
            # Profile B: inbound command + runner ack (added to CycleRecord
            # union when Profile B handlers land).
            - command
            - command_ack
            # R1: structured runner failure record. Emitted by the runner's
            # three ``except`` sites in ``application/runner/{entry,loop}.py``
            # via the kwargs-only ``emit_error_record(...)`` helper over the
            # ``_CYCLE_LEDGER`` ContextVar; ``LiveDashboardProjection._handle_error``
            # is the sole writer of ``dashboard.json::error``.
            - error
            # Non-fatal round-scoped degradation (zero-candidate round, L2
            # framing soft-reject, injection budget truncation) — emitted via
            # ``emit_round_warning(...)`` over the ``_CYCLE_LEDGER`` ContextVar.
            # Previously log-only; now visible on every channel. Sole dashboard
            # writer ``LiveDashboardProjection._handle_round_warning``
            # (``dashboard.json::recent_loop_warnings``).
            - round_warning
            # The crown, stamped once per round by ``elect_round_winner`` on its
            # own record so the tree can crown before the round closes
            # (``ElectionRecord``). Absent here it burned one offset per round of
            # every campaign — the most frequent instance of the hole above.
            - election
            # The cycle's standing operator budget — the axes an operator named,
            # appended by ``set-limits`` and by a launch flag that moves one
            # (``StandingBudgetRecord``); the last one wins.
            - standing_budget
            # What a launch runs under — the optimizer's pacing, the connector's
            # declarations and the admitted budget (``RunWiringRecord``); the
            # last one wins.
            - run_wiring
            # The criterion the origin's measurement locked, where the campaign
            # declared scoring dials (``ScoringLockedRecord``).
            - scoring_locked
            # The cycle's own facts, each appended as it becomes true and folded into
            # `CycleIndex` (`index.json` is that fold, written): that it exists and
            # what it was cut from (``CycleMintedRecord``), what its runner banked
            # at its stop (``CycleFinalRecord``), that the line moved off it
            # (``CycleSupersededRecord``), a cut's measured direction
            # (``ForkGradedRecord``), an operator's intervention
            # (``InterventionRecord``), and the outer work-item an L4 inner cycle
            # opened for (``SpawnedRecord``). None is a progress event.
            - cycle_minted
            - cycle_final
            - cycle_superseded
            - fork_graded
            - intervention
            - spawned
            # A launch's claim on the cycle before any process runs it — queued or
            # starting (``LaunchClaimRecord``) — and the act that lets it go
            # without a run (``LaunchReleasedRecord``). Neither is a progress event.
            - launch_claim
            - launch_released
            # An account's banked spend, written before a delete takes the rows
            # carrying it (``SpendTombstoneRecord``). Rides the WORKSPACE ledger,
            # so it reaches no cycle subscriber — listed because the enum's rule
            # is the union, not the subset a given channel happens to carry.
            - spend_tombstone
            # The commands a deleted campaign or cycle carried, banked the same
            # way (``TrailTombstoneRecord``). Rides the WORKSPACE ledger.
            - trail_tombstone
            # An account's own history — created, signed in, terms accepted
            # (``AccountEventRecord``). Rides the WORKSPACE ledger, so it reaches
            # no cycle subscriber.
            - account_event
            # A cell or an optimizer / judge call the campaign's search priced —
            # billed fresh or metered as a replay (``PricedKeyRecord``), so a
            # resumed launch prices it once.
            - priced_key
        cycle_id:
          type: string
          description: |
            Target cycle id. MUST match the `cycle_id` path parameter the
            client subscribed against (the channel enforces tenant scope;
            the runtime enforces cross-tenant rejection per security box 12).
        sequence:
          type: integer
          minimum: 0
          description: |
            Monotonically-increasing per-stream sequence. The snapshot frame
            carries the sequence of the LAST record included in the snapshot;
            subsequent live tail frames are strictly greater. Heartbeats do
            NOT advance sequence.
        payload:
          description: |
            Per-kind payload. The envelope's `kind` field discriminates
            which payload schema applies. Each per-kind schema below
            mirrors the corresponding record class in
            `promptpotter/domain/run_records.py`; the AsyncAPI spec is the
            source of truth, the Python classes mirror it.
          oneOf:
            - $ref: '#/components/schemas/StreamSnapshotPayload'
            - $ref: '#/components/schemas/DecisionPayload'
            - $ref: '#/components/schemas/PhasePayload'
            - $ref: '#/components/schemas/RunPhasePayload'
            - $ref: '#/components/schemas/RoundEnteredPayload'
            - $ref: '#/components/schemas/RoundProposedPayload'
            - $ref: '#/components/schemas/RoundClosedPayload'
            - $ref: '#/components/schemas/OptimizerStatePayload'
            - $ref: '#/components/schemas/RoundStandingPayload'
            - $ref: '#/components/schemas/BackendWarningPayload'
            - $ref: '#/components/schemas/ProviderHoldPayload'
            - $ref: '#/components/schemas/ProviderEasedPayload'
            - $ref: '#/components/schemas/ArmPayload'
            - $ref: '#/components/schemas/SampleStartedPayload'
            - $ref: '#/components/schemas/SampleScoredPayload'
            - $ref: '#/components/schemas/FlightPayload'
            - $ref: '#/components/schemas/RaceStandingPayload'
            - $ref: '#/components/schemas/RaceCatchUpPayload'
            - $ref: '#/components/schemas/TokenUsagePayload'
            - $ref: '#/components/schemas/LlmCallStartPayload'
            - $ref: '#/components/schemas/LlmCallProgressPayload'
            - $ref: '#/components/schemas/LlmCallPayload'
            - $ref: '#/components/schemas/CommandPayload'
            - $ref: '#/components/schemas/CommandAckPayload'
            - $ref: '#/components/schemas/ErrorPayload'
            - $ref: '#/components/schemas/RoundWarningPayload'
            - $ref: '#/components/schemas/CycleSeedPayload'
            - $ref: '#/components/schemas/ElectionPayload'
            - $ref: '#/components/schemas/StandingBudgetPayload'
            - $ref: '#/components/schemas/RunWiringPayload'
            - $ref: '#/components/schemas/ScoringLockedPayload'
            - $ref: '#/components/schemas/CycleMintedPayload'
            - $ref: '#/components/schemas/CycleFinalPayload'
            - $ref: '#/components/schemas/CycleSupersededPayload'
            - $ref: '#/components/schemas/ForkGradedPayload'
            - $ref: '#/components/schemas/InterventionPayload'
            - $ref: '#/components/schemas/SpawnedPayload'
            - $ref: '#/components/schemas/LaunchClaimPayload'
            - $ref: '#/components/schemas/LaunchReleasedPayload'
            - $ref: '#/components/schemas/SpendTombstonePayload'
            - $ref: '#/components/schemas/TrailTombstonePayload'
            - $ref: '#/components/schemas/AccountEventPayload'

    # ---- The run's current state, stamped on every frame ----
    # Mirrors `promptpotter/domain/activity.py`. The tail folds the ledger up to each frame —
    # the snapshot's included — so a subscriber keeps the newest frame's `activity` and
    # translates nothing.

    ActivityState:
      type: object
      description: What the run is doing now, and what was said that still holds.
      required: [status, notices, decision]
      additionalProperties: false
      properties:
        status:
          description: The one line saying what the run is doing; each new one replaces it.
          oneOf:
            - $ref: '#/components/schemas/ActivityItem'
            - type: 'null'
        notices:
          type: array
          description: |
            Warnings and controls of the round the run is in, and any error of this launch.
            The round is the one whose phase the runner last entered; a notice from a round
            it has left is no longer served.
          items:
            $ref: '#/components/schemas/ActivityItem'
        decision:
          description: |
            What the run is holding for the operator to decide, or null while it holds for
            nothing. Served from the run-phase declaration that opened the hold until the next
            one, so a subscriber renders it and tests no phase.
          oneOf:
            - $ref: '#/components/schemas/ActivityDecision'
            - type: 'null'

    ActivityDecision:
      type: object
      description: |
        A choice the run is holding for: what to say about it, and the commands that answer it.
        A subscriber renders every field verbatim and computes nothing.
      required: [title, lead, facts, reasons, actions]
      additionalProperties: false
      properties:
        title: { type: string }
        lead: { type: string, description: The paragraph under the title. }
        facts:
          type: array
          description: The evidence behind the hold, one labelled line each, in reading order.
          items:
            type: object
            required: [label, value, tone]
            additionalProperties: false
            properties:
              label: { type: string }
              value: { type: string }
              tone: { type: string, enum: [good, warn, bad, muted] }
        reasons:
          type: array
          description: Why the run is holding, one sentence fragment each.
          items: { type: string }
        actions:
          type: array
          description: |
            One button each. A press POSTs `payload` to `/commands/{kind}` unchanged — the
            payload already addresses the cycle, its `descend` tail included.
          items:
            type: object
            required: [label, variant, kind, payload]
            additionalProperties: false
            properties:
              label: { type: string }
              variant: { type: string, enum: [primary, ghost, danger] }
              kind:
                type: string
                description: A `/commands/{kind}` kind, as `api-openapi.yaml` declares the set.
              payload: { type: object }

    ActivityItem:
      type: object
      description: One record's reading — a line to show, and the round and candidate it is about.
      required: [id, kind, icon, label, detail, tone, round, candidate]
      additionalProperties: false
      properties:
        id: { type: string, description: The record's kind and ledger offset. }
        kind:
          type: string
          enum: [running, done, candidate, round, warning, error, merge, progress]
        icon: { type: string }
        label: { type: string }
        detail: { type: [string, 'null'] }
        tone: { type: string, enum: [good, warn, bad, muted] }
        round: { type: [integer, 'null'] }
        arm:
          type: [string, 'null']
          description: The arm the record is about, by its key; `label` renders it.

    # ---- Profile A: projection-synthesized payload ----

    StreamSnapshotPayload:
      type: object
      description: |
        Payload of the `stream_snapshot` frame — the first message on the
        stream. The cycle's served dashboard at subscribe time. The
        envelope's `sequence` carries the ledger offset the tail picks up
        at; the payload does not repeat it.
      additionalProperties: true
      properties:
        warming_up:
          type: boolean
          description: |
            Set to `true` when `dashboard.json` does not yet exist (fresh
            campaign before origin's first flush). The body is then a
            `WarmingDashboard` — the cycle's ids, `run_phase` and `producer`
            — and clients should render a "campaign initialising"
            placeholder.

    # ---- Profile A: record-derived payloads ----
    # Each mirrors a `*Record` class in `promptpotter/domain/run_records.py`.
    # The envelope's `kind` field strips the record's `record_type` discriminator;
    # these schemas describe the rest.

    DecisionPayload:
      type: object
      description: |
        ResumeCheckpointRecord — one recorded loop decision. `fork_cut` and
        `panel_coverage` are the bench's; every other kind is taken by one
        optimizer node, and `node` names which.
      required: [kind, inputs_ref, outcome, data, timestamp]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: |
            A `CheckpointKind` value: the bench's `BenchCheckpointKind`, or the
            enum the deciding optimizer's own package declares. The set is those
            registries (`decisions.py::resume_checkpoint_gating` merges them),
            so it is open here and grows with every optimizer installed.
        node:
          type: [string, 'null']
          description: |
            The manifest node whose member took this decision; null for a
            bench decision.
        inputs_ref:
          type: object
          additionalProperties: true
        outcome: {}
        data:
          type: object
          additionalProperties: true
        round:
          type: [integer, 'null']
          minimum: 0
        timestamp:
          type: string
          format: date-time

    PhasePayload:
      type: object
      description: |
        PhaseRecord — a phase BRACKET, the bench's or an optimizer's own,
        opening, closing, or stating a result inside itself. `view` is the whole
        of what the boundary says: one typed view of the `PhaseView` union
        (`promptpotter/domain/phase_views.py`), discriminated by its `kind`.
      required: [phase, event, timestamp]
      additionalProperties: false
      properties:
        phase: { type: string, minLength: 1 }
        event: { type: string, minLength: 1 }
        round:
          type: [integer, 'null']
          minimum: 0
        view:
          type: [object, 'null']
          required: [kind]
          additionalProperties: true
          properties:
            kind:
              type: string
              enum:
                - init_enter
                - init_exit
                - round_start
                - candidates_generated
                - measure_enter
                - bench_enter
                - bench_scored
                - bench_graded
                - verify_enter
                - verify_graded
                - round_complete
                - optimizer_step_enter
                - optimizer_step_exit
        timestamp:
          type: string
          format: date-time

    RunPhasePayload:
      type: object
      description: |
        RunPhaseRecord — the runner DECLARING where its run stands; the last
        one is what every surface's run phase is derived from. `stop_reason` is
        set where a run STOPS — `terminal` and `paused` alike — and a `paused`
        declaration also names its `cause`; `spend` rides where a run ends.
        This record is a cycle's ending on every exit path: the runner's own
        stop, a launch that never bound a run, and the reaper all write it.
      required: [run_phase, timestamp]
      additionalProperties: false
      properties:
        run_phase: { type: string, minLength: 1 }
        stop_reason: { type: [string, 'null'] }
        cause:
          type: [string, 'null']
          enum: [command, enclosing, interrupt, cancelled, step, bound, null]
          description: |
            What paused the run: a `pause-cycle` command the loop took, the
            pause of the run it measures for, an interrupt signal, its host
            cancelling it, the round allowance of a `step-cycle`, or a declared
            bound cutting the round's panel. Required on `paused`.
        detail:
          type: string
          description: The cause in words — who issued the command, which enclosing cycle.
        spend:
          type: [object, 'null']
          additionalProperties: false
          required: [billed_usd, rate_priced_usd, incurred_usd, meter, metered_usd, metered_tokens, usd_cap, token_cap]
          properties:
            billed_usd: { type: number }
            rate_priced_usd: { type: number }
            incurred_usd: { type: number }
            meter: { type: string }
            metered_usd: { type: number }
            metered_tokens: { type: integer }
            usd_cap: { type: [number, 'null'] }
            token_cap: { type: [integer, 'null'] }
        gate:
          type: [string, 'null']
          enum: [origin, arms, null]
          description: |
            What a `gate` declaration holds for — the origin's verdict, or the
            arms a round measures. Set on `gate` and on nothing else.
        drafts:
          type: integer
          minimum: 0
          description: |
            How many drafts an `arms` hold offers to keep, by index into the
            round's `round_proposed`; 0 where no proposer ran.
        timestamp: { type: string, format: date-time }

    RoundEnteredPayload:
      type: object
      description: |
        RoundEnteredRecord — the run moves into `round`. Entering round N
        displaces N and every round after it: its closes stop standing and
        its arms are walked again. `rewound` is the run moved BACK (a rewind,
        a branch minted to continue at N), which discards what was generated
        for N and after as well.
      required: [round, timestamp]
      additionalProperties: false
      properties:
        round: { type: integer, minimum: 0 }
        rewound: { type: boolean }
        timestamp: { type: string, format: date-time }

    RoundProposedPayload:
      type: object
      description: |
        RoundProposedRecord — the arms a round's walk made, banked by the bench
        once per round. `consumed` is
        the digest of the round it read to do so; `proposals` is a list of
        `Proposal`. A resume walking back into the round replays them.
        `submitted` marks the operator's answer at the arm gate instead: the
        arms the round measures, standing beside the drafts it answered.
      required: [round, consumed, proposals, timestamp]
      additionalProperties: false
      properties:
        round: { type: integer, minimum: 0 }
        consumed: { type: string }
        proposals:
          type: array
          items: { type: object, additionalProperties: true }
        submitted: { type: boolean }
        timestamp: { type: string, format: date-time }

    RoundClosedPayload:
      type: object
      description: |
        RoundClosedRecord — a round closed, WHOLE: every outcome field of the
        round (`RoundOutcome`, which the OpenAPI file declares as
        `RoundResult` less its rows), `cells`, the archive address of every
        row the round read, and `positions`, each of those rows' position in
        the bank the cycle drew. The last close per round stands and IS the
        round; `rounds/round_NNNN.json` is a checkout of it. `level_series` is
        the `LevelSeries` this close read, the one fit of every standing round
        on one scale that every later reader takes off the last close.
      required: [round, arms, folds, election, overlap, optimizer_state, cells, positions, level_series, timestamp]
      additionalProperties: false
      properties:
        round: { type: integer, minimum: 0 }
        # By `ArmKey`: each an `ArmState`, the panel in slot order then each reference re-read.
        arms: { type: object, additionalProperties: { type: object, additionalProperties: true } }
        # By `ArmKey`: each arm's `ScoreSummary` over every row its walk holds; none for an
        # arm refused before a cell.
        folds: { type: object, additionalProperties: { type: object, additionalProperties: true } }
        # The `Election`; null on a diag round, whose variants were generated and never scored.
        election: { type: [object, 'null'], additionalProperties: true }
        # The `OverlapReading` the OpenAPI file declares: the best-so-far line on
        # the origin panel, and `advance`, what the round did to it.
        overlap: { type: object, additionalProperties: true }
        diagnostics: { type: [object, 'null'], additionalProperties: true }
        health: { type: [object, 'null'], additionalProperties: true }
        # The optimizer's `OptimizerState` envelope at the close.
        optimizer_state: { type: object, additionalProperties: true }
        optimizer_facts:
          type: array
          items: { type: object, additionalProperties: true }
        cells:
          $ref: '#/components/schemas/RoundCells'
        positions:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        level_series: { type: object, additionalProperties: true }
        timestamp: { type: string, format: date-time }

    RoundCells:
      type: object
      description: |
        Where a round's rows are in the archive, by row set, each a
        `WalkedCell`, in walk order.
      required: [arms, overlap]
      additionalProperties: false
      properties:
        arms:
          type: object
          description: By `ArmKey`; a re-read reference is an arm.
          additionalProperties: { $ref: '#/components/schemas/WalkedCells' }
        overlap:
          type: object
          additionalProperties: { $ref: '#/components/schemas/WalkedCells' }

    WalkedCell:
      type: array
      description: |
        One cell's archive address, `[sample_key, answer, replayed]`: the
        content key two walks pair on, the answer the cell store files, and
        whether this walk took it as a replay.
      prefixItems:
        - { type: string }
        - { type: string }
        - { type: boolean }
      minItems: 3
      maxItems: 3

    WalkedCells:
      type: array
      items: { $ref: '#/components/schemas/WalkedCell' }

    OptimizerStatePayload:
      type: object
      description: |
        OptimizerStateRecord — a CLOSED round's optimizer state, restated: the
        `OptimizerState` envelope (`{manifest, population, prompt_hashes, slices, outputs}`) as the
        optimizer now holds it for `round`. The last one after the round's
        standing close is that round's state.
      required: [round, optimizer_state, timestamp]
      additionalProperties: false
      properties:
        round: { type: integer, minimum: 0 }
        optimizer_state: { type: object, additionalProperties: true }
        timestamp: { type: string, format: date-time }

    RoundStandingPayload:
      type: object
      description: |
        RoundStandingRecord — where the run stands once `round` is closed: what
        it has selected, how that reads against the origin and what the cycle
        has cost. Once per round, where a close can repeat, and displaced with
        its round; a subscriber that renders the round reads its last
        `RoundClosedRecord`, which this record follows.
        `run_standing` is the `RunStanding` and `panel_precision` the
        `PanelPrecision` the OpenAPI file declares — the latter pairs the
        round's leading arm against the origin's rows, so it is read once the
        round stands.
      required: [round, run_standing, anchors, timestamp]
      additionalProperties: false
      properties:
        round: { type: integer, minimum: 0 }
        run_standing: { type: object, additionalProperties: true }
        panel_precision: { type: [object, 'null'], additionalProperties: true }
        anchors: { $ref: '#/components/schemas/ViewAnchors' }
        timestamp: { type: string, format: date-time }

    BackendWarningPayload:
      type: object
      description: |
        BackendWarningRecord — a backend attempt that failed and will be tried
        again: a transport fault or a 5xx, never a 429. `detail` is the
        backend's own words about why.
      required: [kind, attempt, max_attempts, wait_s, timestamp]
      additionalProperties: false
      properties:
        kind: { type: string }
        attempt: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 0 }
        wait_s: { type: number, minimum: 0 }
        error_class: { type: [string, 'null'] }
        status_code: { type: [integer, 'null'] }
        final: { type: boolean }
        query: { type: string }
        detail: { type: string }
        timestamp: { type: string, format: date-time }

    ProviderHoldPayload:
      type: object
      description: |
        ProviderHoldRecord — a provider's 429 episode on one sender, told to a
        ledger from that ledger's own sends: each throttle it has not heard.
        `reading` is the `BackpressureReading` the OpenAPI file declares. A
        throttle past `gives_up_at` (epoch seconds) stops the run.
      required: [sender, scope, strikes, gives_up_at, reading, timestamp]
      additionalProperties: false
      properties:
        sender: { type: string }
        scope: { type: string }
        strikes: { type: integer, minimum: 1 }
        gives_up_at: { type: number }
        reading: { type: object, additionalProperties: true }
        timestamp: { type: string, format: date-time }

    ProviderEasedPayload:
      type: object
      description: |
        ProviderEasedRecord — the provider answers the sender again, told at
        once to every ledger that heard its hold; `held_s` is how long the
        episode held.
      required: [sender, held_s, timestamp]
      additionalProperties: false
      properties:
        sender: { type: string }
        held_s: { type: number, minimum: 0 }
        timestamp: { type: string, format: date-time }

    ViewAnchors:
      type: object
      description: The formula and display metric a score beside them is read under.
      additionalProperties: true
      properties:
        composite_fitness_formula: { type: [string, 'null'] }
        composite_fitness_formula_short: { type: [string, 'null'] }
        display_metric: { type: string }

    BenchEnterPayload:
      type: object
      description: |
        `PhaseRecord.view` of `phase: bench`, `event: enter` — one
        individual's pass over the bench set begins, and every `sample_scored`
        up to the matching `exit` is one of its rows. `subject` says whose pass
        it is, `arm` the key of the arm it grades and `label` that arm's label,
        `sp_hash` the searchpoint scored, `round` the round whose selection that
        is (0 is the origin) and `rows` the size of the bench set; the dashboard
        serves it as `bench_pass`, with the rows scored so far and their running
        accuracy beside it.
      required: [subject, arm, label, sp_hash, round, rows]
      properties:
        subject: { type: string, enum: [origin, selected] }
        arm: { type: string }
        label: { type: string }
        sp_hash: { type: string }
        round: { type: integer, minimum: 0 }
        rows: { type: integer, minimum: 0 }

    BenchScoredPayload:
      type: object
      description: |
        `PhaseRecord.view` of `phase: bench`, `event: scored` — the bench as
        the cycle stands to it, declared when a launch starts and again when it
        ends, for every trigger and for a cycle beside the line, and once more
        by a `grade-bench` pass. `bench` is the `BenchScore` the
        OpenAPI file declares, the run's reading of its passes stamped with its
        `scorer_id`; the dashboard serves it as `bench_score`.
      required: [bench]
      properties:
        bench: { type: object, additionalProperties: true }

    BenchGradedPayload:
      type: object
      description: |
        `PhaseRecord.view` of `phase: bench`, `event: graded` — one
        pass BANKED and read: the origin's as a launch begins or a
        `grade-bench` command runs, the selection's as either ends, and under
        `bench_trigger: each_round` each round's declared selection.
        `bench_pass` is the `BenchPass` itself — the line's passes are the
        fold of these records over every ledger on it, so a pass stands from
        the moment it is graded. `reserve_*` is what an origin's pass
        incurred, null on a selection's. `reading` is the
        `BenchReading` the OpenAPI file declares, null exactly where `state`
        is not `read` (`pass_stopped`, with `bench_pass.stop`, or
        `past_tolerance`); the dashboard serves it as `rounds[].bench` on the
        round it names and as `bench` on the candidate `label` names.
      required: [subject, bench_pass, tolerance, reserve_usd, reserve_tokens, reading, state, label]
      properties:
        subject: { type: string, enum: [origin, selected] }
        bench_pass: { type: object, additionalProperties: true }
        tolerance: { type: integer, minimum: 0 }
        reserve_usd: { type: [number, 'null'] }
        reserve_tokens: { type: [integer, 'null'] }
        label: { type: string }
        reading: { type: [object, 'null'], additionalProperties: true }
        state: { type: string, enum: [read, pass_stopped, past_tolerance] }

    VerifyEnterPayload:
      type: object
      description: |
        `PhaseRecord.view` of `phase: verify`, `event: enter` — one
        candidate's pass over search cells it has never met begins, on the
        ledger of the cycle that scored it and from whichever process runs it.
        The matching `exit` always follows; the dashboard read serves an open
        pass as `verify_pass`.
      required: [arm, rows, strategy]
      properties:
        arm:
          type: object
          description: The `ArmName` the OpenAPI file declares — the candidate's key, first round and label.
          required: [key, round, label]
          properties:
            key: { type: string, minLength: 1 }
            round: { type: integer, minimum: 0 }
            label: { type: string }
        rows: { type: integer, minimum: 0 }
        strategy: { type: string, enum: [random, hard] }

    VerifyGradedPayload:
      type: object
      description: |
        `PhaseRecord.view` of `phase: verify`, `event: graded` — the
        pass banked. `verify_pass` is the `VerifyPass` the OpenAPI file declares
        (the facts: which candidate, the archive run, the cells sent, the
        scorer); `reading` is the `VerifyReading` of it under that scorer, which
        the dashboard read serves as `verify` on the candidate's row.
      required: [verify_pass, reading]
      properties:
        verify_pass: { type: object, additionalProperties: true }
        reading: { type: object, additionalProperties: true }

    # ---- One arm's walk ----
    # `flight` names no arm. A pass record names the round, the individual whose cell it is
    # and the `MeasurementRole` it ran for.

    ArmPayload:
      type: object
      description: |
        ArmRecord — one arm's transition, LAST wins: proposed, measuring, then
        cut or measured. `arm` is the `ArmKey`; `state` is the `ArmState` the
        OpenAPI file declares, discriminated by its own `state`. A `measuring`
        state carries the `sample_order` the arm will walk, a declared order:
        a stop rule can end the walk before its tail.
      required: [round, arm, state, timestamp]
      additionalProperties: false
      properties:
        round: { type: integer, minimum: 0 }
        arm: { type: string, minLength: 1 }
        state: { type: object, additionalProperties: true }
        anchors: { $ref: '#/components/schemas/ViewAnchors' }
        timestamp: { type: string, format: date-time }

    SampleStartedPayload:
      description: SampleStartedRecord — a cell left for the backend.
      type: object
      required: [round, individual_id, role, sample_idx, sample_total, position, timestamp]
      properties:
        round: { type: integer, minimum: 0 }
        individual_id: { type: string }
        role:
          type: string
          enum: [origin, panel, backfill, parent, repair, overlap, verify, bench]
        timestamp: { type: string, format: date-time }
        sample_idx: { type: integer, minimum: 0 }
        sample_total: { type: integer, minimum: 0 }
        position: { type: integer, minimum: 0 }
        query_preview: { type: string }
        sample_lookahead:
          type: integer
          minimum: 1
          description: What the walk held in flight as it launched this cell.

    SampleScoredPayload:
      type: object
      description: |
        SampleScoredRecord — a cell the walk took. `result` is the measured row
        as the ledger keeps it, naming the archive `answer` the walk read.
        `sample_idx` is null on a row re-banked onto a branch. `individual_id`
        and `role` say whose cell it is and why the walk ran. `running` is the
        walk's `ScoreSummary` with this cell folded in; null on a pass of no arm.
      required: [round, individual_id, role, position, result, timestamp]
      properties:
        round: { type: integer, minimum: 0 }
        individual_id: { type: string }
        role:
          type: string
          enum: [origin, panel, backfill, parent, repair, overlap, verify, bench]
        timestamp: { type: string, format: date-time }
        sample_idx: { type: [integer, 'null'], minimum: 0 }
        sample_total: { type: [integer, 'null'], minimum: 0 }
        position: { type: integer, minimum: 0 }
        result: { type: object, additionalProperties: true }
        running: { type: [object, 'null'], additionalProperties: true }

    FlightPayload:
      type: object
      description: |
        FlightRecord — the scoring phase's calls in flight (`out`), what its
        stop rules allow, what the spend ceiling affords and the most it could
        hold. The whole round's, so it names no arm.
      required: [round, out, allowed, most, timestamp]
      additionalProperties: false
      properties:
        round: { type: integer, minimum: 0 }
        out: { type: integer, minimum: 0 }
        allowed: { type: integer, minimum: 0 }
        most: { type: integer, minimum: 0 }
        affordable: { type: [integer, 'null'] }
        cell_usd: { type: [number, 'null'] }
        waiting:
          type: [object, 'null']
          description: The call a decision waits on, and since when.
          required: [position, since]
          properties:
            position: { type: integer }
            since: { type: number }
        backpressure:
          type: [object, 'null']
          additionalProperties: true
          description: Always `null`; a provider's hold is `provider_hold`.
        timestamp: { type: string, format: date-time }

    RaceStandingPayload:
      description: |
        RaceStandingRecord — one candidate's standing in its eliminator's race,
        per sample. `member` names the manifest node racing it; `p_best` is
        about the arm `current` alone.
      type: object
      required: [round, member, current, n_samples, p_best, paired_breakdown, decision_grade, timestamp]
      properties:
        round: { type: integer, minimum: 0 }
        member: { type: string, minLength: 1 }
        current: { type: string, minLength: 1 }
        n_samples: { type: integer, minimum: 0 }
        p_best: { type: number }
        paired_breakdown: { type: object, additionalProperties: true }
        decision_grade: { type: boolean }
        timestamp: { type: string, format: date-time }

    RaceCatchUpPayload:
      description: |
        RaceCatchUpRecord — the catch-up walks the sample just measured took
        for the arm, each prior's cell by its archive address. No slot writes a
        catch-up's cells, so this record is where a line's memory finds them.
      type: object
      required: [round, arm, member, sample_key, position, cells, timestamp]
      properties:
        round: { type: integer, minimum: 0 }
        arm: { type: string, minLength: 1 }
        member: { type: string, minLength: 1 }
        sample_key: { type: string, minLength: 1 }
        position: { type: integer, minimum: 0 }
        cells:
          type: object
          minProperties: 1
          additionalProperties: { $ref: '#/components/schemas/WalkedCell' }
        timestamp: { type: string, format: date-time }

    ErrorPayload:
      type: object
      description: |
        ErrorRecord — a run that ended FAILED. One writer:
        `promptpotter/application/runner/termination.py::end_run_on`, the
        place every run ends through, emits it for each stop whose
        `STOP_REASON_INFO` row (`promptpotter/domain/phases.py`) has outcome
        `failed`, via the kwargs-only `emit_error_record(...)` helper over
        the `_CYCLE_LEDGER` ContextVar (mirrors the `emit_token_usage`
        pattern from ADR-0003).

        Subscribers:
          * `LiveDashboardProjection._handle_error` — sole writer of
            `dashboard.json::error`. The presentation layer reads this
            block; nothing else writes it.
          * `CycleLedgerTail` — tails this record to SSE subscribers.
      required: [kind, message, stop_reason, timestamp]
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
          description: |
            Python exception class name (`ConnectError`, `RenderError`,
            `DivergenceError`, etc.). Operator-facing diagnostic — never
            load-bearing for routing.
        message:
          type: string
          description: |
            Operator-readable error message. The throw site picks the
            phrasing (e.g. `"backend at http://localhost:5544 unreachable
            (connection refused)"`) so no downstream layer has to map
            raw `httpx` exception strings.
        traceback:
          type: [string, 'null']
          description: |
            Full Python traceback. Set where the reason's
            `STOP_REASON_INFO` row declares `has_traceback`, `null` where
            the message alone is the full diagnostic.
        stop_reason:
          type: string
          description: |
            The `StopReason` VALUE the run ended on (lowercase, e.g.
            `crashed`) — the same spelling the `RunPhaseRecord`,
            `index.json` and `dashboard.json` carry. Its label, outcome
            and next step are that member's `STOP_REASON_INFO` row.
        round:
          type: [integer, 'null']
          minimum: 0
          description: |
            Round number when the error fired. `null` for crashes that
            happened before the round loop entered (e.g. a run-init
            failure).
        timestamp:
          type: string
          format: date-time

    RoundWarningPayload:
      type: object
      description: |
        RoundWarningRecord — a non-fatal, round-scoped degradation the
        self-healing rails recovered from. Previously logged only to the
        server's stdout; now rides the ledger so it is visible on every
        channel. Emitted via `emit_round_warning(...)` over the
        `_CYCLE_LEDGER` ContextVar (mirrors `emit_error_record`).

        Subscribers:
          * `LiveDashboardProjection._handle_round_warning` — sole writer of
            `dashboard.json::recent_loop_warnings` (rolling, capped).
          * `AuditTrailProjection` — accumulates into `round_NNNN.json::warnings`.
          * `ReadoutProjection` — writes a one-line marker to the readout.
          * `CycleLedgerTail` — tails this record to SSE subscribers.
      required: [kind, severity, message, timestamp]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - l1_zero_candidates
            - injection_budget_overrun
            - layer_parse_failure
            - layer_terminated_cycle
            - layer_terminate_blank
            # A `fork_proposal` UCB found no ancestor with a level for:
            # dropped, its `detail.caveats` naming what withholds θ there.
            - layer_rebase_dropped
            # An adapter (potter's `l1_critique`) landed no round output, and
            # its re-runs before the next walk failed: the run halts `paused`.
            - adapter_output_unavailable
            # The run STOPPED on a send refused before it left (`SendRefusedError`):
            # `message` is the refusal's own sentence — which budget axis, and the
            # sums behind it, or that no rate prices the route. `severity: error`.
            - send_refused
            # The round selected an arm and closed `not_separated` or `unread`
            # (`OverlapReading.advance`): its lead over C0 on the origin panel
            # still spans 0, or the reading owed on it failed. The round's
            # numbers are real and its winner is the best of what it saw —
            # but the point estimate must not be read as a result. Emitted
            # at round close, after the overlap pass. Distinct from every kind
            # above: the round looks identical on every other channel. That
            # silence is the defect this kind exists to break.
            - round_not_advanced
          description: Which degradation class this record reports.
        severity:
          type: string
          enum: [warning, error]
          description: |
            `error` = the round produced nothing usable (zero candidates);
            `warning` = degraded but the round still progressed. An
            unresolvable round is a `warning`: it progressed, and what it
            lacks is power rather than data.
        message:
          type: string
          description: |
            Operator-readable one-liner composed at the emit site, so no
            downstream layer reformats it.
        round:
          type: [integer, 'null']
          minimum: 0
          description: Round the degradation fired in; `null` outside the round loop.
        detail:
          type: object
          additionalProperties: true
          description: |
            Per-kind structured context (e.g. `reason` + `model` for
            `l1_zero_candidates`, `injection`/`rendered_chars`/`cap` for the
            budget overrun, `node`/`budget_s`/`attempt` for a deadline retry).
        timestamp:
          type: string
          format: date-time

    ElectionPayload:
      type: object
      description: |
        ElectionRecord — what the round's selection produced, appended by the
        optimizer's selector before the round closes, keyed by `ArmKey`. θ is
        re-read on every `round_closed` (its `Election.fit`); only the selection
        never moves. `verdict_reason` is the round's own reading as the election
        held it.
      required: [round, selected, leading, ended_on, electable, elects_on, ruler, timestamp]
      additionalProperties: false
      properties:
        round:
          type: integer
          minimum: 0
        elects_on:
          type: string
          enum: [accuracy, composite, ability]
          description: |
            `Election.elects_on` — the column the selector elects on. `ability`: the
            round is won on θ, not on accuracy.
        selected:
          type: array
          items: { type: string, minLength: 1 }
          description: |
            The individuals the next round derives from — one for potter, a
            population or a front for a peer; empty when the round held.
            Round 0 selects the origin it adopted.
        leading: { type: [string, 'null'] }
        ended_on: { type: string, minLength: 1 }
        electable: { type: integer, minimum: 0 }
        ruler: { type: object, additionalProperties: true }
        fit:
          type: object
          description: Per-arm readings the selection stamped, keyed by `ArmKey` (`ArmFit`).
          additionalProperties:
            type: object
            additionalProperties: true
            properties:
              vs_reference:
                type: [object, 'null']
                description: |
                  This arm's lift over its reference as one `PairedReading`, over
                  the cells the reference was read on. Null on the origin.
        verdict_reason: { type: [string, 'null'] }
        timestamp:
          type: string
          format: date-time


    ScoringLockedPayload:
      type: object
      description: |
        ScoringLockedRecord — the criterion a cycle's origin measurement locked:
        the scoring block as `declared` with `dials`, and the same block
        `locked` to the `per_cell` formula those dials spell on the origin's
        measured anchors. Appended once per cycle that measures an origin under
        dials; `campaign.json::config.scoring` keeps the declaration, and every
        config read lays the root cycle's lock over it. Not a progress event:
        the tail frames it, the activity line stays silent.
      required: [declared, locked, timestamp]
      additionalProperties: false
      properties:
        declared:
          type: object
          additionalProperties: { type: string }
        locked:
          type: object
          additionalProperties: { type: string }
        timestamp:
          type: string
          format: date-time

    StandingBudgetPayload:
      type: object
      description: |
        StandingBudgetRecord — the cycle's standing operator budget, whole; the
        last record wins. Appended by `set-limits` and by a launch flag that
        moves an axis, it names only the axes an operator named. Not a progress
        event: the tail frames it, the activity line stays silent.
      required: [timestamp]
      additionalProperties: false
      properties:
        budget:
          $ref: 'openapi.generated.json#/components/schemas/Budget'
        pause_at_round:
          type: [integer, 'null']
          minimum: 0
          description: |
            The count of closed rounds at which the launch in flight pauses —
            `step-cycle`'s allowance. Every launch declares its own or clears
            the last one's; the loop reads this and `budget.rounds` off the one
            record.
        timestamp:
          type: string
          format: date-time

    CycleMintedPayload:
      type: object
      description: |
        CycleMintedRecord — the cycle exists; the first line of its own ledger.
        A fork carries `parent`, `forked_at_offset` (the line of the
        parent's ledger its history begins at) and `fork` (the `ForkSpec`, less
        its seed) together; a root carries none. `parent` is the parent cycle's
        directory as a POSIX path relative to this cycle's own — `../{cycle_id}`
        for a sibling, a longer path for a fork of another tree's cycle. A
        ledger chain is walked off this record alone. A root's ledger may open
        with the check-in records its draft carried; Start moves them in.
      required: [timestamp]
      additionalProperties: false
      properties:
        parent:
          type: [string, 'null']
        forked_at_offset:
          type: [integer, 'null']
          minimum: 0
        fork:
          type: [object, 'null']
          description: The `ForkSpec` (`promptpotter/domain/run_records.py`).
        timestamp:
          type: string
          format: date-time

    CycleFinalPayload:
      type: object
      description: |
        CycleFinalRecord — what a cycle banks once, as its own runner stops it,
        just before that runner's `terminal` declaration. A later `running`
        declaration retires it with the ending it belonged to.
      required: [final, timestamp]
      additionalProperties: false
      properties:
        final:
          type: object
          description: The `CycleFinal` (`promptpotter/domain/run_records.py`).
        interrupted_round:
          type: [integer, 'null']
          minimum: 0
          description: The round the stop left unclosed; `null` for a stop at a boundary.
        timestamp:
          type: string
          format: date-time

    CycleSupersededPayload:
      type: object
      description: |
        CycleSupersededRecord — the line moved to `successor_cycle_id`, on the
        left-behind side of a supersede cut.
      required: [successor_cycle_id, timestamp]
      additionalProperties: false
      properties:
        successor_cycle_id:
          type: string
        timestamp:
          type: string
          format: date-time

    ForkGradedPayload:
      type: object
      description: |
        ForkGradedRecord — a cut's MEASURED direction, on the branch; it
        overrides the direction the mint's trigger implies.
      required: [direction, timestamp]
      additionalProperties: false
      properties:
        direction:
          type: string
          enum: [offshoot, supersede, equivalent]
        timestamp:
          type: string
          format: date-time

    InterventionPayload:
      type: object
      description: |
        InterventionRecord — an operator manually intervened; one is enough to
        make the cycle babysat for good.
      required: [kind, timestamp]
      additionalProperties: false
      properties:
        kind:
          type: string
        timestamp:
          type: string
          format: date-time

    SpawnedPayload:
      type: object
      description: |
        SpawnedRecord — an L4 inner cycle opened for `spawned_by`; the last one
        names the outer work-item the cycle last measured for.
      required: [spawned_by, timestamp]
      additionalProperties: false
      properties:
        spawned_by:
          type: object
          description: The `SpawnedBy` (`promptpotter/domain/run_records.py`).
        timestamp:
          type: string
          format: date-time

    LaunchClaimPayload:
      type: object
      description: |
        LaunchClaimRecord — a launch CLAIMED the cycle before any process runs
        it. The last one stands while neither a `run_phase` record nor its own
        `launch_released` follows it and the process that made it is alive.
        `stage` IS the `run_phase` the cycle then reads, the value the launch's
        job carries, so every guard a running cycle refuses also refuses a
        claimed one. Not a progress event: the tail frames it, the activity line stays silent.
      required: [stage, job_id, claimant_lock, timestamp]
      additionalProperties: false
      properties:
        stage:
          type: string
          enum: [queued, starting]
        job_id: { type: string, minLength: 1 }
        claimant_lock:
          type: string
          minLength: 1
          description: The OS lock file the claiming process holds for its life; a dead claimant claims nothing.
        timestamp:
          type: string
          format: date-time

    LaunchReleasedPayload:
      type: object
      description: |
        LaunchReleasedRecord — the launch `job_id` let its claim go without a
        run: refused at admission, withdrawn from the queue, or failed before
        its process took the cycle. It ends that job's claim and no other's.
        Not a progress event: the tail frames it, the activity line stays silent.
      required: [job_id, detail, timestamp]
      additionalProperties: false
      properties:
        job_id: { type: string, minLength: 1 }
        detail:
          type: string
          description: What refused or withdrew the launch.
        timestamp:
          type: string
          format: date-time

    RunWiringPayload:
      type: object
      description: |
        RunWiringRecord — what a cycle runs under that no other record states;
        the last record wins. Appended first at a root's mint, then by every launch once
        its admitted config is settled, before the origin scores, and again for
        a cycle the launch forks onto. Not a progress event: the tail frames it, the activity line stays silent.
      required:
        - arms_per_round
        - sp_budget_round
        - display_metric
        - elects_on
        - max_cells_in_flight
        - measured_unit
        - langfuse_trace_url
        - run_limits
        - timestamp
      additionalProperties: false
      properties:
        arms_per_round:
          type: [integer, 'null']
          description: The most arms one round races; `null` where the optimizer declares none.
        sp_budget_round:
          type: integer
          description: The cells one arm walks in a round.
        display_metric:
          type: string
          enum: [accuracy, composite, ability]
        elects_on:
          type: string
          enum: [accuracy, composite, ability]
          description: The column the selected optimizer's selector elects on.
        max_cells_in_flight:
          type: integer
          minimum: 1
          description: How many cells the connector's backend holds in flight.
        measured_unit:
          type: string
          enum: [sample, cell]
        langfuse_trace_url:
          type: [string, 'null']
        run_limits:
          type: object
          description: The budget of the config the launch was admitted under (`RunLimits`).
          required: [budget, optimizer]
          additionalProperties: false
          properties:
            budget:
              $ref: 'openapi.generated.json#/components/schemas/Budget'
            optimizer:
              type: array
              description: The optimizer's own run-bounding knobs (`OptimizerLimit`).
              items:
                type: object
                required: [node, knob, label, value, integer]
                additionalProperties: false
                properties:
                  node: { type: string }
                  knob: { type: string }
                  label: { type: string }
                  value: { type: [number, 'null'] }
                  integer: { type: boolean }
        timestamp:
          type: string
          format: date-time

    SpendTombstonePayload:
      type: object
      description: |
        SpendTombstoneRecord — a deleted campaign's or cycle's spend, banked on
        the WORKSPACE ledger before the delete so the money outlives the data.
        Reaches no cycle subscriber.
      required: [campaign_id, used_usd, rate_priced_usd, used_tokens, unpriced_tokens, timestamp]
      additionalProperties: false
      properties:
        campaign_id:
          type: string
        cycle_id:
          type: string
          description: Empty for a whole-campaign bank.
        used_usd:
          type: number
          description: What providers reported they billed.
        rate_priced_usd:
          type: number
          description: What our rate table prices the calls no provider billed. Never spent.
        used_tokens:
          type: integer
        unpriced_tokens:
          type: integer
        unreported_usd:
          type: number
        unreported_tokens:
          type: integer
        metered:
          type: object
          description: What the campaign's ceiling counted of it, keyed by ceiling meter.
          additionalProperties:
            $ref: 'openapi.generated.json#/components/schemas/Budget'
        timestamp:
          type: string
          format: date-time

    TrailTombstonePayload:
      type: object
      description: |
        TrailTombstoneRecord — the commands a deleted campaign or cycle carried,
        banked on the WORKSPACE ledger before the delete so that what was done
        outlives the data. Reaches no cycle subscriber.
      required: [campaign_id, commands, timestamp]
      additionalProperties: false
      properties:
        campaign_id:
          type: string
        cycle_id:
          type: string
          description: Empty for a whole-campaign bank.
        commands:
          type: array
          items:
            type: object
            required: [at, kind, subject, user_id]
            additionalProperties: false
            properties:
              at:
                type: string
                format: date-time
              kind:
                type: string
              subject:
                type: string
                description: The campaign and cycle the command addressed.
              user_id:
                type: string
                description: The acting principal.
        timestamp:
          type: string
          format: date-time

    AccountEventPayload:
      type: object
      description: |
        AccountEventRecord — one fact of an account's own history, on the
        WORKSPACE ledger beside the commands that address no cycle. Reaches no
        cycle subscriber.
      required: [event, user_id, timestamp]
      additionalProperties: false
      properties:
        event:
          type: string
          enum: [account_created, signed_in, terms_accepted]
        user_id:
          type: string
          description: The acting principal — a delegate's own id in its delegator's tenant.
        subject:
          type: string
          description: The provider of a sign-in, the version of a terms acceptance.
        timestamp:
          type: string
          format: date-time

    CycleSeedPayload:
      type: object
      description: |
        CycleSeedRecord — the cycle's read-once starting point (`CycleSeed`),
        appended at mint / operator-steered fork and re-read
        once at init. A fork inherits its parent's seed record *virtually*
        (`CycleEventLog.inherit_from`) but appends its OWN, so a scan of the
        cycle's own ledger file returns that cycle's seed. A diag cycle
        carries none.

        Not progress, and deliberately at most one per cycle: it reads as a
        single "cycle seeded" marker at the head of a non-root cycle's thread.
      required: [seed, timestamp]
      additionalProperties: false
      properties:
        seed:
          type: object
          additionalProperties: true
          description: |
            The `CycleSeed` model dump — `origin_prompts`,
            `pipeline_overlay`, `optimizer_narrowing`, `config_overrides`, and
            the `origin_source` provenance stamp (`fork_seed` |
            `campaign_origin`; empty when an L2/L3 rebase replays its own
            origin).
        timestamp:
          type: string
          format: date-time

    TokenUsagePayload:
      type: object
      description: TokenUsageRecord — LLM token + cost telemetry.
      required: [kind, node, input_tokens, output_tokens, timestamp]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [optimizer, backend, judge, diagnostic, bench]
        node: { type: string, minLength: 1 }
        model: { type: [string, 'null'] }
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        duration_s:
          type: number
          minimum: 0
        cost_usd:
          type: [number, 'null']
          minimum: 0
          description: >-
            What the provider REPORTED the call cost — the only figure a surface
            calls spent. Null where it reported none.
        rate_priced_usd:
          type: [number, 'null']
          minimum: 0
          description: >-
            What our rate table prices a call whose provider reported no cost. An
            estimate a ceiling counts and no surface calls spent. Null beside a
            reported `cost_usd`, and where no rate is on file.
        key_source:
          type: [string, 'null']
          enum: [host, user, null]
          description: >-
            Which wallet paid for this call — `host` (host-provided shared key,
            metered against the user's coupon) or `user` (the user's own BYO key,
            outside the coupon gate). Lets host-key spend sum separately from
            user-key spend. See ADR-0003 § Host coupon. Null on pre-coupon records.
        round:
          type: [integer, 'null']
          minimum: 0
        role:
          type: [string, 'null']
          enum: [origin, panel, backfill, parent, repair, overlap, bench, null]
          description: >-
            The `MeasurementRole` of the scoring pass this call measured for —
            `backfill` is a PoBB catch-up, `overlap` the best-so-far line's
            top-up. Null outside a candidate's pass: an optimizer call, the
            origin's pass, a nested run's call carried onto its outer ledger.
        timestamp:
          type: string
          format: date-time

    LlmCallStartPayload:
      type: object
      description: LLMCallStartRecord — in-flight marker (paired with LLMCall via call_id).
      required: [call_id, node, started_at_ms, timestamp]
      additionalProperties: false
      properties:
        call_id: { type: string, minLength: 1 }
        node: { type: string, minLength: 1 }
        round:
          type: [integer, 'null']
          minimum: 0
        candidate_idx:
          type: [integer, 'null']
          minimum: 0
        model: { type: [string, 'null'] }
        started_at_ms:
          type: integer
          minimum: 0
        prompt_chars:
          type: integer
          minimum: 0
        timestamp:
          type: string
          format: date-time

    LlmCallProgressPayload:
      type: object
      description: LLMCallProgressRecord — heartbeat while an LLM call is blocked.
      required: [call_id, node, elapsed_s, timestamp]
      additionalProperties: false
      properties:
        call_id: { type: string, minLength: 1 }
        node: { type: string, minLength: 1 }
        round:
          type: [integer, 'null']
          minimum: 0
        elapsed_s:
          type: number
          minimum: 0
        detail:
          type: [string, 'null']
        inner:
          type: [object, 'null']
          description: |
            The `CycleHop` the waited-on L4 cell runs, in this cycle's sandbox;
            null on an ordinary call.
          required: [campaign_id, cycle_id]
          additionalProperties: false
          properties:
            campaign_id: { type: string, minLength: 1 }
            cycle_id: { type: string, minLength: 1 }
        timestamp:
          type: string
          format: date-time

    LlmCallPayload:
      type: object
      description: LLMCallRecord — full I/O of one optimizer LLM call.
      required: [node, payload_kind, payload, timestamp]
      additionalProperties: false
      properties:
        node: { type: string, minLength: 1 }
        round:
          type: [integer, 'null']
          minimum: 0
        candidate_idx:
          type: [integer, 'null']
          minimum: 0
        payload_kind:
          type: string
          enum: [llm_call, synthesized]
        call_id: { type: string }
        payload:
          type: object
          additionalProperties: true
          description: Opaque action-dict consumed by AuditTrailProjection.
        timestamp:
          type: string
          format: date-time

    # ---- Profile B Phase 2a — graduated record classes ----

    CommandPayload:
      type: object
      description: |
        Projection of `CommandRecord` (Profile B Phase 2a). Carries the
        inbound command kind, payload, the dispatcher-captured
        `idempotency_key`, and identity context.
      required: [command_id, kind, payload, idempotency_key, issued_by, timestamp]
      additionalProperties: false
      properties:
        command_id: { type: string, minLength: 1 }
        kind:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]*$'
        payload:
          type: object
          additionalProperties: true
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 128
        issued_by:
          type: object
          description: The `Principal` that issued it.
          required: [id, display]
          properties:
            id: { type: string }
            display: { type: string }
        timestamp:
          type: string
          format: date-time

    CommandAckPayload:
      type: object
      description: |
        Projection of `CommandAckRecord` (Profile B Phase 2a). Echoes the
        originating `command_id` + status + optional human-readable detail
        (never load-bearing for clients).

        `applied` means the thing was DONE. A command the running loop carries
        out (`pause-cycle`, `skip-searchpoint`, `set-sample-lookahead`,
        `origin-gate-decision`) is delivered by this ledger: the dispatcher acks
        it `accepted`, the run reads the accepted commands standing since its
        launch, and the run itself acks `applied` when it takes one — so a
        command may carry two acks, and an `accepted` one no run took stays
        `accepted`. Every other command is applied by the dispatcher and acked
        `applied` once.

        `effect` is what the applier ACTUALLY changed, as opposed to what the
        `CommandRecord.payload` asked for. The two diverge whenever the applier
        gates, coerces, or infers: `resolve-origin` carries only `{draft_id}` in
        its payload, so the fields its LLM turn moved exist nowhere else on the
        ledger. Empty for commands whose payload already IS their effect
        (`pause-cycle`, `change-run-limits`), and for every `rejected` ack.
      required: [command_id, status, timestamp]
      additionalProperties: false
      properties:
        command_id: { type: string, minLength: 1 }
        status:
          type: string
          enum: [accepted, applied, rejected]
        detail: { type: string }
        effect:
          type: object
          description: |
            Applied state change, keyed by domain field. The check-in commands
            key it by `origin_projection` field id (`prompt.task_intent`,
            `column.ground_truth`, `connector`, …), each value a
            `{from, to}` pair. Replaying these in ledger order reconstructs the
            committed origin without re-running an LLM call.
            Order matters: provenance is non-monotonic, so never coalesce.
          additionalProperties:
            type: object
            required: [from, to]
            additionalProperties: false
            properties:
              from: {}
              to: {}
        timestamp:
          type: string
          format: date-time
