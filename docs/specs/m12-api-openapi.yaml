# PromptPotter Control-remote — closed inbound command set
#
# This file is the source of truth for the inbound HTTP command surface.
# Every `POST /commands/{kind}` operation MUST be declared here BEFORE a
# handler lands in `promptpotter/presentation/api/routers/commands.py`.
# Drift detection: review + Spectral lint (no `test_contracts.py` — the
# structural/contract suite was cut to the silent-harm core, see tests/CLAUDE.md).
#
# Permanent contract: docs/adr/0001-m12-control-plane.md
# §0 definition: docs/architecture.md (§0 "State + persistence" — Five I/O kinds)
#
# Status: Profile -1 scaffold. paths{} is intentionally empty. Profile B
# fills it with the migrated 6 sanctioned POSTs + M12-new command kinds.

openapi: 3.1.0

info:
  title: PromptPotter Control-remote API
  version: 0.0.0-profile-minus-1
  summary: Closed inbound command set for the M12 Control-remote I/O kind.
  description: |
    The HTTP command surface for PromptPotter's interactive control plane.
    Every operation is a Control-remote command: an HTTP-ingressed mutation
    authored by a signed-in operator or signed-in client, appended to the
    canonical per-cycle `events.jsonl` as a `CommandRecord` by the sole
    `CommandDispatcher` at the FastAPI seam.

    See `docs/adr/0001-m12-control-plane.md` for the permanent contract, the
    Profile gradient (A-E), and the 20-item security checklist that every
    handler is measured against.

    Conformance: handlers MUST reject any request that omits the
    `Idempotency-Key` header. State-mutating handlers MUST additionally
    reject any request that omits the `Expected-Version` header. Mismatch
    on `Expected-Version` returns 409 `version_conflict`.

  contact:
    name: PromptPotter maintainers
  license:
    name: See repository LICENSE

servers:
  - url: http://localhost:8001
    description: Local dev (uvicorn + auth-off, Stage 0 / Profile B default).
  - url: https://{install}.promptpotter.dev
    description: Hosted hub (Profile D — placeholder, OIDC required).
    variables:
      install:
        default: example
        description: Per-install hostname slug.

tags:
  - name: cycle-control
    description: Commands that mutate a single cycle's state (pause, resume, step, rewind).
  - name: cycle-lifecycle
    description: Commands that mint, fork, or delete cycles.
  - name: budget
    description: Commands that change halt / spend / round budgets mid-cycle.
  - name: pipeline-params
    description: Commands that mutate pipeline_params on the active cycle.
  - name: scoring
    description: Commands that mutate the scoring composite or steer file.
  - name: operator-feedback
    description: Operator-authored signals — hard-sample marks, round notes, candidate verdicts.
  - name: backends
    description: Commands that register or sync external backends.
  - name: datasets
    description: |
      Workspace-scoped dataset ingest. These endpoints mint a durable `checkin`
      campaign and mutate its server-held `DraftCampaign` before the loop runs;
      the eventual Start IS a command (`/commands/start-checkin`) declared above.
  - name: cycles
    description: |
      Read-only per-cycle reads. NOTE: some read GETs (e.g. `/cycles`) predate
      this file and are not yet declared here — this file began as the closed
      *command* set. The per-cycle `/dashboard` (with its `descend` inner-descent
      query) and `/inner-cycles` reads below are declared per the "declare new
      GETs before the handler" rule; the remaining pre-existing read drift is
      tracked separately, not resolved here.

# v0 closed inbound command set — DRAFT for operator redline.
#
# Sources of this draft:
#   - sanctioned POSTs migrated off active.py / backends.py (fork,
#     delete, cleanup-empty, register-backend, sync-backend-experiments).
#   - 2 CLI verbs hoisted into the wire surface (mint-campaign = `new`,
#     start-run = `resume` / launcher per ADR-0001 control plane).
#   - M12-new commands (pause, step, rewind-to-round, change-spend-budget,
#     change-pipeline-param) — plan-listed v0 candidates. `pause-cycle` is the
#     single operator-interrupt verb: the worker exits cleanly, the cycle stays
#     resumable, and `start-run`/`resume` relaunches it (there is no `stop-cycle`
#     or in-place `resume-cycle`).
#
# Each operation:
#   - is `POST /commands/{kebab-kind}` — one literal path per kind, one
#     operationId per path. Path tail matches `CommandEnvelope.kind`.
#   - declares `Idempotency-Key` (every command). State-mutating
#     cycle-scoped commands additionally declare `Expected-Version`.
#     Workspace-scoped backend commands (register-backend,
#     sync-backend-experiments) intentionally omit `Expected-Version` —
#     they do not mutate a specific cycle's ledger offset.
#   - declares a request body schema that pins `kind` to a const literal
#     and refers to a per-kind `*Payload` schema in components.schemas.
#   - declares the closed response set: 202 CommandAccepted +
#     400 IdempotencyKeyMissing + 403 CapabilityDenied + 422 PayloadInvalid,
#     plus 409 VersionConflict on cycle-scoped commands.
paths:
  /commands/pause-cycle:
    post:
      operationId: pauseCycle
      summary: Pause a running cycle — the single operator-interrupt verb.
      description: |
        Writes `.runtime/pause.flag`. The runner sees it at the next checkpoint,
        the worker exits cleanly, and the cycle stays **resumable** (non-terminal,
        no `finished_at`). There is no separate `stop-cycle`; resuming is the
        `start-run`/`resume` launcher relaunching from the last completed round
        (the worker is gone, so there is no in-place `resume-cycle`). Idempotent.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: pause-cycle }
                    payload: { $ref: '#/components/schemas/PauseCyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/origin-gate-decision:
    post:
      operationId: originGateDecision
      summary: Resolve the round-0 origin gate (rescore / proceed / abort).
      description: |
        Delivered to a runner blocked at the origin gate (`run_phase: gate`):
        the round-0 origin verdict was not `healthy`, so the loop paused before
        L1 instead of optimizing against a broken floor. `rescore` re-scores the
        origin force-fresh (reflecting a backend-code fix) and re-evaluates the
        gate in place; `proceed` overrides the gate and enters L1; `abort` ends
        the cycle with `StopReason.ORIGIN_GATE`. The applier writes
        `.runtime/gate_decision.json`, which the runner polls at the gate — the
        one decision channel all three surfaces (webapp / CLI / notebook) write.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: origin-gate-decision }
                    payload: { $ref: '#/components/schemas/OriginGateDecisionPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/skip-searchpoint:
    post:
      operationId: skipSearchpoint
      summary: Write `.runtime/skip.flag`; the runner cuts the searchpoint scoring now and continues.
      description: |
        Operator-driven early-abort of the searchpoint currently being scored:
        the runner stops measuring its remaining samples, accepts the partial
        score, and the cycle CONTINUES to the next candidate / round (it does
        NOT stop). The operator analog of automatic PoBB candidate elimination.
        Single-shot — the flag is consumed at the next per-sample checkpoint, so
        exactly one searchpoint is cut per issue. A manual skip marks the cycle
        `human_intervened` (no longer purely reproducible).
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: skip-searchpoint }
                    payload: { $ref: '#/components/schemas/SkipSearchpointPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/step-cycle:
    post:
      operationId: stepCycle
      summary: Advance N rounds then auto-pause (default N=1).
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: step-cycle }
                    payload: { $ref: '#/components/schemas/StepCyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/rewind-to-round:
    post:
      operationId: rewindToRound
      summary: Rewind a cycle in place to round N, dropping later events.
      description: |
        Operator-initiated in-place rewind (as opposed to `fork-cycle` which
        preserves the parent). Destructive on the target cycle's ledger tail
        beyond round N — `Expected-Version` is the only safety against
        racing a concurrent writer.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: rewind-to-round }
                    payload: { $ref: '#/components/schemas/RewindToRoundPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/fork-cycle:
    post:
      operationId: forkCycle
      summary: Fork from the parent's current ledger offset; retargets active pointer.
      description: |
        Rides `CycleEventLog.inherit_from(parent, offset)` via the unified
        `mint_operator_fork` path. `round` / `candidate_id` name the searchpoint;
        the typed `ForkSpec` lands on the parent's `FORK_CUT` ledger record and
        the fork's `index.json::fork`. Every operator fork is `operator_steered`:
        the required `seed` roots the fork at the chosen searchpoint plus the
        operator's prompt/config edits and reconciled run limits. After minting,
        the fork is **launched** (an implicit `start-run`/resume against the new
        cycle), so steer-and-fork continues optimizing from the edited searchpoint
        in one gesture — the reconciled limits in `seed` govern its run.
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: fork-cycle }
                    payload: { $ref: '#/components/schemas/ForkCyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/delete-cycle:
    post:
      operationId: deleteCycle
      summary: Delete a stub cycle dir (guarded — n_rounds==0, not root, not active).
      description: |
        Migrated from `DELETE /api/v1/campaigns/{c}/cycles/{cy}`
        (active.py:236). The HTTP verb changes (DELETE -> POST /commands/...)
        because every Control-remote mutation rides the same dispatcher;
        guard semantics in `CampaignStore.try_delete_stub_cycle` unchanged.
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: delete-cycle }
                    payload: { $ref: '#/components/schemas/DeleteCyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/cleanup-empty-cycles:
    post:
      operationId: cleanupEmptyCycles
      summary: Batch-delete every empty-stub sibling under the root.
      description: |
        Migrated from `POST /api/v1/campaigns/{c}/cycles/{cy}/cleanup-empty`
        (active.py:254). Leaves-first via two passes (covers the
        two-generation stub chains we ship today); active-pointer guard
        respected per-cycle.
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: cleanup-empty-cycles }
                    payload: { $ref: '#/components/schemas/CleanupEmptyCyclesPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/archive-cycle:
    post:
      operationId: archiveCycle
      summary: Mark a non-stub cycle as archived (soft delete; ledger preserved).
      description: |
        Counterpart to `delete-cycle` (which only handles empty stubs).
        Archived cycles remain on disk + queryable in the MeasurementArchive,
        but are hidden from default operator views. Reversible only via
        out-of-band file edits in v0 — no `unarchive-cycle` command.
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: archive-cycle }
                    payload: { $ref: '#/components/schemas/ArchiveCyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/archive-campaign:
    post:
      operationId: archiveCampaign
      summary: Archive a campaign — MOVE its tree into the ``archive/`` recycle bin (restorable).
      description: |
        Campaign-scoped lifecycle transition. Campaign-scoped means
        workspace-level — no `Expected-Version` (the target is a campaign,
        not a specific cycle's ledger tail). Physically MOVES the campaign
        tree to `projects/{tenant}/archive/{campaign_id}/`; `unarchive`
        moves it back. The `CommandRecord` lands on the WORKSPACE ledger
        (`projects/{tenant}/.workspace/events.jsonl`) — the campaign's own
        ledger moves with the tree, so it can't be the audit home. Archiving
        the active-session campaign is refused (409). Shape pinned in
        `docs/operations/persistence-and-state.md` § Beta hosting state.
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: archive-campaign }
                    payload: { $ref: '#/components/schemas/CampaignLifecyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '404': { $ref: '#/components/responses/CommandTargetNotFound' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/delete-campaign:
    post:
      operationId: deleteCampaign
      summary: Destructively remove a campaign (no recovery); ``keep_results`` spares the keepsake.
      description: |
        Destructive — NOT reversible. Removes the campaign tree outright; with
        ``payload.keep_results=true`` it instead strips the heavy resume / audit /
        mirror tiers and spares the keepsake (manifest + reports + the shallow
        ``langfuse/{traces,observations,scores}`` loop trace), flagging the
        manifest ``deleted``. The cross-campaign measurement cache
        (``measurements/``) is NEVER touched per ADR-0002 §0.5, so siblings on the
        same declaration still cache-hit. The ``CommandRecord`` lands on the
        WORKSPACE ledger — the campaign's own ledger is going away. Deleting the
        active-session campaign is refused (409).
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: delete-campaign }
                    payload: { $ref: '#/components/schemas/CampaignLifecyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '404': { $ref: '#/components/responses/CommandTargetNotFound' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/unarchive-campaign:
    post:
      operationId: unarchiveCampaign
      summary: Restore a campaign to ``active`` (reverses ``archive`` or ``delete``).
      description: |
        Single restoration verb regardless of which soft-mark fired
        previously. ``reason`` is optional and stored on the lifecycle
        transition for audit; unset reads as an empty string.
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: unarchive-campaign }
                    payload: { $ref: '#/components/schemas/CampaignLifecyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '404': { $ref: '#/components/responses/CommandTargetNotFound' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/mint-campaign:
    post:
      operationId: mintCampaign
      summary: Mint a fresh campaign + root cycle (CLI `new <dataset>` equivalent).
      description: |
        Workspace-scoped — creates new state, no `Expected-Version` (there
        is no prior cycle offset to gate against). `Idempotency-Key`
        prevents double-mint on a retried POST.
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: mint-campaign }
                    payload: { $ref: '#/components/schemas/MintCampaignPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }
        '503': { $ref: '#/components/responses/BackendUnreachable' }

  /commands/start-run:
    post:
      operationId: startRun
      summary: Launch a runner job (CLI `new` / `resume` equivalent — m10 launcher).
      description: |
        Spawns the JobRegistry-tracked runner against an existing cycle.
        `kind: new` re-mints the root state of a stub cycle; `kind: resume`
        attaches to the cycle's current ledger tail. Tracked under
        ADR-0001 control plane (cycle-lifecycle commands).
      tags: [cycle-lifecycle]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: start-run }
                    payload: { $ref: '#/components/schemas/StartRunPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }
        '503': { $ref: '#/components/responses/BackendUnreachable' }

  /commands/change-spend-budget:
    post:
      operationId: changeSpendBudget
      summary: Raise or lower a cycle's USD and/or token spend cap mid-flight.
      tags: [budget]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: change-spend-budget }
                    payload: { $ref: '#/components/schemas/ChangeSpendBudgetPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/change-halt-budget:
    post:
      operationId: changeHaltBudget
      summary: Raise or lower a cycle's max-rounds halt cap mid-flight.
      tags: [budget]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: change-halt-budget }
                    payload: { $ref: '#/components/schemas/ChangeHaltBudgetPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
