  /commands/edit-draft-campaign:
    post:
      operationId: editDraftCampaign
      summary: Patch a sparse subset of mutable `DraftCampaign` fields.
      description: |
        Drives the chat ↔ panel dual-surface mutation path (see
        `docs/specs/roadmap.md § State binding`). Both the
        assistant tool-call surface and the panel "Apply" button ride this
        same verb. Check-in scoped — dispatched through `CommandDispatcher`
        onto the check-in cycle's ledger (`cycle_chk_*`, minted with its own
        `.runtime/` at the first ingest action and retained across the flip to
        `active`), so an origin edit is a `CommandRecord` + `CommandAckRecord`
        like every other Control-remote mutation. No `Expected-Version` — a
        draft is authored, not raced. An `Idempotency-Key` retry is deduped and
        the body re-read from `draft.json`.

        `patch` is a sparse object — only declared field names are accepted,
        omitted fields are unchanged. Slug edits go through the same slug
        collision detection as `/datasets/ingest` (409 on conflict).
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: edit-draft-campaign }
                    payload: { $ref: '#/components/schemas/EditDraftCampaignPayload' }
      responses:
        '200':
          description: Post-mutation `DraftCampaign` (full shape, not a partial diff).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `draft_id` does not exist, or exists under a different
            `IdentityContext.tenant_id`. Existence-leak gate: 404, not 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/start-checkin:
    post:
      operationId: startCheckin
      summary: Start a CHECKIN campaign — gate the origin, commit the Dataset, mint the run.
      description: |
        Terminal verb in the check-in phase. The campaign already exists durably
        (minted on the first ingest action — `/datasets/ingest` or
        `/datasets/{name}/draft`); its working state lives at
        `projects/{tenant}/campaigns/{campaign_id}/checkin/`, and the phase itself
        is the root cycle's `.runtime/checkin.flag`. This verb clears that flag and
        runs. Server:
        1. Loads the campaign by `campaign_id`, asserts owned + flag still set,
           rehydrates the draft from `checkin/draft.json`.
        2. Runs the deterministic origin-readiness gate (incomplete → 422; the flag
           stays set so the operator resolves + retries).
        3. Reserves the machine slot, then commits the origin: a fresh upload
           writes `projects/{tenant}/datasets/{slug}/` (the four Dataset files
           + sibling `campaign.yaml`) from the materialized bank; a draft derived
           from an existing dataset persists only its candidate library.
        4. Resolves the cycle plan, flips `checkin` → `active`, clears
           `.runtime/checkin.flag`, and detaches the runner.

        Check-in scoped — dispatched through `CommandDispatcher` onto the
        check-in cycle's ledger, the same cycle the run then appends its rounds
        to. No `Expected-Version`. `Idempotency-Key` set by the client, but this
        verb alone is NOT ledger-deduped: `job_id` is a live `JobRegistry` handle
        with no disk home, so a deduped retry could only fabricate one. The
        durable campaign is what makes a retry safe — a second Start finds the
        campaign `active` and raises `LaunchError` (422).
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: start-checkin }
                    payload: { $ref: '#/components/schemas/StartCheckinPayload' }
      responses:
        '200':
          description: |
            Canonical mint response — `campaign_id`, `cycle_id`, `job_id`.
            Synchronous through the commit + runner spawn; background progress
            then rides the canonical ledger + `dashboard.json` stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCheckinResponse'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `campaign_id` has no check-in working state (already Started, never a
            check-in, or under a different `IdentityContext.tenant_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            `payload_invalid` (malformed envelope), `origin_incomplete`,
            `ingest_failed`, or `pipeline_config_invalid`. `origin_incomplete` —
            the deterministic origin-readiness checklist still has gaps (the
            column mapping unset/unconfirmed, an empty `task_description`, or any
            config knob still `proposed`); `details.gaps` lists each blocking
            field as `{field, reason, hint}`. `ingest_failed` — a confirmed
            mapping hit a per-row data failure (a blank mapped cell) at
            materialization. `pipeline_config_invalid` — the resolved pipeline
            config can't produce a runnable cycle. The campaign stays `checkin`;
            the operator resolves it (via `resolve-origin` or
            `edit-draft-campaign`) and retries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503': { $ref: '#/components/responses/BackendUnreachable' }

  /campaigns:
    get:
      operationId: listCampaigns
      summary: Every campaign in one store owned by the caller, newest first.
      description: |
        The forest's other half — `GET /cycles` returns one store's cycles,
        this returns its campaigns, and the webapp groups the pair by
        `root_cycle_id` (`buildForest`). Takes the same `descend`: absent/empty
        is the caller's own tenant tree; a hop chain re-roots the list into an
        L4 `.inner/<key>` sandbox, so one route lists the top level and
        any depth. Response shape is owned by the server model
        (`registry.py::CampaignListResponse`, generated into
        `webapp/lib/api/types.generated.ts::CampaignSummary`) — not duplicated
        here.
      tags: [cycles]
      parameters:
        - name: dataset
          in: query
          required: false
          description: Filter to one dataset's campaigns.
          schema: { type: string }
        - name: lifecycle
          in: query
          required: false
          description: |
            `active` (default), `archived`, `deleted` — the visibility intent —
            or `all`. `checkin` is not a status but the authoring PHASE, read off
            the root cycle's `.runtime/checkin.flag`; it narrows `active`, which
            already carries the origin-authoring set.
          schema:
            type: string
            enum: [active, archived, deleted, checkin, all]
            default: active
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops to descend into, as on
            `GET /cycles`. Empty/absent → the caller's own tree.
          schema: { type: string }
      responses:
        '200':
          description: The resolved store's campaigns, newest first (`CampaignListResponse`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: A `descend` hop names an inner sandbox that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/checkin:
    get:
      operationId: getCampaignCheckin
      summary: Re-open a CHECKIN campaign — its draft wire + last resolver turn.
      description: |
        The sidebar opens a check-in campaign through here instead of
        the dashboard (no `dashboard.json` exists pre-loop): the webapp rebuilds
        the ingest "ready" panel from `draft` and shows the prior `resolution`
        recap. Tenant-scoped — a cross-tenant id 404s. 404 when the campaign has
        no check-in working state (already Started or never a check-in).
      tags: [campaigns]
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: The check-in campaign id (the draft's `draft_id`).
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        '200':
          description: |
            The rehydrated draft wire + the last resolver turn (or null) + any
            proposals the last turn left unclicked.
          content:
            application/json:
              schema:
                type: object
                required: [draft, resolution, raised]
                properties:
                  draft: { $ref: '#/components/schemas/DraftCampaign' }
                  resolution:
                    description: |
                      The last `resolve-origin` turn's output (assessment,
                      findings, next_action, recap), or null when none ran.
                    type: [object, 'null']
                  raised:
                    type: array
                    items: { $ref: '#/components/schemas/RaisedCommand' }
                    description: |
                      Proposals the last turn left unclicked. Always present
                      (`[]` when none) — without them a re-opened check-in would
                      drop the operator's outstanding actions on the floor.
                    additionalProperties: true
        '404':
          description: No check-in working state for this campaign (or cross-tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/cycles/{cycle_id}/dashboard:
    get:
      operationId: getCycleDashboard
      summary: Live telemetry for a viewed cycle — `dashboard.json` (root or any inner descendant).
      description: |
        The single dashboard-serving route. `dashboard.json` is per-cycle: every
        cycle owns its own live file, self-stamped with its own `campaign_id` /
        `cycle_id`. The path ids address the top-level (root) cycle; the optional
        `descend` query walks into the previous hop's L4 `.inner/<key>` sandbox one
        `campaign::cycle` hop at a time, so ONE route reads a top-level cycle, an
        inner cycle, or an L5+ descendant — the recursion-native address that
        retired the separate inner-dashboard route. Absent/empty `descend` is a
        plain per-cycle read (byte-identical to the pre-existing route). Same 304 /
        warming-fallback / atomic-read semantics at any depth (one server-side
        implementation, `serve_dashboard_response`). The leaf `dashboard.json`
        self-stamps its own ids, so the webapp's payload-identity guard is unchanged.
        `run_phase` is DERIVED at read time (`derive_run_phase`) — the same answer
        `/cycles` and `/tree` serve — overriding what the file declares, and
        `Last-Modified` covers that derivation's inputs rather than this file's mtime
        alone, since the phase turns `detached` on the clock with nothing written.
        The in-flight round's per-candidate searchpoints
        (`current_round.nodes.l1_score.input.candidates[]`) carry the
        `SearchpointCandidate` shape — the same shape a round file's
        `candidate_scores[]` carries historically.
      tags: [cycles]
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: The top-level (root) campaign id.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: cycle_id
          in: path
          required: true
          description: The top-level (root) cycle id — the key of any `.inner/` sandbox below it.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops BELOW the root, each re-rooting into
            the previous hop's `.inner/<key>`. Absent/empty = the top-level cycle. Every
            component is validated against the id charset before any filesystem touch.
          schema: { type: string }
        - name: at
          in: query
          required: false
          description: |
            A ledger offset in the LEAF cycle's own ledger — the space
            `ProjectionEnvelope.sequence`, `RayItem.offset` and `dashboard.json::at_offset`
            share, so a ray item taken from this course addresses a moment directly.
            Present, the body is the same state REPLAYED to that moment rather than the
            head's file: the same fold, given records off disk. Absent = the head, served
            from the materialized file at no fold cost.

            `run_phase` is still derived at read time — it answers what the producer is
            doing NOW, which is a clock fact and not a property of the moment asked for.
            The armed spend ceilings are NOT overlaid on a replay, because they are the
            cap in force now and restating one as a past cap would be a fabrication.
          schema: { type: integer, minimum: 0 }
        - name: If-Modified-Since
          in: header
          required: false
          description: Standard conditional-GET validator; the route 304s on an unadvanced mtime.
          schema: { type: string }
      responses:
        '200':
          description: The leaf cycle's `dashboard.json` (or a `warming_up` placeholder).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '304':
          description: The leaf `dashboard.json` mtime has not advanced since `If-Modified-Since`.
        '404':
          description: A `descend` hop names an inner sandbox that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/cycles/{cycle_id}/tree:
    get:
      operationId: getLineageTree
      summary: The lineage tree rooted at one cycle — the single served genealogy.
      description: |
        ONE tree, one owner. Nodes alternate `course -> candidate -> (course | sample)`
        forever, so an L4 inner run is not a special case — it is the same shape one
        level down, and L5+ needs no new tier.

        Rooted at a COURSE, not a campaign: a campaign is a bag of courses, and the
        flat campaign-rooted read this replaced could not describe a leaf below depth 1.
        `GET /campaigns` + `GET /cycles` stay the flat registry the sidebar groups.

        IDENTITY is built from each course's **ledger** (`CandidateMintedRecord`) plus
        `index.json` topology — deliberately NOT the round file. A round that never closed
        writes no round file, but it minted its candidates, and at L4 their inner campaigns
        are finished on disk under a parent that a positional read cannot name. The ledger
        is the only witness independent of round close.

        The round-CLOSE facts (`is_winner`, `theta`, `cumulative_theta`) come from
        `dashboard.json::rounds[]`, the declared projection for them — the ledger genuinely
        does not carry them. A round that never closed reports **no winner** rather than
        promoting its lone candidate.

        ONE tree per campaign, and every consumer reads it. There is no `depth` dial:
        two clients choosing different depths for the same served object is how they
        came to disagree. Course recursion is bounded by a server constant instead
        (`lineage_views.py::_MAX_COURSE_DEPTH`) — a cost bound, not a caller knob.

        Conditional-GET is a **weak ETag** over the newest mtime across the subtree's
        `ledger.jsonl` + `index.json` **plus the `lens`/`samples` query**. The ledger
        bumps per candidate, so a 5 s poll sees an in-flight candidate the moment it
        starts, which `dashboard.json`'s mtime never guaranteed. Folding the query into
        the validator is what lets a MASKED read 304: `Last-Modified` cannot express
        query-dependence, so a lens request used to recompute the whole tree on every
        poll. `Cache-Control: no-store` applies, so the browser cache never replays the
        validator — the client holds the ETag itself and sends `If-None-Match`.
      tags: [cycles]
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: The top-level (root) campaign id.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: cycle_id
          in: path
          required: true
          description: The top-level (root) cycle id — the key of any `.inner/` sandbox below it.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops to descend into before resolving the leaf,
            as on the dashboard route. Empty/absent → the caller's own tree. Send back a
            node's own `path` verbatim to root the tree at that node.
          schema: { type: string }
        - name: lens
          in: query
          required: false
          description: |
            A counterfactual overlay. `score:<formula>` = an alternative scoring formula —
            stamps each candidate's `lens_value` and marks a `divergence` on the spine node
            where that criterion would have elected someone else. `abort:<variant>`,
            variant ∈ {`epsilon_off`, `lock_in_off`, `all_off`} = switch off a PoBB abort
            contributor. Absent → the tree is the raw read. Unknown value → 400.
          schema: { type: string }
        - name: samples
          in: query
          required: false
          description: |
            The sample-set mask: a comma-separated sample-id list. Re-scores each candidate
            over only those samples into `sample_set_accuracy` / `sample_set_n`. Composes
            with a `score:` lens; ignored for an `abort:` lens. A non-integer token → 400.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: |
            The `ETag` from a prior response for this exact query; the route 304s when
            neither the subtree nor the mask has changed. Replaces `If-Modified-Since`
            here — a single validator that covers both, rather than a time validator
            plus a "masked reads always recompute" carve-out.
          schema: { type: string }
      responses:
        '200':
          description: The course at the resolved path, and its subtree.
          headers:
            ETag:
              description: |
                Weak validator over `(subtree mtime, lens, samples)`. Send it back as
                `If-None-Match`. Distinct per mask, so a lens view has its own 304.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineageNode'
        '304':
          description: Unchanged since `If-None-Match` — same subtree, same mask.
        '404':
          description: Unknown cycle (or cross-tenant), or a `descend` hop names no sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/cycles/{cycle_id}/ray:
    get:
      operationId: getFamilyRay
      summary: The time-ray — one chronology across a course and everything below it.
      description: |
        **The absolute linear sequence of what happened.** Every other axis this API
        serves is round-indexed (`/rounds`), tree-structured (`/tree`), or spend-only —
        none of them answers "what happened, in order, and is it still happening." The
        ray does, and it is the only surface that can, because it is the only one that
        merges the ledgers of a course AND its forks AND its inner runs into one order.

        **This is also the replay endpoint** that `domain/projection_envelope.py`
        promises. The SSE tail (`events:subscribe`) unconditionally seeks to EOF, so it
        can never serve history; the ray is where history lives. Do NOT add a `since=`
        parameter to the tail — that would be a second replay mechanism.

        ### Ordering, and its stated limits

        Records merge on one key: `(ts_eff, encoded_path, offset)`. `ts_eff` applies a
        per-file monotonic clamp: each ledger is read in FILE order carrying `last_ts`,
        and `ts_eff = max(parsed_ts, last_ts)`. Records are stamped at construction but
        appended later, so a raw-timestamp sort can place a record BEFORE the record
        that caused it; append order is the one authority a single file has, and the
        clamp repairs the inversion with it rather than inventing time. A record
        arriving before its file's first parseable timestamp is skipped (a fabricated
        time would corrupt the order), while still consuming its physical offset.

        Limits, deliberately on the record:
          * Two records in different cycles inside the clock's resolution are ordered
            by encoded path — arbitrarily but stably, not by truth.
          * A clamped record displays at its predecessor's time. Gap durations use
            `ts_eff` deltas, so a clamped record contributes a zero gap — correct.
          * Clocks are one machine's. A distributed runner would need a family-scoped
            Lamport counter; that does not exist and must not be faked.

        ### The two offset spaces — never merge them

        `offset` is the **physical** 0-based line index in THAT cycle's own
        `.runtime/ledger.jsonl` — the same space as `ProjectionEnvelope.sequence` from
        the SSE tail, which is what lets a client join a live frame onto a ray item
        (`path == leafPath && offset == sequence`). It is NOT the space
        `CycleEventLog.iter(since=N)` indexes: that walks a fork's virtual
        parent-prefix + own appends. The ray reads each ledger's own FILE and never
        goes through `iter()`, because a fork's `iter()` replays the parent prefix and
        the ray already reads the parent — every parent record would appear twice.

        Ray offsets are **sparse**: server curation drops kinds, so consecutive items
        may skip offsets, and a gap between ray offsets is not a missing record.

        ### Windowing

        Newest-first selection, oldest-first delivery. `before` is an opaque cursor
        encoding the merge key of the oldest item a prior window returned; a deeper
        page is every record with a key strictly below it, so consecutive windows
        partition the key space — no overlap, no hole. A cycle discovered after the
        head fetch (a new fork) has only keys above every outstanding cursor: it
        enters at the next head fetch and can never corrupt a deep page.

        Any window revalidates with `If-None-Match` against the family's mtimes.
      tags: [cycles]
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: The top-level (root) campaign id.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: cycle_id
          in: path
          required: true
          description: The top-level (root) cycle id.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops to descend into before resolving the leaf,
            as on the `tree`/`dashboard` routes. The resolved leaf is the ray's ROOT —
            the family below it is what gets merged.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: How many items to return. The window bound.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: before
          in: query
          required: false
          description: |
            An opaque cursor from a prior response's `cursor_prev`. Returns the window
            immediately older than that one. Absent = the head (newest) window.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: |
            The `ETag` from a prior response for this exact window. Every window —
            head or deep — revalidates against the family's newest ledger + index
            mtimes.
          schema: { type: string }
      responses:
        '200':
          description: One ordered window of the family's chronology.
          headers:
            ETag:
              description: Weak validator over `(limit, before, each course's path + mtimes)`.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RayResponse'
        '304':
          description: Unchanged since `If-None-Match`.
        '400':
          description: A malformed `before` cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown cycle (or cross-tenant), or a `descend` hop names no sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /cycles:
    get:
      operationId: getCycles
      summary: Every cycle in one store + that store's active pointer — one forest.
      description: |
        A *forest* is one store's whole content: campaigns (`GET /campaigns`,
        which takes the same `descend`) grouped by their `root_cycle_id` — their
        ORIGIN — each holding the runs on that origin, and each run's cycles: its
        root plus every fork / diag / sweep, returned FLAT and related only by
        `parent_cycle_id`. Whether a consumer nests them or lays them out as
        peers is the consumer's call; the wire asserts no hierarchy.

        `descend` names the chain of cycles to descend INTO; absent/empty is the
        caller's own tenant tree. When the optimizer optimizes its own
        optimizer prompts (L4), each candidate runs as a real inner campaign under a
        flat, off-registry sandbox `<workspace>/.inner/<key>`, which is
        structurally a normal projects tree — so descending one hop returns that
        cycle's inner fan-out through this same route, and an L5+ descendant
        through two. There is no depth-specific read.

        `active_campaign_id` / `active_cycle_id` carry the RESOLVED store's own
        pointer: the active session at the top level, the inner loop running
        right now inside a sandbox. They are reported raw — liveness is
        `CycleListEntry.run_phase`'s job, and a consumer asking "is the pointed
        cycle live?" reads that off `cycles[]` rather than having this route
        re-derive it.

        A cycle that spawned no inner campaigns (non-L4, or the loop hasn't
        recursed yet) has no sandbox, so a `descend` hop naming it is a 404 —
        that absence is what tells the webapp to show no expand affordance.
      tags: [cycles]
      parameters:
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops to descend into, mirroring the
            webapp's `CyclePath`. Empty/absent → the caller's own tree. A hop's
            campaign component is carried for wire symmetry only; a sandbox is
            keyed on the cycle id.
          schema: { type: string }
      responses:
        '200':
          description: |
            Every cycle in the resolved store; `active_*` carry that store's pointer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CyclesResponse'
        '400':
          description: A `descend` hop is malformed (missing `::`) or has bad path chars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: A `descend` hop names an inner sandbox that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /commands/replace-dataset:
    post:
      operationId: replaceDataset
      summary: Version-and-repoint an existing dataset so its name frees for new data.
      description: |
        The data-safe answer to a name collision when the operator means
        "supersede the data under this name". NEVER overwrites: the old data
        + its results are preserved,
        renamed out of the way. Server, in crash-safe order:
        1. Renames `projects/{tenant}/datasets/{slug}/` to the smallest free
           `{slug}-v{n}/` (byte-identical data; self-reference fixed).
        2. Repoints every dependent campaign — `campaign.yaml::dataset_name`
           and each cycle `index.json::header.dataset_name` — onto `{slug}-vN`,
           and re-stamps that data's measurement-archive entries. After this,
           every prior campaign resolves the exact bytes it always ran on.
        3. Returns; the freed `{slug}` is then re-ingested via `/datasets/ingest`
           through the normal draft/check-in flow (a separate call).

        A `datasets/.migrations/{id}.json` marker makes the migration resumable;
        a crash between steps is healed before any run resolves a pin.
        Workspace-scoped — no `Expected-Version`. `Idempotency-Key` required.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: replace-dataset }
                    payload: { $ref: '#/components/schemas/ReplaceDatasetPayload' }
      responses:
        '200':
          description: |
            The migration completed. `versioned_to` is the archival name the old
            data now lives under; the counts are what moved with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceDatasetResponse'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `nothing_to_replace` — no committed dataset holds `slug` (the name
            was removed between the collision 409 and this call).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/resolve-origin:
    post:
      operationId: resolveOrigin
      summary: Run one origin-resolver turn against a `DraftCampaign`.
      description: |
        The proposer half of the origin proposer/gate split (see
        `docs/specs/roadmap.md`). One turn: the
        origin-aware `checkin` node inspects the draft (headers, sample rows,
        current per-field provenance, open gaps) plus the operator's latest
        framing and proposes evidence-cited values for the unresolved
        origin-readiness fields. High-confidence findings auto-confirm
        (`confirmed`); low-confidence land `proposed` and wait for an operator
        click. The deterministic checklist — not the resolver — decides
        completeness; a false `ready` is re-checked and rejected.

        Synchronous (mirrors `edit-draft-campaign`): returns the resolver
        output + the post-apply `DraftCampaign`. Check-in scoped — dispatched
        through `CommandDispatcher` onto the check-in cycle's ledger, so a turn
        that moved the origin is a `CommandRecord`. No `Expected-Version`. An
        `Idempotency-Key` retry is deduped and the body re-read from
        `cache.json::resolution` + `draft.json`, so a network retry never
        re-spends the LLM call. Drives subsequent turns from the UI; bounded by
        operator interaction.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: resolve-origin }
                    payload: { $ref: '#/components/schemas/ResolveOriginPayload' }
      responses:
        '200':
          description: The resolver turn output + the post-apply `DraftCampaign`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveOriginResponse'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `draft_id` does not exist, or exists under a different
            `IdentityContext.tenant_id`. Existence-leak gate: 404, not 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /datasets/ingest:
    post:
      operationId: ingestDataset
      summary: Upload a tabular file; receive a server-held `DraftCampaign` with parsed preview + smart defaults.
      description: |
        Ingest path for the M13 chat-first user web (see
        `docs/specs/roadmap.md § Ingest`). Workspace-scoped,
        identity-bound by `IdentityContext.tenant_id`. Mints a durable `checkin`
        campaign on this first action: the draft's `draft_id` IS the new
        `campaign_id`, its working state lands at
        `projects/{tenant}/campaigns/{campaign_id}/checkin/`, and on Start the
        dataset directory is written at `projects/{tenant}/datasets/{slug}/`.

        The check-in campaign appears in the sidebar immediately and survives a
        restart; nothing runs until the operator starts it via the separate
        `/commands/start-checkin` verb.
        File type is detected from the filename extension: CSV, TSV, JSON,
        JSONL/NDJSON, or XLSX (first sheet). XLSX parsing is gated off when the
        server runs `HARDENED_MODE` (Office formats are a macro/zip-bomb vector).
        Ingest is header-agnostic — any column names are accepted; for JSON the
        check-in reads the structure and proposes the mapping. The input/target
        column mapping is resolved on the draft (`column_query` /
        `column_ground_truth`) and gated at mint, not at upload.
      tags: [datasets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Tabular file (CSV/TSV/JSON/JSONL/XLSX); any column headers (header-agnostic).
                slug:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[a-z0-9][a-z0-9_-]*$'
                  description: |
                    Optional slug override. Defaults to `SafeName(filename_without_ext)`.
                    Must pass `SafeName` (lowercase, alphanumerics + `_-`).
      responses:
        '200':
          description: |
            Draft created. Body is a `DraftCampaign` with `sample_preview`
            (first 10 rows), `n_samples`, smart-defaulted `connector` /
            `scoring_composite` / `max_rounds`, and a server-minted `draft_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated but not permitted to ingest in this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            Slug collides with an existing user-uploaded dataset under
            `projects/{tenant}/datasets/`. `details.suggested_slug` carries
            the smallest free `{slug}-{n}`; the operator picks or edits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Parse / shape failure — undecodable bytes, unparseable file, no
            header row, or zero data rows. `details.reason` carries the specific
            failure (`bad_csv`, `bad_json`, `empty`, `too_large`, `bad_slug`,
            `unsupported_format`, or `hardened_blocked` for an XLSX upload when
            the server runs `HARDENED_MODE`). Column names are NOT validated
            here (header-agnostic ingest).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /datasets/{name}/draft:
    post:
      operationId: draftFromExistingDataset
      summary: Open an authored dataset as a durable check-in campaign.
      description: |
        The direct path behind "open this dataset in the ingest panel" — a demo /
        benchmark / owned dataset becomes a prefilled check-in (`draft_id` ==
        `campaign_id`) with no browser-side CSV round-trip. **Mints a campaign**,
        so it is a state-creating POST, not a read. Identity-gated through the
        same resolver as the other dataset reads; nothing runs until the operator
        starts it via `/commands/start-checkin`.
      tags: [datasets]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The prefilled draft wire (same shape every draft-returning endpoint emits).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Unknown dataset, or one outside this tenant (existence-leak gate).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /origins/{origin_id}/draft:
    post:
      operationId: draftFromOrigin
      summary: Open a prior origin as a prefilled check-in campaign ("Reuse an origin").
      description: |
        Resolves the origin's EXACT prompt fields: a campaign itself minted from
        an origin carries those fields on its root-cycle seed, so they are reused
        verbatim. The draft is marked `reused_origin_id`, so starting it
        (`/commands/start-checkin`) seeds C0 via `origin_override` and stamps the
        `campaign_origin` lineage. **Mints a campaign** — a state-creating POST.
      tags: [origins]
      parameters:
        - name: origin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The prefilled draft wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Unknown origin, or one outside this tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /sessions/active:
    get:
      operationId: getActiveSession
      summary: The caller-tenant's active-session pointer.
      description: |
        The three ids naming what is running for this tenant, read off
        `.workspace/active_session.json`. The webapp polls it on the live 2 s beat
        so a CLI-minted cycle is followed promptly.

        **There is no 404 on this route, deliberately.** "No active session" is a
        steady state — nothing launched yet, or the workspace was cleared — so it
        answers 200 with null ids, like `/cycles` does with
        `active_campaign_id`/`active_cycle_id`. A 404 would classify as `gone` on the
        client ("stop, this address is dead") and, on a route polled every 2 s from
        boot, would log a warning per tick for the whole idle life of the server.
      tags: [Sessions]
      responses:
        '200':
          description: The active pointer; ids null when no session is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSessionResponse'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /machine-status:
    get:
      operationId: getMachineStatus
      summary: Whether another user currently holds the single run slot.
      description: |
        The server is single-process and runs campaigns in sequence, so a launch
        is rejected (409 `machine_busy`) while anyone else's run is live. This
        read is the poll that lets the webapp surface that state as a
        critical-alert banner *before* the operator tries — the always-on twin of
        the 409. Reads the same `JobRegistry.machine_holder` the launch gate
        uses, so banner and gate can never disagree.
      tags: [Sessions]
      responses:
        '200':
          description: Current holder of the machine slot, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineStatusResponse'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /datasets/draft/candidate-library:
    post:
      operationId: uploadCandidateLibrary
      summary: Attach a candidate library to a draft, fulfilling a `candidate_source` dependency.
      description: |
        The operator's "drop in place" for an unfulfilled pipeline dependency: when
        the draft's active pipeline has a `candidate_source` node (declared by the
        connector's node types), the draft's `dependencies` block reports a
        `candidate_library` dependency `fulfilled: false`. This uploads the target
        list — one entry per line for `.txt`, else the first column of a
        CSV/TSV/JSON/JSONL/XLSX — onto the in-flight draft. On commit it
        materializes to `{slug}/candidate_library.txt` alongside the per-pipeline
        origin, and the run unions it into the session's term index.

        Soft dependency — it sharpens the candidate pool but does NOT gate mint
        (the answers already in the data are a runnable pool). A multipart ingress
        for `edit-draft-campaign`: the parsed terms become that command's
        `patch.candidate_library` and dispatch through `CommandDispatcher`, so the
        edit lands on the check-in cycle's ledger like every other origin mutation.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, draft_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: Target library — one entry per line (.txt), or a single-column CSV/Excel.
                draft_id:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: The draft to attach the library to (the check-in `campaign_id`).
      responses:
        '200':
          description: |
            Library attached. Body is the updated `DraftCampaign`; its
            `dependencies` block now reports the `candidate_library` dependency
            `fulfilled: true` and `candidate_library_size` carries the entry count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '404':
          description: Draft not found (or owned by another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Parse failure or empty library. `details.reason` is the specific
            failure (`bad_csv`, `bad_json`, `unsupported_format`, `empty`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /datasets/draft/candidate-library/from-column:
    post:
      operationId: buildCandidateLibraryFromColumn
      summary: Build a draft's candidate library from one of its own columns.
      description: |
        The unified "build from dataset" path: when the targets already live in
        the data (the ground-truth/target column, the union of the dataset's
        category sheets), derive the candidate library from the distinct values of
        a chosen column rather than uploading an external file. Blanks and the
        TermNorm `--` placeholder are dropped; order preserved, duplicates
        collapsed. Like its upload sibling, the derived terms dispatch as
        `edit-draft-campaign`'s `patch.candidate_library`.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_id, column]
              additionalProperties: false
              properties:
                draft_id:
                  type: string
                  minLength: 8
                  maxLength: 128
                column:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: One of the draft's `headers` to take distinct values from.
      responses:
        '200':
          description: |
            Library built. Body is the updated `DraftCampaign`; its
            `candidate_library` dependency reads `fulfilled: true` and
            `candidate_library_size` carries the distinct-value count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '404':
          description: Draft not found (or owned by another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Column is not one of the draft's `headers`, the draft has no cached
            rows, or the column has no usable values (`details.reason: empty`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID-or-equivalent identifying this command attempt.
        The dispatcher dedupes by hash lookup against the target ledger; a
        second POST with the same `Idempotency-Key` returns the original 202
        response, not a fresh command.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    ExpectedVersion:
      name: Expected-Version
      in: header
      required: false
      description: |
        The ledger offset (or round number, for round-grained commands) the
        client believes the target cycle is at. The runner rejects the command
        with 409 `version_conflict` if the cycle has advanced past this point.
        Optimistic-concurrency floor.

        **v0 relaxation (Phase 2b):** the header is declared optional in v0
        because the webapp's mutation surface does not yet thread ledger
        sequence numbers from the SSE stream through to mutations. The
        dispatcher validates the version when the header IS present and
        skips the check otherwise. Phase 2c flips this back to `required:
        true` once the webapp consumes sequence from `EventStreamView`.
      schema:
        type: integer
        minimum: 0

  schemas:
    SearchpointCandidate:
      type: object
      additionalProperties: true
      description: |
        One candidate searchpoint as the webapp joins it — DESCRIPTIVE, not a
        route body: both carriers are `additionalProperties: true` passthroughs
        (the file IS the contract per the folder-UI doctrine). Carried by
        `dashboard.json::current_round.nodes.l1_score.input.candidates[]` (live,
        writer `projections/live_dashboard/render.py`) and
        `rounds/round_NNNN.json::candidate_scores[]` (historical, writer
        `domain/results.py::ScoredCandidate`, served via the generic file route).
        The webapp joins `resolved_pipeline_params` values onto the static
        `node_config_schema` rows from the pipeline endpoint (`lib/derivations`);
        the "·evolved" badge is that client-side diff — no served flag.
      properties:
        candidate_id:
          type: string
          description: Live id is `r{round}_{idx}`; round files carry the stable id.
        label:
          type: string
          description: Display label, e.g. `C1.2`.
        idx:
          type: integer
          minimum: 0
        prompt_fields:
          type: object
          additionalProperties: true
          description: |
            The evolved prompt — `OptSearchPoint.prompt_field_dict()` shape (the
            six PromptTemplate string fields; pp-self outer pipelines instead carry
            per-node prompt fields inside `resolved_pipeline_params`).
        resolved_pipeline_params:
          type: object
          additionalProperties: true
          description: |
            The COMPLETE server-resolved, config-only params this candidate runs
            — origin floor ⊕ candidate delta, prompt stripped:
            `{node: {param: value}, steps: […]}`. Never re-merged client-side.
        pipeline_params_override:
          type: object
          additionalProperties: true
          description: The sparse fork-transport delta. Round files only.

    CommandEnvelope:
      type: object
      required: [kind, payload]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: |
            The command kind. MUST be one of the kinds declared in this
            file's `paths` keys (the closed set). Examples once Profile B
            lands: `pause-cycle`, `fork-cycle`,
            `change-spend-budget`. See `docs/adr/0001-m12-control-plane.md`
            Profile B table.
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]*$'
        payload:
          description: |
            Per-kind payload. Each declared operation in `paths` overrides
            this with a tighter schema (using `$ref` or inline). The base
            envelope only guarantees the field is present.
          type: object
          additionalProperties: true

    CommandAcceptedBody:
      type: object
      required: [command_id, correlation_id, ledger_sequence]
      additionalProperties: false
      properties:
        command_id:
          type: string
          description: |
            Stable id of the appended `CommandRecord`. Clients use this to
            correlate the eventual `CommandAckRecord` frame on the SSE
            channel.
        correlation_id:
          type: string
          description: |
            Echoes the `Idempotency-Key` from the request. Idempotent: a
            second POST with the same key returns the same `command_id` +
            `correlation_id` pair.
        ledger_sequence:
          type: integer
          minimum: 0
          description: |
            The ledger offset at which the `CommandRecord` was appended.
            Client subscribers can use this to align the SSE tail.

    CycleHop:
      type: object
      description: One `(campaign, cycle)` step of a CyclePath.
      required: [campaign_id, cycle_id]
      additionalProperties: false
      properties:
        campaign_id: { type: string }
        cycle_id: { type: string }

    LineageDivergence:
      type: object
      description: |
        Where an alternative criterion would have elected someone else. It rides the node it
        describes (`LineageNode.divergence`), so there is no parallel list to re-join onto
        the tree by a hand-rolled key.
      required: []
      additionalProperties: false
      properties:
        alternative_candidate_id:
          type: [string, "null"]
          description: |
            The candidate the masked criterion would have elected instead (measured, so
            nameable); null when the round would simply have held on origin.

    LineageNode:
      type: object
      description: |
        One node of the served lineage tree — the SAME shape at every depth, which is the
        point: a client writes one renderer, not one per tier. `course` and `candidate`
        strictly alternate. Declared in full here rather than as an open object: the
        `/lineage` response this replaces was `additionalProperties: true`, and that hole
        is exactly how five disagreeing lineage shapes went unnoticed.
      required: [kind, id, label, course_label, path, children]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [course, candidate]
        id:
          type: string
          description: Course → the cycle_id. Candidate → the searchpoint id minted at L1/origin.
        parent_id:
          type: [string, "null"]
          description: |
            The candidate this node descends from; null only at the true root. A fork and
            an L4 inner run carry the SAME edge — one resolver reads
            `fork.from_candidate_id` and `spawned_by`, so a course hangs off a node and
            needs no lane geometry.
        label:
          type: string
          description: |
            This node's position on THIS course's one timeline. Minted at mint time, never
            derived from list position — except for a fork-contributed attempt, which is
            renumbered onto this course's sequence (`C{round}.{n}` is a course's PRIVATE
            counter, so four forks cut off C0 each mint their own `C1.1` and only the
            renumber makes the label mean something campaign-wide).
        course_label:
          type: string
          description: |
            This candidate's label in the course that MINTED it. Equal to `label` for a
            candidate this course minted itself; a fork-contributed attempt keeps the
            fork's private `C{round}.{n}` here while `label` carries its renumbered
            position on this course's timeline.

            Join on THIS, not on `candidate_id`, when matching a node against a
            per-cycle projection: `dashboard.json` is per-cycle and speaks the minting
            course's private counter, and `candidate_id` is re-minted per run (a resume,
            a rewind, a re-`new` onto a deterministic cycle_id all re-mint the same
            `(round, idx)` under a new id), so an id join silently misses.
        path:
          type: array
          description: |
            The addressable CyclePath of the course this node belongs to, root → leaf.
            Send it back as `descend` to root the tree here — no client re-derivation.
          items: { $ref: '#/components/schemas/CycleHop' }
        children:
          type: array
          items: { $ref: '#/components/schemas/LineageNode' }
        round:
          type: [integer, "null"]
          description: Column hint. Candidates only — rounds are not a tier.
        accuracy: { type: [number, "null"] }
        composite_fitness: { type: [number, "null"] }
        status:
          type: string
          description: |
            Candidate → `minted` | `measured`. Never `winner` (that rides `is_winner`):
            election is stamped at round close, so an unclosed round HAS no winner and this
            tree declines to invent one. Course → `index.json::status`, the same StopReason
            value `/cycles` serves under this same name. Was `state`, which is what
            `dashboard.json::state` calls the fine-grained ACTIVITY phase — a different axis.
        is_winner:
          type: boolean
          description: |
            Elected this round. False throughout a round that never closed — such a round
            has no winner, and a lone candidate is not promoted to one.
        theta:
          type: [number, "null"]
          description: |
            Difficulty-adjusted Rasch ability the election ranked on — what explains a
            lower-accuracy winner. Null outside the round's election fit.
        theta_se: { type: [number, "null"] }
        evaluators:
          type: object
          additionalProperties: { type: number }
          description: The candidate's stored evaluator namespace — what a `score:` lens re-scores.
        mean_fitness_ci_lo: { type: [number, "null"] }
        mean_fitness_ci_hi: { type: [number, "null"] }
        scored_samples: { type: [integer, "null"] }
        expected_samples: { type: [integer, "null"] }
        cached_samples:
          type: [integer, "null"]
          description: |
            Of `scored_samples`, how many were replayed from the MeasurementArchive rather
            than measured. Null on a course and on any candidate never measured.
        cumulative_theta:
          type: [number, "null"]
          description: |
            Ability of the adopted lineage on the cycle's fixed δ ruler — the
            subset-invariant, cross-round-comparable series. Carried by the round's WINNER
            only: it is a property of the advancing spine, and a losing sibling never
            joined it. Its accuracy-space predecessor was a mean over rows measured by
            DIFFERENT configurations and is gone; `accuracy` is what this node MEASURED.
        lens_value:
          type: [number, "null"]
          description: |
            This candidate's fitness under the request's `score:` lens, re-scored
            server-side. Null without a lens, or when the namespace can't satisfy it.
        sample_set_accuracy:
          type: [number, "null"]
          description: |
            Scorer-faithful accuracy over the request's `samples=` subset. Null without a
            mask, or when this candidate never ran any selected sample — a blank slot, not
            a fabricated 0%.
        sample_set_n:
          type: [integer, "null"]
          description: How many of the `samples=` subset this candidate actually ran.
        divergence:
          oneOf:
            - $ref: '#/components/schemas/LineageDivergence'
            - type: "null"
          description: |
            Set where the lens would have FORKED the record at this node. It rides the node
            rather than a parallel array keyed `"{cycle_id}::r{round}"` — the client used to
            re-join two flat lists onto the tree by a hand-rolled string.
        divergent:
          type: boolean
          description: This node is inside the counterfactual subtree below a divergence; render dimmed.
        course_kind:
          type: [string, "null"]
          enum: [root, fork, diag, sweep, inner, null]
          description: |
            Courses, and the candidates a FORK contributed to this timeline — on those it is
            the provenance stamp (⑂) marking an attempt the operator cut, apart from one L1
            minted in this course. A fork is not a node: its candidates land on the parent's
            one timeline, renumbered there, and its replayed C0 merges into the candidate it
            was cut from.
        run_phase:
          type: string
          enum: [checkin, running, paused, detached, terminal, ""]
          description: |
            Courses only: the ONE server-owned run-state (`derive_run_phase`) — the same value
            `/cycles` serves, never a second "is it running?" derivation. Empty on a candidate.
        dataset_name: { type: string }
        trigger:
          type: string
          description: Fork trigger; empty for roots and inner runs.
        steered_by: { type: [string, "null"] }
        task:
          type: [string, "null"]
          description: |
            An inner run's benchmark task. Load-bearing: every task runs for every
            candidate, so the candidate edge alone does not identify an inner run.
        best_accuracy: { type: [number, "null"] }
        origin_accuracy: { type: [number, "null"] }
        hearts: { type: [integer, "null"] }
        lives_cap: { type: [integer, "null"] }

    RayItem:
      type: object
      description: |
        One event on the time-ray: an **envelope plus an address**.

        `kind` + `payload` are byte-identical to a `ProjectionEnvelope`'s, deliberately —
        the client's `projectionToActivity` translator maps a `RayItem` unchanged, so the
        ray reuses the chat's curated event vocabulary instead of minting a second one.
        What the envelope cannot carry is WHICH cycle in the family: `cycle_id` alone is
        ambiguous, because inner cycle ids repeat across sibling `.inner/` sandboxes.
        Hence `path`, the same full address `LineageNode.path` carries.
      required: [path, offset, ts, kind, payload]
      additionalProperties: false
      properties:
        path:
          type: array
          items:
            $ref: '#/components/schemas/CycleHop'
          minItems: 1
          description: The cycle this record belongs to, root → leaf. THE address.
        offset:
          type: integer
          minimum: 0
          description: |
            Physical 0-based line index in THIS cycle's own `.runtime/ledger.jsonl` —
            the same space as `ProjectionEnvelope.sequence`, which is what lets a live
            SSE frame de-duplicate against a ray item on `(path, offset)`. Not the
            `CycleEventLog.iter(since=)` virtual space. SPARSE: server curation drops
            kinds, so a gap between ray offsets is not a missing record.
        ts:
          type: string
          format: date-time
          description: |
            The effective timestamp — the record's own, clamped upward to its
            predecessor's within the same file. See the endpoint description.
        kind:
          type: string
          description: |
            The ledger `record_type`, identical to `ProjectionEnvelope.kind`. The set is
            the same closed set declared in `m12-events-asyncapi.yaml`.
        payload:
          type: object
          additionalProperties: true
          description: The record's `model_dump`, identical to `ProjectionEnvelope.payload`.

    RayResponse:
      type: object
      description: One ordered window of a family's chronology, oldest-first.
      required: [items, cursor_prev]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RayItem'
          description: |
            The window, oldest-first. Includes `llm_call_progress` heartbeats: the client
            uses them to prove the process was alive across a silent stretch (so a
            heartbeated 120 s backend query grows no gap marker) and THEN drops them from
            the rendered step list. A server that stopped sending them would give every
            long backend query a spurious gap.
        cursor_prev:
          type: [string, "null"]
          description: |
            Opaque cursor for the window immediately older than this one; null when this
            window already reaches the family's beginning.

    ErrorEnvelope:
      type: object
      required: [error, message, error_id]
      additionalProperties: false
      properties:
        error:
          type: string
          description: |
            Stable error code. The whole API serializes errors to this one flat
            envelope (no `detail` wrapper) — every code below maps from a
            `PotterError` subclass at the single `main.py` handler. Control-plane
            specifics: `version_conflict` (409), `idempotency_key_missing` (400),
            `command_kind_unknown` (404), `slug_collision` (409),
            `machine_busy` (409), `backend_unreachable` (503),
            `ingest_failed` / `origin_incomplete` / `pipeline_config_invalid`
            (422), `stored_config_invalid` (500). Generic families:
            `bad_request` (400), `unauthenticated`
            (401), `capability_denied` (403), `not_found` (404), `too_large`
            (413), `request_invalid` (422), `service_unavailable` (503),
            `internal_error` (500). New codes require a YAML update first.
          enum:
            - version_conflict
            - idempotency_key_missing
            - expected_version_missing
            - capability_denied
            - command_kind_unknown
            - command_target_not_found
            - payload_invalid
            - tenant_mismatch
            - slug_collision
            - machine_busy
            - backend_unreachable
            - ingest_failed
            - origin_incomplete
            - pipeline_config_invalid
            - stored_config_invalid
            - nothing_to_replace
            - resolver_failed
            - backend_sync_failed
            - job_registry_unavailable
            - identity_not_initialised
            - provider_not_configured
            - provider_unknown
            - bad_request
            - unauthenticated
            - not_found
            - too_large
            - request_invalid
            - service_unavailable
            - internal_error
        message:
          type: string
          description: Human-readable explanation; never load-bearing for clients.
        error_id:
          type: string
          description: |
            Short hex handle stamped on EVERY error response and written to the
            same server log line (`api error [<id>] <method> <path> -> <status>
            <code>`; a 500 logs its traceback under the same handle). It is the
            one thing that ties an opaque client-side failure to its server-side
            cause, so a bug report quotes it instead of a wall-clock guess — the
            webapp surfaces it through Account → Copy diagnostics. Minted at the
            single `main.py::_error_response` seam; never reused, never
            client-supplied.
        details:
          type: object
          additionalProperties: true
          description: |
            Optional per-error structured detail.

            * `version_conflict` — `expected_version` (client sent) +
              `actual_version` (runner observed).
            * `slug_collision` (409 on `/datasets/ingest`) — `suggested_slug`
              carrying the smallest free `{slug}-{n}`, and `slug` (the colliding
              name) so the chat can offer "use existing / save as new".
            * `machine_busy` (409 on any launch command — `mint-campaign`,
              `start-checkin`, `start-run`, `fork-cycle`) — the
              single sequential run slot is taken (the server admits
              `MACHINE_RUN_CAPACITY` campaigns at once, 1 today). Carries the
              holder presence record: `holder_user`, `campaign_id`, `cycle_id`,
              `started_at`. The webapp also polls this state proactively via
              the read `GET /machine-status` (which excludes the caller's own
              run) to raise the cross-user busy banner before a launch is
              attempted.
            * `backend_unreachable` (503 on any command that needs the
              backend reachable) — `backend_type` (connector name) and
              `backend_url` (configured URL). Used by the frontend to
              compose the "Start the backend and try again" message
              without re-parsing the `message` field.
            * `ingest_failed` (422 on `/datasets/ingest`) — `reason`
              ∈ `bad_csv` | `bad_json` | `empty` | `too_large` | `bad_slug` |
              `unsupported_format` | `hardened_blocked`. (Ingest is
              header-agnostic — it no longer rejects on column names; column
              identity is resolved on the draft, gated at mint. `hardened_blocked`
              is an XLSX upload refused while the server runs `HARDENED_MODE`.)
            * `origin_incomplete` (422 on `/commands/start-checkin`)
              — `gaps`: a list of `{field, reason, hint}` objects naming each
              origin field that still blocks mint. `reason` ∈ `unset` |
              `proposed_unconfirmed`. The deterministic origin-readiness
              checklist — not the operator — is the source of truth for
              completeness (see `docs/specs/roadmap.md`).
            * `stored_config_invalid` (500 on any read of a stored config the
              server itself persisted) — `path` (the workspace-relative file)
              and `reason` (what the parse or validation rejected, naming the
              offending key). Distinct from `pipeline_config_invalid` (422),
              which rejects config the *caller* supplied: this one means data on
              disk stopped satisfying the code that reads it — typically a knob
              dropped from `CampaignConfig` (`extra="forbid"`) while a file
              written earlier still names it. It is a 500 because the caller did
              nothing wrong and cannot fix it; the remedy is the
              `promptpotter restamp --apply` verb, which `deploy-linux/update.sh`
              runs on every deploy.
            (`internal_error` carries no `details`: its trace handle is the
            top-level `error_id`, which every error now has.)

    # ---- Read-surface shapes (the forest's cycle list, at any depth) ----
    # Mirrors promptpotter/presentation/api/routers/active.py::CycleListEntry
    # + CyclesResponse. GET /cycles serves it at every depth via ?descend=
    # (declared above) — top level, an L4 cycle's inner fan-out, or L5+.

    CycleListEntry:
      type: object
      required: [campaign_id, cycle_id, mint_kind, is_root, status]
      properties:
        campaign_id: { type: string }
        cycle_id: { type: string }
        parent_session_id: { type: string, default: '' }
        parent_cycle_id:
          type: [string, 'null']
          description: Immediate parent for siblings (forks/sweeps/diag); null for roots.
        dataset_name: { type: string, default: '' }
        backend_id: { type: string, default: '' }
        mint_kind:
          type: string
          enum: [session, divergent_resume, user_fork, auto_rebase]
        is_root: { type: boolean }
        status:
          type: string
          description: StopReason value once finished, else 'active' ('unreadable' when malformed).
        run_phase:
          type: string
          enum: [checkin, running, paused, detached, terminal]
          default: detached
        best_accuracy: { type: [number, 'null'] }
        n_rounds: { type: integer, default: 0 }
        created_at: { type: string, default: '' }
        updated_at: { type: string, default: '' }
        human_intervened: { type: boolean, default: false }

    CyclesResponse:
      type: object
      required: [tenant_id, cycles]
      properties:
        tenant_id: { type: string }
        active_campaign_id:
          type: [string, 'null']
          description: |
            Active campaign per the RESOLVED store's own pointer: the active
            session at the top level, the inner loop running now when `descend`
            walked into a sandbox. Raw — check the pointed cycle's `run_phase`
            in `cycles[]` for liveness rather than assuming this is live.
        active_cycle_id:
          type: [string, 'null']
          description: Active cycle per the resolved store's own pointer (see active_campaign_id).
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/CycleListEntry'

    # ---- Per-kind command payloads (v0 closed set) ----
    # Each `*Payload` schema is the `payload` field of one command kind.
    # Naming matches the kind: `pause-cycle` -> `PauseCyclePayload`.

    CycleRef:
      type: object
      required: [campaign_id, cycle_id]
      additionalProperties: false
      description: |
        Reusable cycle reference. The trust-boundary identifier — every
        cycle-scoped command names its target by this pair (never by a
        cookie-derived pointer or an `active_session.json` lookup).
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Campaign id ({dataset}__{rand6_hex}). Deliberately UNPATTERNED, like every
            other id here: the shape is minted, not parsed, and a regex in this file is
            a second rule that can disagree with `CampaignPayload` — which is the half
            that actually refuses. Bounds live on the model.
        cycle_id:
          type: string
          minLength: 1
          maxLength: 128
          description: 'Content-addressed cycle id (`cycle_{target_hash[:12]}` + optional sibling suffix).'

    PauseCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              maxLength: 512
              description: |
                Why the pause was asked for, recorded on the `CommandRecord`. The
                CLI's `pause --reason` has always sent it; declaring it here is
                what makes the two entry points one contract.

    OriginGateDecisionPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [decision]
          additionalProperties: false
          properties:
            decision:
              type: string
              enum: [rescore, proceed, abort]
              description: |
                `rescore` re-scores the origin force-fresh and re-evaluates the
                gate; `proceed` overrides the gate into L1; `abort` ends the
                cycle with `StopReason.ORIGIN_GATE`.

    SkipSearchpointPayload:
      $ref: '#/components/schemas/CycleRef'

    SetSampleLookaheadPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [cells]
          additionalProperties: false
          properties:
            cells:
              type: integer
              minimum: 1
              description: >
                How many of one candidate's samples the walk may hold in flight. `1` disarms —
                one on-disk state for "never armed" and "cancelled", so the two cannot read
                alike. Recorded as sent and clamped by the walk to the backend's declared
                ceiling (`dashboard.json::max_cells_in_flight`), so a value above it arms the
                ceiling rather than being rejected. An arming also ends on its own — after the
                round that scores under it, or the group it released — so `1` is a cancel, not
                the normal way it ends.
            descend:
              type: string
              maxLength: 512
              description: >
                Inner-sandbox tail of the address, same grammar as the read side's `?descend=`
                (`campaign::cycle`, `~`-joined, the hops BELOW the root named by `campaign_id` /
                `cycle_id`). Absent addresses the root hop. The ONE command that takes it:
                throughput is what an inner run answers for itself, whereas a pause or a skip
                reaches an inner cycle by INHERITANCE from its owner, so widening the address
                for those would build a second channel that contradicts the first. Refused with
                422 on any other kind rather than ignored — a dropped address would apply the
                command to the outer cycle.

    StepCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            rounds:
              type: integer
              minimum: 1
              maximum: 100
              default: 1
              description: Rounds to advance before auto-pausing.

    RewindToRoundPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
              description: Target round number (inclusive); events past this round are dropped.

    ForkCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          required: [seed]
          properties:
            round:
              type: integer
              minimum: 0
              description: Round the searchpoint the operator steered from.
            candidate_id:
              type: string
              maxLength: 128
              description: |
                Candidate the operator steered from — the point the edits in
                `seed` are rooted on (`operator_steered`).
            steered_by:
              type: string
              maxLength: 256
              description: |
                Operator identity stamped into lineage as the human who steered
                this fork. Recorded, not gated — operators may act; we record it.
            keep_rounds:
              type: boolean
              default: false
              description: |
                Which of the two acts this fork is. `false` (default) is
                `operator_steered`: a clean offshoot branching from the origin,
                re-scoring the edited searchpoint, rounds numbered from 1. `true`
                is `operator_rewind` — rounds `0..round-1` are LIFTED from the
                parent and the fork continues at `round` under the seed's
                overrides. That is what an "apply this from here" press means, and
                the same act the terminal spells `resume --rewind N`. It refuses a
                seed carrying `origin_prompt_fields`: the lifted round 0 already
                IS the origin, so declaring a second one is contradictory.
            seed:
              $ref: '#/components/schemas/OperatorForkOverride'

    OperatorForkOverride:
      type: object
      additionalProperties: false
      description: |
        The edited-searchpoint origin override that makes a fork's origin =
        chosen searchpoint + operator edits. Required on every operator fork.
        Under `keep_rounds` the origin is the LIFTED round 0 instead, so only the
        override half of this applies and `origin_prompt_fields` is refused.
        Persisted to the fork's ledger as a read-once `CycleSeedRecord` (read at
        init) and onto the parent's `FORK_CUT` ledger record.
      properties:
        origin_prompt_fields:
          type: object
          additionalProperties: true
          description: |
            The fork's origin prompt — a `PromptTemplate.prompt_field_dict()`
            shape (the 8 prompt fields). Becomes the origin `OptSearchPoint` at
            init. `{}` inherits the parent's origin prompt.
        pipeline_overlay:
          type: object
          additionalProperties: true
          description: |
            `nodes.*.config` value overlay for this fork only, merged ON TOP of the
            dataset overlay (seed > dataset > backend default). The dataset
            `pipeline.yaml` stays immutable — the steer never mutates the origin.
            Param *locks* ride `optimizer_narrowing`, not this block.
        optimizer_narrowing:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            description: Per-node search-space narrowing (NodeSearchNarrowing).
            properties:
              param_keys:
                type: array
                nullable: true
                items:
                  type: string
                description: |
                  The tunable param subset (unlocked keys) the optimizer may mutate;
                  `null` inherits the full declared set. Keys absent here are locked.
              param_allowed_values:
                type: object
                additionalProperties:
                  type: array
                  items: {}
                description: Per-param allowed-value subset (enum narrowing).
          description: |
            Per-fork search-space lock edits keyed by node name — overrides the
            campaign's mint-time `optimizer_narrowing` for THIS cycle only (the
            cycle-level peer of `CampaignConfig.optimizer_narrowing`). Absent
            inherits the campaign-wide locks unchanged.
        config_overrides:
          $ref: '#/components/schemas/ConfigOverrides'

    ConfigOverrides:
      type: object
      additionalProperties: false
      description: |
        The fork's campaign-config delta. Every field optional — absent
        inherits the parent's value; applied to the fork's snapshot at init,
        never mutates the parent's frozen config. Four kinds of knob ride here:
        (1) run limits (`max_rounds`/`spend_budget_usd`/`token_budget`/patiences/
        `pobb_epsilon`) — ABSOLUTE values the reconcile dialog re-sets (defaults to
        the parent's remaining, e.g. "3 of 6 rounds left"); (2) the selection-policy
        toggle (`per_round_resubset`) → the nested
        `mechanisms.selection`; (3) the search-space policy toggle
        (`schema_field_rename`); (4) the composite criterion (`scoring`), which
        sits on `CampaignConfig` itself rather than under `optimization`. Every
        policy knob invalidates search comparability, so a fork-at-offset-0 is how
        you A/B one without touching the global default or the parent cycle.
      properties:
        max_rounds:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Absolute L1-round ceiling for the fork. `0` measures the origin and stops.
        spend_budget_usd:
          type: number
          minimum: 0
          nullable: true
          description: Absolute spend cap (USD) for the fork; `null` lifts the cap.
        token_budget:
          type: integer
          minimum: 0
          nullable: true
          description: Absolute cumulative-token cap for the fork; `null` lifts the cap.
        l1_patience:
          type: integer
          minimum: 1
          description: Consecutive non-improving L1 rounds before escalation.
        l2_patience:
          type: integer
          minimum: 1
          nullable: true
          description: L2 stall tolerance; `null` disables the L2 gate.
        l3_patience:
          type: integer
          minimum: 1
          nullable: true
          description: L3 stall tolerance; `null` disables the L3 gate.
        pobb_epsilon:
          type: number
          minimum: 0
          maximum: 1
          description: Per-candidate P(best) elimination threshold.
        scoring:
          oneOf:
            - type: string
            - type: object
              additionalProperties: { type: string }
          nullable: true
          description: |
            The composite-fitness criterion (`CampaignConfig.scoring`) — a formula
            string, or the per-node map. The ONE override a what-if can preview
            against the record: a lens re-elects every round from rows already
            measured, so the round the preview parts at is the round a
            `keep_rounds` fork carrying this is minted at. Every other field here
            moves a ceiling or a patience count, which no measurement can be
            re-read under, so those forks preview nothing.
        per_round_resubset:
          type: boolean
          nullable: true
          description: |
            Re-pick the most-informative scoring subset every round (adaptive
            Rasch selection) for this fork. `null` inherits the parent. Safe to
            A/B now that every cross-round comparator measures on one fixed θ ruler.
        schema_field_rename:
          type: boolean
          nullable: true
          description: |
            Let this fork's L1 rename a field on the inner `l1_generate`'s output
            schema, not merely re-describe it. `null` inherits the parent (locked by
            default: `build_l1_response_schema` never declares the rename param, so the
            LLM cannot emit a key the schema omits). Only meaningful on a campaign
            that optimizes an optimizer (`promptpotter-self`). An L2/L3
            `fork_proposal` can request this same unlock autonomously.

    DeleteCyclePayload:
      $ref: '#/components/schemas/CycleRef'

    CleanupEmptyCyclesPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          description: |
            `cycle_id` here names any cycle in the family; the dispatcher
            resolves it to its root and sweeps every empty stub under that
            root (matching `cleanup_empty_stubs` semantics).

    # The three operator-set launch ceilings. Written out on BOTH payloads rather than $ref'd as
    # one branch: `additionalProperties: false` only sees `properties` in its own schema object,
    # so folding these in via `allOf` would close the payload against the very fields it declares.
    # One validator serves both (`commands.py::_run_limits`) — keep the two copies identical.
    MintCampaignPayload:
      type: object
      required: [dataset_name]
      additionalProperties: false
      properties:
        halt_at_accuracy:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Stop once the best measured accuracy reaches this. Omitted leaves the
            campaign's configured value. Must be FINITE — `NaN` satisfies a
            `minimum`/`maximum` pair and then never compares true, so a halt that
            can never fire looks identical to no halt at all.
        spend_budget_usd:
          type: number
          minimum: 0
          description: |
            USD ceiling for this run, composed as a `min` against what the host
            wallet admits (ADR-0003 § D1) — a request may lower a ceiling, never
            raise one. Must be FINITE, for the reason above: the `BudgetGate`
            probe is `spent >= cap`.
        token_budget:
          type: integer
          minimum: 0
          description: |
            Cumulative-token ceiling (optimizer + backend, input + output), the
            model-portable twin of `spend_budget_usd` and the one that still binds
            when a model has no rate on file. Whichever ceiling is met first halts
            the cycle.
        dataset_name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Dataset under `datasets/{dataset_name}/` to mint a campaign for.
            No `pattern`: `MintCampaignPayload` refuses to carry one so that the slug
            ingest mints off a filename stays the ONE rule, and a copy here was that
            second rule.
            Campaign-from-origin (reuse a chosen prior origin) rides the DRAFT
            path instead — `POST /origins/{origin_id}/draft` prefills a check-in
            with the origin's exact prompt fields, then `start-checkin` seeds C0
            (`campaign_origin` lineage). This verb mints the dataset's own
            authored origin only.

    StartRunPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [kind]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [new, resume]
              description: |
                `new` re-mints root state (stub cycle only). `resume` attaches
                to the cycle's current ledger tail. Matches CLI `new` /
                `resume` verbs hoisted onto the wire surface.
            halt_at_accuracy:
              type: number
              minimum: 0
              maximum: 1
              description: |
                Stop once the best measured accuracy reaches this. Omitted leaves
                the campaign's configured value. Must be FINITE — `NaN` satisfies a
                `minimum`/`maximum` pair and then never compares true.
            spend_budget_usd:
              type: number
              minimum: 0
              description: |
                USD ceiling for this run, composed as a `min` against what the host
                wallet admits (ADR-0003 § D1) — a request may lower a ceiling, never
                raise one. Must be FINITE: the `BudgetGate` probe is `spent >= cap`.
            token_budget:
              type: integer
              minimum: 0
              description: |
                Cumulative-token ceiling (optimizer + backend, input + output), the
                model-portable twin of `spend_budget_usd` and the one that still binds
                when a model has no rate on file. Whichever ceiling is met first halts
                the cycle. The CLI's `--token-budget`, hoisted onto the wire.

    ChangeSpendBudgetPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          anyOf:
            - required: [max_usd]
            - required: [max_tokens]
          description: |
            At least one of `max_usd` / `max_tokens` must be present — expressed as
            `anyOf`, because the `minProperties: 1` this carried was satisfied by
            `campaign_id` alone and so asserted nothing (the handler enforced the
            real rule by itself). A field that is omitted leaves that ceiling
            unchanged; the applier composes against the RUNNING JOB's pair, not the
            file's, and writes both homes from it. Whichever ceiling is met first
            halts the cycle.
          properties:
            max_usd:
              type: number
              minimum: 0
              description: |
                New USD spend cap for the cycle. Setting `0` halts the
                cycle at the next checkpoint; raising above current spend
                releases the halt.
            max_tokens:
              type: integer
              minimum: 0
              description: |
                New cumulative-token cap (optimizer + backend, input + output)
                for the cycle. Setting `0` halts at the next checkpoint; raising
                above current usage releases the halt. The model-portable twin of
                `max_usd` — counts free-backend work the USD ceiling misses.

    ChangePipelineParamPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [node, param, value]
          additionalProperties: false
          properties:
            node:
              type: string
              minLength: 1
              maxLength: 64
              description: 'Node name in the backend pipeline (key under `nodes.{name}` overlay).'
            param:
              type: string
              minLength: 1
              maxLength: 64
              description: 'Param key within the node config (e.g. `model`, `temperature`).'
            value:
              description: |
                New value. Type is per-param — string for `model`, number for
                `temperature`, etc. Validated against the schema PromptPotter
                discovers via `GET /pipeline` (zero backend-specific constants).
              oneOf:
                - { type: string }
                - { type: number }
                - { type: integer }
                - { type: boolean }
                - { type: 'null' }

    RegisterBackendPayload:
      type: object
      required: [name, backend_type, base_url]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Human-readable backend name.
        backend_type:
          type: string
          minLength: 1
          maxLength: 64
          description: Backend connector type (e.g. `termnorm`, `promptpotter`).
        base_url:
          type: string
          format: uri
          description: Backend API base URL (trailing slash stripped server-side).
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]*$'
          description: 'Custom backend id; auto-derived from `name` when omitted.'


    # ---- Forward-scope payloads (beyond v0; same closed-set policy) ----

    CampaignRef:
      type: object
      required: [campaign_id]
      additionalProperties: false
      description: |
        Workspace-scoped reference (campaign-level, no cycle). Lifecycle
        commands ride the campaign's root cycle ledger; the dispatcher
        resolves ``campaign_id -> root_cycle_id`` from ``campaign.json``.
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Campaign id ({dataset}__{rand6_hex}). Unpatterned for the same reason as
            `CycleRef.campaign_id`: `CampaignPayload` is the half that refuses, and it
            carries bounds only.

    CampaignLifecyclePayload:
      allOf:
        - $ref: '#/components/schemas/CampaignRef'
        - type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              maxLength: 512
              description: |
                Optional operator-supplied reason for the lifecycle
                transition. Stored on ``campaign.json::lifecycle_reason``;
                empty string is the unset form.
            keep_results:
              type: boolean
              default: false
              description: |
                ``delete-campaign`` only (ignored by archive / unarchive).
                When ``true`` the destructive delete spares the keepsake tier
                (manifest + reports + the shallow ``langfuse/{traces,observations,
                scores}`` loop trace) and drops only the heavy resume / audit /
                mirror tiers. When ``false`` (default) the whole campaign tree is
                removed. The cross-campaign measurement cache is never touched
                either way.

    ArchiveCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 512
              description: 'Operator-supplied reason; stored on the archive marker for audit.'

    ChangeHaltBudgetPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [max_rounds]
          additionalProperties: false
          properties:
            max_rounds:
              type: integer
              minimum: 0
              description: |
                New round cap. Setting `0` halts the cycle at the next
                checkpoint; raising above current round count releases.

    ChangeSampleBudgetPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [sp_budget_ttest]
          additionalProperties: false
          properties:
            sp_budget_ttest:
              type: integer
              minimum: 1
              description: |
                Per-round PoBB sample budget (the adaptive queue narrows the
                scoring bank to this many samples each round via
                `select_round_subset`). Lower = cheaper rounds, weaker signal.

    ResetPipelineOverlayPayload:
      $ref: '#/components/schemas/CycleRef'

    ChangeScoringCompositePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [composite]
          additionalProperties: false
          properties:
            composite:
              type: object
              additionalProperties: true
              description: |
                The `scoring` block as it would be written to `campaign.json`.
                Validated server-side against ScoringContext; reject as 422
                `payload_invalid` when the composite references unknown
                evaluator ids.

    SetAllowedModelsPayload:
      allOf:
        - $ref: '#/components/schemas/CampaignRef'
        - type: object
          required: [allowed_models]
          additionalProperties: false
          properties:
            allowed_models:
              type: array
              items: { type: string }
              description: |
                The full sanctioned model list, replacing the campaign's set wholesale.
                Empty clears it (restrictive default). A human fork steered to a listed
                model is clean; to an unlisted one, babysat (grade C).

    SetCampaignLabelPayload:
      allOf:
        - $ref: '#/components/schemas/CampaignRef'
        - type: object
          required: [label]
          additionalProperties: false
          properties:
            label:
              type: string
              maxLength: 200
              description: |
                The operator's name for this campaign, replacing any previous one and
                trimmed of surrounding whitespace. Empty restores the dataset-name
                fallback. Display only — nothing addresses a campaign by it.

    MarkHardSamplePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [sample_id]
          additionalProperties: false
          properties:
            sample_id:
              type: string
              minLength: 1
              maxLength: 128
              description: 'Dataset-local sample id (`datasets/{name}/dataset.json` row id).'

    UnmarkHardSamplePayload:
      $ref: '#/components/schemas/MarkHardSamplePayload'

    AnnotateRoundPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round, note]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
              description: Round number the note is attached to.
            note:
              type: string
              minLength: 1
              maxLength: 4000
              description: Free-form operator note; stored verbatim in `round_NNNN.json::operator_notes`.

    EndorseCandidatePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round, candidate_id, verdict]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
            candidate_id:
              type: string
              minLength: 1
              maxLength: 128
            verdict:
              type: string
              enum: [endorsed, rejected]
              description: |
                Operator verdict. Stored on the round's audit trail; L2/L3
                may consume in later profiles (no behavior change in v0).

    OptimizerLocks:
      type: object
      additionalProperties: false
      required: [pipeline, forbidden_axes, nodes]
      description: |
        Connector-derived permission surface — what the optimizer is allowed to
        permute on this draft. Boundary-added by
        `launcher/draft_build.py::draft_wire_with_locks` (via
        `derive_optimizer_locks`) onto EVERY draft-returning response, so it is
        required, not optional. The UI renders a ladder value absent from
        `param_allowed_values` as crossed-out.
      properties:
        pipeline:
          type: array
          items: { type: string }
          description: Connector default pipeline step list, e.g. `["llm_only"]`.
        forbidden_axes:
          type: array
          items: { type: string }
          description: |
            Params the optimizer may never permute on any node
            (`["model","provider"]`) — always locked. Mirrors `PARAM_FORBIDDEN_KEYS`.
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OptimizerNodeLocks'

    OptimizerNodeLocks:
      type: object
      additionalProperties: false
      required: [config, param_allowed_values]
      properties:
        config:
          type: object
          additionalProperties: true
          description: |
            Effective per-node config floor (connector seed + overlay) — the
            active value of each control, e.g.
            `{ reasoning_effort: "low", temperature: 0 }`.
        param_allowed_values:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: Closed set the optimizer may permute per param.

    OptimizationOverrides:
      type: object
      additionalProperties: false
      description: |
        The campaign-config knobs a draft carries, as one object — materialized
        into the committed `campaign.yaml::optimization` block. Operator-facing
        (UI) vocabulary. Sent whole on `DraftCampaign`; on the edit patch any
        subset is shallow-merged onto the current value (a new knob is one property
        here, not a fresh field threaded through every surface).
      properties:
        max_rounds:
          type: integer
          minimum: 0
          maximum: 100
          default: 5
          description: |
            Round ceiling; `0` measures the origin and stops. Smart-default `5`
            (matches the M10 prompt-iteration
            framework default). Operator-editable.
        prompt_block_catalogue:
          type: string
          enum: [guidance, restrict, off]
          default: guidance
          description: |
            How the reusable prompt building-block library reaches the optimizer:
            `guidance` (suggest blocks, L1 may still invent), `restrict` (library
            values only — an off-library value fails `L1_PROMPT_BLOCKS_IN_LIBRARY`
            and rides the existing forbidden-value wound), `off` (render empty;
            prompt bit-for-bit identical to a no-library ablation).
        mechanisms:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: boolean
          description: |
            Pluggable orchestration mechanism toggles
            (`optimization.mechanisms` — sorting/selection + early-abort groups).
            Nested `{group: {toggle: bool}}`; seeded with stock defaults,
            operator-editable in the new-campaign form, materialized verbatim into
            the committed `campaign.json`. Self-describing schema served by
            `GET /campaigns/mechanisms-schema`.

    DraftCampaign:
      type: object
      required:
        - draft_id
        - slug
        - sample_preview
        - n_samples
        - connector
        - scoring_composite
        - optimization_overrides
        - raw_task_description
        - pipeline_overlay
        - headers
        - column_query
        - column_ground_truth
        - field_provenance
        - origin_prompt_fields
        - readiness
        - created_at
        - updated_at
      additionalProperties: false
      description: |
        Server-held canonical state for an in-progress check-in campaign. Mutated
        by both the chat surface and the parameter panel (both ride
        `POST /commands/{kind}`) until the operator starts it via
        `/commands/start-checkin`. The `draft_id` IS the owning `campaign_id`;
        identity scope rides the tenant prefix, so the draft never carries a
        per-record `tenant_id` on the wire (see ADR-0002 no-drift gate #3).
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            The owning check-in `campaign_id` (the draft is re-keyed to it at
            `create_checkin_campaign`). Mutation + Start verbs key on this value.
        slug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9_-]*$'
          description: |
            Tentative dataset directory name under
            `projects/{tenant}/datasets/{slug}/` after commit. `SafeName`-validated.
        sample_preview:
          type: array
          minItems: 0
          maxItems: 10
          description: |
            First 10 parsed rows; read-only. Projected to the `{query,
            ground_truth}` wire shape using the resolved `column_query` /
            `column_ground_truth` mapping (the internal bank stays keyed by raw
            headers). Both fields are blank until the columns are confirmed.
          items:
            type: object
            required: [query, ground_truth]
            additionalProperties: false
            properties:
              query: { type: string }
              ground_truth: { type: string }
        n_samples:
          type: integer
          minimum: 0
          description: Total parsed row count (preview is a head; this is the bank size).
        connector:
          type: string
          minLength: 1
          maxLength: 64
          default: termnorm
          description: |
            Smart-default `termnorm` (only registered connector today, per
            root CLAUDE.md). Operator-editable via panel or chat.
        scoring_composite:
          type: string
          minLength: 1
          maxLength: 64
          default: exact_match
          description: |
            Smart-default `exact_match` (only universally-applicable scorer
            for `(query, ground_truth)`). Operator-editable.
        optimization_overrides:
          allOf:
            - $ref: '#/components/schemas/OptimizationOverrides'
          description: |
            The campaign-config knobs (round ceiling, model lock, mechanism
            toggles) as one object. Seeded with stock defaults; operator-editable
            in the new-campaign form. Materialized into `campaign.yaml::optimization`
            at commit.
        raw_task_description:
          type: string
          maxLength: 16384
          description: Free-form framing; chat negotiates content. Empty string on first ingest.
        pipeline_overlay:
          type: object
          additionalProperties: true
          description: |
            Initial `nodes.*.config` overlay for the future `pipeline.json`.
            Empty `{}` on first ingest; the operator (or chat) populates per-node
            model / `reasoning_effort` from
            `docs/operations/dataset-reasoning-matrix.md` before commit.
        headers:
          type: array
          items: { type: string }
          description: |
            The uploaded file's column headers, in order. The operator (or,
            once it lands, the origin resolver) maps two of these to
            `column_query` / `column_ground_truth`.
        column_query:
          type: string
          maxLength: 256
          description: |
            Which uploaded header carries the input string. Empty until
            resolved. Auto-confirmed on ingest only when a header is literally
            named `query`; otherwise the operator picks one via
            `edit-draft-campaign`. Must be a member of `headers` to mint.
        column_ground_truth:
          type: string
          maxLength: 256
          description: |
            Which uploaded header carries the target string. Same resolution
            rules as `column_query` (literal `ground_truth` auto-confirms).
        field_provenance:
          type: object
          additionalProperties:
            type: string
            enum: [unset, proposed, confirmed]
          description: |
            Per-field provenance for the origin-readiness checklist. Keys are the
            checklist field ids — only the genuinely-stated fields: the column
            mapping (`column.query`, `column.ground_truth`) and `task_description`.
            Values are `unset` (no value), `proposed` (an inference awaiting
            confirmation), or `confirmed` (operator-stated or auto-confirmed).
            `task_description` lands `unset` (no default framing); a column
            auto-confirms only on a literal `query` / `ground_truth` header.
            Config knobs carry a default and are not gated, so they get no entry.
            No field reaches mint while `unset` or `proposed`. The deterministic
            checklist gates; see `docs/specs/roadmap.md`.
        origin_prompt_fields:
          type: object
          additionalProperties: true
          description: |
            The campaign's origin prompt — a `PromptTemplate.prompt_field_dict()`
            shape (the six string fields + optional `few_shot_examples`). Seeded
            by the check-in node's decomposition, or from an authored dataset's
            prompt on the derived-draft path; operator-editable before commit and
            written verbatim to `prompts/default.json` at mint. `{}` until the
            check-in fills it (the commit then floors on `raw_task_description`).
        candidate_library_size:
          type: integer
          minimum: 0
          default: 0
          description: |
            Entry count of the dropped candidate library (0 = none yet). The full
            list isn't sent — a library can run to tens of thousands of entries.
            Populated via `POST /datasets/draft/candidate-library`; committed to
            `{slug}/candidate_library.txt`.
        allowed_models:
          type: array
          items: { type: string }
          default: []
          description: |
            The origin's sanctioned inner-optimizer model allow-list, ticked in the
            check-in pipeline setup. Materializes to `campaign.json::config.allowed_models`
            (a top-level CampaignConfig field). Empty = nothing sanctioned = restrictive
            default: any human fork that steers the model taints the branch grade C
            (`overlay_sets_model_outside_allowed`); a steer to a listed model is clean.
        dependencies:
          type: array
          description: |
            The active pipeline's required inputs beyond (pipeline + dataset +
            origin), derived from its node types. Boundary-added (needs the
            connector's node-type map). Each entry is a `PipelineDependency` plus a
            `fulfilled` flag. Today one kind — `candidate_library`, raised by a
            `candidate_source` node. Soft: an unfulfilled dependency does NOT block
            mint; it's surfaced so the operator drops the missing input in place.
          items:
            type: object
            required: [kind, node, title, hint, fulfilled]
            additionalProperties: false
            properties:
              kind: { type: string, description: 'Dependency family, e.g. `candidate_library`.' }
              node: { type: string, description: 'The node that raised it.' }
              title: { type: string }
              hint: { type: string, description: 'How to fulfil it (operator-facing).' }
              fulfilled: { type: boolean }
        readiness:
          type: object
          required: [complete, gaps]
          additionalProperties: false
          description: |
            Server-authoritative mint-gate verdict — the full `origin_readiness`
            checklist (columns, task framing, node models; no individual prompt
            field is gated), recomputed on every draft response. The UI gates Start on
            this and renders `gaps`; the client never re-derives the gate. Same
            shape the `422 origin_incomplete` error carries in `details.gaps`.
          properties:
            complete:
              type: boolean
              description: True iff no field still blocks mint.
            gaps:
              type: array
              items:
                type: object
                required: [field, reason, hint]
                additionalProperties: false
                properties:
                  field: { type: string }
                  reason: { type: string, enum: [unset, proposed_unconfirmed] }
                  hint: { type: string }
              description: Each field still blocking mint, with an operator-facing hint.
        pipeline_view:
          type: [object, 'null']
          additionalProperties: true
          description: |
            The draft's parsed pipeline render — the graph `view` (nodes + edges)
            the ingest node editor draws. Boundary-added (the same parse
            `GET /datasets/{name}/pipeline` runs for a committed dataset), but
            computed from the draft so a pre-commit check-in — which has no
            `datasets/{slug}/` dir to fetch — still renders its node editor instead
            of hanging on "Loading node…". Null when the pipeline declares no view.
        node_config_schema:
          type: object
          additionalProperties: true
          description: |
            Every param each node carries, keyed by node id — COMPLETE, because
            clients sum `optimizer_tunable` across it to answer "is this node
            optimizer-locked". An EMPTY list is a different answer from "has
            params, none tunable" — the node carries nothing to change at all —
            and `[].every()` collapses the two, so test length before the sum.
            Each param's `kind` names the surface that owns it:
            the five widget kinds (`model`/`enum`/`number`/`bool`/`string`) are
            config-editor rows; `prompt` (a PromptTemplate decomposition field) and
            `nested` (object/array) are listed but carry no widget, and a `prompt`
            param carries no value — the prose lives in `prompts/{node}.json`.
            Boundary-added beside `pipeline_view`, same draft-derived parse.
        node_output_schema:
          type: object
          additionalProperties: true
          description: |
            Per-node structured-output contract (read-only), keyed by node id;
            null per node when it declares none. Boundary-added beside
            `pipeline_view`.
        optimizer_locks:
          $ref: '#/components/schemas/OptimizerLocks'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResolveOriginPayload:
      type: object
      required: [draft_id]
      additionalProperties: false
      description: |
        One resolver turn against an existing `DraftCampaign`. Tenant-scoped —
        a `draft_id` resolving to a different `IdentityContext.tenant_id`
        returns 404 (existence-leak gate).

        `message` is what the operator just said ("the ground truth is the
        `answer` column"). It is distinct from the draft's
        `raw_task_description`, which is the *task framing field* the resolver
        may propose and the operator confirms — conflating the two meant a
        correction could only be delivered by overwriting the framing. The
        message is turn-scoped: it rides the `CommandRecord` payload as the
        operator's verbatim contribution to the thread, and is not persisted
        onto the draft.
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 128
          description: The check-in `campaign_id` (the draft's `draft_id`), from `/datasets/ingest`.
        message:
          type: string
          maxLength: 4000
          description: The operator's turn. Omitted or empty on an unprompted turn.

    ActiveSessionResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, session_id, campaign_id, cycle_id]
      description: |
        What is running for this tenant. All three ids are null together while no
        session is active — that state is served on a 200, never a 404.
      properties:
        tenant_id:
          type: string
          description: Tenant the pointer belongs to — the caller's own, always known.
        session_id:
          type: [string, 'null']
          description: Active session id; null when no session is active.
        campaign_id:
          type: [string, 'null']
          description: Active campaign id (pinned by the webapp); null when no session is active.
        cycle_id:
          type: [string, 'null']
          description: Active cycle id within the campaign; null when no session is active.

    MachineHolder:
      type: object
      additionalProperties: false
      required: [user, campaign_id, cycle_id]
      description: |
        Who holds the single machine run slot. Cross-user holder info is
        intentionally exposed — the operator needs to know *someone* is running,
        and this deployment is an allowlisted beta.
      properties:
        user:
          type: string
          description: "`user_id` of the operator whose run owns the slot."
        campaign_id: { type: string }
        cycle_id: { type: string }
        started_at:
          type: [string, 'null']
          format: date-time
          description: ISO start time of the holding run; null if still pending.

    MachineStatusResponse:
      type: object
      additionalProperties: false
      required: [busy]
      properties:
        busy:
          type: boolean
          description: |
            True iff a *different* user holds a running job (the server runs one
            campaign at a time).
        holder:
          oneOf:
            - $ref: '#/components/schemas/MachineHolder'
            - type: 'null'
          description: Who holds the slot; null when free for this caller.

    RaisedCommand:
      type: object
      additionalProperties: false
      required: [kind, payload, evidence]
      description: |
        A pre-shaped command the copilot offers the operator as a button. The
        resolver proposes a FIELD; code derives the command — which is why the
        resolver never has to name one. Surfaced on `OriginResolution.raised`
        and on the `GET /campaigns/{campaign_id}/checkin` response.

        Every command here is awaiting a click: a high-confidence finding is
        auto-confirmed (CONFIRMED) inside the resolver turn and never raised, so
        the model's `confidence` is a server-side policy input, not a wire field.
      properties:
        kind:
          type: string
          enum: [edit-draft-campaign]
        payload:
          $ref: '#/components/schemas/EditDraftCampaignPayload'
        evidence:
          type: string
          description: The citation backing the proposal. A finding citing no evidence is rejected.

    OriginResolution:
      type: object
      required: [complete, provenance, values, gaps]
      additionalProperties: true
      description: |
        The draft's checklist state after a resolver turn, mirroring the
        on-disk `cache.json::resolution` block. `last_resolution` carries the
        resolver's own output (assessment + evidence-cited findings +
        next_action + recap) for the panel and the AI.
      properties:
        raised:
          type: array
          items: { $ref: '#/components/schemas/RaisedCommand' }
          description: Proposals from the last turn the operator has not yet actioned.
        complete:
          type: boolean
          description: True iff no field still blocks mint (the deterministic gate's verdict).
        provenance:
          type: object
          additionalProperties:
            type: string
            enum: [unset, proposed, confirmed]
          description: Per-field provenance for every closed-set checklist field.
        values:
          type: object
          additionalProperties: true
          description: Current value of every closed-set field, keyed by checklist field id.
        gaps:
          type: array
          items:
            type: object
            required: [field, reason, hint]
            additionalProperties: false
            properties:
              field: { type: string }
              reason: { type: string, enum: [unset, proposed_unconfirmed] }
              hint: { type: string }
          description: Each field still blocking mint, with an operator-facing hint.
        last_resolution:
          type: object
          additionalProperties: true
          description: |
            The resolver turn's own output — `assessment`, `next_action`
            (`{kind, questions}` where each question is
            `{field, prompt, options}` — `field` names the checklist gap the
            answer resolves so the panel applies it as a confirmed patch), and
            `recap` (set only on a `ready` turn). The turn's findings are NOT
            mirrored here: they ride `raised` above as clickable commands.
        degraded_cause:
          type: string
          description: |
            Present only when the resolver turn came back thin — the check-in model
            returned an empty/truncated response that forced a paid repair retry.
            One cause, no grade: a turn that produced nothing usable raises instead
            (502 `resolver_failed`), so every value that reaches a client means the
            same thing. The check-in panel warns + offers a re-run on it rather than
            minting a thin origin.

    ResolveOriginResponse:
      type: object
      required: [resolution, draft]
      additionalProperties: false
      description: One resolver turn's outcome — the resolution block + the post-apply draft.
      properties:
        resolution:
          $ref: '#/components/schemas/OriginResolution'
        draft:
          $ref: '#/components/schemas/DraftCampaign'

    EditDraftCampaignPayload:
      type: object
      required: [draft_id, patch]
      additionalProperties: false
      description: |
        Sparse mutation of an existing `DraftCampaign`. Only declared fields
        in `patch` are accepted; omitted fields are unchanged. Tenant-scoped
        — the dispatcher rejects `draft_id`s that resolve to a different
        `IdentityContext.tenant_id` with 404 (existence-leak gate).
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 128
          description: The check-in `campaign_id` (the draft's `draft_id`), from `/datasets/ingest`.
        patch:
          type: object
          additionalProperties: false
          description: |
            Sparse subset of mutable `DraftCampaign` fields. Slug edits run
            the same collision check as ingest (409 on conflict).
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 64
              # Verbatim from `_EditDraftPatch.slug`, which enforces it. The copy here
              # admitted a leading digit the model refuses.
              pattern: '^[a-z][a-z0-9_-]*$'
            connector:
              type: string
              minLength: 1
              maxLength: 64
            scoring_composite:
              type: string
              minLength: 1
              maxLength: 64
            optimization_overrides:
              allOf:
                - $ref: '#/components/schemas/OptimizationOverrides'
              description: |
                The campaign-config knobs (`max_rounds` / `mechanisms`). The sent
                keys are shallow-merged onto the draft's
                current overrides — send one knob or several; a nested `mechanisms`
                replaces wholesale. Validated against `OptimizationOverrides`
                server-side (rejects unknown keys / out-of-range `max_rounds`).
            raw_task_description:
              type: string
              maxLength: 16384
              description: |
                Sets the task framing. An operator edit CONFIRMS it, opening the
                origin-readiness gate for the field (checklist id `task_description`).
            pipeline_overlay:
              type: object
              additionalProperties: true
              description: 'Replaces (not deep-merges) the prior `nodes.*.config` overlay.'
            column_query:
              type: string
              maxLength: 256
              description: |
                Confirm which uploaded header is the input column. Must be a
                member of the draft's `headers` (422 otherwise). Setting it
                moves `field_provenance["column.query"]` to `confirmed`.
            column_ground_truth:
              type: string
              maxLength: 256
              description: |
                Confirm which uploaded header is the target column. Same
                membership rule; moves `field_provenance["column.ground_truth"]`
                to `confirmed`.
            origin_prompt_fields:
              type: object
              additionalProperties: true
              description: |
                Replaces (not deep-merges) the draft's origin prompt — the editor
                sends the full `PromptTemplate.prompt_field_dict()` object.
            pipeline_steps:
              type: array
              items: { type: string }
              description: |
                The active pipeline step list (`["llm_only"]` vs the full
                cache_lookup→…→token_matching). The setup-panel mode toggle writes it.
            candidate_library:
              type: array
              minItems: 1
              items: { type: string }
              description: |
                The origin's target library. `POST /datasets/draft/candidate-library`
                and its `/from-column` sibling derive this value from an upload or a
                column and dispatch it as this patch — they are alternate ingresses
                for `edit-draft-campaign`, not separate write paths.
            allowed_models:
              type: array
              items: { type: string }
              description: |
                The origin's sanctioned model allow-list (ticked in the check-in
                pipeline setup). Replaces the draft's set wholesale; an empty list
                clears it (restrictive default). Materializes to
                `campaign.json::config.allowed_models`.

    StartCheckinPayload:
      type: object
      required: [campaign_id]
      additionalProperties: false
      description: |
        Start-verb payload — no field overrides at Start; the durable check-in
        draft is the canonical source of truth. Tenant-scoped; 404 on a
        cross-tenant `campaign_id` (or one with no check-in working state).
      properties:
        campaign_id:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            The check-in campaign id (the draft's `draft_id` IS this id — re-keyed
            at `create_checkin_campaign`), returned by `/datasets/ingest`.

    StartCheckinResponse:
      type: object
      required: [campaign_id, cycle_id, job_id]
      additionalProperties: false
      description: |
        Canonical mint response, returned synchronously through the commit +
        runner spawn. Background progress then rides the ledger + `dashboard.json`.
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z0-9][a-z0-9_-]*$'
          description: 'The started campaign id ({slug}__{rand6_hex}).'
        cycle_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^cycle_[0-9a-z_]+$'
          description: |
            Root cycle id. A check-in keeps its provisional `cycle_chk_{rand}` id
            as the permanent root (option 2b — drift reads `root_content_hash`,
            not the parsed id).
        job_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            JobRegistry handle for the runner spawned against the new
            campaign. Clients use this to subscribe to the SSE stream.

    ReplaceDatasetPayload:
      type: object
      required: [slug]
      additionalProperties: false
      description: |
        Names the committed dataset whose data is being superseded. The new
        data is NOT carried here — it is re-ingested under the freed name in a
        separate `/datasets/ingest` call after this returns.
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The colliding dataset name to version-and-repoint away. Unpatterned:
            `ReplaceDatasetPayload` carries bounds only, and the one slug regex that
            does exist lives on `_EditDraftPatch.slug`.

    ReplaceDatasetResponse:
      type: object
      required: [slug]
      additionalProperties: false
      description: |
        Outcome of one version-and-repoint migration. A bare acknowledgement: the
        archival name and the repointed/re-stamped counts are recorded by the
        migration itself (log line + on-disk marker), not read back off the wire.
      properties:
        slug:
          type: string
          description: The name that was freed (the request's `slug`).

    DatasetIndexEntry:
      type: object
      required: [slug, tier, n_samples]
      additionalProperties: false
      description: |
        One entry in the `GET /datasets` response (endpoint declaration
        deferred to the read-surface PR — pinned here so the wire shape is
        fixed before the read handler lands). Flat list with a `tier`
        discriminator; no two-section UI.
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9_-]*$'
          description: |
            Dataset directory name. For `tier: "yours"` this is the
            tenant-scoped slug under `projects/{tenant}/datasets/{slug}/`.
            For `tier: "install"` this is the repo-root `datasets/{slug}/`
            name (e.g. `aime_2025`, `bbeh`).
        tier:
          type: string
          enum: [yours, install]
          description: |
            `"yours"` — user-owned Origin under `projects/{tenant}/datasets/`.
            `"install"` — content shipping with the product at `datasets/{slug}/`
            (benchmarks, demos, `promptpotter-self`). Tracked in git, so readable
            by anyone using the install; no capability gates it. A `"yours"` slug
            shadows an `"install"` one of the same name.
        n_samples:
          type: integer
          minimum: 0
          description: Sample bank size (from `cache.json`).
        task_description:
          type: string
          maxLength: 16384
          description: First line of `task_description.md`; UI list preview.

  responses:
    CommandAccepted:
      description: |
        Command appended to the canonical ledger as a `CommandRecord`. The
        runner will apply it asynchronously and emit a `CommandAckRecord`
        observable via the SSE channel; clients MUST NOT treat this 202 as
        confirmation that the mutation has been applied (no client-side
        optimistic mutations — security checkbox #17).
      headers:
        Idempotency-Key:
          description: Echo of the request's `Idempotency-Key`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandAcceptedBody'

    VersionConflict:
      description: |
        `Expected-Version` did not match the cycle's current ledger offset.
        Client SHOULD refresh state from the SSE snapshot and retry with
        the new version. Returned with 409 status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    IdempotencyKeyMissing:
      description: Request omitted the mandatory `Idempotency-Key` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    CapabilityDenied:
      description: |
        Authenticated identity lacks the capability required for this
        command kind. Returned with 403 status. At Profile B (auth-off),
        the Stage-0 default identity has all capabilities granted; this
        response begins to fire at Profile C with real OIDC subjects.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    PayloadInvalid:
      description: |
        Command body failed schema validation for the declared kind.
        Returned with 422 status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    CommandTargetNotFound:
      description: |
        The command names a target (campaign, cycle, backend) that either
        does not exist or belongs to a different identity. Existence-leak
        gate: 404, not 403. Shape pinned in
        `docs/operations/persistence-and-state.md` § Beta hosting state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    BackendUnreachable:
      description: |
        Configured backend (TermNorm or another `Connector`) did not respond
        to the dispatcher's preflight probe. The operator-facing fix is
        "start the backend and retry"; the dispatcher does not retry
        internally. `details.backend_type` + `details.backend_url` identify
        which backend failed so the frontend can render a specific message.
        Returned with 503 status. Sole source: `Connector.preflight(...)`
        invoked from `CommandDispatcher` before any applier runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: pp_session
      description: |
        Opaque server-side session id (NOT a JWT). Issued by the OIDC
        middleware at Profile C after ID Token verification; per
        identity-foundation no-drift gate #2 the cookie itself carries no
        claims. At Profile B (auth-off), this scheme is declared but the
        Stage-0 default identity is returned unconditionally.
