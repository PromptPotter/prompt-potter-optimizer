  /commands/edit-draft-campaign:
    post:
      operationId: editDraftCampaign
      summary: Patch a sparse subset of mutable `DraftCampaign` fields.
      description: |
        Drives the chat ↔ panel dual-surface mutation path (see
        `docs/specs/m13-chat-first-user-web.md § State binding`). Both the
        assistant tool-call surface and the panel "Apply" button ride this
        same verb. Workspace-scoped — the draft is server-held state, not
        yet a ledger-bearing cycle, so no `Expected-Version`.

        `patch` is a sparse object — only declared field names are accepted,
        omitted fields are unchanged. Slug edits go through the same slug
        collision detection as `/datasets/ingest` (409 on conflict).
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: edit-draft-campaign }
                    payload: { $ref: '#/components/schemas/EditDraftCampaignPayload' }
      responses:
        '200':
          description: Post-mutation `DraftCampaign` (full shape, not a partial diff).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `draft_id` does not exist, or exists under a different
            `IdentityContext.tenant_id`. Existence-leak gate: 404, not 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/mint-campaign-from-draft:
    post:
      operationId: mintCampaignFromDraft
      summary: Commit a `DraftCampaign` — write the Origin files + `campaign.json`, then mint.
      description: |
        Terminal verb in the draft lifecycle. Server:
        1. Looks up the draft by `draft_id`, tenant-scoped.
        2. Atomic-renames `projects/{tenant}/datasets/.drafts/{draft_id}/` to
           `projects/{tenant}/datasets/{slug}/`.
        3. Writes the four Origin files (`cache.json`, `pipeline.json`,
           `task_description.md`, `prompts/default.json`) per the slot table
           in `docs/specs/m13-chat-first-user-web.md § Commit path`.
        4. Writes the sibling `campaign.json` (default-campaign config; not
           part of the Origin's `JobSearchPoint.content_hash(dataset)`).
        5. Falls through to the existing mint-campaign path.

        Workspace-scoped — no `Expected-Version` (no prior cycle to gate
        against). `Idempotency-Key` prevents double-mint on retry.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: mint-campaign-from-draft }
                    payload: { $ref: '#/components/schemas/MintCampaignFromDraftPayload' }
      responses:
        '200':
          description: |
            Canonical mint-campaign response — `campaign_id`, `cycle_id`,
            `job_id`. Matches the shape returned by `/commands/mint-campaign`
            once it commits asynchronously (this endpoint is synchronous
            because the commit is a single atomic rename + mint, not an
            event-stream-tracked runner spawn).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintCampaignFromDraftResponse'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `draft_id` does not exist, or exists under a different
            `IdentityContext.tenant_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            Slug now collides with an existing user-uploaded dataset (the
            draft's slug edit raced another commit). `details.suggested_slug`
            carries the smallest free `{slug}-{n}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Either `payload_invalid` (malformed envelope) or
            `origin_incomplete` — the deterministic origin-readiness checklist
            still has gaps (the column mapping unset/unconfirmed, an empty
            `task_description`, or any config knob still `proposed`).
            `details.gaps` lists each blocking field as `{field, reason, hint}`.
            The draft is preserved; the operator resolves the gaps (via
            `resolve-origin` or `edit-draft-campaign`) and retries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503': { $ref: '#/components/responses/BackendUnreachable' }

  /commands/resolve-origin:
    post:
      operationId: resolveOrigin
      summary: Run one origin-resolver turn against a `DraftCampaign`.
      description: |
        The proposer half of the origin proposer/gate split (see
        `docs/specs/m10-origin-resolution-checkin.md`). One turn: the
        origin-aware `checkin` node inspects the draft (headers, sample rows,
        current per-field provenance, open gaps) plus the operator's latest
        framing and proposes evidence-cited values for the unresolved
        origin-readiness fields. High-confidence findings auto-confirm
        (`confirmed`); low-confidence land `proposed` and wait for an operator
        click. The deterministic checklist — not the resolver — decides
        completeness; a false `ready` is re-checked and rejected.

        Synchronous (mirrors `edit-draft-campaign`): returns the resolver
        output + the post-apply `DraftCampaign`. Workspace-scoped — no
        `Expected-Version`; the LLM call's token/cost ride the tenant
        workspace ledger. Drives subsequent turns from the UI; bounded by
        operator interaction.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: resolve-origin }
                    payload: { $ref: '#/components/schemas/ResolveOriginPayload' }
      responses:
        '200':
          description: The resolver turn output + the post-apply `DraftCampaign`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveOriginResponse'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `draft_id` does not exist, or exists under a different
            `IdentityContext.tenant_id`. Existence-leak gate: 404, not 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /datasets/ingest:
    post:
      operationId: ingestDataset
      summary: Upload a CSV; receive a server-held `DraftCampaign` with parsed preview + smart defaults.
      description: |
        Slice 1 ingest path for the M13 chat-first user web (see
        `docs/specs/m13-chat-first-user-web.md § Ingest`). Workspace-scoped,
        identity-bound by `IdentityContext.tenant_id` — the resulting draft
        (and on commit, the dataset directory) lands at
        `projects/{tenant}/datasets/{slug}/`.

        NOT a Control-remote command — no `CommandRecord` lands on a ledger;
        the draft lives in the server's draft-campaign store until the operator
        commits via the separate `/commands/mint-campaign-from-draft` verb.
        File type in slice 1: CSV. Ingest is header-agnostic — any column
        names are accepted; the input/target column mapping is resolved on
        the draft (`column_query` / `column_ground_truth`) and gated at mint,
        not at upload. Future slices add XLSX (first sheet only), Parquet,
        JSON-lines — declared in this file before each handler lands.
      tags: [datasets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV blob; any column headers (header-agnostic).
                slug:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[a-z][a-z0-9_-]*$'
                  description: |
                    Optional slug override. Defaults to `SafeName(filename_without_ext)`.
                    Must pass `SafeName` (lowercase, alphanumerics + `_-`).
      responses:
        '200':
          description: |
            Draft created. Body is a `DraftCampaign` with `sample_preview`
            (first 10 rows), `n_samples`, smart-defaulted `connector` /
            `scoring_composite` / `max_rounds`, and a server-minted `draft_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated but not permitted to ingest in this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            Slug collides with an existing user-uploaded dataset under
            `projects/{tenant}/datasets/`. `details.suggested_slug` carries
            the smallest free `{slug}-{n}`; the operator picks or edits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            CSV parse / shape failure — undecodable bytes, unparseable CSV,
            no header row, or zero data rows. `details.reason` carries the
            specific failure (`bad_csv`, `empty`, `too_large`, `bad_slug`).
            Column names are NOT validated here (header-agnostic ingest).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /llm/providers:
    get:
      operationId: listLlmProviders
      summary: List optimizer LLM providers + curated starter models, gated on installed API keys.
      description: |
        Read-only surface backing the draft-campaign panel's
        `optimizer_provider` / `optimizer_model` pickers. Each entry carries
        an `available` flag computed from whether the install's environment
        holds the required API key (e.g. `GROQ_API_KEY` for `groq`). The
        curated `models` list mirrors the per-provider recommendations in
        `docs/operations/dataset-reasoning-matrix.md`; the operator can
        still hand-edit `optimizer_model` on `DraftCampaign` to any model
        string the provider accepts.

        Pure read; no `Idempotency-Key`, no `Expected-Version`.
      tags: [config]
      responses:
        '200':
          description: Installed provider list with availability + curated models.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                additionalProperties: false
                properties:
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/LLMProvider'
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID-or-equivalent identifying this command attempt.
        The dispatcher dedupes by hash lookup against `events.jsonl`; a second
        POST with the same `Idempotency-Key` returns the original 202 response,
        not a fresh command.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    ExpectedVersion:
      name: Expected-Version
      in: header
      required: false
      description: |
        The ledger offset (or round number, for round-grained commands) the
        client believes the target cycle is at. The runner rejects the command
        with 409 `version_conflict` if the cycle has advanced past this point.
        Optimistic-concurrency floor.

        **v0 relaxation (Phase 2b):** the header is declared optional in v0
        because the webapp's mutation surface does not yet thread ledger
        sequence numbers from the SSE stream through to mutations. The
        dispatcher validates the version when the header IS present and
        skips the check otherwise. Phase 2c flips this back to `required:
        true` once the webapp consumes sequence from `EventStreamView`.
      schema:
        type: integer
        minimum: 0

  schemas:
    CommandEnvelope:
      type: object
      required: [kind, payload]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: |
            The command kind. MUST be one of the kinds declared in this
            file's `paths` keys (the closed set). Examples once Profile B
            lands: `pause-cycle`, `resume-cycle`, `fork-cycle`,
            `change-spend-budget`. See `docs/adr/0001-m12-control-plane.md`
            Profile B table.
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]*$'
        payload:
          description: |
            Per-kind payload. Each declared operation in `paths` overrides
            this with a tighter schema (using `$ref` or inline). The base
            envelope only guarantees the field is present.
          type: object
          additionalProperties: true
        client_metadata:
          type: object
          description: |
            Optional client-supplied metadata (e.g. UI surface that issued
            the command, user-agent build id). Stored on the `CommandRecord`
            for debugging; never used for authorization.
          additionalProperties: true

    CommandAcceptedBody:
      type: object
      required: [command_id, correlation_id, ledger_sequence]
      additionalProperties: false
      properties:
        command_id:
          type: string
          description: |
            Stable id of the `CommandRecord` appended to `events.jsonl`.
            Clients use this to correlate the eventual `CommandAckRecord`
            frame on the SSE channel.
        correlation_id:
          type: string
          description: |
            Echoes the `Idempotency-Key` from the request. Idempotent: a
            second POST with the same key returns the same `command_id` +
            `correlation_id` pair.
        ledger_sequence:
          type: integer
          minimum: 0
          description: |
            The ledger offset at which the `CommandRecord` was appended.
            Client subscribers can use this to align the SSE tail.

    ErrorEnvelope:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error:
          type: string
          description: |
            Stable error code. Closed set includes `version_conflict` (409),
            `idempotency_key_missing` (400), `expected_version_missing` (400),
            `capability_denied` (403), `command_kind_unknown` (404),
            `payload_invalid` (422), `slug_collision` (409),
            `backend_unreachable` (503), `ingest_failed` (422),
            `origin_incomplete` (422). New codes require a YAML update first.
          enum:
            - version_conflict
            - idempotency_key_missing
            - expected_version_missing
            - capability_denied
            - command_kind_unknown
            - command_target_not_found
            - payload_invalid
            - tenant_mismatch
            - slug_collision
            - backend_unreachable
            - ingest_failed
            - origin_incomplete
        message:
          type: string
          description: Human-readable explanation; never load-bearing for clients.
        details:
          type: object
          additionalProperties: true
          description: |
            Optional per-error structured detail.

            * `version_conflict` — `expected_version` (client sent) +
              `actual_version` (runner observed).
            * `slug_collision` (409 on `/datasets/ingest` and
              `/commands/mint-campaign-from-draft`) — `suggested_slug`
              carrying the smallest free `{slug}-{n}`, and `draft_id`
              when collision detection runs against an existing draft.
            * `backend_unreachable` (503 on any command that needs the
              backend reachable) — `backend_type` (connector name) and
              `backend_url` (configured URL). Used by the frontend to
              compose the "Start the backend and try again" message
              without re-parsing the `message` field.
            * `ingest_failed` (422 on `/datasets/ingest`) — `reason`
              ∈ `bad_csv` | `empty` | `too_large` | `bad_slug`. (Ingest is
              header-agnostic — it no longer rejects on column names; column
              identity is resolved on the draft, gated at mint.)
            * `origin_incomplete` (422 on `/commands/mint-campaign-from-draft`)
              — `gaps`: a list of `{field, reason, hint}` objects naming each
              origin field that still blocks mint. `reason` ∈ `unset` |
              `proposed_unconfirmed`. The deterministic origin-readiness
              checklist — not the operator — is the source of truth for
              completeness (see `docs/specs/m10-origin-resolution-checkin.md`).

    # ---- Per-kind command payloads (v0 closed set) ----
    # Each `*Payload` schema is the `payload` field of one command kind.
    # Naming matches the kind: `pause-cycle` -> `PauseCyclePayload`.

    CycleRef:
      type: object
      required: [campaign_id, cycle_id]
      additionalProperties: false
      description: |
        Reusable cycle reference. The trust-boundary identifier — every
        cycle-scoped command names its target by this pair (never by a
        cookie-derived pointer or an `active_session.json` lookup).
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_-]*$'
          description: 'Campaign id ({dataset}__{rand6_hex}).'
        cycle_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^cycle_[0-9a-f_]+$'
          description: 'Content-addressed cycle id (`cycle_{target_hash[:12]}` + optional sibling suffix).'

    PauseCyclePayload:
      $ref: '#/components/schemas/CycleRef'

    ResumeCyclePayload:
      $ref: '#/components/schemas/CycleRef'

    StopCyclePayload:
      $ref: '#/components/schemas/CycleRef'

    StepCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            rounds:
              type: integer
              minimum: 1
              maximum: 100
              default: 1
              description: Rounds to advance before auto-pausing.

    RewindToRoundPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
              description: Target round number (inclusive); events past this round are dropped.

    ForkCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
              description: Round the operator endorsed (audit-trail only in v0).
            candidate_id:
              type: string
              maxLength: 128
              description: Candidate the operator endorsed (audit-trail only in v0).

    DeleteCyclePayload:
      $ref: '#/components/schemas/CycleRef'

    CleanupEmptyCyclesPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          description: |
            `cycle_id` here names any cycle in the family; the dispatcher
            resolves it to its root and sweeps every empty stub under that
            root (matching `cleanup_empty_stubs` semantics).

    MintCampaignPayload:
      type: object
      required: [dataset_name]
      additionalProperties: false
      properties:
        dataset_name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_-]*$'
          description: 'Dataset under `datasets/{dataset_name}/` to mint a campaign for.'

    StartRunPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [kind]
          additionalProperties: false
          properties:
            kind:
              type: string
              enum: [new, resume]
              description: |
                `new` re-mints root state (stub cycle only). `resume` attaches
                to the cycle's current ledger tail. Matches CLI `new` /
                `resume` verbs hoisted onto the wire surface.

    ChangeSpendBudgetPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [max_usd]
          additionalProperties: false
          properties:
            max_usd:
              type: number
              minimum: 0
              description: |
                New USD spend cap for the cycle. Setting `0` halts the
                cycle at the next checkpoint; raising above current spend
                releases the halt.

    ChangePipelineParamPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [node, param, value]
          additionalProperties: false
          properties:
            node:
              type: string
              minLength: 1
              maxLength: 64
              description: 'Node name in the backend pipeline (key under `nodes.{name}` overlay).'
            param:
              type: string
              minLength: 1
              maxLength: 64
              description: 'Param key within the node config (e.g. `model`, `temperature`).'
            value:
              description: |
                New value. Type is per-param — string for `model`, number for
                `temperature`, etc. Validated against the schema PromptPotter
                discovers via `GET /pipeline` (zero backend-specific constants).
              oneOf:
                - { type: string }
                - { type: number }
                - { type: integer }
                - { type: boolean }
                - { type: 'null' }

    RegisterBackendPayload:
      type: object
      required: [name, backend_type, base_url]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Human-readable backend name.
        backend_type:
          type: string
          minLength: 1
          maxLength: 64
          description: Backend connector type (e.g. `termnorm`, `promptpotter`).
        base_url:
          type: string
          format: uri
          description: Backend API base URL (trailing slash stripped server-side).
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]*$'
          description: 'Custom backend id; auto-derived from `name` when omitted.'

    SyncBackendExperimentsPayload:
      type: object
      required: [backend_id]
      additionalProperties: false
      properties:
        backend_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]*$'

    # ---- Forward-scope payloads (beyond v0; same closed-set policy) ----

    CampaignRef:
      type: object
      required: [campaign_id]
      additionalProperties: false
      description: |
        Workspace-scoped reference (campaign-level, no cycle). Lifecycle
        commands ride the campaign's root cycle ledger; the dispatcher
        resolves ``campaign_id -> root_cycle_id`` from ``campaign.json``.
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_-]*$'
          description: 'Campaign id ({dataset}__{rand6_hex}).'

    CampaignLifecyclePayload:
      allOf:
        - $ref: '#/components/schemas/CampaignRef'
        - type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              maxLength: 512
              description: |
                Optional operator-supplied reason for the lifecycle
                transition. Stored on ``campaign.json::lifecycle_reason``;
                empty string is the unset form.

    ArchiveCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 512
              description: 'Operator-supplied reason; stored on the archive marker for audit.'

    ChangeHaltBudgetPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [max_rounds]
          additionalProperties: false
          properties:
            max_rounds:
              type: integer
              minimum: 0
              description: |
                New round cap. Setting `0` halts the cycle at the next
                checkpoint; raising above current round count releases.

    ChangeSampleBudgetPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [sp_budget_ttest]
          additionalProperties: false
          properties:
            sp_budget_ttest:
              type: integer
              minimum: 1
              description: |
                Per-round PoBB sample budget (the adaptive queue narrows the
                scoring bank to this many samples each round via
                `select_round_subset`). Lower = cheaper rounds, weaker signal.

    ResetPipelineOverlayPayload:
      $ref: '#/components/schemas/CycleRef'

    ChangeScoringCompositePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [composite]
          additionalProperties: false
          properties:
            composite:
              type: object
              additionalProperties: true
              description: |
                Full `scoring_steer.json` content. Validated server-side
                against ScoringContext; reject as 422 `payload_invalid`
                when the composite references unknown evaluator ids.

    MarkHardSamplePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [sample_id]
          additionalProperties: false
          properties:
            sample_id:
              type: string
              minLength: 1
              maxLength: 128
              description: 'Dataset-local sample id (`datasets/{name}/dataset.json` row id).'

    UnmarkHardSamplePayload:
      $ref: '#/components/schemas/MarkHardSamplePayload'

    AnnotateRoundPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round, note]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
              description: Round number the note is attached to.
            note:
              type: string
              minLength: 1
              maxLength: 4000
              description: Free-form operator note; stored verbatim in `round_NNNN.json::operator_notes`.

    EndorseCandidatePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round, candidate_id, verdict]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
            candidate_id:
              type: string
              minLength: 1
              maxLength: 128
            verdict:
              type: string
              enum: [endorsed, rejected]
              description: |
                Operator verdict. Stored on the round's audit trail; L2/L3
                may consume in later profiles (no behavior change in v0).

    DraftCampaign:
      type: object
      required:
        - draft_id
        - slug
        - sample_preview
        - n_samples
        - connector
        - scoring_composite
        - max_rounds
        - task_description
        - pipeline_overlay
        - optimizer_provider
        - optimizer_model
        - headers
        - column_query
        - column_ground_truth
        - resolved
        - sources
        - created_at
        - updated_at
        - optimizer_locks
      additionalProperties: false
      description: |
        Server-held canonical state for an in-progress dataset ingest. Mutated
        by both the chat surface and the parameter panel (both ride
        `POST /commands/{kind}` once that verb lands) until the operator
        commits via `/commands/mint-campaign-from-draft`. Identity scope rides
        the existing tenant prefix; the draft never carries a per-record
        `tenant_id` on the wire (see ADR-0002 no-drift gate #3).
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 64
          description: Server-minted ULID; idempotent re-ingest of the same file returns the same draft.
        slug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_-]*$'
          description: |
            Tentative dataset directory name under
            `projects/{tenant}/datasets/{slug}/` after commit. `SafeName`-validated.
        sample_preview:
          type: array
          minItems: 0
          maxItems: 10
          description: |
            First 10 parsed rows; read-only. Header-agnostic — each row is
            the raw uploaded record keyed by its own column headers (not yet
            mapped to `query` / `ground_truth`; that mapping is `column_query`
            / `column_ground_truth`, resolved on the draft and gated at mint).
          items:
            type: object
            additionalProperties: { type: string }
        n_samples:
          type: integer
          minimum: 0
          description: Total parsed row count (preview is a head; this is the bank size).
        connector:
          type: string
          minLength: 1
          maxLength: 64
          default: termnorm
          description: |
            Smart-default `termnorm` (only registered connector today, per
            root CLAUDE.md). Operator-editable via panel or chat.
        scoring_composite:
          type: string
          minLength: 1
          maxLength: 64
          default: exact_match
          description: |
            Smart-default `exact_match` (only universally-applicable scorer
            for `(query, ground_truth)`). Operator-editable.
        max_rounds:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
          description: |
            Smart-default `5` (matches the M10 prompt-iteration framework
            default). Operator-editable.
        task_description:
          type: string
          maxLength: 16384
          description: Free-form framing; chat negotiates content. Empty string on first ingest.
        pipeline_overlay:
          type: object
          additionalProperties: true
          description: |
            Initial `nodes.*.config` overlay for the future `pipeline.json`.
            Empty `{}` on first ingest; the operator (or chat) populates per-node
            model / `reasoning_effort` from
            `docs/operations/dataset-reasoning-matrix.md` before commit.
        optimizer_provider:
          type: string
          minLength: 1
          maxLength: 32
          default: groq
          description: |
            Optimizer LLM provider name (`groq`, `openai`, `anthropic`,
            `openrouter`). Smart-default `groq` (free tier, fastest startup).
            Operator-editable via panel; the resolved list of providers
            available in this install — gated on whether the corresponding
            API key is set — is served by `GET /llm/providers`.
        optimizer_model:
          type: string
          maxLength: 128
          default: ''
          description: |
            Optimizer LLM model id (e.g. `openai/gpt-oss-120b`,
            `claude-sonnet-4-6`). Empty string means "use the connector's
            recommended default for this provider"; the curated per-provider
            model list is exposed by `GET /llm/providers`.
        headers:
          type: array
          items: { type: string }
          description: |
            The uploaded file's column headers, in order. The operator (or,
            once it lands, the origin resolver) maps two of these to
            `column_query` / `column_ground_truth`.
        column_query:
          type: string
          maxLength: 256
          description: |
            Which uploaded header carries the input string. Empty until
            resolved. Auto-confirmed on ingest only when a header is literally
            named `query`; otherwise the operator picks one via
            `edit-draft-campaign`. Must be a member of `headers` to mint.
        column_ground_truth:
          type: string
          maxLength: 256
          description: |
            Which uploaded header carries the target string. Same resolution
            rules as `column_query` (literal `ground_truth` auto-confirms).
        resolved:
          type: object
          additionalProperties:
            type: string
            enum: [unset, proposed, confirmed]
          description: |
            Per-field provenance for the origin-readiness checklist. Keys are
            dotted field names spanning the closed set: the column mapping
            (`column.query`, `column.ground_truth`), `task_description`, and the
            config knobs (`connector`, `scoring_composite`, `max_rounds`,
            `optimizer.provider`, `optimizer.model`, `backend.node_config`).
            Values are `unset` (no value), `proposed` (an inference awaiting
            confirmation), or `confirmed` (operator-stated or auto-confirmed).
            The config knobs auto-confirm from template defaults at ingest;
            `task_description` lands `unset` (no default framing). No field
            reaches mint while `unset` or `proposed`. The deterministic
            checklist gates; see
            `docs/specs/m10-origin-resolution-checkin.md`.
        sources:
          type: object
          additionalProperties:
            type: string
            enum: [auto, stated]
          description: |
            Per-field source — orthogonal to `resolved`. `auto` = the value was
            machine-set (a template default auto-confirmed at ingest, a literal
            column auto-detect, or a resolver finding); `stated` = the operator
            set it explicitly via `edit-draft-campaign`. Only fields that have a
            value (`proposed` / `confirmed`) appear here; `unset` fields carry no
            source. A `confirmed + auto` entry is a once-hidden default now made
            visible; `confirmed + stated` is an operator choice. Audit-only — the
            gate verdict reads `resolved`, never this.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        optimizer_locks:
          type: object
          required: [pipeline, forbidden_axes, nodes]
          additionalProperties: false
          description: |
            The backend-pipeline permission surface the new-campaign UI renders
            *before* commit — the connector's node-config seed (which a draft's
            empty `pipeline_overlay` otherwise hides) merged with any operator
            overlay edit, plus the campaign-wide forbidden axes. Read-only,
            server-derived per request; it exists to show that the optimizer is
            *locked out* of escalating certain params (model/provider campaign-
            wide; `reasoning_effort` above the connector floor), not merely that
            a value is the default. Mirrors the commit-time
            `pipeline.json::nodes` merge so the two never drift.
          properties:
            pipeline:
              type: array
              items: { type: string }
              description: |
                The connector's first-tenant default pipeline step list
                (`Connector.default_pipeline`) — e.g. `["llm_only"]` for a fresh
                TermNorm CSV. Empty means "no override; the backend's
                `GET /pipeline` default stands."
            forbidden_axes:
              type: array
              items: { type: string }
              description: |
                Params the optimizer may never permute on any node when
                `forbidden_axes_strict` is on (the default) — `["model",
                "provider"]`. Empty when strict mode is off.
            nodes:
              type: object
              additionalProperties:
                type: object
                required: [config, param_allowed_values]
                additionalProperties: false
                properties:
                  config:
                    type: object
                    additionalProperties: true
                    description: |
                      The effective per-node config floor (connector seed +
                      overlay) — e.g. `{ "reasoning_effort": "low",
                      "temperature": 0.0 }`. The active value of each control.
                  param_allowed_values:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
                    description: |
                      The closed set of values the optimizer may permute per
                      param — e.g. `{ "reasoning_effort": ["none","default",
                      "low"] }`. Any ladder value absent here renders crossed-out
                      (optimizer locked out).
              description: |
                Per-node permission block, keyed by node name. Mirrors the merged
                `pipeline.json::nodes` the commit step writes.

    ResolveOriginPayload:
      type: object
      required: [draft_id]
      additionalProperties: false
      description: |
        One resolver turn against an existing `DraftCampaign`. Tenant-scoped —
        a `draft_id` resolving to a different `IdentityContext.tenant_id`
        returns 404 (existence-leak gate). The operator's latest framing is
        read off the draft's `task_description`; no separate message field this
        slice.
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 64
          description: Server-minted draft id returned by `/datasets/ingest`.

    OriginResolution:
      type: object
      required: [complete, provenance, sources, values, gaps]
      additionalProperties: true
      description: |
        The draft's checklist state after a resolver turn, mirroring the
        on-disk `cache.json::resolution` block. `last_resolution` carries the
        resolver's own output (assessment + evidence-cited findings +
        next_action + recap) for the panel and the AI.
      properties:
        complete:
          type: boolean
          description: True iff no field still blocks mint (the deterministic gate's verdict).
        provenance:
          type: object
          additionalProperties:
            type: string
            enum: [unset, proposed, confirmed]
          description: Per-field provenance for every closed-set checklist field.
        sources:
          type: object
          additionalProperties:
            type: string
            enum: [auto, stated]
          description: |
            Per-field source (`auto` / `stated`) — the audit sub-tag mirroring
            `DraftCampaign.sources`. Only valued fields appear.
        values:
          type: object
          additionalProperties: true
          description: Current value of every closed-set field, keyed by checklist field id.
        gaps:
          type: array
          items:
            type: object
            required: [field, reason, hint]
            additionalProperties: false
            properties:
              field: { type: string }
              reason: { type: string, enum: [unset, proposed_unconfirmed] }
              hint: { type: string }
          description: Each field still blocking mint, with an operator-facing hint.
        last_resolution:
          type: object
          additionalProperties: true
          description: |
            The resolver turn's own output — `assessment`, `findings`
            (`{field, proposed_value, confidence, evidence}`), `next_action`
            (`{kind, questions}` where each question is
            `{field, prompt, options}` — `field` names the checklist gap the
            answer resolves so the panel applies it as a confirmed patch), and
            `recap` (set only on a `ready` turn).

    ResolveOriginResponse:
      type: object
      required: [resolution, draft]
      additionalProperties: false
      description: One resolver turn's outcome — the resolution block + the post-apply draft.
      properties:
        resolution:
          $ref: '#/components/schemas/OriginResolution'
        draft:
          $ref: '#/components/schemas/DraftCampaign'

    EditDraftCampaignPayload:
      type: object
      required: [draft_id, patch]
      additionalProperties: false
      description: |
        Sparse mutation of an existing `DraftCampaign`. Only declared fields
        in `patch` are accepted; omitted fields are unchanged. Tenant-scoped
        — the dispatcher rejects `draft_id`s that resolve to a different
        `IdentityContext.tenant_id` with 404 (existence-leak gate).
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 64
          description: Server-minted ULID returned by `/datasets/ingest`.
        patch:
          type: object
          additionalProperties: false
          description: |
            Sparse subset of mutable `DraftCampaign` fields. Slug edits run
            the same collision check as ingest (409 on conflict).
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 64
              pattern: '^[a-z][a-z0-9_-]*$'
            connector:
              type: string
              minLength: 1
              maxLength: 64
            scoring_composite:
              type: string
              minLength: 1
              maxLength: 64
            max_rounds:
              type: integer
              minimum: 1
              maximum: 100
            task_description:
              type: string
              maxLength: 16384
            pipeline_overlay:
              type: object
              additionalProperties: true
              description: 'Replaces (not deep-merges) the prior `nodes.*.config` overlay.'
            optimizer_provider:
              type: string
              minLength: 1
              maxLength: 32
            optimizer_model:
              type: string
              maxLength: 128
            column_query:
              type: string
              maxLength: 256
              description: |
                Confirm which uploaded header is the input column. Must be a
                member of the draft's `headers` (422 otherwise). Setting it
                moves `resolved["column.query"]` to `confirmed`.
            column_ground_truth:
              type: string
              maxLength: 256
              description: |
                Confirm which uploaded header is the target column. Same
                membership rule; moves `resolved["column.ground_truth"]` to
                `confirmed`.

    MintCampaignFromDraftPayload:
      type: object
      required: [draft_id]
      additionalProperties: false
      description: |
        Terminal-verb payload — no field overrides accepted at commit time;
        the draft is the canonical source of truth. Tenant-scoped; 404 on
        cross-tenant `draft_id`.
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 64
          description: Server-minted ULID returned by `/datasets/ingest`.

    MintCampaignFromDraftResponse:
      type: object
      required: [campaign_id, cycle_id, job_id]
      additionalProperties: false
      description: |
        Canonical mint-campaign response. Matches the eventual
        `CommandAckRecord` payload for `/commands/mint-campaign` once that
        verb's async ack lands, but returned synchronously here because the
        commit is a single atomic rename + mint.
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_-]*$'
          description: 'Newly-minted campaign id ({slug}__{rand6_hex}).'
        cycle_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^cycle_[0-9a-f_]+$'
          description: 'Root cycle id, content-addressed on the Origin (`cycle_{target_hash[:12]}`).'
        job_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            JobRegistry handle for the runner spawned against the new
            campaign. Clients use this to subscribe to the SSE stream.

    LLMProvider:
      type: object
      required: [name, display_name, available, env_var, models]
      additionalProperties: false
      description: |
        One entry in the `GET /llm/providers` response. The `available` flag
        is computed from whether the install's environment carries the
        `env_var` API key. `models` is a curated starter list sourced from
        `docs/operations/dataset-reasoning-matrix.md`; the operator can
        still hand-edit `optimizer_model` to any model string the provider
        accepts.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
          description: 'Stable provider id (`groq`, `openai`, `anthropic`, `openrouter`).'
        display_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Human-readable label for the picker UI.
        available:
          type: boolean
          description: |
            `true` when the install's environment holds the required API
            key (`env_var`). Drives the picker dimming; the API still
            accepts unavailable providers on `DraftCampaign` so the
            operator can pre-configure before adding the key.
        env_var:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Environment-variable name carrying the API key (e.g. `GROQ_API_KEY`).'
        models:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: |
            Curated starter models for this provider. The first entry is
            the recommended default when `DraftCampaign.optimizer_model`
            is the empty string.
        note:
          type: string
          maxLength: 256
          description: Optional one-line picker hint (e.g. "free tier; 8k TPM").

    DatasetIndexEntry:
      type: object
      required: [slug, tier, n_samples]
      additionalProperties: false
      description: |
        One entry in the `GET /datasets` response (endpoint declaration
        deferred to the read-surface PR — pinned here so the wire shape is
        fixed before the read handler lands). Flat list with a `tier`
        discriminator; no two-section UI per
        `docs/specs/m13-chat-first-user-web.md § Collection`.
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_-]*$'
          description: |
            Dataset directory name. For `tier: "yours"` this is the
            tenant-scoped slug under `projects/{tenant}/datasets/{slug}/`.
            For `tier: "benchmark"` this is the repo-root `datasets/{slug}/`
            name (e.g. `aime_2025`, `bbeh`).
        tier:
          type: string
          enum: [yours, benchmark, demo]
          description: |
            `"yours"` — user-owned Origin under `projects/{tenant}/datasets/`.
            `"benchmark"` — install-global read-only Origin; visible only when
            the identity holds the `datasets.benchmarks.read` capability.
            `"demo"` — the built-in try-and-learn dataset, surfaced while
            `User.demo_mode_enabled` is on (independent of the benchmark cap).
        n_samples:
          type: integer
          minimum: 0
          description: Sample bank size (from `cache.json`).
        task_description:
          type: string
          maxLength: 16384
          description: First line of `task_description.md`; UI list preview.

  responses:
    CommandAccepted:
      description: |
        Command appended to the canonical ledger as a `CommandRecord`. The
        runner will apply it asynchronously and emit a `CommandAckRecord`
        observable via the SSE channel; clients MUST NOT treat this 202 as
        confirmation that the mutation has been applied (no client-side
        optimistic mutations — security checkbox #17).
      headers:
        Idempotency-Key:
          description: Echo of the request's `Idempotency-Key`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandAcceptedBody'

    VersionConflict:
      description: |
        `Expected-Version` did not match the cycle's current ledger offset.
        Client SHOULD refresh state from the SSE snapshot and retry with
        the new version. Returned with 409 status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    IdempotencyKeyMissing:
      description: Request omitted the mandatory `Idempotency-Key` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    CapabilityDenied:
      description: |
        Authenticated identity lacks the capability required for this
        command kind. Returned with 403 status. At Profile B (auth-off),
        the Stage-0 default identity has all capabilities granted; this
        response begins to fire at Profile C with real OIDC subjects.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    PayloadInvalid:
      description: |
        Command body failed schema validation for the declared kind.
        Returned with 422 status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    CommandTargetNotFound:
      description: |
        The command names a target (campaign, cycle, backend) that either
        does not exist or belongs to a different identity. Existence-leak
        gate: 404, not 403. Shape pinned in
        `docs/operations/persistence-and-state.md` § Beta hosting state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    BackendUnreachable:
      description: |
        Configured backend (TermNorm or another `Connector`) did not respond
        to the dispatcher's preflight probe. The operator-facing fix is
        "start the backend and retry"; the dispatcher does not retry
        internally. `details.backend_type` + `details.backend_url` identify
        which backend failed so the frontend can render a specific message.
        Returned with 503 status. Sole source: `Connector.preflight(...)`
        invoked from `CommandDispatcher` before any applier runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: pp_session
      description: |
        Opaque server-side session id (NOT a JWT). Issued by the OIDC
        middleware at Profile C after ID Token verification; per
        identity-foundation no-drift gate #2 the cookie itself carries no
        claims. At Profile B (auth-off), this scheme is declared but the
        Stage-0 default identity is returned unconditionally.
