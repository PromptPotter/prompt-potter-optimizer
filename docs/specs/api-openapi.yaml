        composite incomparable to its own past — `EscalationFSM._advanced` reads
        `best_composite_fitness` as the L2/L3 stall gate whenever the θ ruler is
        unavailable. So this must land as a FORK (the wire twin of
        `resume --fork-on-divergence`), never as a swap into the running cycle.
        Rationale: `docs/operations/persistence-and-state.md`
        § Changing the composite formula — fork, never swap.
      tags: [scoring]
      parameters:
