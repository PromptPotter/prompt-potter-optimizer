        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/endorse-candidate:
    post:
      operationId: endorseCandidate
      x-status: declared-not-wired  # no handler; POST 404s `command_kind_unknown`
      summary: Operator verdict on a candidate (endorsed | rejected).
      description: |
        Verify-tab action (M11 webapp). Verdict appended to the round's audit
        trail; L2/L3 may bias future generations toward endorsed candidates
        in subsequent profiles (no behavior change in v0 — audit only).
      tags: [operator-feedback]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: endorse-candidate }
                    payload: { $ref: '#/components/schemas/EndorseCandidatePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/register-backend:
    post:
      operationId: registerBackend
      summary: Register a new backend connection (workspace-scoped).
      description: |
        Migrated from `POST /api/v1/backends`, a route that no longer exists. Workspace-scoped,
        no `Expected-Version` — the target is the backend registry, not a cycle.
      tags: [backends]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: register-backend }
                    payload: { $ref: '#/components/schemas/RegisterBackendPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/edit-draft-campaign:
    post:
      operationId: editDraftCampaign
      summary: Patch a sparse subset of mutable `DraftCampaign` fields.
      description: |
        Drives the chat ↔ panel dual-surface mutation path (see
        `docs/specs/roadmap.md § State-sync`). Both the
        assistant tool-call surface and the panel "Apply" button ride this
        same verb. Check-in scoped — dispatched through `CommandDispatcher`
        onto the check-in cycle's ledger (`cycle_chk_*`, minted with its own
        `.runtime/` at the first ingest action and retained across the flip to
        `active`), so an origin edit is a `CommandRecord` + `CommandAckRecord`
        like every other Control-remote mutation. No `Expected-Version` — a
        draft is authored, not raced. An `Idempotency-Key` retry is deduped and
        the body re-read from `draft.json`.

        `patch` is a sparse object — only declared field names are accepted,
        omitted fields are unchanged. Slug edits go through the same slug
        collision detection as `/datasets/ingest` (409 on conflict).
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: edit-draft-campaign }
                    payload: { $ref: '#/components/schemas/EditDraftCampaignPayload' }
      responses:
        '200':
          description: Post-mutation `DraftCampaign` (full shape, not a partial diff).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `draft_id` does not exist, or exists under a different
            `IdentityContext.tenant_id`. Existence-leak gate: 404, not 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/start-checkin:
    post:
      operationId: startCheckin
      summary: Start a CHECKIN campaign — gate the origin, commit the Dataset, mint the run.
      description: |
        Terminal verb in the check-in phase. The campaign already exists durably
        (minted on the first ingest action — `/datasets/ingest` or
        `/datasets/{name}/draft`); its working state lives at
        `projects/{tenant}/campaigns/{campaign_id}/checkin/`, and the phase itself
        is a fact of the root cycle's ledger (minted in check-in, not yet closed).
        This verb closes it and runs. Server:
        1. Loads the campaign by `campaign_id`, asserts owned + flag still set,
           rehydrates the draft from `checkin/draft.json`.
        2. Runs the deterministic origin-readiness gate (incomplete → 422; the flag
           stays set so the operator resolves + retries).
        3. Takes a machine slot — or a place in the queue for one, in which case
           everything below happens after the wait, leaving the check-in exactly
           as the operator left it — then commits the origin: a fresh upload
           writes `projects/{tenant}/datasets/{slug}/` (the four Dataset files
           + sibling `campaign.yaml`) from the materialized bank; a draft derived
           from an existing dataset persists only its candidate library.
        4. Resolves the cycle plan, flips `checkin` → `active`, appends
           `checkin_closed` to the cycle's ledger, and detaches the runner.

        Check-in scoped — dispatched through `CommandDispatcher` onto the
        check-in cycle's ledger, the same cycle the run then appends its rounds
        to. No `Expected-Version`. `Idempotency-Key` set by the client, but this
        verb alone is NOT ledger-deduped: `job_id` is a live `JobRegistry` handle
        with no disk home, so a deduped retry could only fabricate one. The
        durable campaign is what makes a retry safe — a second Start finds the
        campaign `active` and raises `LaunchError` (422).
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: start-checkin }
                    payload: { $ref: '#/components/schemas/StartCheckinPayload' }
      responses:
        '200':
          description: |
            Canonical mint response — `campaign_id`, `cycle_id`, `job_id`.
            Synchronous through the commit + runner spawn; background progress
            then rides the canonical ledger + `dashboard.json` stream.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCheckinResponse'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `campaign_id` has no check-in working state (already Started, never a
            check-in, or under a different `IdentityContext.tenant_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            `payload_invalid` (malformed envelope), `origin_incomplete`,
            `ingest_failed`, or `pipeline_config_invalid`. `origin_incomplete` —
            the deterministic origin-readiness checklist still has gaps (the
            column mapping unset/unconfirmed, an empty `task_description`, or any
            config knob still `proposed`); `details.gaps` lists each blocking
            field as `{field, reason, hint}`. `ingest_failed` — a confirmed
            mapping hit a per-row data failure (a blank mapped cell) at
            materialization. `pipeline_config_invalid` — the resolved pipeline
            config can't produce a runnable cycle. The campaign stays `checkin`;
            the operator resolves it (via `resolve-origin` or
            `edit-draft-campaign`) and retries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503': { $ref: '#/components/responses/BackendUnreachable' }

  /campaigns:
    get:
      operationId: listCampaigns
      summary: Every campaign in one store owned by the caller, most recently active first.
      description: |
        The forest's other half — `GET /cycles` returns one store's cycles,
        this returns its campaigns, and the webapp groups the pair by
        `root_cycle_id` (`buildForest`) in the order served. Each summary's `line` is the
        campaign's line as one value (`LineStanding`): the cycle answering for it now — the
        root, or whichever cycle supersede cuts handed it to — with that cycle's run state,
        standing, rounds and the rounds cap binding it, so no client follows `superseded_by`.
        Takes the same `descend`: absent/empty
        is the caller's own tenant tree; a hop chain re-roots the list into an
        L4 `.inner/<key>` sandbox, so one route lists the top level and
        any depth. Response shape is owned by the server model
        (`application/campaign_listing.py::CampaignListResponse`, generated into
        `webapp/lib/api/types.generated.ts::CampaignSummary`) — not duplicated
        here. Each summary carries the campaign's lifetime billed spend
        (`spend_lifetime`, whose `bill_is_floor` says where it understates), summed
        server-side over its cycle ledgers and banked tombstones — the
        per-campaign split of `GET /auth/quota-status`'s account total. Beside
        it, `spend_metered` is what the campaign's cap counts along its line —
        the bill, or a controlled arm's search incurred — by bucket: the
        number the sidebar prints, so it never picks or adds one up itself.
        Each carries `bench`, the headline read off the bench passes its line's ledgers hold
        (`ledger_scan.py::scan_bench_passes`) under the formula its line runs —
        whichever cycle a rebase handed the line to — and never a per-cycle copy.
        Each also carries
        `runs_with` — what the ROOT course runs with (models and every scalar
        setting, each with the layer that won it, the models grouped under
        the vendor that trained them, the optimizer manifest it selects, plus
        the DECLARED rounds cap)
        — a second transport of the `GET /campaigns/{id}/pipeline` answer at the
        root, never a second source; null when the root pipeline did not
        resolve, so one broken dataset drops its own row's answer only.
      tags: [cycles]
      parameters:
        - name: dataset
          in: query
          required: false
          description: Filter to one dataset's campaigns.
          schema: { type: string }
        - name: lifecycle
          in: query
          required: false
          description: |
            `active` (default), `archived`, `deleted` — the visibility intent —
            or `all`. `checkin` is not a status but the authoring PHASE, read off
            the root cycle's ledger; it narrows `active`, which
            already carries the origin-authoring set.
          schema:
            type: string
            enum: [active, archived, deleted, checkin, all]
            default: active
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops to descend into, as on
            `GET /cycles`. Empty/absent → the caller's own tree.
          schema: { type: string }
      responses:
        '200':
          description: The resolved store's campaigns, newest first (`CampaignListResponse`).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: A `descend` hop names an inner sandbox that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/checkin:
    get:
      operationId: getCampaignCheckin
      summary: Re-open a CHECKIN campaign — its draft wire + last resolver turn.
      description: |
        The sidebar opens a check-in campaign through here instead of
        the dashboard (no `dashboard.json` exists pre-loop): the webapp rebuilds
        the ingest "ready" panel from `draft` and shows the prior `resolution`
        recap. Tenant-scoped — a cross-tenant id 404s. 404 when the campaign has
        no check-in working state (already Started or never a check-in).
      tags: [campaigns]
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: The check-in campaign id (the draft's `draft_id`).
          schema:
            type: string
            minLength: 8
            maxLength: 128
      responses:
        '200':
          description: |
            The rehydrated draft wire + the last resolver turn (or null) + any
            proposals the last turn left unclicked.
          content:
            application/json:
              schema:
                $ref: 'openapi.generated.json#/components/schemas/CheckinReopenResponse'
        '404':
          description: No check-in working state for this campaign (or cross-tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/pipeline:
    get:
      operationId: getCampaignPipeline
      summary: What this campaign's pipeline RESOLVES TO at one searchpoint.
      description: |
        The one server-owned answer to "what config does this node run" — the
        sole source for every config row, model chip and provenance badge
        (`frontend-surface-contract.md::I9`). Five layers, merged
        last-writer-wins by `application/pipeline_resolve.py`: dataset overlay <
        the campaign's FROZEN `pipeline_overlay` < cycle seed < the addressed
        candidate's sparse `pipeline_overlay` < identity contributions,
        which are unoverridable. Each param's `source` is the layer that won it,
        stamped BY the merge. A check-in campaign resolves through the same
        call. A one-shot read beside `dashboard.json` polling, which is its
        invalidation signal, not its transport (`roadmap.md` § Hard ordering).
      tags: [campaigns]
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
        - name: at
          in: query
          required: false
          description: |
            Which searchpoint to resolve, in the ONE subject grammar
            (`application/evidence/subjects.py::parse_subject`): `campaign:<id>`,
            `course:<id>/<cycle>/<label>`, `candidate:<id>/<cycle>/<cand_id>`,
            each optionally suffixed `;in=<hop chain>` for an L4 inner point.
            Omitted defaults to `campaign:<campaign_id>`. `;lens=` and
            `;samples=` are REFUSED with 400: a scoring mask cannot change what
            config a point ran. An `at` naming another campaign is 400 too.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: The resolved pipeline at the addressed searchpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPipelineResponse'
        '400':
          description: |
            Malformed `at`, a scoring mask on a configuration read, or an `at`
            naming a campaign other than the path's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            No such campaign, or cross-tenant. Ownership-gated by `owned_campaign`
            and nothing else — 404 rather than 403, so a probe cannot enumerate
            other tenants' campaign ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/fork-preview:
    post:
      operationId: previewForkSteer
      summary: Would this steer take the babysit path? — the fork gate's own verdict, asked without forking.
      description: |
        The ADR-0005 babysit verdict `POST /commands/fork-cycle` reaches inside its
        own dispatch, answered instead of enforced. A steer picking a responder the
        campaign never sanctioned costs the branch grade C, so the operator is owed
        the verdict BEFORE confirming — and the browser must not re-derive it, which
        is what `frontend-surface-contract.md::I9` forbids and what the deleted
        `overlaySetsModelOutsideAllowed` did.

        POST because the subject is the in-progress overlay, which exists nowhere
        on disk yet. It is a READ all the same: no `CommandRecord`, no ack, no
        `Idempotency-Key`, nothing written. A `dry_run` flag on `fork-cycle` was the
        alternative and is refused — a control-plane verb that sometimes records
        nothing is the redundant mechanism root `CLAUDE.md` § STOP rejects.

        Campaign-scoped, not cycle-scoped, because the permitted set is the
        campaign's frozen `config.optimizer_narrowing` and nothing below it.
        Capability-free: it reports what the gate WOULD say, and holding
        `campaign.babysit` is what decides whether the fork itself lands.
      tags: [campaigns]
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkPreviewRequest'
      responses:
        '200':
          description: The verdict this overlay would draw at `fork-cycle`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForkPreviewResponse'
        '404':
          description: |
            No such campaign, or cross-tenant — `owned_campaign` and nothing else, so a
            probe cannot enumerate other tenants' campaign ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /campaigns/{campaign_id}/cycles/{cycle_id}/dashboard:
    get:
      operationId: getCycleDashboard
      summary: Live telemetry for a viewed cycle — `dashboard.json` (root or any inner descendant).
      description: |
        The single dashboard-serving route. `dashboard.json` is per-cycle: every
        cycle owns its own live file, self-stamped with its own `campaign_id` /
        `cycle_id`. The path ids address the top-level (root) cycle; the optional
        `descend` query walks into the previous hop's L4 `.inner/<key>` sandbox one
        `campaign::cycle` hop at a time, so ONE route reads a top-level cycle, an
        inner cycle, or an L5+ descendant — the recursion-native address that
        retired the separate inner-dashboard route. Absent/empty `descend` is a
        plain per-cycle read (byte-identical to the pre-existing route). Same 304 /
        warming-fallback / atomic-read semantics at any depth (one server-side
        body, `served_dashboard`, which the SSE snapshot leads with too). The leaf `dashboard.json`
        self-stamps its own ids, so the webapp's payload-identity guard is unchanged.
        `run_phase` and `producer` (`ProducerReading`: whether a process holds the
        cycle, whether it is live, idle, wedged, held or silent, and its two clocks as
        server-measured durations) are DERIVED together at read time
        (`derive_run_state`) — the same answer `/cycles` and `/tree` serve — overriding
        what the file declares, and `Last-Modified` covers that derivation's inputs
        rather than this file's mtime alone, since the phase turns `detached` on the
        clock with nothing written. A client subtracts no clock of its own.
        `spend_metered` (`MeteredSpend`) is set at read time too, head and replay
        alike: `spend` read under the campaign's `ceiling_meter` — the bill plus what
        our rate table prices the calls no provider billed, or a controlled arm's
        search incurred — by bucket. Its `billed_usd` is what providers REPORTED and
        the one spend every surface leads with; `rate_priced_usd` sits beside it,
        never inside it, shown where `calls_rate_priced` says there is one; `metered_usd`
        is read only beside `run_limits`' spend cap, and the kinds are the breakdown under
        the bill — each with `sent` (whether a provider was reached for it) and its `prefix`
        reading, whose badge carries the kind's cache writes.
        `rounds[]` arrives in round order, and the readings decided off it are set at
        read time, head and replay alike: `ability_on_series_ruler` and
        `panel_precision_verdict` per round, `reading.panel.cut` per
        candidate row (`DashboardCandidate`), closed or in flight.
        The body names no optimizer's node in a key the bench serves.
        `current_round.candidates[]` (`LiveCandidate`) carries the round in flight
        whole: the closed-row numbers, the searchpoint as a round file's
        `candidate_scores[]` (`ScoredCandidate`) carries it historically, the sample
        tape (`samples[]`) and `validation_failures[]`;
        `current_round.nodes` holds optimizer LLM calls alone.
        `current_round.measurement_node` names the node the ledger recorded at
        `measure:enter`, and `active_node` names it while it measures.
        `current_round.racing` is the eliminator's live standing, named by its
        manifest `member` and null before a reading; `catch_up_log[]` names the
        member too. `bench_score` (`BenchScore`) is the headline, folded from the
        `bench:scored` phase record — the run's own reading, stamped with its
        `scorer_id` — and served from the launch's start for every trigger and for a cycle
        beside the line, its `status` (`BenchStatus`) saying where the bench stands and
        whether `grade-bench` is admitted now; the serve lays the live reading over the
        stored one. `run_limits` holds the bench's ceilings and `optimizer[]` — the
        run-bounding knobs the selected optimizer declares (`OptimizerLimit`), empty
        where it declares none. `run_standing` (`RunStanding`) is where the run
        stands after the last closed round — its selection, that selection's reading
        against the origin, what the cycle had cost at that close, rounds without
        advance, and the stalls it may still absorb out of their cap; before round 0
        closes it names no selection.
        `rounds[].optimizer_facts` are the optimizer's own words about each closed
        round (`OptimizerFact`), and `rounds[].bench` the bench's `BenchReading` of the
        selection that round declared — the origin and the final pick once their
        passes are sent (`CampaignConfig.bench_trigger`: on `grade-bench` under `manual`,
        by the launch itself under `at_end`), and under `each_round` every round that
        selected. The same
        reading rides `rounds[].candidates[].bench` on the candidate it read, and
        `bench_pass` (`BenchPassProgress`) is the pass in flight: its candidate's
        `label` and `sp_hash`, the rows `scored` of `rows`, and their running
        `accuracy`; `state: optimizer_step`
        names a phase the optimizer declares for itself, its words in
        `optimizer_step`.
      tags: [cycles]
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: The top-level (root) campaign id.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: cycle_id
          in: path
          required: true
          description: The top-level (root) cycle id — the key of any `.inner/` sandbox below it.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops BELOW the root, each re-rooting into
            the previous hop's `.inner/<key>`. Absent/empty = the top-level cycle. Every
            component is validated against the id charset before any filesystem touch.
          schema: { type: string }
        - name: at
          in: query
          required: false
          description: |
            A ledger offset in the LEAF cycle's own ledger — the space
            `ProjectionEnvelope.sequence`, `RayItem.offset` and `dashboard.json::at_offset`
            share, so a ray item taken from this course addresses a moment directly.
            Present, the body is the same state REPLAYED to that moment rather than the
            head's file: the same fold, given records off disk. Absent = the head, served
            from the materialized file at no fold cost — refolded the same way where
            that file does not read as this build's.

            `run_phase` is still derived at read time — it answers what the producer is
            doing NOW, which is a clock fact and not a property of the moment asked for.
            A replay takes NONE of what stands now — the armed ceilings and look-ahead,
            the verify readings, the fork remainder — because restating one as a past
            moment's would be a fabrication.
          schema: { type: integer, minimum: 0 }
        - name: If-Modified-Since
          in: header
          required: false
          description: Standard conditional-GET validator; the route 304s on an unadvanced mtime.
          schema: { type: string }
      responses:
        '200':
          description: |
            The leaf cycle's `ServedDashboard` — its banked `dashboard.json` plus what only
            the read can say, every field required — or a `WarmingDashboard`
            (`warming_up: true`) for a cycle still at check-in. Both are
            `application/served_dashboard.py`'s models.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '304':
          description: The leaf `dashboard.json` mtime has not advanced since `If-Modified-Since`.
        '404':
          description: A `descend` hop names an inner sandbox that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/cycles/{cycle_id}/rounds/{round_num}/audit:
    get:
      operationId: getCycleRoundAudit
      summary: One round's audit twin — the per-node LLM I/O the served round does not carry.
      description: |
        Read where the cycle of the chain that RAN the round wrote it, so a fork answers
        for the rounds it inherited. `null` where no twin is on disk: a round still open,
        or one that made no optimizer call.
      tags: [cycles]
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: cycle_id
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: round_num
          in: path
          required: true
          schema: { type: integer }
        - name: descend
          in: query
          required: false
          description: The dashboard route's `descend`.
          schema: { type: string }
      responses:
        '200':
          description: The audit twin, or `null`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RoundAudit'
                  - type: 'null'
        '404':
          description: Unknown cycle (or cross-tenant), or a `descend` hop names no sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/cycles/{cycle_id}/tree:
    get:
      operationId: getLineageTree
      summary: The lineage tree rooted at one cycle — the single served genealogy.
      description: |
        ONE tree, one owner. Nodes alternate `course -> candidate -> (course | sample)`
        forever, so an L4 inner run is not a special case — it is the same shape one
        level down, and L5+ needs no new tier.

        Rooted at a COURSE, not a campaign: a campaign is a bag of courses, and the
        flat campaign-rooted read this replaced could not describe a leaf below depth 1.
        `GET /campaigns` + `GET /cycles` stay the flat registry the sidebar groups.

        IDENTITY is built from each course's **ledger** (`CandidateMintedRecord`) plus
        `index.json` topology — deliberately NOT the round file. A round that never closed
        writes no round file, but it minted its candidates, and at L4 their inner campaigns
        are finished on disk under a parent that a positional read cannot name. The ledger
        is the only witness independent of round close.

        The round facts (`reading.election`, `reading.ability`, `elects_on`) come off the same ledger:
        the `ElectionRecord` stamps them at the election, and `round_closed` re-reads θ. A
        round that never elected reports **no winner** rather than promoting its lone
        candidate.

        ONE tree per campaign, and every consumer reads it. There is no `depth` dial:
        two clients choosing different depths for the same served object is how they
        came to disagree. Course recursion is bounded by a server constant instead
        (`lineage_queries.py::_MAX_COURSE_DEPTH`) — a cost bound, not a caller knob.

        Conditional-GET is a **weak ETag** over the newest mtime across the subtree's
        `ledger.jsonl` + `index.json` **plus the `lens`/`samples` query**. The ledger
        bumps per candidate, so a 5 s poll sees an in-flight candidate the moment it
        starts, which `dashboard.json`'s mtime never guaranteed. Folding the query into
        the validator is what lets a MASKED read 304: `Last-Modified` cannot express
        query-dependence, so a lens request used to recompute the whole tree on every
        poll. `Cache-Control: no-store` applies, so the browser cache never replays the
        validator — the client holds the ETag itself and sends `If-None-Match`.
      tags: [cycles]
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: The top-level (root) campaign id.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: cycle_id
          in: path
          required: true
          description: The top-level (root) cycle id — the key of any `.inner/` sandbox below it.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops to descend into before resolving the leaf,
            as on the dashboard route. Empty/absent → the caller's own tree. Send back a
            node's own `path` verbatim to root the tree at that node.
          schema: { type: string }
        - name: lens
          in: query
          required: false
          description: |
            A counterfactual overlay. `score:<formula>` = an alternative `per_cell` composite:
            every candidate's rows are re-graded under the campaign's per-sample formula and it,
            then folded — the number a fresh run under it reports — into `lens_value`, with a
            `divergence` on the spine node where that criterion would have elected someone
            else. `dials:<term=weight,…>` = the same, said as weights: realized against each
            campaign's own anchors, and the formula it was read under is served on the course
            as `lens_criterion`. Reads every standing round of each campaign the tree spans and
            grades each row once per request. `abort:<variant>`,
            variant ∈ {`epsilon_off`, `lock_in_off`, `all_off`} = switch off a PoBB abort
            contributor. Absent → the tree is the raw read. Unknown value → 400.
          schema: { type: string }
        - name: samples
          in: query
          required: false
          description: |
            The sample-set mask: a comma-separated sample-id list. Re-scores each candidate
            over only those samples into `sample_set_n` — how many of them it holds scoreable —
            and, where that is all of them, `sample_set_accuracy`. Composes
            with a `score:` lens, which then reads the same subset per cell and so stays
            exact on it; ignored for an `abort:` lens. A non-integer token → 400.
          schema: { type: string }
        - name: at
          in: query
          required: false
          description: |
            The dashboard route's `at`: a ledger offset, here naming ONE instant for the
            whole family. The cycle it is a line of is read to that line; every other
            ledger of the tree is read to its last record stamped no later, so a course
            minted after it is absent. Run-state stays the live one, as on a replayed
            dashboard. Folded into the ETag. Also taken by `…/rounds/{round_num}` (the
            round as it stood then, 404 where it had not closed) and by
            `GET /datasets/{name}/cells` under `scope=cycle`.
          schema: { type: integer, minimum: 0 }
        - name: at_cycle
          in: query
          required: false
          description: |
            The cycle `at` is an offset into, as a WHOLE path in the `descend` grammar
            (root hop included) — the viewed leaf is often a fork or an inner run of the
            tree's root. Absent → the tree's own root.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: |
            The `ETag` from a prior response for this exact query; the route 304s when
            neither the subtree nor the mask has changed. Replaces `If-Modified-Since`
            here — a single validator that covers both, rather than a time validator
            plus a "masked reads always recompute" carve-out.
          schema: { type: string }
      responses:
        '200':
          description: The course at the resolved path, and its subtree.
          headers:
            ETag:
              description: |
                Weak validator over `(subtree mtime, lens, samples)`. Send it back as
                `If-None-Match`. Distinct per mask, so a lens view has its own 304.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseNode'
        '304':
          description: Unchanged since `If-None-Match` — same subtree, same mask.
        '404':
          description: Unknown cycle (or cross-tenant), or a `descend` hop names no sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /campaigns/{campaign_id}/cycles/{cycle_id}/ray:
    get:
      operationId: getFamilyRay
      summary: The time-ray — one chronology across a course and everything below it.
      description: |
        **The absolute linear sequence of what happened.** Every other axis this API
        serves is round-indexed (`/rounds`), tree-structured (`/tree`), or spend-only —
        none of them answers "what happened, in order, and is it still happening." The
        ray does, and it is the only surface that can, because it is the only one that
        merges the ledgers of a course AND its forks AND its inner runs into one order.

        **This is also the replay endpoint** that `domain/projection_envelope.py`
        promises. The SSE tail (`events:subscribe`) unconditionally seeks to EOF, so it
        can never serve history; the ray is where history lives. Do NOT add a `since=`
        parameter to the tail — that would be a second replay mechanism.

        ### Ordering, and its stated limits

        Records merge on one key: `(ts_eff, encoded_path, offset)`. `ts_eff` applies a
        per-file monotonic clamp: each ledger is read in FILE order carrying `last_ts`,
        and `ts_eff = max(parsed_ts, last_ts)`. Records are stamped at construction but
        appended later, so a raw-timestamp sort can place a record BEFORE the record
        that caused it; append order is the one authority a single file has, and the
        clamp repairs the inversion with it rather than inventing time. A record
        arriving before its file's first parseable timestamp is skipped (a fabricated
        time would corrupt the order), while still consuming its physical offset.

        Limits, deliberately on the record:
          * Two records in different cycles inside the clock's resolution are ordered
            by encoded path — arbitrarily but stably, not by truth.
          * A clamped record displays at its predecessor's time. Gap durations use
            `ts_eff` deltas, so a clamped record contributes a zero gap — correct.
          * Clocks are one machine's. A distributed runner would need a family-scoped
            Lamport counter; that does not exist and must not be faked.

        ### The two offset spaces — never merge them

        `offset` is the **physical** 0-based line index in THAT cycle's own
        `.runtime/ledger.jsonl` — the same space as `ProjectionEnvelope.sequence` from
        the SSE tail, which is what lets a client join a live frame onto a ray item
        (`path == leafPath && offset == sequence`). It is NOT the space
        `CycleEventLog.iter(since=N)` indexes: that walks a fork's virtual
        parent-prefix + own appends. The ray reads each ledger's own FILE and never
        goes through `iter()`, because a fork's `iter()` replays the parent prefix and
        the ray already reads the parent — every parent record would appear twice.

        Ray offsets are **sparse**: server curation drops kinds, so consecutive items
        may skip offsets, and a gap between ray offsets is not a missing record.

        ### Windowing

        Newest-first selection, oldest-first delivery. `before` is an opaque cursor
        encoding the merge key of the oldest item a prior window returned; a deeper
        page is every record with a key strictly below it, so consecutive windows
        partition the key space — no overlap, no hole. A cycle discovered after the
        head fetch (a new fork) has only keys above every outstanding cursor: it
        enters at the next head fetch and can never corrupt a deep page.

        Any window revalidates with `If-None-Match` against the family's mtimes.
      tags: [cycles]
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: The top-level (root) campaign id.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: cycle_id
          in: path
          required: true
          description: The top-level (root) cycle id.
          schema: { type: string, minLength: 8, maxLength: 128 }
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops to descend into before resolving the leaf,
            as on the `tree`/`dashboard` routes. The resolved leaf is the ray's ROOT —
            the family below it is what gets merged.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: How many items to return. The window bound.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: before
          in: query
          required: false
          description: |
            An opaque cursor from a prior response's `cursor_prev`. Returns the window
            immediately older than that one. Absent = the head (newest) window.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: |
            The `ETag` from a prior response for this exact window. Every window —
            head or deep — revalidates against the family's newest ledger + index
            mtimes.
          schema: { type: string }
      responses:
        '200':
          description: One ordered window of the family's chronology.
          headers:
            ETag:
              description: Weak validator over `(limit, before, each course's path + mtimes)`.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RayResponse'
        '304':
          description: Unchanged since `If-None-Match`.
        '400':
          description: A malformed `before` cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Unknown cycle (or cross-tenant), or a `descend` hop names no sandbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /cycles:
    get:
      operationId: getCycles
      summary: Every cycle in one store + that store's active pointer — one forest.
      description: |
        A *forest* is one store's whole content: campaigns (`GET /campaigns`,
        which takes the same `descend`) grouped by their `root_cycle_id` — their
        ORIGIN — each holding the runs on that origin, and each run's cycles: its
        root plus every fork / diag, returned FLAT and related only by
        `parent_cycle_id`. Whether a consumer nests them or lays them out as
        peers is the consumer's call; the wire asserts no hierarchy.

        `descend` names the chain of cycles to descend INTO; absent/empty is the
        caller's own tenant tree. When the optimizer optimizes its own
        optimizer prompts (L4), each candidate runs as a real inner campaign under a
        flat, off-registry sandbox `<workspace>/.inner/<key>`, which is
        structurally a normal projects tree — so descending one hop returns that
        cycle's inner fan-out through this same route, and an L5+ descendant
        through two. There is no depth-specific read.

        `active_cycle_id` carries the RESOLVED store's own
        pointer: the active session at the top level, the inner loop running
        right now inside a sandbox. It is reported raw — liveness is
        `CycleListEntry.run_phase`'s job, and a consumer asking "is the pointed
        cycle live?" reads that off `cycles[]` rather than having this route
        re-derive it.

        A cycle that spawned no inner campaigns (non-L4, or the loop hasn't
        recursed yet) has no sandbox, so a `descend` hop naming it is a 404 —
        that absence is what tells the webapp to show no expand affordance.
      tags: [cycles]
      parameters:
        - name: descend
          in: query
          required: false
          description: |
            `~`-joined `campaign::cycle` hops to descend into, mirroring the
            webapp's `CyclePath`. Empty/absent → the caller's own tree. A hop's
            campaign component is carried for wire symmetry only; a sandbox is
            keyed on the cycle id.
          schema: { type: string }
        - name: campaign
          in: query
          required: false
          description: Only this campaign's cycles. Absent → every campaign's.
          schema: { type: string }
        - name: attached
          in: query
          required: false
          description: |
            `true` → only the cycles a producer holds (`producer_attached`), the
            question "what is running" asks.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: |
            Every cycle in the resolved store; `active_*` carry that store's pointer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CyclesResponse'
        '400':
          description: A `descend` hop is malformed (missing `::`) or has bad path chars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: A `descend` hop names an inner sandbox that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /commands/compact-archive:
    post:
      operationId: compactArchive
      summary: Move unread measurement fields into a gzip cold store, restore them, or purge it.
      description: |
        Archive maintenance over the CONTENT-ADDRESSED measurement store.
        Workspace-scoped — `measurements/` belongs to no campaign — so no
        `Expected-Version`. `Idempotency-Key` required.

        **This is a deletion with a receipt.** A measurement row is paid LLM
        spend, so `compact` never drops a field: it MOVES the ones nothing
        reads (`hit`, `scored`, `objective`, and `pipeline_data`'s
        `reasoning_trace` / `result_ranking` / `final_ranking` / `total_time`)
        into `measurements/cold/{file_key}.jsonl.gz`, and stamps the answer
        so a compacted row is never mistaken for one that never carried the
        field. `restore` puts them back. `purge-cold` is the only step that
        destroys, and `compact` cannot perform it.

        Applies to answers filed under the `panel` role only (a candidate's
        own walk): `origin` and `parent` serve the overwhelming majority of
        cache replays, so they are never touched.
        A row carrying `mean_round_delta` keeps its `reasoning_trace` — the L4
        narrative panel gate needs both, and a row with one but not the other
        silently changes which panel the round renders.

        Refuses outright (`archive_writers` > 0, nothing written) while any
        cycle can still append: the archive is shared across every cycle and
        appended to per sample, so a rewrite could lose a row another run is
        landing.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: compact-archive }
                    payload: { $ref: '#/components/schemas/CompactArchivePayload' }
      responses:
        '200':
          description: |
            The pass completed, or previewed. `applied` says which; every other
            field means the same thing either way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveReport'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/replace-dataset:
    post:
      operationId: replaceDataset
      summary: Version-and-repoint an existing dataset so its name frees for new data.
      description: |
        The data-safe answer to a name collision when the operator means
        "supersede the data under this name". NEVER overwrites: the old data
        + its results are preserved,
        renamed out of the way. Server, in crash-safe order:
        1. Renames `projects/{tenant}/datasets/{slug}/` to the smallest free
           `{slug}-v{n}/` (byte-identical data; self-reference fixed).
        2. Repoints every dependent campaign — `campaign.yaml::dataset_name`
           and each cycle `index.json::header.dataset_name` — onto `{slug}-vN`,
           and re-stamps that data's measurement-archive entries. After this,
           every prior campaign resolves the exact bytes it always ran on.
        3. Returns; the freed `{slug}` is then re-ingested via `/datasets/ingest`
           through the normal draft/check-in flow (a separate call).

        A `datasets/.migrations/pending/{id}.json` marker makes the migration
        resumable; a crash between steps is replayed the next time the
        workspace's stores are built, before anything reads a pin.
        Workspace-scoped — no `Expected-Version`. `Idempotency-Key` required.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: replace-dataset }
                    payload: { $ref: '#/components/schemas/ReplaceDatasetPayload' }
      responses:
        '200':
          description: |
            The migration completed. `versioned_to` is the archival name the old
            data now lives under; the counts are what moved with it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceDatasetResponse'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `nothing_to_replace` — no committed dataset holds `slug` (the name
            was removed between the collision 409 and this call).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/resolve-origin:
    post:
      operationId: resolveOrigin
      summary: Run one origin-resolver turn against a `DraftCampaign`.
      description: |
        The proposer half of the origin proposer/gate split (see
        `docs/specs/roadmap.md`). One turn: the
        origin-aware `checkin` node inspects the draft (headers, sample rows,
        current per-field provenance, open gaps) plus the operator's latest
        framing and proposes evidence-cited values for the unresolved
        origin-readiness fields. High-confidence findings auto-confirm
        (`confirmed`); low-confidence land `proposed` and wait for an operator
        click. The deterministic checklist — not the resolver — decides
        completeness; a false `ready` is re-checked and rejected.

        Synchronous (mirrors `edit-draft-campaign`): returns the resolver
        output + the post-apply `DraftCampaign`. Check-in scoped — dispatched
        through `CommandDispatcher` onto the check-in cycle's ledger, so a turn
        that moved the origin is a `CommandRecord`. No `Expected-Version`. An
        `Idempotency-Key` retry is deduped and the body re-read from
        `cache.json::resolution` + `draft.json`, so a network retry never
        re-spends the LLM call. Drives subsequent turns from the UI; bounded by
        operator interaction.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: resolve-origin }
                    payload: { $ref: '#/components/schemas/ResolveOriginPayload' }
      responses:
        '200':
          description: The resolver turn output + the post-apply `DraftCampaign`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveOriginResponse'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: |
            `draft_id` does not exist, or exists under a different
            `IdentityContext.tenant_id`. Existence-leak gate: 404, not 403.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /datasets/ingest:
    post:
      operationId: ingestDataset
      summary: Upload a tabular file; receive a server-held `DraftCampaign` with parsed preview + smart defaults.
      description: |
        Ingest path for the chat-first user web (roadmap `C1`; contract in
        `docs/specs/chat-foundation.md`). Workspace-scoped,
        identity-bound by `IdentityContext.tenant_id`. Mints a durable `checkin`
        campaign on this first action: the draft's `draft_id` IS the new
        `campaign_id`, its working state lands at
        `projects/{tenant}/campaigns/{campaign_id}/checkin/`, and on Start the
        dataset directory is written at `projects/{tenant}/datasets/{slug}/`.

        The check-in campaign appears in the sidebar immediately and survives a
        restart; nothing runs until the operator starts it via the separate
        `/commands/start-checkin` verb.
        File type is detected from the filename extension: CSV, TSV, JSON,
        JSONL/NDJSON, or XLSX (first sheet). XLSX parsing is gated off when the
        server runs `HARDENED_MODE` (Office formats are a macro/zip-bomb vector).
        Ingest is header-agnostic — any column names are accepted; for JSON the
        check-in reads the structure and proposes the mapping. The input/target
        column mapping is resolved on the draft (`column_query` /
        `column_ground_truth`) and gated at mint, not at upload.
      tags: [datasets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Tabular file (CSV/TSV/JSON/JSONL/XLSX); any column headers (header-agnostic).
                slug:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: '^[a-z0-9][a-z0-9_-]*$'
                  description: |
                    Optional slug override. Defaults to `SafeName(filename_without_ext)`.
                    Must pass `SafeName` (lowercase, alphanumerics + `_-`).
      responses:
        '200':
          description: |
            Draft created. Body is a `DraftCampaign` with `sample_preview`
            (first 10 rows), `n_samples`, smart-defaulted `connector` /
            `scoring_matcher` / `max_rounds`, and a server-minted `draft_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '401':
          description: Unauthenticated (no `IdentityContext` resolved at the middleware).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated but not permitted to ingest in this workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            Slug collides with an existing user-uploaded dataset under
            `projects/{tenant}/datasets/`. `details.suggested_slug` carries
            the smallest free `{slug}-{n}`; the operator picks or edits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Parse / shape failure — undecodable bytes, unparseable file, no
            header row, or zero data rows. `details.reason` carries the specific
            failure (`bad_csv`, `bad_json`, `empty`, `too_large`, `bad_slug`,
            `unsupported_format`, or `hardened_blocked` for an XLSX upload when
            the server runs `HARDENED_MODE`). Column names are NOT validated
            here (header-agnostic ingest).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /datasets/{name}/pipeline:
    get:
      operationId: getDatasetPipeline
      summary: A DATASET's declared pipeline — the topology of a level nothing has run.
      description: |
        What a dataset DECLARES, under its own campaign template: the node
        graph, each node's params and the reach summed over them, and the
        pipeline it nests in turn. A fact about a target, not about anyone
        running it — what a campaign RUNS is `GET /campaigns/{id}/pipeline`.
        Its one reader walks a `nests` chain below the campaign's own level.
        Wire shape: `application/pipeline_resolve.py::DatasetPipelineResponse`.
      tags: [datasets]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: The dataset's graph, param rows, reach and nested pipeline.
          content:
            application/json:
              schema:
                $ref: 'openapi.generated.json#/components/schemas/DatasetPipelineResponse'
        '404':
          description: No such dataset, or it declares no `pipeline.yaml`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /datasets/{name}/cells:
    get:
      operationId: getDatasetCells
      summary: The measurement log of one scope — every cell (candidate × sample), served ranked.
      description: |
        One read behind every measurement view. `samples` in hard-sample rank,
        `candidates` chronological within a cycle, `cells` by candidate then
        walk order (the time series); a
        client groups by bucketing under those served orders and never
        re-sorts. Grouped by sample it IS the hard-sample leaderboard. A
        round still being measured reads as a closed one does: every cell is
        the archive's row, and `CellCandidate.live` marks an arm whose walk
        is still open. `candidate_id` /
        `round` / `status` narrow the rows — a preset, not a second read.
        Wire shape: `domain/cells.py::CellsResponse`.
      tags: [datasets]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: scope, in: query, schema: { type: string, enum: [cycle, campaign, dataset], default: dataset } }
        - { name: campaign_id, in: query, schema: { type: string } }
        - { name: cycle_id, in: query, schema: { type: string } }
        - { name: descend, in: query, schema: { type: string } }
        - { name: order, in: query, schema: { type: string, enum: [info_gain, difficulty] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 50 } }
        - { name: max_unmeasured, in: query, schema: { type: integer, minimum: 0, maximum: 1000 } }
        - { name: candidate_id, in: query, schema: { type: string } }
        - { name: round, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [HIT, MISS, ERR, UNSC] } }
        - { name: at, in: query, description: "Replay `scope=cycle` to this line of the cycle's own ledger (the dashboard route's `at`); 400 on any other scope.", schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: The scope's ranked samples, its candidates and their cells.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: No such dataset, campaign or cycle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /datasets/{name}/cells/{answer}:
    get:
      operationId: getDatasetCell
      summary: One answer opened — its archive row assembled into a trace.
      description: |
        Addressed by the answer (`CellRow.answer`): a cell keeps every answer
        it was given, and a row names the one it read. One span per pipeline
        node, in chain order — the input re-rendered from the configuration's
        own node config, tokens and seconds off the row, outputs attributed
        through the dataset's schema. Assembled at read time; nothing is
        stored for it. Wire shape: `domain/cells.py::Cell`.
      tags: [datasets]
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: answer, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: The cell and its spans.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: No such dataset, or the archive holds no answer at that address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /optimizer-pipeline:
    get:
      operationId: getOptimizerPipeline
      summary: One optimizer manifest as authored — install content, no campaign scope.
      description: |
        `promptpotter/assets/optimizers/{optimizer}/pipeline.yaml` parsed: that
        optimizer's nodes, their config schema and output contracts, with no
        campaign's overlay — a campaign's own changes ride its
        `optimization.nodes` and are read off the campaign.
      tags: [campaigns]
      parameters:
        - name: optimizer
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            default: potter
          description: The manifest to read, as `optimization.optimizer` names it.
      responses:
        '200':
          description: The optimizer manifest's view, config schema and output schemas.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: No optimizer of that name is registered (`optimizer_unknown`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /optimizers:
    get:
      operationId: listOptimizers
      summary: The optimizer manifests this install can run.
      description: |
        One entry per optimizer the registry holds a runtime for
        (`application/optimizers::runtimes`, which the
        `promptpotter.optimizer_runtimes` entry points extend), each resolved
        through the same `resolve_optimizer` a run takes — so a menu offers
        exactly what `optimization.optimizer` accepts, never a hand-written
        list. `paper` is the citation a paper preset reproduces, whose declared
        knob values are that paper's configuration; null for an optimizer that
        reproduces none. Install content: no campaign scope.
      tags: [campaigns]
      responses:
        '200':
          description: The optimizer roster, the default first.
          content:
            application/json:
              schema:
                $ref: 'openapi.generated.json#/components/schemas/OptimizerRoster'

  /optimizers/{name}/knobs:
    get:
      operationId: getOptimizerKnobs
      summary: Every knob an optimizer manifest's nodes take.
      description: |
        One row per knob per node — its JSON Schema type, its closed options,
        whether null is legal, and the value the manifest declares — so a
        settings surface draws one control per knob and writes a campaign's
        `optimization.nodes.{node}.config.{key}`. Install content: no campaign
        scope, no auth beyond the server's own.
      tags: [campaigns]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The manifest's knob menu.
          content:
            application/json:
              schema:
                $ref: 'openapi.generated.json#/components/schemas/OptimizerKnobsResponse'
        '404':
          description: No such manifest ships with this install.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /datasets/{name}/draft:
    post:
      operationId: draftFromExistingDataset
      summary: Open an authored dataset as a durable check-in campaign.
      description: |
        The direct path behind "open this dataset in the ingest panel" — a demo /
        benchmark / owned dataset becomes a prefilled check-in (`draft_id` ==
        `campaign_id`) with no browser-side CSV round-trip. **Mints a campaign**,
        so it is a state-creating POST, not a read. Identity-gated through the
        same resolver as the other dataset reads; nothing runs until the operator
        starts it via `/commands/start-checkin`.
      tags: [datasets]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The prefilled draft wire (same shape every draft-returning endpoint emits).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Unknown dataset, or one outside this tenant (existence-leak gate).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /origins/{origin_id}/draft:
    post:
      operationId: draftFromOrigin
      summary: Open a prior origin as a prefilled check-in campaign ("Reuse an origin").
      description: |
        Resolves the origin's EXACT prompt fields: a campaign itself minted from
        an origin carries those fields on its root-cycle seed, so they are reused
        verbatim. The draft is marked `reused_origin_id`, so starting it
        (`/commands/start-checkin`) seeds C0 via `origin_override` and stamps the
        `campaign_origin` lineage. **Mints a campaign** — a state-creating POST.
      tags: [origins]
      parameters:
        - name: origin_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The prefilled draft wire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Unknown origin, or one outside this tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /sessions/active:
    get:
      operationId: getActiveSession
      summary: The caller-tenant's active-session pointer.
      description: |
        The three ids naming this tenant's LATEST launch (`new`, Start or a fork, from
        any entry point), read off `.workspace/active_session.json` — the terminal's
        default `resume` target and what an unpinned webapp follows. It is not the
        set of live runs: several may run at once, and each is a `/cycles` entry whose
        `run_phase` says so. The webapp polls it on the live 2 s beat so a new launch
        is followed promptly.

        **There is no 404 on this route, deliberately.** "No active session" is a
        steady state — nothing launched yet, or the workspace was cleared — so it
        answers 200 with null ids, like `/cycles` does with
        `active_cycle_id`. A 404 would classify as `gone` on the
        client ("stop, this address is dead") and, on a route polled every 2 s from
        boot, would log a warning per tick for the whole idle life of the server.
      tags: [Sessions]
      responses:
        '200':
          description: The active pointer; ids null when no session is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSessionResponse'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /machine-status:
    get:
      operationId: getMachineStatus
      summary: Machine occupancy — how many campaigns may run here, and how many do.
      description: |
        What the webapp polls to say the machine is full *before* the operator
        presses. `busy` is `running >= capacity` against the same resolver
        `JobRegistry.request_slot` admits on, so banner and gate can never
        disagree. It means "you will wait", not "you cannot start": a full box
        queues the launch.

        `capacity` is resolved per read rather than fixed at startup — it is the
        operator's `MACHINE_RUN_CAPACITY` ceiling, lowered while the shared
        provider throttle is saturated and never raised above it.

        Occupancy is not relative to who asks, so the caller's own run counts in
        `running` and their own holder record is named like anyone else's. The
        one caller-scoped field is `queue`, which lists only their waiting
        launches; everyone else's are counted in `queued`.
      tags: [Sessions]
      responses:
        '200':
          description: Machine occupancy and the oldest live run, if any.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineStatusResponse'
        '401':
          description: Unauthenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /datasets/draft/candidate-library:
    post:
      operationId: uploadCandidateLibrary
      summary: Attach a candidate library to a draft, fulfilling a `candidate_source` dependency.
      description: |
        The operator's "drop in place" for an unfulfilled pipeline dependency: when
        the draft's active pipeline has a `candidate_source` node (declared by the
        connector's node types), the draft's `dependencies` block reports a
        `candidate_library` dependency `fulfilled: false`. This uploads the target
        list — one entry per line for `.txt`, else the first column of a
        CSV/TSV/JSON/JSONL/XLSX — onto the in-flight draft. On commit it
        materializes to `{slug}/candidate_library.txt` alongside the per-pipeline
        origin, and the run unions it into the session's term index.

        Soft dependency — it sharpens the candidate pool but does NOT gate mint
        (the answers already in the data are a runnable pool). A multipart ingress
        for `edit-draft-campaign`: the parsed terms become that command's
        `patch.candidate_library` and dispatch through `CommandDispatcher`, so the
        edit lands on the check-in cycle's ledger like every other origin mutation.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, draft_id]
              properties:
                file:
                  type: string
                  format: binary
                  description: Target library — one entry per line (.txt), or a single-column CSV/Excel.
                draft_id:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: The draft to attach the library to (the check-in `campaign_id`).
      responses:
        '200':
          description: |
            Library attached. Body is the updated `DraftCampaign`; its
            `dependencies` block now reports the `candidate_library` dependency
            `fulfilled: true` and `candidate_library_size` carries the entry count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '404':
          description: Draft not found (or owned by another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Parse failure or empty library. `details.reason` is the specific
            failure (`bad_csv`, `bad_json`, `unsupported_format`, `empty`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /datasets/draft/candidate-library/from-column:
    post:
      operationId: buildCandidateLibraryFromColumn
      summary: Build a draft's candidate library from one of its own columns.
      description: |
        The unified "build from dataset" path: when the targets already live in
        the data (the ground-truth/target column, the union of the dataset's
        category sheets), derive the candidate library from the distinct values of
        a chosen column rather than uploading an external file. Blanks and the
        TermNorm `--` placeholder are dropped; order preserved, duplicates
        collapsed. Like its upload sibling, the derived terms dispatch as
        `edit-draft-campaign`'s `patch.candidate_library`.
      tags: [datasets]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [draft_id, column]
              additionalProperties: false
              properties:
                draft_id:
                  type: string
                  minLength: 8
                  maxLength: 128
                column:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: One of the draft's `headers` to take distinct values from.
      responses:
        '200':
          description: |
            Library built. Body is the updated `DraftCampaign`; its
            `candidate_library` dependency reads `fulfilled: true` and
            `candidate_library_size` carries the distinct-value count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftCampaign'
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '404':
          description: Draft not found (or owned by another tenant).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: |
            Column is not one of the draft's `headers`, the draft has no cached
            rows, or the column has no usable values (`details.reason: empty`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID-or-equivalent identifying this command attempt.
        The dispatcher dedupes by hash lookup against the target ledger; a
        second POST with the same `Idempotency-Key` returns the original 202
        response, not a fresh command.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
    ExpectedVersion:
      name: Expected-Version
      in: header
      required: false
      description: |
        The ledger offset (or round number, for round-grained commands) the
        client believes the target cycle is at. The runner rejects the command
        with 409 `version_conflict` if the cycle has advanced past this point.
        Optimistic-concurrency floor.

        **v0 relaxation (Phase 2b):** the header is declared optional in v0
        because the webapp's mutation surface does not yet thread ledger
        sequence numbers from the SSE stream through to mutations. The
        dispatcher validates the version when the header IS present and
        skips the check otherwise. Phase 2c flips this back to `required:
        true` once the webapp consumes sequence from `EventStreamView`.
      schema:
        type: integer
        minimum: 0

  schemas:
    CommandEnvelope:
      type: object
      required: [kind, payload]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: |
            The command kind. MUST be one of the kinds declared in this
            file's `paths` keys (the closed set). Examples once Profile B
            lands: `pause-cycle`, `fork-cycle`,
            `change-run-limits`. See `docs/adr/0001-m12-control-plane.md`
            Profile B table.
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]*$'
        payload:
          description: |
            Per-kind payload. Each declared operation in `paths` overrides
            this with a tighter schema (using `$ref` or inline). The base
            envelope only guarantees the field is present.
          type: object
          additionalProperties: true

    # Idempotent: a second POST with the same `Idempotency-Key` returns the same
    # `command_id`.
    CommandAcceptedBody:
      $ref: 'openapi.generated.json#/components/schemas/CommandAcceptedBody'

    CycleHop:
      type: object
      description: One `(campaign, cycle)` step of a CyclePath.
      required: [campaign_id, cycle_id]
      additionalProperties: false
      properties:
        campaign_id: { type: string }
        cycle_id: { type: string }

    # The read shapes below are the Pydantic models' own: each is a pointer to the schema
    # `scripts/build_openapi.py` emits off the model, never a second copy of it.
    LineageDivergence:
      $ref: 'openapi.generated.json#/components/schemas/LineageDivergence'
    ArmPanel:
      $ref: 'openapi.generated.json#/components/schemas/ArmPanel'
    ArmSpend:
      $ref: 'openapi.generated.json#/components/schemas/ArmSpend'
    ArmAbility:
      $ref: 'openapi.generated.json#/components/schemas/ArmAbility'
    ArmElection:
      $ref: 'openapi.generated.json#/components/schemas/ArmElection'
    ArmReading:
      $ref: 'openapi.generated.json#/components/schemas/ArmReading'
    ScoreboardRow:
      $ref: 'openapi.generated.json#/components/schemas/ScoreboardRow'
    DashboardCandidate:
      $ref: 'openapi.generated.json#/components/schemas/DashboardCandidate'
    ForkStamp:
      $ref: 'openapi.generated.json#/components/schemas/ForkStamp'
    LensShift:
      $ref: 'openapi.generated.json#/components/schemas/LensShift'
    MainLineStep:
      $ref: 'openapi.generated.json#/components/schemas/MainLineStep'

    ArmNode:
      $ref: 'openapi.generated.json#/components/schemas/ArmNode'
    CourseNode:
      $ref: 'openapi.generated.json#/components/schemas/CourseNode'
    RoundAudit:
      $ref: 'openapi.generated.json#/components/schemas/RoundAudit'
    RayItem:
      $ref: 'openapi.generated.json#/components/schemas/RayItem'
    RayResponse:
      $ref: 'openapi.generated.json#/components/schemas/RayResponse'

    ErrorEnvelope:
      type: object
      required: [error, message, error_id]
      additionalProperties: false
      properties:
        error:
          type: string
          description: |
            Stable error code. The whole API serializes errors to this one flat
            envelope (no `detail` wrapper) — every code below maps from a
            `PotterError` subclass at the single `main.py` handler. Control-plane
            specifics: `version_conflict` (409), `idempotency_key_missing` (400),
            `command_kind_unknown` (404), `slug_collision` (409),
            `inner_cycle_unaddressed` (422 — a kind that is the outer run's, sent a `descend` tail),
            `machine_busy` (409), `cycle_busy` (409), `backend_unreachable` (503),
            `admission_gate_stuck` (503 — a process is wedged inside the
            machine-wide admission window, so occupancy cannot be read and
            nothing was started; retryable),
            `ingest_failed` / `origin_incomplete` / `pipeline_config_invalid`
            (422), `stored_config_invalid` (500). Generic families:
            `bad_request` (400), `unauthenticated`
            (401), `capability_denied` (403), `not_found` (404), `too_large`
            (413), `request_invalid` (422), `service_unavailable` (503),
            `internal_error` (500). New codes require a YAML update first.
          enum:
            - version_conflict
            - idempotency_key_missing
            - expected_version_missing
            - capability_denied
            - command_kind_unknown
            - command_target_not_found
            - payload_invalid
            - inner_cycle_unaddressed
            - tenant_mismatch
            - slug_collision
            - machine_busy
            - cycle_busy
            - backend_unreachable
            - ingest_failed
            - origin_incomplete
            - pipeline_config_invalid
            - stored_config_invalid
            - nothing_to_replace
            - resolver_failed
            - backend_sync_failed
            - identity_not_initialised
            - provider_not_configured
            - provider_unknown
            - bad_request
            - unauthenticated
            - not_found
            - too_large
            - request_invalid
            - service_unavailable
            - internal_error
        message:
          type: string
          description: Human-readable explanation; never load-bearing for clients.
        error_id:
          type: string
          description: |
            Short hex handle stamped on EVERY error response and written to the
            same server log line (`api error [<id>] <method> <path> -> <status>
            <code>`; a 500 logs its traceback under the same handle). It is the
            one thing that ties an opaque client-side failure to its server-side
            cause, so a bug report quotes it instead of a wall-clock guess — the
            webapp surfaces it through Account → Copy diagnostics. Minted at the
            single `main.py::_error_response` seam; never reused, never
            client-supplied.
        details:
          type: object
          additionalProperties: true
          description: |
            Optional per-error structured detail.

            * `version_conflict` — `expected_version` (client sent) +
              `actual_version` (runner observed).
            * `slug_collision` (409 on `/datasets/ingest`) — `suggested_slug`
              carrying the smallest free `{slug}-{n}`, and `slug` (the colliding
              name) so the chat can offer "use existing / save as new".
            * `machine_busy` — **no launch command returns this.** A full box
              QUEUES rather than refuses, so `mint-campaign`, `start-checkin`,
              `start-run` and `fork-cycle` all accept and the launch waits its
              turn. The code survives for the terminal's `--no-wait`, which asks
              to be refused instead; it carries the holder presence record
              `holder_user`, `campaign_id`, `cycle_id`, `started_at`. What the
              webapp reads is `GET /machine-status` — occupancy, and the
              caller's own place in line.
            * `cycle_busy` (409 on `start-run`, `step-cycle` and
              `start-checkin`) — the targeted cycle already has an unfinished
              job (queued included), so a second launch would put two
              producers on one ledger. Carries that job: `job_id`, `status`,
              `holder_user`, `campaign_id`, `cycle_id`, `started_at`.
            * `backend_unreachable` (503 on any command that needs the
              backend reachable) — `backend_type` (connector name) and
              `backend_url` (configured URL) — the IDENTITY of what refused.
              The REMEDY is the connector probe's own and rides `message`: a
              surface renders that, never a sentence rebuilt from these two,
              which cannot say why.
            * `ingest_failed` (422 on `/datasets/ingest`) — `reason`
              ∈ `bad_csv` | `bad_json` | `empty` | `too_large` | `bad_slug` |
              `unsupported_format` | `hardened_blocked`. (Ingest is
              header-agnostic — it no longer rejects on column names; column
              identity is resolved on the draft, gated at mint. `hardened_blocked`
              is an XLSX upload refused while the server runs `HARDENED_MODE`.)
            * `origin_incomplete` (422 on `/commands/start-checkin`)
              — `gaps`: a list of `{field, reason, hint}` objects naming each
              origin field that still blocks mint. `reason` ∈ `unset` |
              `proposed_unconfirmed`. The deterministic origin-readiness
              checklist — not the operator — is the source of truth for
              completeness (see `docs/specs/roadmap.md`).
            * `stored_config_invalid` (500 on any read of a stored config the
              server itself persisted) — `path` (the workspace-relative file)
              and `reason` (what the parse or validation rejected, naming the
              offending key). Distinct from `pipeline_config_invalid` (422),
              which rejects config the *caller* supplied: this one means data on
              disk stopped satisfying the code that reads it — typically a knob
              dropped from `CampaignConfig` (`extra="forbid"`) while a file
              written earlier still names it. It is a 500 because the caller did
              nothing wrong and cannot fix it; the remedy is the
              `promptpotter restamp --apply` verb, which `deploy-linux/update.sh`
              runs on every deploy.
            (`internal_error` carries no `details`: its trace handle is the
            top-level `error_id`, which every error now has.)

    # ---- Read-surface shapes (the forest's cycle list, at any depth) ----
    # Mirrors promptpotter/domain/cycle_listing.py::CycleListEntry
    # + CyclesResponse. GET /cycles serves it at every depth via ?descend=
    # (declared above) — top level, an L4 cycle's inner fan-out, or L5+.

    # Mirrors promptpotter/domain/phases.py::RunAdmission — served on every dashboard body
    # (`ServedDashboard`, `WarmingDashboard`), every `/cycles` entry and every `/tree` course, and the answer
    # `start-run` / `step-cycle` / `pause-cycle` / `origin-gate-decision` / `skip-searchpoint` /
    # `set-sample-lookahead` are refused on (409). An INNER cycle answers every run verb but the
    # look-ahead with that verb's own sentence — the one `inner_cycle_unaddressed` (422) carries
    # when the verb is sent at it — so it is offered no verb the command would refuse.
    RunAdmission:
      $ref: 'openapi.generated.json#/components/schemas/RunAdmission'
    PauseReading:
      $ref: 'openapi.generated.json#/components/schemas/PauseReading'
    CycleListEntry:
      $ref: 'openapi.generated.json#/components/schemas/CycleListEntry'
    BandedValue:
      $ref: 'openapi.generated.json#/components/schemas/BandedValue'
    OwnLevel:
      $ref: 'openapi.generated.json#/components/schemas/OwnLevel'
    BenchReading:
      $ref: 'openapi.generated.json#/components/schemas/BenchReading'
    BenchScore:
      $ref: 'openapi.generated.json#/components/schemas/BenchScore'
    BenchStatus:
      $ref: 'openapi.generated.json#/components/schemas/BenchStatus'
    CyclesResponse:
      $ref: 'openapi.generated.json#/components/schemas/CyclesResponse'

    # ---- Per-kind command payloads (v0 closed set) ----
    # Each `*Payload` schema is the `payload` field of one command kind.
    # Naming matches the kind: `pause-cycle` -> `PauseCyclePayload`.

    CycleRef:
      type: object
      required: [campaign_id, cycle_id]
      additionalProperties: false
      description: |
        Reusable cycle reference. The trust-boundary identifier — every
        cycle-scoped command names its target by this pair (never by a
        cookie-derived pointer or an `active_session.json` lookup).
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Campaign id ({dataset}__{rand6_hex}). Deliberately UNPATTERNED, like every
            other id here: the shape is minted, not parsed, and a regex in this file is
            a second rule that can disagree with `CampaignPayload` — which is the half
            that actually refuses. Bounds live on the model.
        cycle_id:
          type: string
          minLength: 1
          maxLength: 128
          description: 'Content-addressed cycle id (`cycle_{target_hash[:12]}` + optional sibling suffix).'
        descend:
          type: [string, 'null']
          maxLength: 512
          description: |
            Inner-sandbox tail of the address, in the read side's `?descend=` grammar
            (`campaign::cycle`, `~`-joined): the hops BELOW the root that `campaign_id` /
            `cycle_id` name. Absent addresses the root hop. Every cycle-scoped kind takes it
            and one seam resolves it, so a viewed inner cycle is always sent as its whole
            address. `set-sample-lookahead` and `verify-candidate` act on the inner cycle;
            every other kind refuses it with 422 `inner_cycle_unaddressed`, its sentence
            naming why that kind is the outer run's — never applied to the root instead. For a
            run verb that sentence is the one the inner cycle's `run_admission` serves.

    PauseCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              maxLength: 512
              description: |
                Why the pause was asked for, recorded on the `CommandRecord`. The
                CLI's `pause --reason` has always sent it; declaring it here is
                what makes the two entry points one contract.

    OriginGateDecisionPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [decision]
          additionalProperties: false
          properties:
            decision:
              type: string
              enum: [rescore, proceed, abort]
              description: |
                `rescore` re-scores the origin force-fresh and re-evaluates the
                gate; `proceed` overrides the gate into L1; `abort` ends the
                cycle with `StopReason.ORIGIN_GATE`.

    SkipSearchpointPayload:
      $ref: '#/components/schemas/CycleRef'

    GradeBenchPayload:
      $ref: '#/components/schemas/CycleRef'

    SetSampleLookaheadPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [cells]
          additionalProperties: false
          properties:
            cells:
              type: integer
              minimum: 1
              description: >
                How many calls the scoring round may hold in flight. `1` clears it —
                one on-disk state for "never set" and "cancelled", so the two cannot read
                alike. Recorded as sent and clamped by the walk to the backend's declared
                ceiling (`dashboard.json::max_cells_in_flight`), so a value above it runs at the
                ceiling rather than being rejected. The depth also ends on its own — after the
                round that scores under it — so `1` is a cancel, not the normal way it ends.
            auto:
              type: boolean
              default: false
              description: >
                Hold as many calls as the stop rules allow, up to the ceiling, every round and
                past a fresh launch, until an `auto: false` press replaces it; `cells` is ignored
                while it stands. `false` is the one-round press.

    CancelQueuedRunPayload:
      type: object
      additionalProperties: false
      required: [job_id]
      properties:
        job_id:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          minLength: 1
          maxLength: 128
          description: |
            The queued job to withdraw, from `GET /machine-status`'s `queue`. Not a
            `CycleRef`: the queue holds launch INTENT, and a queued mint names no
            cycle until the drainer runs it.

    SetConcurrentCyclesPayload:
      type: object
      additionalProperties: false
      required: [max_concurrent_cycles]
      properties:
        max_concurrent_cycles:
          type: integer
          minimum: 1
          description: |
            The caller's own account limit, queued launches included. At most
            `GET /machine-status`'s `ceiling`; a larger value is refused, never
            clamped.

    StepCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            rounds:
              type: integer
              minimum: 1
              maximum: 100
              default: 1
              description: Rounds to advance before auto-pausing.

    VerifyCandidatePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          required: [candidate_id]
          properties:
            candidate_id:
              type: string
              minLength: 1
              maxLength: 128
              description: >-
                The searchpoint, as `GET /evidence` addresses one: `candidate_id` on its round
                file's `candidate_scores` row. The origin is addressed the same way — and with
                `descend`, an L4 inner candidate is verified like a top-level one.
            strategy:
              type: string
              enum: [random, hard]
              default: random
              description: >-
                Which unseen cells to buy: `random` from the unmeasured search pool, or `hard`
                — the highest-δ cells on the cycle's ruler first.
            seed:
              type: integer
              nullable: true
              description: Seeds the pick. Omit for an unseeded draw.
            samples:
              type: integer
              minimum: 1
              maximum: 10000
              nullable: true
              description: >-
                Additional cells to score. OMIT for the derived budget, which is the
                intended use; an explicit count above it is refused 422.

    RewindToRoundPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
              description: Target round number (inclusive); events past this round are dropped.

    ForkCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          required: [seed]
          properties:
            round:
              type: integer
              minimum: 0
              description: Round the searchpoint the operator steered from.
            candidate_id:
              type: string
              maxLength: 128
              description: |
                Candidate the operator steered from — the point the edits in
                `seed` are rooted on (`operator_steered`).
            reason:
              type: string
              maxLength: 512
              description: |
                Why the operator cut this fork, stamped as the `ForkSpec`'s
                reason. Empty names the act itself.
            keep_rounds:
              type: boolean
              default: false
              description: |
                Which of the two acts this fork is. `false` (default) is
                `operator_steered`: a clean offshoot branching from the origin,
                re-scoring the edited searchpoint, rounds numbered from 1. `true`
                is `operator_rewind` — rounds `0..round-1` are LIFTED from the
                parent and the fork continues at `round` under the seed's
                overrides. That is what an "apply this from here" press means, and
                the same act the terminal spells `resume --rewind N`. It refuses a
                seed carrying `origin_prompt_fields`: the lifted round 0 already
                IS the origin, so declaring a second one is contradictory.
            seed:
              $ref: '#/components/schemas/CycleSeed'
            from_round:
              type: integer
              minimum: 0
            no_divergence_check:
              type: boolean
              default: false
            fork_on_divergence:
              type: boolean
              default: false
            diag:
              type: boolean
              default: false
              description: |
                With the three above, the shape of the fork's FIRST run — the
                fields `start-run` carries, read the same way, applied to the
                cycle this command mints. Omitted, the fork runs as a plain
                `start-run` of it would.

    CycleSeed:
      type: object
      additionalProperties: false
      description: |
        `domain/run_records.py::CycleSeed` as a fork sends it — the chosen
        starting point that makes a fork's origin = chosen searchpoint +
        operator edits. `origin_source` is not sent: the dispatcher stamps
        `fork_seed`. Required on every operator fork.
        Under `keep_rounds` the origin is the LIFTED round 0 instead, so only the
        override half of this applies and `origin_prompt_fields` is refused.
        Persisted to the fork's ledger as a read-once `CycleSeedRecord` (read at
        init) and onto the parent's `FORK_CUT` ledger record.
      properties:
        origin_prompt_fields:
          type: object
          additionalProperties: true
          description: |
            The fork's origin prompt — a `PromptTemplate.prompt_field_dict()`
            shape (the 8 prompt fields). Becomes the origin `OptSearchPoint` at
            init. `{}` inherits the parent's origin prompt.
        pipeline_overlay:
          type: object
          additionalProperties: true
          description: |
            `nodes.*.config` value overlay for this fork only, merged ON TOP of the
            dataset overlay (seed > dataset > backend default). The dataset
            `pipeline.yaml` stays immutable — the steer never mutates the origin.
            Param *locks* ride `optimizer_narrowing`, not this block.
        optimizer_narrowing:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            description: Per-node search-space narrowing (NodeSearchNarrowing).
            properties:
              param_keys:
                type: array
                nullable: true
                items:
                  type: string
                description: |
                  The tunable param subset (unlocked keys) the optimizer may mutate;
                  `null` inherits the full declared set. Keys absent here are locked.
              param_allowed_values:
                type: object
                additionalProperties:
                  type: array
                  items: {}
                description: Per-param allowed-value subset (enum narrowing).
          description: |
            Per-fork search-space lock edits keyed by node name — overrides the
            campaign's mint-time `optimizer_narrowing` for THIS cycle only (the
            cycle-level peer of `CampaignConfig.optimizer_narrowing`). Absent
            inherits the campaign-wide locks unchanged.
        node_narrowing:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ParamIntent'
          description: |
            The same narrowing said as row intents, keyed by node name — what a
            surface drew. The dispatcher reads them against the rows the forked
            cycle serves (`pipeline_schema.py::narrowing_of`) into `optimizer_narrowing`,
            declaring a value space only where the operator moved it off the menu.
            Sent INSTEAD of `optimizer_narrowing`; both together is a 422.
        config_overrides:
          $ref: '#/components/schemas/ConfigOverrides'

    ParamIntent:
      type: object
      additionalProperties: false
      required: [key, open, allowed]
      description: |
        One config row as an operator set it. A free-valued param is read by
        `open` (its padlock); an axis (`enum` / `model`) by `allowed` (its
        ticks), where one value left is the pin.
      properties:
        key:
          type: string
        open:
          type: boolean
        allowed:
          type: array
          items:
            type: string

    ConfigOverrides:
      type: object
      additionalProperties: false
      description: |
        The fork's campaign-config delta. Every field optional — absent
        inherits the parent's value; applied to the fork's snapshot at init,
        never mutates the parent's frozen config. Three kinds of knob ride here:
        (1) the bench's run limits (`max_rounds`/`ceiling`)
        — ABSOLUTE values the reconcile dialog re-sets (defaults to the parent's
        remaining, e.g. "3 of 6 rounds left"); (2) `nodes`, the fork's delta over
        the selected optimizer manifest — every knob its nodes take, which
        `GET /optimizers/{name}/knobs` lists; (3) the composite
        criterion (`scoring`), which sits on `CampaignConfig` itself rather than
        under `optimization`. Every policy knob invalidates search comparability,
        so a fork-at-offset-0 is how you A/B one without touching the manifest or
        the parent cycle.
      properties:
        max_rounds:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Absolute L1-round ceiling for the fork. `0` measures the origin and stops.
        ceiling:
          $ref: '#/components/schemas/SpendCeilings'
          description: |
            Absolute spend caps for the fork, in USD and cumulative tokens. A null
            arm inherits: the USD arm takes what the parent's cap has left, the
            token arm the parent's own.
        nodes:
          type: object
          description: |
            The fork's delta over the selected optimizer manifest, keyed by node name —
            `{node: {config: {...}}}`, the shape a target pipeline's overlay takes.
            Every optimizer knob rides here, resolved against the campaign's manifest
            before the fork is minted (an unknown node or a refused value is a 422);
            the fields around it are the bench's own. No field here switches the
            manifest: a head-to-head between optimizers is two campaigns, not a fork.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              config:
                type: object
                additionalProperties: true
        scoring:
          oneOf:
            - type: string
            - type: object
              additionalProperties: { type: string }
          nullable: true
          description: |
            The composite-fitness criterion (`CampaignConfig.scoring`) — a formula
            string (the per-sample formula, replacing the block), or a
            `{per_sample, per_cell}` map laid key by key over the parent's block.
            The ONE override a mask can preview against the record: a `score:F`
            lens IS `{per_cell: F}`, re-grading rows already measured, so the round
            the preview parts at is the round a `keep_rounds` fork carrying this is
            minted at. Every other field here
            moves a ceiling or a patience count, which no measurement can be
            re-read under, so those forks preview nothing.

    DeleteCyclePayload:
      $ref: '#/components/schemas/CycleRef'

    CleanupEmptyCyclesPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          description: |
            `cycle_id` here names any cycle in the family; the dispatcher
            resolves it to its root and sweeps every empty stub under that
            root (matching `cleanup_empty_stubs` semantics).

    # The three operator-set launch ceilings. Written out on EACH declaring payload rather than
    # $ref'd as one branch: `additionalProperties: false` only sees `properties` in its own schema
    # object, so folding these in via `allOf` would close the payload against the very fields it
    # declares. One model serves all three (`domain/launch_limits.py::LaunchLimits`, which each
    # payload inherits) — keep the copies identical. The set is mint-campaign, start-run and
    SpendCeilings:
      type: object
      additionalProperties: false
      description: |
        What a run may spend, in both units (`domain/spend.py::SpendCeilings`) — the
        one pair a launch asks, admission holds, the run's process arms and the
        dashboard serves. An arm omitted or `null` declares nothing: no ceiling of
        the caller's own on a launch, that arm left unchanged on `change-run-limits`.
        Whichever arm is met first halts the cycle.
      properties:
        usd:
          type: [number, "null"]
          minimum: 0
          description: |
            USD ceiling. Must be FINITE — `NaN` satisfies a `minimum` and then
            never compares true, and the spend book's probe is `spent >= cap`.
        tokens:
          type: [integer, "null"]
          minimum: 0
          description: |
            Cumulative-token ceiling (optimizer + backend, input + output), the
            model-portable twin of `usd` and the one that still binds when a model
            has no rate on file.

    # start-checkin: every verb that BEGINS spending, which is what makes it the whole set.
    MintCampaignPayload:
      type: object
      required: [dataset_name]
      additionalProperties: false
      properties:
        halt_at_accuracy:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Stop once the optimizer's declared pick reaches this accuracy. Omitted, the run
            never halts on accuracy. Must be FINITE — `NaN` satisfies a
            `minimum`/`maximum` pair and then never compares true, so a halt that
            can never fire looks identical to no halt at all.
        ceiling:
          $ref: '#/components/schemas/SpendCeilings'
          description: |
            This run's ceiling. One the account cannot cover is refused whole
            (ADR-0003 § D1); one it can may lower the campaign's ceiling, never
            raise it.
        step_rounds:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            A round allowance: the launch pauses (resumable, `run.pause.cause: step`)
            once it has closed this many rounds. `step-cycle` is a launch that
            declares only this. Unset, the round cap and the controller end the run.
        dataset_name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Dataset under `datasets/{dataset_name}/` to mint a campaign for.
            No `pattern`: `MintCampaignPayload` refuses to carry one so that the slug
            ingest mints off a filename stays the ONE rule, and a copy here was that
            second rule.
            Campaign-from-origin (reuse a chosen prior origin) rides the DRAFT
            path instead — `POST /origins/{origin_id}/draft` prefills a check-in
            with the origin's exact prompt fields, then `start-checkin` seeds C0
            (`campaign_origin` lineage). This verb mints the dataset's own
            authored origin only.
        optimization:
          $ref: '#/components/schemas/OptimizationOverrides'
          description: |
            Which optimizer this campaign runs and its knobs, laid over the
            dataset's `campaign.yaml::optimization` before the mint freezes it —
            only the fields SENT move anything. Validated as the check-in's and
            the terminal's `--set` are, by the one resolution a run takes: an
            optimizer this install lacks is a 404 `optimizer_unknown`, a knob its
            manifest refuses a 422. Omitted, the dataset's own declaration runs.
        arm:
          type: object
          required: [head_to_head_id, arm_key]
          additionalProperties: false
          description: |
            Mint as a CONTROLLED arm of a head-to-head (`head_to_heads/{id}.json`).
            The first arm declares it off its own bench set (instrument, dataset rows,
            split, held-out rows, scorer, target models, origin) and budget; a later arm
            on any other is refused 409 `arm_off_bench_set`, a key another arm
            holds 409 `arm_taken`. An arm reads no other campaign's measurements,
            refuses fork/skip/limit commands 409, and its spend ceiling is its
            search's INCURRED USD, the bench pass metered beside it. Omitted, the
            campaign optimizes with everything that helps.
          properties:
            head_to_head_id:
              type: string
              pattern: '^[A-Za-z0-9_-]+$'
              minLength: 1
              maxLength: 64
            arm_key:
              type: string
              pattern: '^[A-Za-z0-9_-]+$'
              minLength: 1
              maxLength: 64
        diag:
          type: boolean
          default: false
          description: |
            Run the fresh campaign in the diagnostic shape — origin, one scored
            round, a forced task-framing refinement, a generation-only round,
            halt. The CLI's `new --diag`. A fresh mint has no ledger to rewind or
            replay, so the other run-mode flags are `start-run`'s alone.
        campaign_config:
          type: object
          additionalProperties: true
          description: |
            A campaign declaration standing in for the dataset's own
            `campaign.yaml::campaign_config` — the same document, validated as
            `application/campaign_config.py::CampaignConfig` (an unknown key is a
            422). `optimization` above still lays over it. The CLI's
            `new --config FILE`, sent as the file's content. Omitted, the
            dataset's own declaration is minted.
        task_text:
          type: string
          minLength: 1
          maxLength: 16384
          description: |
            The task description this campaign is framed from, in place of the
            dataset's `task_description.md`. The CLI's `new --task-text` /
            `--task-file`, sent as the text.
        backend_url:
          type: string
          minLength: 1
          maxLength: 2048
          default: http://127.0.0.1:8000
          description: |
            Where the dataset's connector reaches its backend. The CLI's
            `new --backend-url`.
        backend_id:
          type: string
          minLength: 1
          maxLength: 64
          default: local
          description: |
            The registry id that backend is recorded under (`/backends`). The
            CLI's `new --backend-id`.

    StartRunPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            halt_at_accuracy:
              type: number
              minimum: 0
              maximum: 1
              description: |
                Stop once the optimizer's declared pick reaches this accuracy. Omitted, the run
                never halts on accuracy. Must be FINITE — `NaN` satisfies a
                `minimum`/`maximum` pair and then never compares true.
            ceiling:
              $ref: '#/components/schemas/SpendCeilings'
              description: |
                This run's ceiling — the CLI's `--spend-budget` / `--token-budget`.
                One the account cannot cover is refused whole (ADR-0003 § D1); one it
                can may lower the campaign's ceiling, never raise it.
            step_rounds:
              type: integer
              minimum: 1
              maximum: 100
              description: |
                A round allowance: the launch pauses (resumable, `run.pause.cause: step`)
                once it has closed this many rounds. `step-cycle` is a launch that
                declares only this. Unset, the round cap and the controller end the run.
            from_round:
              type: integer
              minimum: 0
              description: |
                Rewind IN PLACE before running: rounds after this one are dropped
                from the cycle and the run continues from the round after it.
                Omitted, the run continues where the ledger stands. The CLI's
                `resume --from N`. Refused on a round the ledger never closed.
            no_divergence_check:
              type: boolean
              default: false
              description: |
                Replay the cycle's recorded decisions without checking that the
                current config still reproduces them — accept a divergence instead
                of refusing on it. The CLI's `resume --no-check`.
            fork_on_divergence:
              type: boolean
              default: false
              description: |
                Where the replay diverges from the record, branch a sibling cycle
                at that point and run it, leaving this cycle untouched. Without it
                a divergence ends the run `diverged`. The CLI's
                `resume --fork-on-divergence`.
            diag:
              type: boolean
              default: false
              description: |
                Run the diagnostic shape — origin, one scored round, a forced
                task-framing refinement, a generation-only round, halt. Against a
                cycle that already finished a diagnostic run (and no `from_round`),
                the run is a counted sibling cycle `{root}_diag_NNN`, so each probe
                is its own cycle. The CLI's `resume --diag`.

    ChangeRunLimitsPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          anyOf:
            - required: [ceiling]
            - required: [max_rounds]
          description: |
            At least one of `ceiling.usd` / `ceiling.tokens` / `max_rounds` must be
            present — the model refuses a `ceiling` with both arms unset, which this
            `anyOf` cannot say. An arm that is omitted leaves that ceiling unchanged,
            in the running job's reservation and the cycle's standing record alike,
            each from its own prior. Whichever ceiling is met first halts the cycle.
          properties:
            ceiling:
              $ref: '#/components/schemas/SpendCeilings'
              description: |
                The cycle's new ceiling. An arm set to `0` halts the cycle at the
                next checkpoint; raising it above what is already spent releases
                the halt.
            max_rounds:
              type: [integer, "null"]
              minimum: 0
              description: |
                New L1 round cap for the cycle, read at the next round boundary.
                `null` lifts it, so the spend ceiling governs; a cap at or below
                the rounds already run halts after the current round. Not clamped
                against the account — a round is not money.

    ChangePipelineParamPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [node, param, value]
          additionalProperties: false
          properties:
            node:
              type: string
              minLength: 1
              maxLength: 64
              description: 'Node name in the backend pipeline (key under `nodes.{name}` overlay).'
            param:
              type: string
              minLength: 1
              maxLength: 64
              description: 'Param key within the node config (e.g. `model`, `temperature`).'
            value:
              description: |
                New value. Type is per-param — string for `model`, number for
                `temperature`, etc. Validated against the schema PromptPotter
                discovers via `GET /pipeline` (zero backend-specific constants).
              oneOf:
                - { type: string }
                - { type: number }
                - { type: integer }
                - { type: boolean }
                - { type: 'null' }

    RegisterBackendPayload:
      type: object
      required: [name, backend_type, base_url]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Human-readable backend name.
        backend_type:
          type: string
          minLength: 1
          maxLength: 64
          description: Backend connector type (e.g. `termnorm`, `promptpotter`).
        base_url:
          type: string
          format: uri
          description: Backend API base URL (trailing slash stripped server-side).
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9-]*$'
          description: 'Custom backend id; auto-derived from `name` when omitted.'


    # ---- Forward-scope payloads (beyond v0; same closed-set policy) ----

    CampaignRef:
      type: object
      required: [campaign_id]
      additionalProperties: false
      description: |
        Workspace-scoped reference (campaign-level, no cycle). Lifecycle
        commands ride the campaign's root cycle ledger; the dispatcher
        resolves ``campaign_id -> root_cycle_id`` from ``campaign.json``.
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Campaign id ({dataset}__{rand6_hex}). Unpatterned for the same reason as
            `CycleRef.campaign_id`: `CampaignPayload` is the half that refuses, and it
            carries bounds only.

    CampaignLifecyclePayload:
      allOf:
        - $ref: '#/components/schemas/CampaignRef'
        - type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              maxLength: 512
              description: |
                Optional operator-supplied reason for the lifecycle
                transition. Stored on ``campaign.json::lifecycle_reason``;
                empty string is the unset form.

    # Written out rather than `allOf`'d onto `CampaignLifecyclePayload`, for the reason
    # `MintCampaignPayload` gives — keep `campaign_id` and `reason` identical to it.
    DeleteCampaignPayload:
      type: object
      required: [campaign_id]
      additionalProperties: false
      properties:
        campaign_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Campaign id ({dataset}__{rand6_hex}), bounded as in `CampaignRef`.
        reason:
          type: string
          maxLength: 512
          description: |
            Optional operator-supplied reason for the lifecycle transition. Stored
            on ``campaign.json::lifecycle_reason``; empty string is the unset form.
        keep_results:
          type: boolean
          default: false
          description: |
            When ``true`` the destructive delete spares the keepsake tier
            (manifest + reports + the shallow ``langfuse/{traces,observations,
            scores}`` loop trace) and drops only the heavy resume / audit /
            mirror tiers. When ``false`` (default) the whole campaign tree is
            removed. The cross-campaign measurement cache is never touched
            either way.

    ArchiveCyclePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          additionalProperties: false
          properties:
            reason:
              type: string
              minLength: 1
              maxLength: 512
              description: 'Operator-supplied reason; stored on the archive marker for audit.'

    ChangeSampleBudgetPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [sp_budget_round]
          additionalProperties: false
          properties:
            sp_budget_round:
              type: integer
              minimum: 1
              description: |
                Per-round PoBB sample budget (the adaptive queue narrows the
                scoring bank to this many samples each round via
                `select_round_subset`). Lower = cheaper rounds, weaker signal.

    ResetPipelineOverlayPayload:
      $ref: '#/components/schemas/CycleRef'

    ChangeScoringCompositePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [composite]
          additionalProperties: false
          properties:
            composite:
              type: object
              additionalProperties: true
              description: |
                The `scoring` block as it would be written to `campaign.json`.
                Validated server-side against ScoringContext; reject as 422
                `payload_invalid` when the composite references unknown
                evaluator ids.

    SetCampaignLabelPayload:
      allOf:
        - $ref: '#/components/schemas/CampaignRef'
        - type: object
          required: [label]
          additionalProperties: false
          properties:
            label:
              type: string
              maxLength: 200
              description: |
                The operator's name for this campaign, replacing any previous one and
                trimmed of surrounding whitespace. Empty restores the dataset-name
                fallback. Display only — nothing addresses a campaign by it.

    MarkHardSamplePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [sample_id]
          additionalProperties: false
          properties:
            sample_id:
              type: string
              minLength: 1
              maxLength: 128
              description: 'Dataset-local sample id (`datasets/{name}/dataset.json` row id).'

    UnmarkHardSamplePayload:
      $ref: '#/components/schemas/MarkHardSamplePayload'

    AnnotateRoundPayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round, note]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
              description: Round number the note is attached to.
            note:
              type: string
              minLength: 1
              maxLength: 4000
              description: Free-form operator note; stored verbatim in `round_NNNN.json::operator_notes`.

    EndorseCandidatePayload:
      allOf:
        - $ref: '#/components/schemas/CycleRef'
        - type: object
          required: [round, candidate_id, verdict]
          additionalProperties: false
          properties:
            round:
              type: integer
              minimum: 0
            candidate_id:
              type: string
              minLength: 1
              maxLength: 128
            verdict:
              type: string
              enum: [endorsed, rejected]
              description: |
                Operator verdict. Stored on the round's audit trail; L2/L3
                may consume in later profiles (no behavior change in v0).

    ForkPreviewRequest:
      type: object
      required: [pipeline_overlay]
      additionalProperties: false
      description: |
        The in-progress steer, and only the half the verdict reads. The rest of an
        `CycleSeed` — the origin prompt, the narrowing, the reconciled
        limits — decides nothing here, and asking for it would let a caller believe
        the answer covered them.
      properties:
        pipeline_overlay:
          type: object
          additionalProperties: true
          description: |
            The `nodes.*.config` value overlay the fork would carry, exactly as
            `CycleSeed.pipeline_overlay` sends it.

    # The verdict and the set it was reached against are served together: apart, the
    # sentence an operator reads can name models that had nothing to do with the answer.
    ForkPreviewResponse:
      $ref: 'openapi.generated.json#/components/schemas/ForkPreviewResponse'
    CampaignPipelineResponse:
      $ref: 'openapi.generated.json#/components/schemas/CampaignPipelineResponse'

    OptimizationOverrides:
      type: object
      additionalProperties: false
      description: |
        The campaign-config knobs a draft carries, as one object — materialized
        into the committed `campaign.yaml::optimization` block. Operator-facing
        (UI) vocabulary. Sent whole on `DraftCampaign`; on the edit patch and on
        `mint-campaign` any subset is merged depth-first onto the current value —
        `nodes` node by node and knob by knob, and naming another `optimizer`
        drops the previous one's `nodes` — then resolved against the manifest it
        selects (a new knob is one property here, not a fresh field threaded
        through every surface).
      properties:
        max_rounds:
          type: integer
          minimum: 0
          maximum: 100
          default: 5
          description: |
            Round ceiling; `0` measures the origin and stops. Smart-default `5`
            (matches the M10 prompt-iteration
            framework default). Operator-editable.
        optimizer:
          type: string
          minLength: 1
          default: potter
          description: |
            The optimizer manifest this campaign runs — a name under
            `assets/optimizers/`, or one a registered package ships. Every
            entry point selects it here; nothing selects it install-wide.
        nodes:
          type: object
          description: |
            The campaign's overlay on the selected manifest, keyed by node name —
            `{node: {config: {...}}}`, the shape a target pipeline's overlay
            takes. An optimizer's knobs, a paper's configuration and each llm
            node's `config.model` all ride here.
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              config:
                type: object
                additionalProperties: true

    # The draft every check-in route answers with, under the name this file's commands use
    # for it. `draft_id` IS the owning `campaign_id`; identity scope rides the tenant prefix,
    # so the wire never carries a per-record `tenant_id` (ADR-0002 no-drift gate #3). Its
    # pipeline block is a second DELIVERY of `GET /campaigns/{id}/pipeline`'s answer, never a
    # second source.
    DraftCampaign:
      $ref: 'openapi.generated.json#/components/schemas/DraftCampaignWire'

    ResolveOriginPayload:
      type: object
      required: [draft_id]
      additionalProperties: false
      description: |
        One resolver turn against an existing `DraftCampaign`. Tenant-scoped —
        a `draft_id` resolving to a different `IdentityContext.tenant_id`
        returns 404 (existence-leak gate).

        `message` is what the operator just said ("the ground truth is the
        `answer` column"). It is distinct from the draft's
        `raw_task_description`, which is the *task framing field* the resolver
        may propose and the operator confirms — conflating the two meant a
        correction could only be delivered by overwriting the framing. The
        message is turn-scoped: it rides the `CommandRecord` payload as the
        operator's verbatim contribution to the thread, and is not persisted
        onto the draft.
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 128
          description: The check-in `campaign_id` (the draft's `draft_id`), from `/datasets/ingest`.
        message:
          type: string
          maxLength: 4000
          description: The operator's turn. Omitted or empty on an unprompted turn.

    ActiveSessionResponse:
      $ref: 'openapi.generated.json#/components/schemas/ActiveSessionResponse'
    MachineStatusResponse:
      $ref: 'openapi.generated.json#/components/schemas/MachineStatusResponse'
    # A proposal the resolver raises is awaiting a click: a high-confidence finding is
    # confirmed inside the turn and never raised, so the model's `confidence` is a
    # server-side policy input, never a wire field.
    ResolveOriginResponse:
      $ref: 'openapi.generated.json#/components/schemas/ResolveOriginResponse'

    EditDraftCampaignPayload:
      type: object
      required: [draft_id, patch]
      additionalProperties: false
      description: |
        Sparse mutation of an existing `DraftCampaign`. Only declared fields
        in `patch` are accepted; omitted fields are unchanged. Tenant-scoped
        — the dispatcher rejects `draft_id`s that resolve to a different
        `IdentityContext.tenant_id` with 404 (existence-leak gate).
      properties:
        draft_id:
          type: string
          minLength: 8
          maxLength: 128
          description: The check-in `campaign_id` (the draft's `draft_id`), from `/datasets/ingest`.
        patch:
          type: object
          additionalProperties: false
          description: |
            Sparse subset of mutable `DraftCampaign` fields. Slug edits run
            the same collision check as ingest (409 on conflict).
          properties:
            slug:
              type: string
              minLength: 1
              maxLength: 64
              # Verbatim from `_EditDraftPatch.slug`, which enforces it. The copy here
              # admitted a leading digit the model refuses.
              pattern: '^[a-z][a-z0-9_-]*$'
            connector:
              type: string
              minLength: 1
              maxLength: 64
            scoring_matcher:
              type: string
              minLength: 1
              maxLength: 64
            scoring_dials:
              type: string
              maxLength: 512
              description: The empty string clears the dials.
            optimization_overrides:
              allOf:
                - $ref: '#/components/schemas/OptimizationOverrides'
              description: |
                The campaign-config knobs (`max_rounds` / `optimizer` / `nodes`). The
                sent keys are merged onto the draft's current overrides — send one knob
                or several; `nodes` merges node by node and key by key. Validated against
                `OptimizationOverrides` and the selected manifest's node knobs
                server-side (rejects unknown keys, an out-of-range `max_rounds`, a node
                the manifest does not declare, a knob value its node refuses).
            raw_task_description:
              type: string
              maxLength: 16384
              description: |
                Sets the task framing. An operator edit CONFIRMS it, opening the
                origin-readiness gate for the field (checklist id `task_description`).
            pipeline_overlay:
              type: object
              additionalProperties: true
              description: 'Replaces (not deep-merges) the prior `nodes.*.config` overlay.'
            node_narrowing:
              type: object
              additionalProperties:
                type: array
                items:
                  $ref: '#/components/schemas/ParamIntent'
              description: |
                A node's config rows as the operator set them, keyed by node name.
                `pipeline_schema.py::narrowing_of` reads each against the served row
                and writes that node's `optimizer` block onto the overlay — over
                `pipeline_overlay` where this patch carries one. A key the node does
                not carry is a 422.
            node_output:
              type: object
              additionalProperties: false
              required: [node, output_schema]
              description: |
                One node's authored output contract. The server picks the answer slot
                (the named field, else the one it had, else `answer`, else the last
                field) and, on a node's FIRST schema, switches it to `json` and
                re-opens `response_format` as an axis.
              properties:
                node:
                  type: string
                  minLength: 1
                output_schema:
                  type: object
                  additionalProperties: true
                answer_field:
                  type: string
                  nullable: true
            column_query:
              type: string
              maxLength: 256
              description: |
                Confirm which uploaded header is the input column. Must be a
                member of the draft's `headers` (422 otherwise). Setting it
                moves `field_provenance["column.query"]` to `confirmed`.
            column_ground_truth:
              type: string
              maxLength: 256
              description: |
                Confirm which uploaded header is the target column. Same
                membership rule; moves `field_provenance["column.ground_truth"]`
                to `confirmed`.
            origin_prompt_fields:
              type: object
              additionalProperties: true
              description: |
                Replaces (not deep-merges) the draft's origin prompt — the editor
                sends the full `PromptTemplate.prompt_field_dict()` object.
            pipeline_steps:
              type: array
              items: { type: string }
              description: |
                The active pipeline step list (`["llm_only"]` vs the full
                cache_lookup→…→token_matching). The setup-panel mode toggle writes it.
            candidate_library:
              type: array
              minItems: 1
              items: { type: string }
              description: |
                The origin's target library. `POST /datasets/draft/candidate-library`
                and its `/from-column` sibling derive this value from an upload or a
                column and dispatch it as this patch — they are alternate ingresses
                for `edit-draft-campaign`, not separate write paths.

    StartCheckinPayload:
      type: object
      required: [campaign_id]
      additionalProperties: false
      description: |
        Start-verb payload. The durable check-in draft stays the canonical source
        for everything the campaign IS — no field of it is overridable here. The
        three launch ceilings are not draft fields: they bound what THIS launch
        may spend, exactly as on `start-run` and `mint-campaign`, and omitting
        them from this payload is what left the web Start unable to declare a
        budget that CLI `new <file>` takes on the same three seams. Tenant-scoped;
        404 on a cross-tenant `campaign_id` (or one with no check-in working state).
      properties:
        halt_at_accuracy:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Stop once the optimizer's declared pick reaches this accuracy. Omitted, the run
            never halts on accuracy. Must be FINITE — `NaN` satisfies a
            `minimum`/`maximum` pair and then never compares true.
        ceiling:
          $ref: '#/components/schemas/SpendCeilings'
          description: |
            This run's ceiling. One the account cannot cover is refused whole
            (ADR-0003 § D1); one it can may lower the campaign's ceiling, never
            raise it.
        step_rounds:
          type: integer
          minimum: 1
          maximum: 100
          description: |
            A round allowance: the launch pauses (resumable, `run.pause.cause: step`)
            once it has closed this many rounds. `step-cycle` is a launch that
            declares only this. Unset, the round cap and the controller end the run.
        campaign_id:
          type: string
          minLength: 8
          maxLength: 128
          description: |
            The check-in campaign id (the draft's `draft_id` IS this id — re-keyed
            at `create_checkin_campaign`), returned by `/datasets/ingest`.
        diag:
          type: boolean
          default: false
          description: Run the diagnostic shape, as `mint-campaign`'s `diag` does.
        backend_url:
          type: string
          minLength: 1
          maxLength: 2048
          default: http://127.0.0.1:8000
          description: |
            Where the draft's connector reaches its backend, as on `mint-campaign`.
            A launch fact rather than a draft field: the draft names the connector,
            not the host it answers on. The CLI's `new <file> --backend-url`.
        backend_id:
          type: string
          minLength: 1
          maxLength: 64
          default: local
          description: |
            The registry id that backend is recorded under (`/backends`). The
            CLI's `new <file> --backend-id`.

    # A check-in keeps its provisional `cycle_chk_{rand}` id as the permanent root: drift
    # reads `root_content_hash`, never the parsed id.
    StartCheckinResponse:
      $ref: 'openapi.generated.json#/components/schemas/StartCheckinResponse'

    ReplaceDatasetPayload:
      type: object
      required: [slug]
      additionalProperties: false
      description: |
        Names the committed dataset whose data is being superseded. The new
        data is NOT carried here — it is re-ingested under the freed name in a
        separate `/datasets/ingest` call after this returns.
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            The colliding dataset name to version-and-repoint away. Unpatterned:
            `ReplaceDatasetPayload` carries bounds only, and the one slug regex that
            does exist lives on `_EditDraftPatch.slug`.

    # A bare acknowledgement: the archival name and the repointed counts are recorded by the
    # migration itself (log line + on-disk marker), never read back off the wire.
    ReplaceDatasetResponse:
      $ref: 'openapi.generated.json#/components/schemas/DatasetReplaced'

    CompactArchivePayload:
      type: object
      required: [mode]
      additionalProperties: false
      description: |
        Which archive maintenance step to run, and over which dataset. `apply`
        is false by default on purpose: every mode is previewable, and the
        preview is the operator's whole basis for consenting to a step that
        costs real money to undo.
      properties:
        mode:
          type: string
          enum: [compact, restore, purge-cold]
          description: |
            `compact` moves the unread fields of candidate runs into the gzip
            cold store. `restore` puts them back and drops the payload.
            `purge-cold` deletes the cold store — the ONE irreversible step,
            and deliberately not something `compact` can do on its own.
        dataset:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Scopes the pass to one dataset. Omitted means every dataset, which
            no entry point offers as a default.
        apply:
          type: boolean
          default: false
          description: Write. Omitted or false previews and touches nothing.

    # Identical shape for a preview and an apply — `applied` is what separates them — so a
    # client cannot render a preview in units the apply does not honour.
    ArchiveReport:
      $ref: 'openapi.generated.json#/components/schemas/ArchiveReport'
    # One row of `GET /datasets`: a flat list with a `tier` discriminator, where a `yours`
    # slug shadows an `install` one of the same name.
    DatasetIndexEntry:
      $ref: 'openapi.generated.json#/components/schemas/DatasetIndexEntry'

  responses:
    CommandAccepted:
      description: |
        Command appended to the canonical ledger as a `CommandRecord`. The
        runner will apply it asynchronously and emit a `CommandAckRecord`
        observable via the SSE channel; clients MUST NOT treat this 202 as
        confirmation that the mutation has been applied (no client-side
        optimistic mutations — security checkbox #17).
      headers:
        Idempotency-Key:
          description: Echo of the request's `Idempotency-Key`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommandAcceptedBody'

    VersionConflict:
      description: |
        `Expected-Version` did not match the cycle's current ledger offset.
        Client SHOULD refresh state from the SSE snapshot and retry with
        the new version. Returned with 409 status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    IdempotencyKeyMissing:
      description: Request omitted the mandatory `Idempotency-Key` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    CapabilityDenied:
      description: |
        Authenticated identity lacks the capability required for this
        command kind. Returned with 403 status. At Profile B (auth-off),
        the Stage-0 default identity has all capabilities granted; this
        response begins to fire at Profile C with real OIDC subjects.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    PayloadInvalid:
      description: |
        Command body failed schema validation for the declared kind.
        Returned with 422 status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    CommandTargetNotFound:
      description: |
        The command names a target (campaign, cycle, backend) that either
        does not exist or belongs to a different identity. Existence-leak
        gate: 404, not 403. Shape pinned in
        `docs/operations/persistence-and-state.md` § Beta hosting state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    BackendUnreachable:
      description: |
        Configured backend (TermNorm or another `Connector`) did not respond
        to the dispatcher's preflight probe. The operator-facing fix is
        "start the backend and retry"; the dispatcher does not retry
        internally. `details.backend_type` + `details.backend_url` identify
        which backend failed so the frontend can render a specific message.
        Returned with 503 status. Sole source: `admission.py::probe_backend`,
        which raises it off the reason `Connector.preflight(...)` answers,
        before any applier runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: pp_session
      description: |
        Opaque server-side session id (NOT a JWT). Issued by the OIDC
        middleware at Profile C after ID Token verification; per
        identity-foundation no-drift gate #2 the cookie itself carries no
        claims. At Profile B (auth-off), this scheme is declared but the
        Stage-0 default identity is returned unconditionally.
