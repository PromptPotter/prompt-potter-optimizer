# PromptPotter Control-remote — closed inbound command set
#
# This file is the source of truth for the inbound HTTP command surface.
# Every `POST /commands/{kind}` operation MUST be declared here BEFORE a
# handler lands in `promptpotter/presentation/api/routers/commands.py`.
#
# THIS FILE IS NOT THE SERVED SURFACE, and never was. It owns the command
# contract plus nine reads; the app serves ~30 more endpoints (all of /auth,
# /backends, /evidence, /workspace/storage*, the
# SSE stream, the file reads). Those are described by the generated companion
# `openapi.generated.json` — reality, emitted from the FastAPI app by
# `scripts/build_openapi.py` and gated in CI. Read that one to learn what the
# app runs; read this one to learn what it promises. A difference between them
# is information (something declared-not-wired), not automatically drift.
#
# Drift detection:
#   - CI regenerates `openapi.generated.json` and fails on any diff, so what the app
#     SERVES is always current.
#   - The declared/wired partition below is read against `commands.py::_WIRED_KINDS`
#     at commit time, not by a standing test: a kind declared live whose POST 404s is
#     a loud, first-call failure, and a test comparing two YAML key sets breaks on
#     every rename instead. See tests/CLAUDE.md for the three admission axes.
#
# DECLARED != WIRED. Because this file is schema-first, a declared operation may
# have no handler yet. Those carry `x-status: declared-not-wired`; a POST to one
# 404s `command_kind_unknown`. The key is documentation, not machine-read, and
# absence means WIRED — so it is written only when it says something: the second
# value is `wired-scheduled-for-removal`, a live route whose consumers are being
# migrated off it. Declaring a route
# that is about to go makes its removal a visible diff instead of a silence.
# A schema PROPERTY takes the same key with the same two values: a field no code
# writes yet, and the field it replaces.
#
# READS HAD NO BUCKET, and that is why several shipped undeclared. §0's five I/O
# kinds define Control-remote as MUTATION, so a GET adds no kind and needed no
# amendment — but it owes the same declare-before-handler discipline a command
# owes. The recipe is `docs/developer/adding-a-surface.md` § 9; the two reads
# added to this file in that arc (`/datasets/{name}/pipeline`,
# `/optimizer-pipeline`) were both already live and undeclared when it started.
# The wired set is `commands.py::_WIRED_KINDS` plus
# the four typed routes (edit-draft-campaign, resolve-origin, start-checkin,
# replace-dataset). Check it before promising a UI button — chat-foundation.md
# once advertised `endorse-candidate` as live on the strength of this file alone.
#
# Permanent contract: docs/adr/0001-m12-control-plane.md
# §0 definition: docs/architecture.md § State + persistence — the five I/O kinds

openapi: 3.1.0

info:
  title: PromptPotter Control-remote API
  version: 0.0.0-profile-minus-1
  summary: Closed inbound command set for the M12 Control-remote I/O kind.
  description: |
    The HTTP command surface for PromptPotter's interactive control plane.
    Every operation is a Control-remote command: an HTTP-ingressed mutation
    authored by a signed-in operator or signed-in client, appended to its
    target ledger (the per-cycle `.runtime/ledger.jsonl` or the workspace
    `.workspace/events.jsonl`, per command scope) as a `CommandRecord` by the
    sole `CommandDispatcher`.

    See `docs/adr/0001-m12-control-plane.md` for the permanent contract, the
    Profile gradient (A-E), and the 20-item security checklist that every
    handler is measured against.

    Conformance: handlers MUST reject any request that omits the
    `Idempotency-Key` header. State-mutating handlers MUST additionally
    reject any request that omits the `Expected-Version` header. Mismatch
    on `Expected-Version` returns 409 `version_conflict`.

  contact:
    name: PromptPotter maintainers
  license:
    name: See repository LICENSE

servers:
  - url: http://localhost:8001
    description: Local dev (uvicorn + auth-off, Stage 0 / Profile B default).
  - url: https://{install}.promptpotter.com
    description: Hosted hub (Profile D — placeholder, OIDC required).
    variables:
      install:
        default: example
        description: Per-install hostname slug.

tags:
  - name: cycle-control
    description: Commands that mutate a single cycle's state (pause, resume, step, rewind).
  - name: cycle-lifecycle
    description: Commands that mint, fork, or delete cycles.
  - name: budget
    description: Commands that change halt / spend / round budgets mid-cycle.
  - name: pipeline-params
    description: Commands that mutate pipeline_params on the active cycle.
  - name: scoring
    description: Commands that mutate the scoring composite or steer file.
  - name: operator-feedback
    description: Operator-authored signals — hard-sample marks, round notes, candidate verdicts.
  - name: backends
    description: Commands that register external backends. (There is no sync verb.)
  - name: datasets
    description: |
      Workspace-scoped dataset ingest. These endpoints mint a durable `checkin`
      campaign and mutate its server-held `DraftCampaign` before the loop runs;
      the eventual Start IS a command (`/commands/start-checkin`) declared above.
  - name: cycles
    description: |
      Read-only cycle reads. `descend` is the one inner-descent mechanism across
      them: a `~`-joined `campaign::cycle` hop chain that re-roots the read into
      `.inner/<key>`, so `/cycles` (the forest) and `/dashboard` (one leaf)
      each serve the top level, an L4 inner fan-out, and L5+ through the same
      handler. NOTE: this file began as the closed *command* set, so some read
      GETs predate it and are not yet declared; the remaining pre-existing read
      drift is tracked separately, not resolved here.

# v0 closed inbound command set — DRAFT for operator redline.
#
# Sources of this draft:
#   - sanctioned POSTs migrated off active.py / backends.py (fork,
#     delete, cleanup-empty, register-backend).
#   - 2 CLI verbs hoisted into the wire surface (mint-campaign = `new`,
#     start-run = `resume` / launcher per ADR-0001 control plane).
#   - M12-new commands (pause, step, rewind-to-round, change-run-limits,
#     change-pipeline-param) — plan-listed v0 candidates. `pause-cycle` is the
#     single operator-interrupt verb: the worker exits cleanly, the cycle stays
#     resumable, and `start-run`/`resume` relaunches it (there is no `stop-cycle`
#     or in-place `resume-cycle`).
#
# Each operation:
#   - is `POST /commands/{kebab-kind}` — one literal path per kind, one
#     operationId per path. Path tail matches `CommandEnvelope.kind`.
#   - declares `Idempotency-Key` (every command). State-mutating
#     cycle-scoped commands additionally declare `Expected-Version`.
#     Workspace-scoped backend commands (register-backend,
#     register-backend) intentionally omit `Expected-Version` —
#     they do not mutate a specific cycle's ledger offset.
#   - declares a request body schema that pins `kind` to a const literal
#     and refers to a per-kind `*Payload` schema in components.schemas.
#   - declares the closed response set: 202 CommandAccepted +
#     400 IdempotencyKeyMissing + 403 CapabilityDenied + 422 PayloadInvalid,
#     plus 409 VersionConflict on cycle-scoped commands.
paths:
  /commands/pause-cycle:
    post:
      operationId: pauseCycle
      summary: Pause a running cycle — the single operator-interrupt verb.
      description: |
        Delivered by the ledger it is recorded on: the command is acked
        `accepted`, the running loop reads it at its next checkpoint, exits
        cleanly and acks it `applied`, and the cycle stays **resumable**
        (non-terminal, no `finished_at`) with the pause's cause on its `paused`
        declaration (`run.pause`). Refused (409) where no run of the cycle could
        take it — including a launch still queued or starting, which
        `cancel-queued-run` withdraws. There is no separate `stop-cycle`; resuming is the
        `start-run`/`resume` launcher relaunching from the last completed round
        (the worker is gone, so there is no in-place `resume-cycle`). Idempotent.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: pause-cycle }
                    payload: { $ref: '#/components/schemas/PauseCyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/cancel-queued-run:
    post:
      operationId: cancelQueuedRun
      summary: Withdraw a launch that is waiting for a machine slot.
      description: |
        `pause-cycle`'s twin for a launch that has not started. It cannot serve
        one: a queued **mint** has no cycle whose ledger could carry the command,
        and the campaign it will create does not exist yet. So the address is the
        JOB, and the scope is the workspace.

        A queue with no cancel is a trap — the operator can join it and then only
        wait. Cancelling a queued `fork-cycle` also cleans up the stub fork the
        dispatcher minted before enqueuing (`cleanup_stub_fork_if_empty`), which
        is the one queued kind that leaves disk behind.

        Owner-only: a caller may withdraw their own queued launches and no one
        else's, whatever capability they hold.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: cancel-queued-run }
                    payload: { $ref: '#/components/schemas/CancelQueuedRunPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/set-concurrent-cycles:
    post:
      operationId: setConcurrentCycles
      summary: Set how many campaigns the caller's own account may hold at once.
      description: |
        Rewrites `user.json::max_concurrent_cycles` for the CALLER's account and
        records who asked on the workspace ledger. The limit counts running and
        queued launches alike (`check_launch_quotas`); lowering it below what is
        already in flight stops nothing, it refuses the next launch.

        Requires `campaign.budget`, the rung that moves spend ceilings: more runs
        at once is a faster draw on the same wallet. Holding the rung is not
        enough on the host's provider key. There the limit is the host's bound on
        that person, written in `user.json` alone, so the command answers 422
        `concurrency_set_by_host`; only an account spending its own key moves
        its own. `GET /auth/quota-status` serves which case the caller is in as
        `max_concurrent_cycles_writable`.

        Refused with 422 `concurrency_above_machine` above the machine's
        `MACHINE_RUN_CAPACITY` (`GET /machine-status`'s `ceiling`), which stays
        environment-configured and has no command.
      tags: [budget]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: set-concurrent-cycles }
                    payload: { $ref: '#/components/schemas/SetConcurrentCyclesPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/set-sample-lookahead:
    post:
      operationId: setSampleLookahead
      summary: Set how many calls the scoring round holds in flight — host-admin only.
      description: |
        Recorded on the cycle's ledger and read there by the run (`cells: 1` without `auto`
        disarms, and is acked `applied` at once). A press is acked `accepted` and `applied` by
        the round that scored under it; one sent while no run could take it is refused (409),
        `auto` excepted, which stands across launches. While set, the round holds that many calls at once instead of one — its candidates walk together
        and decide in turn — cutting the wall clock of its scoring roughly in proportion.

        **The request is recorded unclamped; the walk clamps it** to the backend's declared
        `Connector.max_cells_in_flight`, which is where the connector being walked is known.
        `dashboard.json` serves `max_cells_in_flight` (the ceiling, `1` meaning the control does
        not apply to this backend) and `sample_lookahead` — **the depth in force, and the only
        reading of it there is**, re-read from the ledger on the way out of the dashboard route and
        the SSE snapshot, so a press is visible on the next poll rather than at the next launch.
        Beside them, the round's own gauge: `in_flight`, `lookahead_allowed` (what the stop rules
        let the round hold right now) and `lookahead_most` (the most it could hold were nothing
        cut) — each summed over every candidate walking and the PoBB catch-ups, and between
        rounds `lookahead_most` is the next round's, so a press can be sized before it applies.
        Every sentence the control says is served beside them, so a client words none from the
        counts: `lookahead_unavailable` (why the control does not apply to this backend, else
        empty), `lookahead_explained` (the mode in force, its bound and the calls discarded so
        far) and `lookahead_money_hold` (what the spend limits still admit, where they and not
        the armed depth hold the walk; null otherwise).

        **The depth lasts ONE ROUND of scoring** and is cleared when that round's scoring
        completes, so one set outside a scoring phase waits for the next round rather than
        expiring unused. **`auto: true` asks for no depth at all**: every round holds as many
        calls as its stop rules allow, up to the ceiling, until an `auto: false` press replaces
        it; `cells` is ignored while it stands, and it is served as
        `dashboard.json::sample_lookahead_auto`. Leaving it on is safe because the walk launches
        no further than one cell past the earliest row a stop rule could cut at. This is the same
        on every backend: a connector declares the ceiling and cannot declare how long a depth
        lasts, because it cannot see whether the walk in front of it is inside a round. The walk
        re-reads the ledger at every launch boundary, so a press mid-walk tops the window up rather
        than waiting for it to drain.

        **The measurement is unchanged, at any depth.** Samples are
        acquired in parallel but absorbed in walk order, and an acquisition still in flight when
        the walk stops is discarded rather than recorded — so the rows a candidate persists and
        the sample it is cut at do not depend on how many were in flight. Because nothing
        measured changes, this does **not** set `human_intervened` — unlike `skip-searchpoint`,
        which does. The cost is at most one discarded acquisition per cut candidate; for a
        nested-campaign backend even that is recovered, since a cancelled cell resumes from the
        rounds it had already banked.

        **Either LAYER is set by naming it.** An L4 inner cycle is addressed by the optional
        `descend` tail rather than by the outer campaign, because the outer's depth is
        deliberately not inherited downward — one press would otherwise multiply concurrency at
        every nested level at once. So setting the outer runs N inner campaigns together, and
        setting one of those inner runs holds N of its own rows in flight.

        Requires `campaign.lookahead` — its own rung rather than a share of babysit, because it
        spends the box's shared provider rate bucket and is therefore the one power a host may
        want to withhold from a delegate. Deliberately has **no CLI verb**: the browser remote
        is the only surface, which is the boundary itself.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: set-sample-lookahead }
                    payload: { $ref: '#/components/schemas/SetSampleLookaheadPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/origin-gate-decision:
    post:
      operationId: originGateDecision
      summary: Resolve the round-0 origin gate (rescore / proceed / abort).
      description: |
        Delivered to a runner blocked at the origin gate (`run_phase: gate`):
        the round-0 origin verdict was not `healthy`, so the loop paused before
        L1 instead of optimizing against a broken floor. `rescore` re-scores the
        origin force-fresh (reflecting a backend-code fix) and re-evaluates the
        gate in place; `proceed` overrides the gate and enters L1; `abort` ends
        the cycle with `StopReason.ORIGIN_GATE`. The command on the cycle's
        ledger IS the decision: the gate reads it there and acks it `applied` as
        it takes it — the one channel every surface writes, a terminal's typed
        answer and an embedding host's included. Refused (409) while no gate is
        open, so a decision is never acked and then dropped.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: origin-gate-decision }
                    payload: { $ref: '#/components/schemas/OriginGateDecisionPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/skip-searchpoint:
    post:
      operationId: skipSearchpoint
      summary: Cut the searchpoint being scored now; the cycle continues.
      description: |
        Operator-driven early-abort of the searchpoint currently being scored:
        the runner stops measuring its remaining samples, accepts the partial
        score, and the cycle CONTINUES to the next candidate / round (it does
        NOT stop). The operator analog of automatic PoBB candidate elimination.
        Single-shot — the walk that honours it at its next per-sample checkpoint
        acks the command `applied`, so exactly one searchpoint is cut per issue.
        The cycle is marked `human_intervened` (no longer purely reproducible)
        by that cut, never by the request: one sent while no searchpoint is
        being scored is refused (409), and one no walk took stays `accepted`
        and marks nothing.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: skip-searchpoint }
                    payload: { $ref: '#/components/schemas/SkipSearchpointPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/step-cycle:
    post:
      operationId: stepCycle
      summary: Advance N rounds then auto-pause (default N=1).
      description: |
        Bounded manual advance: resumes the cycle in place, runs `rounds` clean
        rounds (default 1), then auto-pauses (StopReason.PAUSED — resumable, so the
        operator can step again, with `run.pause.cause: step`). Reuses the resume
        launcher: the allowance is the launch's `step_rounds` limit, declared as
        `pause_at_round` on the cycle's `run_limits` record, where the loop reads
        it beside the round cap. The `campaign.step`
        capability — a delegate holding it (but not `campaign.run`) can step but cannot
        fire an autonomous loop.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: step-cycle }
                    payload: { $ref: '#/components/schemas/StepCyclePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/verify-candidate:
    post:
      operationId: verifyCandidate
      summary: Re-score one candidate on additional, never-measured cells.
      description: |
        The question a round's own panel cannot answer: a rate is read on the cells the
        acquisition bought that round, so a headline — 100% most of all — is a claim about a
        panel, not about the dataset. This re-scores one candidate on search cells it has never
        seen and banks the pass on that cycle's own ledger (`verify:enter` / `graded` / `exit`),
        whichever process runs it. Not a cycle or a fork: no round id, no election moved. The
        dashboard read serves the result — `verify` on the candidate's row, `verify_pass` while
        one is in flight.

        **The reading keeps the fresh cells apart.** `fresh` is the level on the new cells alone,
        `recorded` every cell a round's decision read the candidate on, re-read under the same
        scorer, and `lift` the candidate over the campaign origin paired per cell both measured —
        overlap top-ups and verify passes included. `strategy: hard` buys the cycle
        ruler's highest-δ unseen cells, which sit below the level by construction, so `held` is
        null there and `lift` is the number to read.

        **`samples` omitted is the answer, not an absence.** The count derives from the
        per-candidate round budget lifted by the rounds run since this cycle's last
        verification, capped by what is still unmeasured — so the bill stays on the scale the
        campaign already set, and a million-row dataset does not make one click a million cells.
        A larger explicit count is refused (422) naming the budget.

        Spends, so it sits at `campaign.run` rather than with the step verbs. The loop fires the
        same application function by itself when a round reads 100%
        (`application/diagnostics/verify.py::verify_on_saturation`), bounded in cadence as well as cells.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: verify-candidate }
                    payload: { $ref: '#/components/schemas/VerifyCandidatePayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

  /commands/grade-bench:
    post:
      operationId: gradeBench
      summary: Grade the campaign's origin and its selection on the held-out bench rows.
      description: |
        The bench pass, asked for. `CampaignConfig.bench_trigger` defaults to `manual`: a launch
        sends no bench row and sets nothing aside for one, and its headline (`BenchScore`) reads
        null under a `status` of `not_asked`. Admitted exactly where that status serves
        `can_grade`, and refused with its `refusal` anywhere else — a graded line, a run still
        selecting, a cycle beside the line. This sends the origin's pass and the
        selection's over the bench set, on the cycle's own ledger (`bench:enter` / `graded` /
        `exit` / `scored`) and outside any run, then banks them on the campaign's result — the
        same passes, through the same steps, a `bench_trigger: at_end` launch takes when it ends. An
        arm of a head-to-head is minted `at_end` and needs no call.

        **A pass the line already holds is reused**, not sent again: the origin's where it sent
        these rows under this grader, the selection's where it also graded this individual. A
        repeat call on an unchanged line spends nothing.

        **Refused 409** where the cycle does not hold its campaign's line (the answer names the
        cycle that does), where it has a run in flight, where it has not scored its origin, and
        where the campaign's `dataset_split` holds no bench rows.

        Spends — two passes over the bench set, under the account's headroom — so it sits at
        `campaign.run`.
      tags: [cycle-control]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CommandEnvelope'
                - type: object
                  required: [kind, payload]
                  properties:
                    kind: { const: grade-bench }
                    payload: { $ref: '#/components/schemas/GradeBenchPayload' }
      responses:
        '202': { $ref: '#/components/responses/CommandAccepted' }
        '400': { $ref: '#/components/responses/IdempotencyKeyMissing' }
        '403': { $ref: '#/components/responses/CapabilityDenied' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/PayloadInvalid' }

