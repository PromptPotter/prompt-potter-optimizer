[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpotter-optimizer"
version = "0.6.1"
description = "Automatic prompt optimization for LLMs — give it a dataset, it finds a better prompt"
readme = "README.md"
license = "MIT"
authors = [{name = "PromptPotter Contributors"}]
keywords = ["prompt-optimization", "llm", "fastapi", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "scalar-fastapi>=1.0.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "openai>=1.10.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "filelock>=3.12.0",
]

[project.optional-dependencies]
jupyter = [
    "jupyterlab>=4.0",
    "ipython>=8.0",
    "tqdm>=4.66",
]
stats = [
    "scipy>=1.12.0",
]
excel = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
]
benchmarks = [
    "datasets>=2.14.0",
]
observability = [
    "langfuse>=2.0.0",
    "mlflow>=2.12.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
all = [
    "jupyterlab>=4.0",
    "ipython>=8.0",
    "tqdm>=4.66",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "datasets>=2.14.0",
    "langfuse>=2.0.0",
    "mlflow>=2.12.0",
    "anthropic>=0.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff>=0.3.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0",
    "deptry>=0.20.0",
]

[project.urls]
Repository = "https://github.com/runfish5/prompt-potter-optimizer"

[tool.setuptools.packages.find]
include = ["promptpotter*"]

[tool.setuptools.package-data]
promptpotter = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --tb=short --no-header"
filterwarnings = ["ignore::RuntimeWarning"]
markers = ["slow: orchestrator integration tests (>1s each)"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = ["^datasets/"]
namespace_packages = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "langfuse.*",
    "mlflow.*",
    "scalar_fastapi.*",
    "openpyxl.*",
    "pandas.*",
    "datasets.*",
    "scipy.*",
    "tqdm.*",
    "IPython.*",
    "tests.*",
]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python idioms)
    "B",      # bugbear (common pitfalls)
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific
    "C90",    # mccabe complexity
]
ignore = [
    "E501",   # line length (handled by formatter)
    "N802",   # function name lowercase (allows test_GET_style names)
    "N803",   # argument name lowercase (allows API-matching names)
    "N806",   # variable name lowercase (allows DataFrame, etc.)
    "UP007",  # X | None already used everywhere via PEP 604
    "RUF003", # ambiguous unicode in comments (multiplication sign × is intentional)
    "RUF002", # ambiguous unicode in docstrings
    "UP040",  # type keyword aliases — TypeAlias is clearer for callback signatures
    "C901",   # complexity — tracked separately, not a lint gate
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["F403", "F405"]  # star imports are intentional in notebooks
"promptpotter/presentation/ui/campaign/__init__.py" = ["F401"]  # pure re-export hub for notebook

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
branch = true
source = ["promptpotter"]

[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
skip_empty = true
fail_under = 0

[tool.deptry]
extend_exclude = [
    "docs/research/bbeh-comparison/.*",
    "notebooks/bbeh_potter.ipynb",
]

[tool.deptry.per_rule_ignores]
# CLI/tool deps — invoked by command, not imported.
# groq is retained for provider-registration symmetry even though calls
# route through the OpenAI-compatible client.
DEP002 = [
    "ipython",
    "uvicorn",
    "jupyterlab",
    "groq",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "deptry",
]
# Optional features — imported lazily with install-message guards.
# Declared in extras ([excel], [benchmarks], [observability], [anthropic], [jupyter]).
DEP001 = ["pandas", "openpyxl", "datasets", "langfuse", "mlflow", "anthropic", "IPython"]
