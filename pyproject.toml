[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpotter"
version = "0.8.11"
description = "Automatic prompt optimization for LLMs — give it a dataset, it finds a better prompt"
readme = "README.md"
license = "MIT"
authors = [{name = "PromptPotter Contributors"}]
keywords = ["prompt-optimization", "llm", "fastapi", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.13"
# The ENGINE and nothing else — what `import promptpotter` needs to optimize. This list is
# measured, not asserted: `application/embedded_run.py` and the CLI entry each import to
# exactly this closure and no further. Everything a SERVER needs is `[api]`, because the
# fourth distribution tier is PromptPotter running inside someone else's program
# (`docs/specs/dspy-adapter.md`), and a library that drags a web server in is one nobody adds.
dependencies = [
    "pydantic>=2.5.3",         # why kept: every domain frozen-model + ledger record
    "pydantic-settings>=2.1.0",  # why kept: env-driven settings for connectors + LLM
    "openai>=1.10.0",          # why kept: OpenAI-compatible client (Groq, OpenRouter, OpenAI all route through)
    "python-dotenv>=1.2.2",    # why kept: nothing imports it — pydantic-settings does, to read
                               # `env_file`, and asks only for >=0.21.0. The direct pin is the
                               # floor past CVE-2026-28684 that the transitive one would not give.
    "httpx>=0.26.0",           # why kept: BackendClient (TermNorm) wire transport
    "filelock>=3.12.0",        # why kept: MeasurementArchive index lock under concurrent writers
    "numpy>=1.26",             # why kept: PoBB posterior + Rasch fit
    "json-repair>=0.30,<1.0",  # why kept: structured repair of provider-returned JSON (invalid \X escapes, etc.) at the LLM boundary
    "pyyaml>=6.0",             # why kept: parse/emit the operator-authored config tier (store/io.py::read_yaml/write_yaml). It used to ride in transitively behind uvicorn[standard]; that is an extra now, so this line is what installs it.
]

[project.optional-dependencies]
api = [
    # `python -m uvicorn promptpotter.main:app` needs this; `python -m promptpotter` does not.
    # The whole set is reachable only through `main.py` and `presentation/api/`, cryptography
    # included — identity gates the API and nothing else asks it a question.
    "fastapi>=0.119.0",        # why kept: read-only operator API + root webapp mount.
    "starlette>=1.0.1",        # why kept: FastAPI's ASGI core (not imported directly). Pinned because FastAPI's own floor (>=0.46.0) leaves the resolver on a Starlette with PYSEC-2026-161 / CVE-2025-54121 / CVE-2025-62727; this floor clears all three.
    "python-multipart>=0.0.27", # why kept: multipart/form-data transport for POST /datasets/ingest tabular-file upload (FastAPI fails at route registration without it). Floor past CVE-2026-24486/40347/42561.
    "scalar-fastapi>=1.0.0",   # why kept: API doc UI on the FastAPI app
    "uvicorn[standard]>=0.27.0",  # why kept: ASGI server for the read-only API
    "sse-starlette>=2.4.1",    # why kept: EventSourceResponse owns events:subscribe SSE framing + heartbeat + teardown on client-disconnect/server-shutdown (patches uvicorn handle_exit, so one Ctrl+C shuts down clean)
    "cryptography>=46.0.7",    # why kept: RS256 / ES256 JWS verification for OIDC ID tokens (Stage-1 identity foundation, ADR-0002). Floor past PYSEC-2026-35/36 + CVE-2026-26007.
]
excel = [
    # why kept: .xlsx ingest (`application/datasets/csv_ingest.py::_read_xlsx`) + the
    # ground-truth builder (`datasets/dataset_builder.py`). Lazy behind an install guard, so
    # its absence is an ingest error naming this extra — `settings.HARDENED_MODE` refuses the
    # format as policy, which is a separate answer to a separate question.
    "openpyxl>=3.1.0",
]
dspy = [
    # why kept: `presentation/teleprompter.py` (PromptPotterOpt) + the `dspy` connector, which
    # runs the caller's own `dspy.Module` in-process. Deliberately absent from `all`: it drags
    # litellm + optuna + pandas, and only a caller who asked to be a DSPy optimizer needs it.
    # The connector's import is function-local, so `promptpotter.connectors` still loads without
    # it; importing the teleprompter without it raises naming this extra.
    "dspy>=3.0.0",
]
jupyter = [
    "jupyterlab>=4.0",  # why kept: notebook UI for `notebooks/optimization_campaign.ipynb`
    "ipython>=8.0",     # why kept: in-notebook HTML rendering (presentation/views/completion.py)
]
stats = [
    "scipy>=1.12.0",    # why kept: Rasch fit + Wilson/normal-CI statistics
]
benchmarks = [
    # why kept: HuggingFace loader for the public benchmark banks (BBEH / GSM8K / AIME /
    # JustLogic). OPT-IN ONLY, and deliberately absent from `all`: it drags a large transitive
    # surface (pyarrow, fsspec, aiohttp, huggingface-hub) from a vendor whose attack surface is
    # not ours to audit, and nothing on the default path imports it — the four call sites are
    # lazy, and a fetched bank is cached to `benchmark-rows/` so a run only needs it ONCE.
    "datasets>=2.14.0",
]
observability = [
    "langfuse>=2.0.0",  # why kept: per-call trace mirror (events.jsonl + cloud)
    "mlflow>=3.1.0",    # why kept: peer optional sink alongside Langfuse,
                        # gated on settings.MLFLOW_ENABLED (off by default).
                        # Per §0 dormant-but-named — the import path stays
                        # so flipping the flag works without a code change.
                        # Floor raised onto 3.x to clear the long 2.16 CVE tail.
]
anthropic = [
    "anthropic>=0.18.0",  # why kept: Anthropic SDK as a peer of the OpenAI-compatible client
]
all = [
    # `benchmarks` is NOT folded in here, and that is the point of it being separate: `all` is
    # what a developer installs by default, so anything listed becomes attack surface nobody
    # opted into. Reach for `.[all,dev,benchmarks]` when you actually fetch a public bank.
    "fastapi>=0.119.0",
    "starlette>=1.0.1",
    "python-multipart>=0.0.27",
    "scalar-fastapi>=1.0.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.4.1",
    "cryptography>=46.0.7",
    "openpyxl>=3.1.0",
    "jupyterlab>=4.0",
    "ipython>=8.0",
    "scipy>=1.12.0",
    "langfuse>=2.0.0",
    "mlflow>=3.1.0",
    "anthropic>=0.18.0",
]
dev = [
    "pytest>=8.0.0",          # why kept: test runner
    "pytest-asyncio>=0.24.0", # why kept: async fixtures for LLM call tests
    "pytest-cov>=6.0",        # why kept: coverage instrumentation
    "ruff>=0.3.0",            # why kept: lint + format
    "mypy>=1.10.0",           # why kept: static type-check (CI gate)
    "deptry>=0.20.0",         # why kept: dependency audit (CI gate)
    "types-PyYAML>=6.0",      # why kept: stubs so mypy checks the store/io.py YAML emitter instead of skipping it
]

[project.urls]
Homepage = "https://github.com/PromptPotter/prompt-potter-optimizer"
Repository = "https://github.com/PromptPotter/prompt-potter-optimizer"
Documentation = "https://github.com/PromptPotter/prompt-potter-optimizer/blob/main/docs/manual/README.md"
Changelog = "https://github.com/PromptPotter/prompt-potter-optimizer/blob/main/CHANGELOG.md"
Issues = "https://github.com/PromptPotter/prompt-potter-optimizer/issues"

[project.scripts]
promptpotter = "promptpotter.presentation.cli.campaign_runner:main"

[tool.setuptools.packages.find]
include = ["promptpotter*"]

# Everything the package READS at runtime but does not import. The list is
# deliberate and exhaustive: setuptools ships no non-.py file unless it is named
# here, so an asset that is merely committed to git is NOT installed. Two of these
# were already correctly placed inside the package and still absent from the wheel
# — which is how `pip install promptpotter` produced a CLI that starts
# and then cannot make a single optimizer call.
#
# Re-verified 2026-07-30, and verifying it has a trap worth knowing: `*.egg-info/
# SOURCES.txt` caches the file manifest and SURVIVES `rm -rf build dist`, so a rebuild
# with this block deleted still ships all 139 files and the list looks inert. Clean room
# is `rm -rf build dist *.egg-info`; with that, deleting this block drops the wheel to a
# single non-.py file. Do not conclude anything about packaging without it.
#
# The last two entries are wildcards over trees that `scripts/build_release.py` stages,
# so whatever lands there is published verbatim — a `.env` in `datasets/`, or a secret
# inlined into the Next.js bundle, would ship. That script scans the built artifact for
# credential-shaped names and contents and refuses to hand you a wheel carrying one.
[tool.setuptools.package-data]
promptpotter = [
    "py.typed",
    "shared/data/rates.json",
    "config/prompt_variants.json",  # config/prompt_blocks.py::BUNDLED_PATH
    "connectors/resources/*.json",  # n8n workflow templates
    "assets/optimizer/*.yaml",      # the optimizer's own pipeline manifest
    "assets/optimizer/*.json",      # + its generated schema registry
    "assets/optimizer/sets/*.yaml", # specialized optimizer prompt sets (L4)
    # The last two are BUILD ARTIFACTS — a Next.js export and a git-filtered dataset
    # tree — so they cannot sit in the source tree the way assets/optimizer/ does.
    # `scripts/build_release.py` stages both before `uv build`; that script is what
    # makes these two globs true, and without it they match nothing silently.
    "assets/webapp/**/*",           # exported dashboard
    "assets/benchmarks/**/*",       # benchmark dataset definitions (no HF caches)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
# Test files carry their reason-to-exist in the name (test_numerics, test_security,
# test_resume) under the standard `test_` prefix, so default discovery picks them up;
# `conftest.py` (fixtures, not test fns) is excluded by the underscore prefix.
addopts = "-q --tb=short --no-header"
filterwarnings = ["ignore::RuntimeWarning"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^datasets/"]
namespace_packages = false
# One SQLite DB instead of ~12.5k tiny JSON files — kills the Windows small-file
# stat() tax that dominated every warm run.
sqlite_cache = true

# Tests are loosely typed by charter — strict applies to shipped code only.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false

# Deps we never type-check through. `follow_imports = "skip"` (not just
# ignore_missing_imports, a no-op when the package is installed + typed) stops
# mypy expanding their bodies — mlflow alone dragged the SQLAlchemy dialect tree
# + alembic into the graph (5488 nodes for 291 first-party modules).
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "openai.*",
    "langfuse.*",
    "mlflow.*",
    "sqlalchemy.*",
    "alembic.*",
    "scalar_fastapi.*",
    "openpyxl.*",
    "datasets.*",
    "dspy.*",
    "scipy.*",
    "IPython.*",
    "tests.*",
    # Pure transitive (0 first-party imports) — pulled in by the skipped sinks /
    # CLI rendering chains; nothing here is in our typed call surface.
    "rich.*",
    "markdown_it.*",
    "mdurl.*",
    "werkzeug.*",
    "google.*",
    "rsa.*",
    "itsdangerous.*",
]
follow_imports = "skip"
ignore_missing_imports = true
follow_untyped_imports = false
implicit_reexport = true

[tool.ruff]
target-version = "py313"
line-length = 100
# Colab research notebooks — external-comparison artifacts, not project code.
# Mirrors the deptry extend_exclude below.
extend-exclude = ["docs/research/bbeh-comparison"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python idioms)
    "B",      # bugbear (common pitfalls)
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "N802",   # function name lowercase (allows test_GET_style names)
    "N803",   # argument name lowercase (allows API-matching names)
    "N806",   # variable name lowercase (allows DataFrame, etc.)
    "UP007",  # X | None already used everywhere via PEP 604
    "RUF003", # ambiguous unicode in comments (multiplication sign × is intentional)
    "RUF002", # ambiguous unicode in docstrings
    "UP040",  # type keyword aliases — TypeAlias is clearer for callback signatures
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["F403", "F405"]  # star imports are intentional in notebooks

[tool.coverage.run]
branch = true
source = ["promptpotter"]

[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
skip_empty = true
fail_under = 0

[tool.deptry]
extend_exclude = [
    "docs/research/bbeh-comparison/.*",
    "notebooks/bbeh_potter.ipynb",
]

[tool.deptry.per_rule_ignores]
# CLI/tool deps — invoked by command, not imported.
DEP002 = [
    "ipython",
    "uvicorn",
    "python-multipart",  # imported by FastAPI at runtime for multipart/form-data, never directly by promptpotter/
    "jupyterlab",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "deptry",
    "types-PyYAML",      # stub-only package: consumed by mypy, never imported
    # Reached only through `importlib.import_module` (`datasets/loaders.py::hf_load_dataset`),
    # which a static scan cannot see — the indirection is load-bearing, because a literal
    # `from datasets import …` resolves to this repo's own top-level `datasets/` directory.
    "datasets",
]
# Optional features — imported lazily with install-message guards.
# Declared in extras ([excel], [benchmarks], [observability], [anthropic], [jupyter]).
DEP001 = ["openpyxl", "datasets", "langfuse", "mlflow", "anthropic", "IPython"]
