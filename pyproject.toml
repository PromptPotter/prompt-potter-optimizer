[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpotter-optimizer"
version = "0.8.2"
description = "Automatic prompt optimization for LLMs — give it a dataset, it finds a better prompt"
readme = "README.md"
license = "MIT"
authors = [{name = "PromptPotter Contributors"}]
keywords = ["prompt-optimization", "llm", "fastapi", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.119.0",        # why kept: read-only operator API + root webapp mount.
    "starlette>=1.0.1",        # why kept: FastAPI's ASGI core (not imported directly). Pinned because FastAPI's own floor (>=0.46.0) leaves the resolver on a Starlette with PYSEC-2026-161 / CVE-2025-54121 / CVE-2025-62727; this floor clears all three.
    "python-multipart>=0.0.27", # why kept: multipart/form-data transport for POST /datasets/ingest tabular-file upload (FastAPI fails at route registration without it). Floor past CVE-2026-24486/40347/42561.
    "scalar-fastapi>=1.0.0",   # why kept: API doc UI on the FastAPI app
    "uvicorn[standard]>=0.27.0",  # why kept: ASGI server for the read-only API
    "pydantic>=2.5.3",         # why kept: every domain frozen-model + ledger record
    "pydantic-settings>=2.1.0",  # why kept: env-driven settings for connectors + LLM
    "openai>=1.10.0",          # why kept: OpenAI-compatible client (Groq, OpenRouter, OpenAI all route through)
    "python-dotenv>=1.2.2",    # why kept: .env loading at bootstrap. Floor past CVE-2026-28684.
    "httpx>=0.26.0",           # why kept: BackendClient (TermNorm) wire transport
    "filelock>=3.12.0",        # why kept: MeasurementArchive index lock under concurrent writers
    "numpy>=1.26",             # why kept: PoBB posterior + Rasch fit
    "json-repair>=0.30,<1.0",  # why kept: structured repair of provider-returned JSON (invalid \X escapes, etc.) at the LLM boundary
    "cryptography>=46.0.7",    # why kept: RS256 / ES256 JWS verification for OIDC ID tokens (Stage-1 identity foundation, ADR-0002). Floor past PYSEC-2026-35/36 + CVE-2026-26007.
    "openpyxl>=3.1.0",         # why kept: .xlsx upload ingest (application/datasets/csv_ingest.py::_read_xlsx) + ground-truth Excel build (datasets/dataset_builder.py). Default-installed; xlsx parsing is gated off by settings.HARDENED_MODE, not by absence.
]

[project.optional-dependencies]
jupyter = [
    "jupyterlab>=4.0",  # why kept: notebook UI for `notebooks/optimization_campaign.ipynb`
    "ipython>=8.0",     # why kept: in-notebook HTML rendering (presentation/views/notebook_run.py)
    "tqdm>=4.66",       # why kept: per-sample progress bar in notebook entry-point
]
stats = [
    "scipy>=1.12.0",    # why kept: Rasch fit + statistical proportion test
]
benchmarks = [
    "datasets>=2.14.0", # why kept: HuggingFace BBEH loader (M11 benchmark track)
]
observability = [
    "langfuse>=2.0.0",  # why kept: per-call trace mirror (events.jsonl + cloud)
    "mlflow>=3.1.0",    # why kept: peer optional sink alongside Langfuse,
                        # gated on settings.MLFLOW_ENABLED (off by default).
                        # Per §0 dormant-but-named — the import path stays
                        # so flipping the flag works without a code change.
                        # Floor raised onto 3.x to clear the long 2.16 CVE tail.
]
anthropic = [
    "anthropic>=0.18.0",  # why kept: Anthropic SDK as a peer of the OpenAI-compatible client
]
all = [
    "jupyterlab>=4.0",
    "ipython>=8.0",
    "tqdm>=4.66",
    "scipy>=1.12.0",
    "datasets>=2.14.0",
    "langfuse>=2.0.0",
    "mlflow>=3.1.0",
    "anthropic>=0.18.0",
]
dev = [
    "pytest>=8.0.0",          # why kept: test runner
    "pytest-asyncio>=0.24.0", # why kept: async fixtures for LLM call tests
    "pytest-cov>=6.0",        # why kept: coverage instrumentation
    "ruff>=0.3.0",            # why kept: lint + format
    "mypy>=1.10.0",           # why kept: static type-check (CI gate)
    "deptry>=0.20.0",         # why kept: dependency audit (CI gate)
]

[project.urls]
Repository = "https://github.com/runfish5/prompt-potter-optimizer"

[project.scripts]
promptpotter = "promptpotter.presentation.cli.campaign_runner:main"

[tool.setuptools.packages.find]
include = ["promptpotter*"]

[tool.setuptools.package-data]
promptpotter = ["py.typed", "shared/data/rates.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
# Test files carry their reason-to-exist in the name (test_numerics, test_security,
# test_resume) under the standard `test_` prefix, so default discovery picks them up;
# `conftest.py` (fixtures, not test fns) is excluded by the underscore prefix.
addopts = "-q --tb=short --no-header"
filterwarnings = ["ignore::RuntimeWarning"]
markers = ["slow: orchestrator integration tests (>1s each)"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^datasets/"]
namespace_packages = false
# One SQLite DB instead of ~12.5k tiny JSON files — kills the Windows small-file
# stat() tax that dominated every warm run.
sqlite_cache = true

# Tests are loosely typed by charter — strict applies to shipped code only.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_any_generics = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = false

# Deps we never type-check through. `follow_imports = "skip"` (not just
# ignore_missing_imports, a no-op when the package is installed + typed) stops
# mypy expanding their bodies — mlflow alone dragged the SQLAlchemy dialect tree
# + alembic into the graph (5488 nodes for 291 first-party modules).
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "openai.*",
    "langfuse.*",
    "mlflow.*",
    "sqlalchemy.*",
    "alembic.*",
    "scalar_fastapi.*",
    "openpyxl.*",
    "datasets.*",
    "scipy.*",
    "tqdm.*",
    "IPython.*",
    "tests.*",
    # Pure transitive (0 first-party imports) — pulled in by the skipped sinks /
    # CLI rendering chains; nothing here is in our typed call surface.
    "rich.*",
    "markdown_it.*",
    "mdurl.*",
    "werkzeug.*",
    "google.*",
    "rsa.*",
    "itsdangerous.*",
]
follow_imports = "skip"
ignore_missing_imports = true
follow_untyped_imports = false
implicit_reexport = true

[tool.ruff]
target-version = "py313"
line-length = 100
# Colab research notebooks — external-comparison artifacts, not project code.
# Mirrors the deptry extend_exclude below.
extend-exclude = ["docs/research/bbeh-comparison"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python idioms)
    "B",      # bugbear (common pitfalls)
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter)
    "N802",   # function name lowercase (allows test_GET_style names)
    "N803",   # argument name lowercase (allows API-matching names)
    "N806",   # variable name lowercase (allows DataFrame, etc.)
    "UP007",  # X | None already used everywhere via PEP 604
    "RUF003", # ambiguous unicode in comments (multiplication sign × is intentional)
    "RUF002", # ambiguous unicode in docstrings
    "UP040",  # type keyword aliases — TypeAlias is clearer for callback signatures
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["F403", "F405"]  # star imports are intentional in notebooks

[tool.coverage.run]
branch = true
source = ["promptpotter"]

[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true
skip_empty = true
fail_under = 0

[tool.deptry]
extend_exclude = [
    "docs/research/bbeh-comparison/.*",
    "notebooks/bbeh_potter.ipynb",
]

[tool.deptry.per_rule_ignores]
# CLI/tool deps — invoked by command, not imported.
DEP002 = [
    "ipython",
    "uvicorn",
    "python-multipart",  # imported by FastAPI at runtime for multipart/form-data, never directly by promptpotter/
    "starlette",         # FastAPI's ASGI core; pinned for a security floor, never imported directly by promptpotter/

    "jupyterlab",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "deptry",
]
# Optional features — imported lazily with install-message guards.
# Declared in extras ([excel], [benchmarks], [observability], [anthropic], [jupyter]).
DEP001 = ["openpyxl", "datasets", "langfuse", "mlflow", "anthropic", "IPython"]
