[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpotter-optimizer"
version = "0.6.1"
description = "Backend-first prompt optimization service"
readme = "README.md"
license = "MIT"
authors = [{name = "PromptPotter Contributors"}]
keywords = ["prompt-optimization", "llm", "fastapi", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.109.0",
    "scalar-fastapi>=1.0.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    "groq>=0.4.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "pandas>=2.2.0",
    "numpy>=1.26.3",
    "openpyxl>=3.1.0",
    "httpx>=0.26.0",
    "langfuse>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
jupyter = [
    "jupyterlab>=4.0",
    "tqdm>=4.66",
]
stats = [
    "scipy>=1.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "ruff>=0.3.0",
    "mypy>=1.10.0",
    "pre-commit>=4.0",
]

[project.urls]
Repository = "https://github.com/runfish5/prompt-potter-optimizer"

[tool.setuptools.packages.find]
include = ["api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --tb=short --cov=api --cov-report=term-missing"
markers = ["slow: orchestrator integration tests (>1s each)"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "langfuse.*",
    "groq.*",
    "scalar_fastapi.*",
    "openpyxl.*",
    "pandas.*",
    "requests.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python idioms)
    "B",      # bugbear (common pitfalls)
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific
    "C90",    # mccabe complexity
]
ignore = [
    "E501",   # line length (handled by formatter)
    "N802",   # function name lowercase (allows test_GET_style names)
    "N803",   # argument name lowercase (allows API-matching names)
    "N806",   # variable name lowercase (allows DataFrame, etc.)
    "UP007",  # X | None already used everywhere via PEP 604
    "RUF003", # ambiguous unicode in comments (multiplication sign × is intentional)
    "RUF002", # ambiguous unicode in docstrings
    "UP040",  # type keyword aliases — TypeAlias is clearer for callback signatures
    "C901",   # complexity — tracked separately, not a lint gate
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["F403", "F405"]  # star imports are intentional in notebooks

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
branch = true
source = ["api"]

[tool.coverage.report]
exclude_lines = [
    "@abstractmethod",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
