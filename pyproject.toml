[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptpotter"
version = "0.8.17"
description = "Automatic prompt optimization for LLMs — give it a dataset, it finds a better prompt"
readme = "README.md"
# MIT plus a revocation clause, so not the SPDX "MIT": the text is the LICENSE file.
license = "LicenseRef-MIT-RG"
license-files = ["LICENSE"]
authors = [{name = "David Streuli"}]
keywords = [
    "prompt-optimization",
    "automatic-prompt-engineering",
    "prompt-engineering",
    "llm-evaluation",
    "evolutionary-search",
    "dspy",
    "gepa",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.13"
# The ENGINE and nothing else — what `import promptpotter` needs to optimize. This list is
# measured, not asserted: `application/embedded_run.py` and the CLI entry each import to
# exactly this closure and no further. Everything a SERVER needs is `[api]`, because the
# fourth distribution tier is PromptPotter running inside someone else's program
# (`docs/decisions.md` § 0006), and a library that drags a web server in is
# one nobody adds.
dependencies = [
    "pydantic>=2.5.3",         # why kept: every domain frozen-model + ledger record
    "pydantic-settings>=2.1.0",  # why kept: env-driven settings for connectors + LLM
    "python-dotenv>=1.2.2",    # why kept: nothing imports it — pydantic-settings does, to read
                               # `env_file`, and asks only for >=0.21.0. The direct pin is the
                               # floor past CVE-2026-28684 that the transitive one would not give.
    "httpx>=0.26.0",           # why kept: every LLM provider's wire (`infrastructure/llm/base.py::post_json`) + BackendClient's
    "numpy>=1.26",             # why kept: PoBB posterior + Rasch fit
    "json-repair>=0.30,<1.0",  # why kept: structured repair of provider-returned JSON (invalid \X escapes, etc.) at the LLM boundary
    "pyyaml>=6.0",             # why kept: parse/emit the operator-authored config tier (store/io.py::read_yaml/write_yaml). It used to ride in transitively behind uvicorn[standard]; that is an extra now, so this line is what installs it.
]

[project.optional-dependencies]
api = [
    # `python -m uvicorn promptpotter.main:app` needs this; `python -m promptpotter` does not.
    # The whole set is reachable only through `main.py` and `presentation/api/`, cryptography
    # included — identity gates the API and nothing else asks it a question.
    "fastapi>=0.119.0",        # why kept: the operator API + root webapp mount.
    "starlette>=1.0.1",        # why kept: FastAPI's ASGI core (not imported directly). Pinned because FastAPI's own floor (>=0.46.0) leaves the resolver on a Starlette with PYSEC-2026-161 / CVE-2025-54121 / CVE-2025-62727; this floor clears all three.
    "python-multipart>=0.0.27", # why kept: multipart/form-data transport for POST /datasets/ingest tabular-file upload (FastAPI fails at route registration without it). Floor past CVE-2026-24486/40347/42561.
    "scalar-fastapi>=1.0.0",   # why kept: API doc UI on the FastAPI app
    "uvicorn[standard]>=0.27.0",  # why kept: ASGI server for the API
    "sse-starlette>=2.4.1",    # why kept: EventSourceResponse owns events:subscribe SSE framing + heartbeat + teardown on client-disconnect/server-shutdown (patches uvicorn handle_exit, so one Ctrl+C shuts down clean)
    "cryptography>=50.0.0",    # why kept: RS256 / ES256 JWS verification for OIDC ID tokens (the identity foundation, docs/decisions.md § 0002). Floor past PYSEC-2026-35/36 + CVE-2026-26007, and now past GHSA-g6cj-pr64-35w5 (PKCS#7 Bleichenbacher oracle, fixed in 50.0.0). Held at 49 until `observability` moved off full mlflow, which required `cryptography<50`.
]
excel = [
    # why kept: .xlsx ingest (`application/datasets/tabular_ingest.py::_xlsx_records`). Lazy behind `shared/extras.py::require_extra`,
    # so its absence is a typed refusal naming this extra — `settings.HARDENED_MODE` refuses the
    # format as policy, which is a separate answer to a separate question.
    "openpyxl>=3.1.0",
    # why kept: pre-2007 .xls (BIFF) ingest, which openpyxl cannot read and a first-time user's
    # sheet often is. Pure Python, no transitive deps; `.ods` needs nothing (stdlib zip + XML).
    "xlrd>=2.0.1",
]
dspy = [
    # why kept: `presentation/teleprompter.py` (PromptPotterOpt) + the `dspy` connector, which
    # runs the caller's own `dspy.Module` in-process. Deliberately absent from `all`: only a
    # caller who asked to be a DSPy optimizer needs it. The connector's import is function-local,
    # so `promptpotter.connectors` still loads without it; importing the teleprompter without it
    # raises naming this extra.
    #
    # It is the sole reason `diskcache` (GHSA-w8v5-vhqr-4h9v, unpatched — 5.6.3 is both the last
    # release and the affected one) is in `uv.lock`, and dspy 3.4.0 still requires it, so there is
    # no skinny-shaped swap. `uv lock` resolves EVERY declared extra, so a lock scanner sees this
    # whether or not anyone installs it — the alert is not evidence the surface is reachable.
    # Deleting the extra would drop exactly 4 packages (dspy, gepa, orjson, diskcache) and break
    # `pip install promptpotter[dspy]`, which README + `docs/decisions.md` § 0006 + `docs/developer/dspy-optimizer.md`
    # publish. Dismiss the alert; do not trade the published install path for it.
    #
    # 3.4 is the floor the connector's billing is verified on: an LM is an ENGINE there
    # (`dspy.LM(engine=...)`), its failures are DSPy's own typed errors, and `import dspy` no
    # longer loads litellm. A custom LM before it subclasses `BaseLM.forward`, which 3.5 removes.
    "dspy>=3.4.0",
]
harbor = [
    # why kept: the `harbor` connector, which runs one containerized agent episode per measured
    # cell through Harbor's own trial runner. Deliberately absent from `all`. The connector's
    # import is function-local, so
    # `promptpotter.connectors` still loads without it and `preflight` fails naming this extra.
    #
    # The gate's env always carries it (`scripts/gate.py::_PINNED_EXTRAS`), and it HOLDS WEBSOCKETS
    # BELOW 16 there, which is expected rather than a conflict to fight: harbor -> supabase ->
    # realtime pins `websockets>=11,<16`, while `uvicorn[standard]` leaves it unpinned. Nothing
    # here requires >=16 (uvicorn wants >=10.4, and openai's realtime extra wants <16).
    # UPPER-BOUNDED, unlike every other pin here, because `connectors/harbor.py::_digest` reads
    # Harbor's PRIVATE on-disk trial layout (`<trial>/agent/*.pane`, `verifier/test-stdout.txt`)
    # — there is no public accessor for those artifacts. A minor release that renames a directory
    # produces a digest with no TERMINAL and no VERIFIER section and the optimizer silently goes
    # back to grading two scalars. The connector's `version_check` reports the drift; this stops
    # it arriving unasked.
    "harbor>=0.22.0,<0.23",
]
jupyter = [
    "jupyterlab>=4.0",  # why kept: notebook UI for `notebooks/bbeh_potter.ipynb`
    "ipython>=8.0",     # why kept: in-notebook HTML rendering (presentation/terminal/completion.py)
]
benchmarks = [
    # why kept: HuggingFace loader for the public benchmark banks (BBEH / GSM8K / AIME /
    # JustLogic). OPT-IN ONLY, and deliberately absent from `all`: it drags a large transitive
    # surface (pyarrow, fsspec, aiohttp, huggingface-hub) from a vendor whose attack surface is
    # not ours to audit, and nothing on the default path imports it — the one call site
    # (`application/datasets/loaders.py::_load_dataset`) is lazy, and a fetched bank is
    # materialized to the tenant's `materialized/` so a run only needs it ONCE.
    "datasets>=2.14.0",
]
observability = [
    "langfuse>=2.0.0",  # why kept: per-call trace mirror (events.jsonl + cloud)
    "mlflow-skinny>=3.15.0",  # why kept: the client for the operator's own MLflow server —
                        # rounds as runs, the winner as a prompt version — off until
                        # settings.MLFLOW_TRACKING_URI names one.
                        # Per §0 dormant-but-named — the import path stays
                        # so setting it works without a code change.
                        # Floor raised onto 3.15 to clear GHSA-7gwp-5pfp-969j (SSRF).
                        # SKINNY, not full `mlflow`, and the distinction is load-bearing twice
                        # over. `mlflow_server.py` calls only `MlflowClient` — tracking and the
                        # prompt registry — which is exactly skinny's surface. Full mlflow
                        # requires `cryptography<50`, and it was the ONLY thing pinning this repo
                        # below the 50.0.0 that fixes GHSA-g6cj-pr64-35w5 (PKCS#7 Bleichenbacher
                        # oracle) — skinny declares no cryptography at all. It also drops the
                        # `mlflow` distribution that carries GHSA-h7x2-h6g9-p789, an AI-Gateway
                        # SSRF with NO upstream patch (3.16.0 still leaves `api_base` unvalidated
                        # in `server/gateway_api.py::raw_proxy`) — unreachable for us either way,
                        # because that is a bug in `mlflow server`, which we never run.
]
all = [
    # `benchmarks` is NOT folded in here, and that is the point of it being separate: `all` is
    # what a developer installs by default, so anything listed becomes attack surface nobody
    # opted into. Reach for `.[all,dev,benchmarks]` when you actually fetch a public bank.
    # `harbor` is out for the same reason.
    # `jupyter` is out because an installed IPython is imported by every `import dspy` and drags
    # jsonschema's format checkers with it: 38 MB and ~4 s on each test run that reaches DSPy.
    "fastapi>=0.119.0",
    "starlette>=1.0.1",
    "python-multipart>=0.0.27",
    "scalar-fastapi>=1.0.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.4.1",
    "cryptography>=50.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "langfuse>=2.0.0",
    "mlflow-skinny>=3.15.0",
]
dev = [
    "pytest>=8.0.0",          # why kept: test runner
    "pytest-asyncio>=0.24.0", # why kept: async fixtures for LLM call tests
    "ruff>=0.3.0",            # why kept: lint + format
    "mypy>=1.10.0",           # why kept: static type-check (CI gate)
    "deptry>=0.20.0",         # why kept: dependency audit (CI gate)
    "types-PyYAML>=6.0",      # why kept: stubs so mypy checks the store/io.py YAML emitter instead of skipping it
]

[project.urls]
Homepage = "https://promptpotter.com"
Source = "https://github.com/PromptPotter/prompt-potter-optimizer"
Repository = "https://github.com/PromptPotter/prompt-potter-optimizer"
Documentation = "https://github.com/PromptPotter/prompt-potter-optimizer/blob/main/docs/manual/README.md"
Changelog = "https://github.com/PromptPotter/prompt-potter-optimizer/blob/main/CHANGELOG.md"
Issues = "https://github.com/PromptPotter/prompt-potter-optimizer/issues"

[project.scripts]
promptpotter = "promptpotter.presentation.cli.campaign_runner:main"

# The ONE uv pin: uv refuses any other, CI's setup-uv installs this, deploy-linux/uv.sh reads it.
[tool.uv]
required-version = "==0.11.21"
# Security floors for packages only other dependencies pull in (GHSA advisories, Dependabot).
constraint-dependencies = ["filelock>=4.2.1", "litellm>=1.100.4"]

[tool.setuptools.packages.find]
include = ["promptpotter*"]

# Everything the package READS at runtime but does not import. The list is
# deliberate and exhaustive: setuptools ships no non-.py file unless it is named
# here, so an asset that is merely committed to git is NOT installed. Two of these
# were already correctly placed inside the package and still absent from the wheel
# — which is how `pip install promptpotter` produced a CLI that starts
# and then cannot make a single optimizer call.
#
# Re-verified 2026-07-30, and verifying it has a trap worth knowing: `*.egg-info/
# SOURCES.txt` caches the file manifest and SURVIVES `rm -rf build dist`, so a rebuild
# with this block deleted still ships all 139 files and the list looks inert. Clean room
# is `rm -rf build dist *.egg-info`; with that, deleting this block drops the wheel to a
# single non-.py file. Do not conclude anything about packaging without it.
#
# The `assets/datasets` and `assets/webapp` entries are wildcards, so whatever lands
# there is published verbatim — a credential in a dataset file, or a secret inlined into
# the Next.js bundle, would ship. That script scans the built artifact for
# credential-shaped names and contents and refuses to hand you a wheel carrying one.
[tool.setuptools.package-data]
promptpotter = [
    "py.typed",
    "infrastructure/llm/data/rates.json",
    "connectors/resources/*.json",  # n8n workflow templates
    "connectors/resources/*.yaml",  # connectors/harbor.py::_DOCKER_OVERLAY
    "connectors/resources/*.Dockerfile",  # connectors/dbllmbench.py runner image
    "assets/optimizers/*/*.yaml",   # one pipeline manifest per optimizer
    "assets/optimizers/*/*.json",   # + each one's generated schema registry
    "assets/checkin/*.yaml",        # the bench's check-in node
    "assets/checkin/*.json",        # + its generated schema registry
    "assets/free_tier.yaml",        # what a free account may run
    "assets/datasets/**/*.yaml",    # dataset definitions, family and install defaults
    "assets/datasets/**/*.md",      # + task framing and READMEs
    # A BUILD ARTIFACT — a Next.js export — so it cannot sit in the source tree the way
    # assets/optimizers/ does. `scripts/build_release.py` stages it before `uv build`;
    # without that the glob matches nothing silently.
    "assets/webapp/**/*",           # exported dashboard
]

[tool.setuptools.exclude-package-data]
promptpotter = ["assets/datasets/CLAUDE.md"]  # its links resolve only in a checkout

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
# Test files are named for the code they own (test_scoring, test_spend, test_archive)
# under the standard `test_` prefix, so default discovery picks them up;
# `conftest.py` (fixtures, not test fns) is excluded by the underscore prefix.
addopts = "-q --tb=short --no-header"
filterwarnings = ["ignore::RuntimeWarning"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code", "redundant-self"]
plugins = ["pydantic.mypy"]
namespace_packages = false
# One SQLite DB instead of ~12.5k tiny JSON files — kills the Windows small-file
# stat() tax that dominated every warm run.
sqlite_cache = true

# Without it a model's `__init__` takes `**Any`, so no constructor call is type-checked.
[tool.pydantic-mypy]
init_typed = true

# Deps we never type-check through. `follow_imports = "skip"` (not just
# ignore_missing_imports, a no-op when the package is installed + typed) stops
# mypy expanding their bodies. The tree this was sized against is gone: `mlflow`
# used to drag the SQLAlchemy dialects + alembic in (5488 nodes for 291 first-party
# modules), and `mlflow-skinny` ships neither, so their two entries went with it.
[[tool.mypy.overrides]]
module = [
    "langfuse.*",
    "mlflow.*",
    "scalar_fastapi.*",
    "openpyxl.*",
    "xlrd.*",
    "datasets.*",
    "dspy.*",
    "harbor.*",
    "IPython.*",
    # Pure transitive (0 first-party imports) — pulled in by the skipped sinks /
    # CLI rendering chains; nothing here is in our typed call surface.
    "rich.*",
    "markdown_it.*",
    "mdurl.*",
    "google.*",
]
follow_imports = "skip"
ignore_missing_imports = true
follow_untyped_imports = false
implicit_reexport = true

[tool.ruff]
target-version = "py313"
line-length = 100
# The peers' Colab notebooks run promptolution and DSPy on Colab, never this repo.
extend-exclude = [
    "docs/research/bbeh-comparison/bbeh_capo.ipynb",
    "docs/research/bbeh-comparison/bbeh_dspy.ipynb",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import ordering)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python idioms)
    "B",      # bugbear (common pitfalls)
    "SIM",    # simplify
    "C4",     # flake8-comprehensions
    "RUF",    # ruff-specific
    "ARG",    # unused arguments
    "BLE",    # blind except
    "ASYNC",  # async pitfalls
    "C901",   # complexity, under the ceiling below
]
ignore = [
    "E501",   # line length (handled by formatter)
    "RUF003", # ambiguous unicode in comments (multiplication sign × is intentional)
    "RUF002", # ambiguous unicode in docstrings
    "ASYNC109", # `docker()` owns its deadline: it kills its child and names the command on expiry
]

[tool.ruff.lint.mccabe]
# The package's current maximum (`views/render/sample.py::fmt_query_result`): it only falls.
max-complexity = 23

[tool.ruff.lint.per-file-ignores]
# A journey test walks a whole run on purpose; the ceiling bounds production code.
"tests/**" = ["C901"]
".claude/hooks/**" = ["C901"]

[tool.deptry]
extend_exclude = [
    "docs/research/bbeh-comparison/.*",
    "notebooks/bbeh_potter.ipynb",
    "examples/.*",  # each a distribution of its own, with its own dependency list
]
# `scripts/` is a directory of programs, not a package: one imports a sibling by its bare name.
known_first_party = ["gate", "last_green", "offline_world", "processes", "tests_owning"]

# CI installs neither `observability` nor `all`, so deptry cannot read the
# distribution's metadata and falls back to assuming the module is named after the
# package — `mlflow_skinny`, which nothing imports. Stating the real module here is
# what makes the check answer the same on a desk that HAS it installed and on a
# runner that does not.
[tool.deptry.package_module_name_map]
mlflow-skinny = ["mlflow"]

[tool.deptry.per_rule_ignores]
# CLI/tool deps — invoked by command, not imported.
DEP002 = [
    "ipython",
    "uvicorn",
    "python-multipart",  # imported by FastAPI at runtime for multipart/form-data, never directly by promptpotter/
    "python-dotenv",     # a CVE floor for pydantic-settings' `env_file` read; see [project] dependencies
    "jupyterlab",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "deptry",
    "types-PyYAML",      # stub-only package: consumed by mypy, never imported
]
# `ipython` ([jupyter]) is in no gate env, so deptry cannot map it to the module it installs.
DEP001 = ["IPython"]
# Imported directly and deliberately left transitive: `connectors/harbor.py::_meter` wraps
# the entry point HARBOR calls, so it must be the litellm Harbor resolved — a pin of our own could
# split the two, and the meter would wrap a copy the agent never sends through.
# `pydantic_core` likewise: pydantic pins it to one exact version, so the `core_schema` a model
# builds (`domain/scoring.py::CellSheet`) must be the one pydantic resolved.
DEP003 = ["litellm", "pydantic_core"]
