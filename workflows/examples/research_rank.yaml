# Research and Rank Pipeline
# Pipeline configuration + entity profiling + candidate ranking
#
# This workflow:
# 1. Assembles pipeline configuration for the backend
# 2. Uses an LLM to extract/profile the entity
# 3. Ranks candidates against the profiled entity

class: Workflow
cwlVersion: v1.2
id: research_rank_workflow
label: "Research and Rank Pipeline"
description: "Pipeline configuration + entity profiling + candidate ranking"

inputs:
  query:
    type: string
    description: "User query to research"
  candidates:
    type: string[]
    description: "List of candidate terms to rank against query"

steps:
  - id: pipeline_config
    run: nodes/PipelineConfigNode
    in:
      query: query
    out:
      - query
      - skip_llm_ranking
      - pipeline_params
    config:
      skip_llm_ranking: true
      pipeline_params: {}
    metadata:
      type: config
      deterministic: true

  - id: entity_profiler
    run: nodes/LLMNode
    in:
      messages:
        - role: user
          content: |
            Analyze the following query: {{query}}

            Extract a comprehensive entity profile including:
            - Primary name/term
            - Category/type
            - Key attributes
            - Related terms

            Return as JSON.
      variables:
        query: query
    out:
      - content
      - parsed
    config:
      # model: uses settings.LLM_MODEL (default: groq/llama-4-maverick)
      temperature: 0.0
      output_format: json
    metadata:
      type: llm
      deterministic: false
      temperature: 0.0

  - id: candidate_ranker
    run: nodes/RankerNode
    in:
      query: query
      candidates: candidates
      context: entity_profiler/parsed
    out:
      - ranked_candidates
      - top_candidate
      - confidence
    config:
      # model: uses settings.LLM_MODEL (default: groq/llama-4-maverick)
      temperature: 0.0
      max_candidates: 20
    metadata:
      type: llm
      deterministic: false

outputs:
  profile:
    type: object
    outputSource: entity_profiler/parsed
  ranked_results:
    type: array
    outputSource: candidate_ranker/ranked_candidates
  best_match:
    type: string
    outputSource: candidate_ranker/top_candidate
  confidence:
    type: float
    outputSource: candidate_ranker/confidence
