# Simple LLM Pipeline
# A minimal example: single LLM call with input/output
#
# Use this as a starting point for custom workflows.

class: Workflow
cwlVersion: v1.2
id: simple_llm_workflow
label: "Simple LLM"
description: "Single LLM call example"

inputs:
  prompt:
    type: string
    description: "The prompt to send to the LLM"
  system_prompt:
    type: string
    description: "Optional system prompt"
    default: "You are a helpful assistant."

steps:
  - id: llm_call
    run: nodes/LLMNode
    in:
      messages:
        - role: user
          content: "{{user_prompt}}"
      system_prompt: system_prompt
      variables:
        user_prompt: prompt
    out:
      - content
      - model
      - usage
    config:
      model: llama-3.3-70b-versatile  # Groq model
      temperature: 0.7
      max_tokens: 1000
    metadata:
      type: llm
      deterministic: false

outputs:
  response:
    type: string
    outputSource: llm_call/content
  model_used:
    type: string
    outputSource: llm_call/model
  tokens:
    type: object
    outputSource: llm_call/usage
