# Optimizer Single-Pass Workflow
# Linear pipeline: L1GenerateNode → L1EvaluateNode
#
# This workflow runs one optimization pass:
# 1. Generate N candidate PromptState variants via LLM meta-prompt
# 2. Evaluate candidates against eval dataset, select winner
#
# For iterative optimization (multiple passes), see feedback cycling (WP 3.4).

class: Workflow
cwlVersion: v1.2
id: optimizer_single_pass
label: "Optimizer Single Pass"
description: >
  One-shot prompt optimization: generate candidate variants from a provided
  baseline, evaluate against dataset, select winner.

inputs:
  instruction:
    type: string
    description: "Raw prompt instruction text (for alias registration)"
  baseline_prompt_state:
    type: object
    description: "Baseline PromptState (serialized dict) — required"
  eval_data:
    type: array
    description: "Evaluation dataset — list of {query, ground_truth} dicts"
  initial_accuracy:
    type: float
    description: "Baseline accuracy before optimization (0.0 if unknown)"
    default: 0.0

steps:
  - id: grow
    run: nodes/L1GenerateNode
    in:
      prompt_state: baseline_prompt_state
      accuracy: initial_accuracy
      results: []
    out:
      - candidates
      - n_generated
    config:
      provider: groq
      n_variants: 5
      creativity: 0.7
    metadata:
      type: llm
      deterministic: false

  - id: evaluate
    run: nodes/L1EvaluateNode
    in:
      candidates: grow/candidates
      eval_data: eval_data
      baseline_prompt_state: baseline_prompt_state
      baseline_accuracy: initial_accuracy
      baseline_results: []
      baseline_label: "baseline"
    out:
      - winner
      - winner_prompt_state
      - winner_accuracy
      - improved
      - suggestions
      - candidate_scores
    config:
      # backend_url must be set at registration or execution time
      backend_url: ""
      improvement_threshold: 0.01
      generate_suggestions: false
    metadata:
      type: algorithm
      deterministic: false

outputs:
  winner_prompt_state:
    type: object
    outputSource: evaluate/winner_prompt_state
  winner_accuracy:
    type: float
    outputSource: evaluate/winner_accuracy
  improved:
    type: boolean
    outputSource: evaluate/improved
  suggestions:
    type: object
    outputSource: evaluate/suggestions
  candidate_scores:
    type: array
    outputSource: evaluate/candidate_scores
  n_candidates:
    type: int
    outputSource: grow/n_generated
