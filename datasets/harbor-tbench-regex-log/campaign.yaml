campaign_config:
  dataset_name: harbor-tbench-regex-log
  exclude_nodes: []
  scoring:
    # The task's own verifier IS the score. Clamped because the formula's range is a contract the
    # δ ruler and PoBB both read, and a reward is upstream's number — these ten write 0 or 1, but
    # Harbor's channel permits any float and a task that returned 3.0 would silently widen it.
    per_sample: max(0.0, min(1.0, env_reward))
    # NO `per_cell` cost term, deliberately, and this panel is the one that still earns the
    # refusal after its siblings stopped. Exactly ONE cell of it has ever been measured — 292.2 s
    # and $0.0020 — and one cell is not a distribution, so an anchor drawn from it would grade
    # every arm against a single draw and would be indistinguishable from a measured one on the
    # round file. The figure is written here so the omission is checkable rather than asserted.
    #
    # That one cell is also STALE in the same way its siblings' anchors are: it was measured while
    # the injected skill was silently dropped (CRLF frontmatter, fixed 2026-09-12), so 292.2 s and
    # $0.0020 price a NO-SKILL episode. On `spreadsheetbench-s10` the correction roughly doubled
    # the tokens, so treat it as a floor rather than an estimate. The refusal above stands either
    # way — one stale cell is no more a distribution than one fresh one.
    #
    # Add the term once a real campaign has priced the panel; `spreadsheetbench-s10` carries the
    # form to copy, and the census and its recompute path are
    # `docs/operations/dataset-selection-rationale.md` § What a cell costs.
  optimization:
    # Deliberately the smallest geometry that can produce a round at all: this campaign's job is
    # to show the Harbor path carries a real measurement end to end, not to find a better prompt.
    # Widen it after a first run has priced a cell.
    max_rounds: 2
    n_variants: 2
    l1_patience: 3
    degradation_threshold: 0.4
    # A RAIL, not an estimate. Nothing here predicts what an episode costs — the point of the
    # first run is to find that out — and this ceiling exists so finding out cannot cost more
    # than the operator agreed to. Raise it with `set-budget` once the ledger says what a cell is.
    spend_budget_usd: 3.00
