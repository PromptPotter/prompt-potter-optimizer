campaign_config:
  dataset_name: promptpotter-self
  allowed_models:
    - openai/gpt-oss-120b
  # Lift core: what the inner search DELIVERED (final_delta, weighted heaviest) plus how fast it
  # got there and held (after_N_rounds_delta, the same series averaged). Both are theta-logit
  # deltas over the ADOPTED incumbent, so exploring costs nothing — the +0.5/1.5 re-anchor puts a
  # do-nothing campaign at 0.333 and saturates at +1.0 logits, well clear of it. The /20.0
  # efficiency divisor is calibrated to a real inner cell (~$0.07 for a +0.4..+0.9 logit climb =>
  # 6..13): the old /6.0 saturated every campaign that actually worked.
  scoring: >-
    max(0.0, min(1.0, (0.6 * final_delta + 0.4 * after_N_rounds_delta + 0.5) / 1.5)) * (0.85 + 0.15
    * rounds_improved_frac) * max(0.6, cleanliness * diversity_health) * (0.7 + 0.3 * max(0.0,
    min(1.0, delta_per_dollar / 20.0)))
  headline_metric: ability
  # = the panel size in inner_tasks.yaml. Above it the engine warns and the adaptive queue is
  # inert (there is nothing to select from); below it a variant is judged on a subset of cells.
  sp_budget_ttest: 6
  exclude_nodes: []
  pipeline_overrides: {}
  optimization:
    optimizer_set: meta
    prompt_block_catalogue: 'off'
    replicate_survivors: 0
    l1_patience: 2
    max_rounds: 2
    lives:
      start: 2
      cap: 4
    n_variants: 3
    improvement_threshold: 0.02
    degradation_threshold: 0.4
    l2_patience: 2
    l3_patience: 1
    elimination_n_min: 4
    spend_budget_usd: 5.0
    token_budget: null
