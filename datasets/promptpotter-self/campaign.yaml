campaign_config:
  dataset_name: promptpotter-self
  # What an operator may steer the inner optimizer TO on a babysat fork. It listed only
  # gpt-oss-120b while `assets/optimizer/pipeline.yaml` ran deepseek-v4-flash:nitro on all
  # four nodes — so the model actually in use was outside its own campaign's allow-list, and
  # every run silently sat in the taints-the-branch case the gate exists to mark. The list
  # now names what runs; gpt-oss-120b stays because `pipeline.yaml::available_models` still
  # offers it as a sanctioned alternative. Move this list in the SAME commit as the manifest —
  # it and `_MODEL_PROFILES` are the two that do not fail loudly when they lag behind it.
  allowed_models:
    - deepseek/deepseek-v4-flash:nitro
    - qwen/qwen3.8-27b:nitro
    - openai/gpt-oss-120b
  # ONE measurand: what the inner search DELIVERED — a theta-logit delta over the ADOPTED
  # incumbent, so exploring costs nothing. The four-factor composite this replaces is described
  # in `domain/l4/proxies.py`; measured over a 39-cell panel, only this term discriminated
  # between optimizer prompts, and the quality factors carried more seed variance than arm variance
  # while holding authority over the ordering.
  #
  # The re-anchor is LINEAR and only exists because `compile_scorer` refuses an empty formula and
  # `clamp_unit_score` clamps [0,1]. Being linear, the paired estimator's reported effect times
  # 3.0 IS the mean logit lift — a number you can read, not merely order by. The window is set
  # from the banked corpus with headroom at both ends so nothing clips; the previous
  # `(x + 0.5) / 1.5` window clipped the best cell ever measured (+1.405) and held zero cells in
  # its lower third.
  #
  # RE-CHECKED on all 50 banked cells after the measurand became `mean_round_delta` (the window
  # was fitted under the old one, so it was owed a re-fit): lift spans -0.072 to +1.140, landing
  # at fitness 0.309-0.713 — 40% of the window used, ZERO clipped at either end. It survives the
  # change; leave it. Narrowing to use more of the range is what the previous window did, and 5
  # of these 50 cells clear the +1.0 where it clipped. Re-check here, not by intuition, if the
  # measurand moves again.
  # PER-ROUND, over those cell fitnesses: what the edit delivered, PRICED IN TIME. An edit buys
  # its lift by making every inner round longer, and until now nothing charged it for that —
  # round 1 elected an arm 1.43x slower than C0 (704.8s/cell vs 491.5s) for +0.05 accuracy that
  # its own CI could not separate from zero, while the arm that was 0.89x FASTER placed last.
  # The time spread was the only axis carrying signal and the formula was blind to it.
  #
  # 500 is the ANCHOR, near C0's measured 491.5s/cell — and it is deliberately a fixed number
  # rather than the running parent's cost. A parent-relative ratio lets each round cost 1.15x the
  # last and never trip; four such rounds double the clock with every round reading clean. Anchored,
  # the debt is cumulative and a slow arm stays slow. RATIO, not a capped budget: a cap charges
  # slowdowns but pays nothing for speed, which lands the 0.89x arm level with a 1.15x one.
  # Re-fit it here if the inner round budget moves; a stale anchor silently stops charging.
  scoring:
    per_sample: max(0.0, min(1.0, (mean_round_delta + 1.0) / 3.0))
    per_round: max(0.0, min(1.0, accuracy * 500.0 / max(1.0, mean_latency_s)))
  headline_metric: ability
  # = the panel size in inner_tasks.yaml. Above it the engine warns and the adaptive queue is
  # inert (there is nothing to select from); below it a variant is judged on a subset of cells.
  sp_budget_ttest: 6
  exclude_nodes: []
  pipeline_overrides: {}
  optimization:
    optimizer_set: self_optimizing
    prompt_block_catalogue: 'off'
    l1_patience: 2
    # Priced against `spend_budget_usd`, not intuition: C0 costs ~$0.47 for the 6-cell panel and a
    # 3-variant round runs ~2.3 arms to completion (PoBB refunds the rest), so an optimizing round
    # is ~$1.08. 4 lands at ~$3.7 of the $5.00 ceiling; 5 would halt mid-round on budget rather
    # than on the cap.
    #
    # It must also be falsifiable. Against an outer SE of ~0.056 logits a challenger has to move
    # `mean_round_delta` by >0.113 to read as real, and ONE optimizing round is a coin toss rather
    # than a test of that.
    max_rounds: 4
    # No `lives` block, and its absence is deliberate rather than an omission. It read
    # `start: 2` against `max_rounds: 2`, so the bank could not reach zero before the
    # calendar did: hearts NEVER bound, they only relabelled the stop. `af6252` stopped
    # `lives_exhausted` on round 2, which is also exactly where `max_rounds` would have
    # ended it, and nothing in the record says which fact stopped the run. Deleting the
    # inert knob changes no round, only the reason it reports. Re-add it with real
    # headroom (`start` well under `max_rounds`) when the outer loop runs long enough for
    # a measurement-driven brake to mean something — `run_preflight_checks` warns
    # (`config.lives_no_headroom`) if it goes back in without it.
    # Affordable rather than merely tolerable, and the inner cycles are why: PoBB cut an arm in
    # 14 of 17 inner rounds, so a 3-variant round runs ~2 arms to completion and the third is
    # mostly refunded. That is `elimination_n_min` earning its keep.
    n_variants: 3
    # On the fitness scale, so it moves with the re-anchor above: the window widened from 1.5 to
    # 3.0, which halves the fitness distance a given logit lift covers. Carrying the old value
    # across would have silently doubled the bar. Calibration for what it must NOT reject, from
    # the inner cycles: a WINNING inner round buys 1-4 rows in 28 (+0.036 / +0.071 / +0.107 /
    # +0.143 are the only positive values ever recorded) and 10 of 17 rounds bought exactly zero.
    # Improvement here is granular and infrequent by nature; a bar that rejects a 1-row win
    # rejects most real wins.
    degradation_threshold: 0.4
    l2_patience: 2
    l3_patience: 1
    elimination_n_min: 4
    # Per-campaign, NOT the global default (0.15, whose false-cut curve was measured on the
    # general round corpus). Here one candidate-cell is a whole inner campaign, so the two
    # errors are priced very differently: a false cut loses one arm of a 3-variant round,
    # while a false survival spends the rest of a 6-cell panel on an arm already losing.
    # Racing at the global epsilon captured about a quarter of the headroom its own p_best
    # stream offered on `promptpotter-self__af6252`.
    pobb_epsilon: 0.30
    spend_budget_usd: 5.0
    token_budget: null
