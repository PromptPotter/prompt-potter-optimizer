name: PromptPotter-self
version: v0.1
description: >-
  Optimizer-of-the-optimizer — outer PromptPotter cycle mutates the inner optimizer's own prompts.
  Each outer 'sample' runs an inner cycle on a cheap proxy benchmark (configured per inner_tasks.yaml).
  See docs/specs/l4-outer-loop.md.
backend_name: PromptPotter
backend_type: promptpotter
available_models:
  - openai/gpt-6-luna
  - deepseek/deepseek-v4-flash:nitro
  - qwen/qwen3.8-27b:nitro
  - openai/gpt-oss-120b
# No `nodes:` and no `pipelines:`: the graph is the inner optimizer's, which the connector serves
# (`runner/inner/tasks.py::InnerCells.pipeline`) — every llm node the manifest the cells run
# declares, on that manifest's walks. This file overlays it as any dataset overlays its backend.
