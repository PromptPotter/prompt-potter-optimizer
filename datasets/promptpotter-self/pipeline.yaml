name: PromptPotter-self
version: v0.1
description: >-
  Optimizer-of-the-optimizer — outer PromptPotter cycle mutates inner PromptPotter's L1/L1_CRITIQUE/L2/L3
  optimizer prompts. Each outer 'sample' runs an inner cycle on a cheap proxy benchmark (configured per inner_tasks.yaml).
  See docs/specs/l4-outer-loop.md.
backend_name: PromptPotter
backend_type: promptpotter
available_models:
  - deepseek/deepseek-v4-flash:nitro
  - qwen/qwen3.8-27b:nitro
  - openai/gpt-oss-120b
# No node declares `prompt_info`, deliberately: none of these accepts a rendered target
# prompt. The mutation surface IS `optimizer.param_keys` — each node's own PromptTemplate
# fields, merged onto the manifest base by `resolve_node_override`. Declaring it made
# `prompt_node_names()` name them, so `to_job_search_point` wrote the outer searchpoint's
# render into `pipeline_params` where the connector drops it: an inert lever the generator
# was still offered, beside a `CURRENT PROMPT` panel that showed it and nothing else.
#
# `problem_description` and `answer_format` are absent from every `param_keys` for the
# reason a lever is never advertised and then forbidden: they carry the injection slots and
# the output contract, so an edit there severs a channel rather than steering one. That was
# prose in `assets/optimizer/sets/self_optimizing.yaml` asking the generator not to; it is now a
# surface it cannot reach.
nodes:
  l1_generate:
    type: optimizer_prompt
    runtime: in_process
    node_role: candidate_source
    description: >-
      Inner cycle's L1-generate optimizer prompt — produces inner candidate variants from inner panels (critique,
      escalation_panel, axis_memory, origin_strengths).
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - output_schema_field_names
      param_types:
        output_schema_field_names: object
      param_allowed_values: {}
      observation_name: l1_generate
      observation_mappings: []
      langfuse_type: generation
  l1_score:
    type: measurement
    runtime: in_process
    node_role: ''
    description: >-
      Scores the inner candidates l1_generate produced. Declared so the pipeline reads as the chain it
      actually runs; it carries no prompt and no tunable param, so the optimizer cannot move it and the
      surface draws it locked. Adding it left every other node's tunable set byte-identical, which is
      why it does not re-key banked measurements.
    config: {}
  l1_critique:
    type: optimizer_prompt
    runtime: in_process
    node_role: ranker
    description: >-
      Inner cycle's L1-critique optimizer prompt — narrates score deltas and proposes negative_critique + suggested_axes.
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - layout
      param_types:
        layout: object
      param_allowed_values: {}
      observation_name: l1_critique
      observation_mappings:
        - pipeline_key: final_ranking
        - pipeline_key: mean_round_delta
      langfuse_type: generation
  l2_context:
    type: optimizer_prompt
    runtime: in_process
    node_role: enricher
    description: Inner cycle's L2 optimizer prompt — refines task_context on inner-L1 stall.
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - layout
      param_types:
        layout: object
      param_allowed_values: {}
      observation_name: l2_context
      observation_mappings: []
      langfuse_type: generation
  l3_plan:
    type: optimizer_prompt
    runtime: in_process
    node_role: enricher
    description: Inner cycle's L3 optimizer prompt — replans strategy on inner-L2 stall.
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - layout
      param_types:
        layout: object
      param_allowed_values: {}
      observation_name: l3_plan
      observation_mappings: []
      langfuse_type: generation
  checkin:
    type: optimizer_prompt
    runtime: in_process
    node_role: enricher
    description: >-
      Inner cycle's check-in prompt — resolves the origin the run's lift is then read against.
      NOT yet exercised by a seed: `runner/inner/spawn.py` hands the inner run its origin
      rather than resolving one, so an edit to these fields measures as a no-change until that
      path closes. Declared regardless, so this dataset carries the optimizer's whole node set.
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - answer_format
      param_types: {}
      param_allowed_values: {}
      observation_name: checkin
      observation_mappings: []
      langfuse_type: generation
# Mirrors `promptpotter/assets/optimizer/pipeline.yaml::pipelines` node for node, because this
# dataset IS that optimizer seen as a target: an edit evolved on one layer lifts onto the other
# only while both declare the same graph. Pinned by
# `test_integrity.py::test_the_two_optimizer_manifests_describe_one_graph` — edit one, mirror it.
#
# `default` is the ROUND, not the tunable set. What the outer loop may EDIT is every node under
# `nodes:` (`PipelineSchema.config_nodes`), so `l2_context` and `l3_plan` stay tunable while
# sitting off the chain a round runs.
pipelines:
  checkin:
    - checkin
  default:
    - l1_generate
    - l1_score
    - l1_critique
  l1_round:
    - l1_generate
    - l1_score
  l1_round_with_l1_critique:
    - l1_generate
    - l1_score
    - l1_critique
  l2_escalation:
    - l2_context
    - l1_generate
    - l1_score
    - l1_critique
  l3_escalation:
    - l3_plan
    - l2_context
    - l1_generate
    - l1_score
    - l1_critique
