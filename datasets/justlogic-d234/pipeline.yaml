name: JustLogic-d234
version: v0.1
description: >-
  JustLogic deductive-reasoning benchmark (Chen 2025), depths 2-4 (iid mix). 3-class TRUE/FALSE/Uncertain
  claim evaluation against premises. Routes through TermNorm /matches with the llm_only pipeline.
backend_name: TermNorm
backend_type: termnorm
available_models:
  - openai/gpt-oss-20b:nitro
  - openai/gpt-oss-20b
nodes:
  llm_only:
    type: generation
    runtime: backend
    node_role: ranker
    description: >-
      Direct LLM generation on the TermNorm backend at JustLogic depths 2-4 (iid mix) — a wider inner
      instrument than d23. reasoning_effort=low, ':nitro' for throughput. Adds depth 4 below the d2-3
      cut to lower the origin and widen the optimizable band. The 2026-07-13 recon read d3+ as collapsed-to-Uncertain
      and called it a capability wall; this cut RE-TESTS that as an addressable hedging behaviour the
      loop can correct in the first 2-3 rounds — 'Uncertain' is reserved for genuine indeterminacy, never
      a hedge against difficulty.
    config:
      provider: openrouter
      model: openai/gpt-oss-20b:nitro
      temperature: 0.0
      reasoning_effort: low
      output_schema:
        type: object
        properties:
          reasoning:
            type: string
            description: >-
              Work the logical chain step by step. Identify each premise; track negations, quantifiers
              (all/some/no) and conditionals explicitly; trace premises to the claim. Recheck each step
              against the stated premises before moving on.
          answer:
            type: string
            enum:
              - 'TRUE'
              - 'FALSE'
              - Uncertain
            description: >-
              TRUE when the premises strictly entail the claim; FALSE when they strictly entail its negation;
              Uncertain ONLY when the premises genuinely do not determine the claim either way — never
              as a hedge against difficulty.
        required:
          - reasoning
          - answer
        additionalProperties: false
      answer_field: answer
    optimizer:
      param_keys:
        - temperature
        - max_tokens
        - model
        - reasoning_effort
        - persona
        - task_intent
        - problem_description
        - instruction
        - thinking_style
        - answer_format
      param_allowed_values:
        reasoning_effort:
          - low
      observation_name: llm_only
      observation_mappings:
        - pipeline_key: final_ranking
          output_field: generated_text
          is_llm: true
      langfuse_type: generation
pipelines:
  default:
    - llm_only
