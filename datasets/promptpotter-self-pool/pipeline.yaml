name: PromptPotter-self-pool
version: v0.1
description: >-
  Optimizer-of-the-optimizer over a POOL of environments — each outer 'sample' runs an inner cycle on
  one dataset under one model (inner_tasks.yaml), and a round draws a subset of them.
  See docs/specs/l4-outer-loop.md.
backend_name: PromptPotter
backend_type: promptpotter
available_models:
  - openai/gpt-6-luna
  - deepseek/deepseek-v4-flash:nitro
  - qwen/qwen3.8-27b:nitro
  - openai/gpt-oss-120b
# No `nodes:` and no `pipelines:`, as in `promptpotter-self`: the connector serves the graph.
