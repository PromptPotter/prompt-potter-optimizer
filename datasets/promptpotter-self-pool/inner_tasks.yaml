# A POOL, not a panel: each task is one ENVIRONMENT (a dataset under one model), and a round draws
# `campaign.yaml::sp_budget_round` of them instead of running them all. `promptpotter-self` beside
# this stays the fixed JustLogic panel and is the calibration instrument, so `justlogic-d234` is
# deliberately absent here: what the pool is tuned on never grades it.
#
# The origin is a census of this list, and the round draw ranks on what it measured: each
# environment's level SE and price. The list still runs model-major and dataset-minor, so the
# PREFIX a draw falls back to where rows carry no price spans all three datasets. Append a new
# environment at the END; every cell above it keeps its slot and replays.
#
# A seed is shared by every model on its dataset, so two models answer the SAME rows and the
# dataset's inner ruler links them. No seed here is screened yet: move one only on a settled
# `seed-screen` margin (`promptpotter-self/inner_tasks.yaml` records what an unscreened seed cost).
#
# An environment earns its seat on HEADROOM: its inner origin has to leave rows to win. `gsm8k`
# is out on that ground, measured 2026-10-12 on 30 rows: 90-100% at origin on both models, so no
# inner round could lift and its cells scored noise. `bbeh` (17-30%) takes a second seed for its
# seats, since `aime_2025` (47-60%) holds only the 30 rows one seed already draws.
#
# An inner campaign answers its rows one at a time, so a model's seconds per row decide whether
# its cell is affordable in wall clock at all. REFUSED on that ground, measured 2026-10-12:
# xiaomi/mimo-v2.6-flash (route xiaomi; 98 s a row on bbeh, 208 s on aime_2025) and
# openai/gpt-oss-120b without `:nitro` (58 s a row on bbeh), and mistral-small-3.2 on aime_2025
# (70 s a row), bbeh (18 s) and gsm8k (7 s: its cells took 1678-1800+ s against the 1800 s cell
# envelope, and the third was cut, holing its round). Unmeasured, so not in the pool:
# deepseek/deepseek-v4.1-flash (route relace), z-ai/glm-5.3-flash (route relace),
# inception/mercury-2.5, qwen/qwen3.7-flash (route alibaba).
inner_benchmark: bbeh
inner_benchmark_config:
  # Cut below the calibration panel's 28 / 40 / 4 to make a census affordable: a cell here is a
  # shorter search read on fewer rows, so its lift is not comparable to a calibration cell's.
  # `aime_2025` holds 30 rows, which is what sets the origin count for every dataset.
  # Two rounds is the floor the law allows, and a terminal run scores cells one at a time, so
  # the round count is what a census costs in wall clock. No `inner_lives`: at two rounds the
  # bank cannot drain before the cap, so it would only relabel the stop.
  n_samples_per_inner_round: 24
  n_samples_origin: 30
  max_inner_rounds: 2
  # Every knob the three datasets' own `campaign.yaml` set differently is stated here, since one
  # pool measures ONE inner optimizer configuration and run init refuses a pool that resolves two.
  inner_nodes:
    l1_generate:
      config:
        n_variants: 3
    pobb:
      config:
        epsilon: 0.3
    escalation:
      config:
        l1_patience: 2
        l2_patience: 2
        l3_patience: 1
  inner_optimizer_temperature: 0.0
# `inner_route_order` pins the host where a model's price or behaviour is one host's: read the
# name off `served_by` in a ledger, never from a catalogue.
tasks:
  - id: bbeh/gpt-oss-20b
    inner_dataset: bbeh
    inner_model: openai/gpt-oss-20b:nitro
    inner_provider: openrouter
  - id: aime_2025/gpt-oss-20b
    inner_dataset: aime_2025
    inner_model: openai/gpt-oss-20b:nitro
    inner_provider: openrouter
  - id: bbeh-s1/gpt-oss-20b
    inner_dataset: bbeh
    inner_dataset_seed: 1
    inner_model: openai/gpt-oss-20b:nitro
    inner_provider: openrouter
  - id: bbeh/gpt-oss-120b-nitro
    inner_dataset: bbeh
    inner_model: openai/gpt-oss-120b:nitro
    inner_provider: openrouter
  - id: aime_2025/gpt-oss-120b-nitro
    inner_dataset: aime_2025
    inner_model: openai/gpt-oss-120b:nitro
    inner_provider: openrouter
  - id: bbeh-s1/gpt-oss-120b-nitro
    inner_dataset: bbeh
    inner_dataset_seed: 1
    inner_model: openai/gpt-oss-120b:nitro
    inner_provider: openrouter
