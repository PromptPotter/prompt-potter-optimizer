name: HotPotQA
version: v0.1
description: Multi-hop QA — prompt optimization via TermNorm /matches with the llm_only pipeline.
backend_name: TermNorm
backend_type: termnorm
available_models:
  - openai/gpt-oss-120b
nodes:
  llm_only:
    type: generation
    runtime: backend
    node_role: ranker
    description: >-
      Direct LLM generation on the TermNorm backend. Context passages + question -> short answer.
    config:
      model: openai/gpt-oss-120b
      temperature: 0.0
      reasoning_effort: medium
    optimizer:
      param_keys:
        - model
        - temperature
        - max_tokens
        - reasoning_effort
        - persona
        - task_intent
        - problem_description
        - instruction
        - thinking_style
        - answer_format
      param_allowed_values:
        reasoning_effort:
          - none
          - default
          - low
          - medium
          - high
      langfuse_type: generation
pipelines:
  default:
    - llm_only
