name: SpreadsheetBench (20-task search cut)
version: v0.0
description: >-
  Twenty SpreadsheetBench tasks run as containerized agent episodes through Harbor. One cell is one
  whole episode: the agent opens a workbook in a container, edits it, and the task's own verifier
  recalculates the formulas and compares the output cell by cell. What PromptPotter mutates is
  the Agent Skill injected into that container.
backend_name: Harbor
backend_type: harbor
available_models:
  - qwen/qwen3.7-flash
nodes:
  agent:
    type: agent
    runtime: backend
    description: >-
      One Harbor trial. The rendered prompt becomes `SKILL.md` in the container, which `terminus-2`
      discovers and reads before acting — or, under `config.skill_delivery: system_prompt`, the
      head of the agent's own prompt. Everything else about the episode — instruction,
      workbook, verifier — belongs to the upstream task and is not ours to tune.
    # Why each cap is set: `spreadsheetbench-s10/pipeline.yaml`. Model, route and effort are what the
    # Qwen campaign on s10 (`spreadsheetbench-s10__679488`) ran its origin with, so this panel's C0 is
    # that configuration and the ten cells it shares with s10 replay rather than re-measure.
    config:
      provider: openrouter
      model: qwen/qwen3.7-flash
      route_order:
        - alibaba
      reasoning_effort: none
      temperature: 0.0
      max_turns: 20
      max_tokens: 4096
      max_input_tokens: 49152
      enable_summarize: false
    # Load-bearing: without `prompt_info` no SKILL.md is produced and every arm runs as no-skill.
    prompt_info:
      family: harbor_agent_skill
      template_variables: []
      description: The Agent Skill, as SKILL.md in the trial container or in the agent's prompt
    optimizer:
      param_keys:
        - persona
        - task_intent
        - problem_description
        - instruction
        - thinking_style
        - answer_format
        - temperature
      observation_name: agent
      observation_mappings:
        - pipeline_key: env_reward
          output_field: env_reward
          is_llm: true
        - pipeline_key: skill_opened
          output_field: skill_opened
pipelines:
  default:
    - agent
