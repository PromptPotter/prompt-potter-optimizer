name: SealQA LongSeal (12-document haystack)
version: v0.0
description: >-
  SealQA's LongSeal at the 12-document haystack, run through Harbor. One cell is ONE containerized
  episode carrying the whole haystack in its instruction: the question arrives with twelve
  automatically-retrieved documents whose results are conflicting or unhelpful, and the answer has
  to be found among them. No search tool and no network — the documents are given, which is what
  makes LongSeal the tractable SealQA variant.

  SINGLE-STEP ON PURPOSE, and that is what this dataset is for. The published LongSeal numbers are
  for a single-turn long-context setting, so imposing a protocol on the episode would make the
  number ours rather than the paper's. `sealqa-longseal-12-2step` is where a declared
  `retrieve -> answer` protocol and its per-step measurement live; this one is the anchor that
  says our instrument did not move the task, and without it that config's per-step result has
  nothing to be read against.
backend_name: Harbor
backend_type: harbor
available_models:
  - qwen/qwen3.7-flash:nitro
nodes:
  agent:
    type: generation
    runtime: backend
    description: >-
      One Harbor episode. The rendered prompt becomes `SKILL.md` in the container and `terminus-2`
      discovers it before acting; the question, the haystack and the answer path arrive from the
      task's own instruction. So what evolves is HOW to read conflicting documents, never which
      documents are shown.
    config:
      # `provider` is separate from `model` by this repo's convention, and the connector composes
      # the two into the single slug Harbor wants (its prefix IS the provider).
      provider: openrouter
      # The arm's model, and deliberately NOT the graders' — `campaign.yaml::judges` names its own,
      # so the ruler does not move when this does.
      #
      # `:nitro` pins the routing to ONE provider instead of OpenRouter's pool. On a panel whose
      # cell is a multi-turn agent episode that is a measurement decision, not a speed one: pooled
      # routing lets two cells of the same arm run on different serving stacks, and the arm's θ
      # then carries that spread. It moves the PRICE too, so read `served_by` and the spend line
      # back off the first round rather than assuming this cell still costs what the last cut did.
      model: qwen/qwen3.7-flash:nitro
      temperature: 0.0
      max_turns: 4
    # DECLARED here rather than inherited, and it is load-bearing: a `remote_http` backend serves
    # its own schema over `GET /pipeline`, so a termnorm dataset can leave this out. There is no
    # server here to ask. Without `prompt_info` this node is not prompt-bearing, the candidate's
    # rendered prompt is never written into its config, no SKILL.md is produced, and every variant
    # scores identically as no-skill — a flat ruler that looks like "the prompt does not matter"
    # and raises nothing.
    prompt_info:
      family: harbor_agent_skill
      # None. The skill is standalone prose the agent reads; the question and its documents arrive
      # from the task instruction, so there is no placeholder for us to substitute into.
      template_variables: []
      description: The Agent Skill injected into the trial container as SKILL.md
    optimizer:
      param_keys:
        - persona
        - task_intent
        - problem_description
        - instruction
        - thinking_style
        - answer_format
        - temperature
      # `max_turns` is deliberately NOT tunable and stays pinned in `config` above. It is the one
      # axis here that moves a cell's cost by an order of magnitude, so it wants a bounded range —
      # and `param_allowed_values` is a string enum, which cannot express one for an integer. An
      # unbounded integer axis would be a cost rail removed rather than a search axis added.
      #
      # 4, not 10, and the bound is where the WORK stops rather than where the agent gives up.
      # UNITS: `max_turns` counts AGENT turns; `pipeline_data.turns` also carries the user message
      # we handed the agent, so counting its length reads one high — the 11-entry episodes banked
      # under the old cap of 10 are what pin the two scales together. Recounted in agent turns over
      # 789 cells: 84.8% finish in 2, 91.1% by 3, and the 3-turn bucket scores best (0.480 on 50).
      # Past that it collapses — 0.019 on the 54 four-turn cells, a flat 0.000 on every deeper
      # bucket — so a long cell here is a LOST cell, not a working one. Capping moved headline
      # accuracy 0.273 -> 0.268. OPEN: that same table argues for 3, which would drop the 4-turn
      # bucket's spend for ~nothing. The number belongs to this dataset alone: its siblings run 20
      # and 30 and no equivalent distribution has been pulled for either, so do not cap them by
      # analogy. This value is inside `node_configs`, so changing it re-keys the archive — which is
      # correct, a 4-turn cell is not the same measurement as a 10-turn one, and it is why the 3
      # above is the operator's call rather than a comment's.
      observation_name: agent
      observation_mappings:
        # The verifier's number, and the only observation this node emits. The connector declares
        # this key in `required_observation_keys`, so init RAISES if the mapping is missing rather
        # than dropping the reward in silence and grading a measurement it never received.
        #
        # It reports whether the episode left an answer to grade, NEVER whether the answer is
        # right: the gold is held outside the container so the agent's environment cannot contain
        # what it is asked for. `campaign.yaml` grades correctness against that gold.
        #
        # `is_llm` marks the mapping the node's LLM spend is attributed through — it is what makes
        # `nodes.agent.config.model` REQUIRED (`pipeline_resolve.py`), so a measurement can never
        # be attributed to whichever model happened to be configured.
        - pipeline_key: env_reward
          output_field: env_reward
          is_llm: true
      langfuse_type: generation
pipelines:
  default:
    - agent
