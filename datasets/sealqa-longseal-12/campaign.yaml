campaign_config:
  dataset_name: sealqa-longseal-12
  exclude_nodes: []
  # θ decides every round, and `per_round_resubset` is ON, so accuracy is subset-relative while the
  # gate is not. Headline the number the gate actually used rather than the one that moves when the
  # subset does — preflight raises `headline_subset_relative_under_resubset` for as long as this
  # reads `accuracy`. DISPLAY scope: it changes what the operator READS, never what is decided.
  headline_metric: ability
  scoring:
    # The ANSWER step alone decides the round — the screen the two evidence rubrics were declared
    # for has run and is written up beside `judges` below.
    #
    # Naming a judge term here is SAFE: a grading that fails past its retry resolves the row
    # UNSCORED, which keeps its `pipeline_data` and stays out of every denominator
    # (`formula/rescore.py`). So this is a choice about which grader wins the round, not a rail.
    #
    # `env_reward` is deliberately NOT here even though the connector always emits it. On this
    # dataset it reports whether the episode left an answer file at all — the gold is held outside
    # the container, so a verifier inside it cannot decide correctness — and scoring it would grade
    # every arm that wrote a file as perfect. It is read as instrument health, not as the score.
    per_sample: label_match(predicted, ground_truth)
    # Cost is charged in TOKENS, not seconds — justlogic's argument holds here and harder. An
    # episode's wall clock is `turns x per-turn latency`, and only the first factor is the
    # prompt's: the same panel reads 48.6s at p50 and 710.7s at its worst, so charging seconds
    # would charge the provider's weather and would punish the origin for replaying cached rows
    # that carry an older run's `step_timings`.
    #
    # ⚠️ STALE, and knowingly left in place. Every cell behind this figure was measured while the
    # injected skill was silently dropped (CRLF frontmatter, fixed 2026-09-12), so it prices a
    # NO-SKILL episode. On `spreadsheetbench-s10` the same correction roughly doubled the median.
    # Not guessed at: re-pinning needs this dataset's own origin re-measured, and a number invented
    # here would be a third answer disagreeing with both the old rows and the future ones.
    #
    # 21301 is C0's median `input + output` across `step_tokens` on this dataset+model, over the
    # 185 origin-labelled rows in the workspace archive; the panel's own median is 22035 over 861
    # rows and its p90 is 45438. So the origin sits at ~1.0x and only GROWTH past it is charged.
    # Half-weight and no knee, so a cell one token over the line is not punished. Re-pin it on any
    # model change — it is a typed constant standing in for an origin-relative term. Census and
    # the recompute path: `docs/operations/dataset-selection-rationale.md` § What a cell costs.
    #
    # `per_cell` rather than folding it into `per_sample`: a correct-but-expensive answer must stay
    # a HIT, or L1 is sent to repair reasoning that was right.
    per_cell: max(0.0, min(1.0, fitness * 21301.0 / (21301.0 + 0.5 * max(0.0, tokens - 21301.0))))
  # The judge schema — the answer step alone — keyed by the term the formula reads.
  #
  # The ANSWER step is `sealqa`, and using SealQA's own published auto-rater is the point: it is
  # what the paper's numbers were produced with, so our number can sit beside theirs. It grades
  # against the gold, which this bank HAS — `harbor_tasks.yaml` declares an `answer` per task, so
  # `_extract_experiment` yields it as `ground_truth` and every `needs_gold` judge stays alive.
  # A harbor bank is normally verifier-graded with no gold, and there they would all be skipped.
  #
  # Their models are declared HERE and inherited from nowhere — not from `available_models`, not
  # from `nodes.agent.config`. A ruler that moved with whatever the search was last steered to
  # would not be one.
  judges:
    # No per-cell judge (evidence settled, answer grounded): it grades the CELL, not the arm, so it
    # saturates and cannot separate arms. The haystack usually holds the answer; the failure is the
    # agent's reading. Re-test that only with a judge graded once per cell, never per arm.
    answer_correct:
      name: sealqa
      stages:
        - model: openai/gpt-oss-120b
          provider: openrouter
  # NEITHER budget is declared — both take the package default (origin 40, round 20). Raising them
  # was priced and did not pay: at the measured ~10% origin rate, a 10%->15% candidate ranks above
  # its parent 0.68 of the time on 20 cells and 0.75 on 40, so doubling the round budget buys +0.07
  # for double the wall clock. Re-price this against the rate an arm actually lands on before
  # raising either — a rate near the paper's 26-33% band moves these numbers a long way.
  optimization:
    # The instrument check is DONE (origin 5% label_match / 10% `answer_correct`, err=0.000). These
    # rounds search.
    max_rounds: 3
    n_variants: 2
    l1_patience: 3
    degradation_threshold: 0.4
    # Wall clock is the real budget here, not money: a cell is $0.0015, so three rounds cost well
    # under a dollar (per-cell latency: the p50 under `scoring` above). This rail only stops a runaway.
    spend_budget_usd: 5.00
