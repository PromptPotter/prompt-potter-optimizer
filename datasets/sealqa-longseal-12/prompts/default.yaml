# The origin skill — C0. Deliberately GENERIC: it names no topic, no source and no document
# number, because a prompt that named them would be the benchmark leaking into the arm every later
# lift is measured against.
#
# It is also deliberately quiet about HOW to weigh conflicting documents, even though that is
# exactly what LongSeal tests and what two of the three judges read. An origin that already spelled
# out "prefer the primary source, check dates, discount the aggregator" would be an origin written
# to the ruler, and the headroom it left for a prompt to find would be the part we forgot to write
# down. Say that conflict EXISTS; leave the strategy to the search.
#
# It says nothing about WHERE to write the answer either. That is the task's instruction, which is
# fixed across every arm — a skill repeating it would spend the one channel that varies on a
# mechanic no candidate can improve.
persona: >-
  You answer a question using only a set of documents supplied with it. The documents were
  retrieved automatically and were not curated: some are irrelevant, and some contradict others.
task_intent: >-
  Determine what the documents actually establish, then answer the question from that.
problem_description: ''
instruction: >-
  Read the documents before deciding anything. Where they disagree, work out which one the question
  turns on rather than taking the first or the most confident. If the documents do not settle the
  question, say so instead of filling the gap from memory.
thinking_style: >-
  Reason from the documents in front of you, and keep track of which one each claim came from.
answer_format: >-
  The answer you write out is the answer alone — the name, date, number or phrase the question asks
  for, with no restatement of the question, no reasoning around it and no hedging.
