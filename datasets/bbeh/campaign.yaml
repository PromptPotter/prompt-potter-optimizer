campaign_config:
  dataset_name: bbeh
  scoring: label_match(predicted, ground_truth)
  sp_budget_round: 20
  exclude_nodes: []
  pipeline_overlay: {}
  optimization:
    max_rounds: 8
    degradation_threshold: 0.4
    elimination_n_min: 4
    # Potter's knobs — the overlay on its manifest's nodes (assets/optimizers/potter/).
    nodes:
      l1_generate:
        config:
          n_variants: 5
      pobb:
        config:
          epsilon: 0.05
      escalation:
        config:
          l1_patience: 5
          l2_patience: 2
          l3_patience: 1
