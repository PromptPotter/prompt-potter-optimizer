reason: >-
  V1 — Prompt-first discipline. Past BBEH cycle stagnated by spending rounds on temperature/reasoning_effort
  while the only +5pp lift came from a task_intent rewrite (cycle_2e758cd9442f round 2). Force L1 to spend
  its variant budget on prompt strings before parameters.
brief: >-
  Mutation budget rule: at least 60% of this round's variants must change a prompt string field (persona,
  task_intent, instruction, thinking_style, answer_format). Node parameters (temperature, reasoning_effort,
  max_tokens) may only be mutated after the batch already contains at least 3 prompt-string variants.
  If the previous round's winner mutated a specific prompt field, at least 3 variants this round must
  mutate that same field — exhaust the winning axis before exploring.
