reason: >-
  Crossover #09: D002's 3-step answer_format (proven +21pp on this family, n=20) + anti-'unknown'-cop-out
  gene (new, derived from miss-pattern analysis: 94 of 189 family-wide misses are pred='unknown' when
  gt is proved (37x) or disproved (57x); 80% wrong-rate when the model picks 'unknown'). Single-gene perturbations
  have stalled at +21pp; a 2-gene composition targeting the dominant failure mode is the next move.
brief: >-
  Crossover hypothesis: the strongest measured surface in this family (diag_002, +21pp over the 0.45 origin)
  used a TIGHT 3-step answer_format — '1. step-by-step reasoning (max 3 steps), 2. final answer in **bold**
  on its own last line, 3. no trailing text'. The dominant failure mode (94 of 189 family misses, ~50%
  of the miss mass) is the model defaulting to 'unknown' when ground truth is proved or disproved. EVERY
  round-1 variant MUST jointly: (a) constrain answer_format to a tight 3-step structure modeled on D002's,
  AND (b) include in the instruction or thinking_style an explicit clause that forbids 'unknown' as a
  give-up fallback — 'unknown' is reserved ONLY for cases where the rule system genuinely lacks a derivation
  path. If even one applicable rule fires on the question's facts, commit to proved or disproved. Do NOT
  produce variants that perturb only one of these two axes.
l1_section_overrides_text:
  task_context: >-
    BBEH dataset miss-pattern profile (n=298 measurements scanned across this family, 36.6% hit rate):
    the dominant failure mode (94 misses, 31% of all measurements) is the model picking 'unknown' when
    ground truth is 'proved' (37x) or 'disproved' (57x). Counter-intuitive datapoint: when the model COMMITS
    to proved/disproved, it is correct ~60% of the time. When it picks 'unknown', it is correct only 20%
    of the time. The model treats 'unknown' as a give-up valve. Forcing commitment is the highest-leverage
    move available. BBEH problems are rule-heavy (Rule1...Rule20+ commonly stated in the question prose),
    so most 'unknown' picks indicate the model abandoning the rule trace, not a genuine non-derivation.
