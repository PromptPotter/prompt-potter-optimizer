name: Screen Taste (v0)
version: v0.0
description: >-
  Ten films or series someone likes go in beside a slate of ten candidates; the slate comes back
  ordered. Single llm_only generation node against TermNorm /matches, scored by where the one
  held-out favourite hidden in the slate lands.
backend_name: TermNorm
backend_type: termnorm
available_models:
  - openai/gpt-oss-20b:nitro
nodes:
  llm_only:
    type: generation
    runtime: backend
    node_role: ranker
    description: >-
      Direct LLM generation: read the liked titles, return the slate ordered, best first.
      reasoning_effort floored at low — the optimizer can raise it within the allowed set if it pays.
    config:
      provider: openrouter
      model: openai/gpt-oss-20b:nitro
      temperature: 0.0
      reasoning_effort: low
    optimizer:
      param_keys:
        - temperature
        - max_tokens
        - reasoning_effort
        - persona
        - task_intent
        - problem_description
        - instruction
        - thinking_style
        - answer_format
      param_allowed_values:
        reasoning_effort:
          - none
          - default
          - low
      observation_name: llm_only
      observation_mappings:
        - pipeline_key: final_ranking
          output_field: generated_text
          is_llm: true
      langfuse_type: generation
pipelines:
  default:
    - llm_only
