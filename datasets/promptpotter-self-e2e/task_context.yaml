domain: Prompt engineering and self-optimization for LLM pipelines
pipeline_purpose: >-
  Automatically evolve PromptPotter's optimizer prompt templates to accelerate inner-cycle convergence on
  the JustLogic deductive-reasoning benchmark (TRUE/FALSE/Uncertain; the depth cut is the dataset's, in
  inner_tasks.yaml).
data_characteristics: >-
  Each sample is a whole inner run; the mutation surface is four prose fields per inner node plus per-node
  panel layouts, and fitness is noisy numeric deltas from a small inner panel, so edits move the score but
  improvement is real and infrequent.
optimization_goals: >-
  Maximize mean_round_delta (the MEAN, over inner rounds, of the ability the parent that
  round ADOPTED, minus its origin, in logits) on the inner benchmark. That is the whole score,
  and it averages the staircase rather than reading its last step: a lift bought in round 1 is
  worth more than the same lift bought in round 4. So winning edits make the inner optimizer
  diagnose its own observed failures FASTER, reading from its critique and transcripts.
key_challenges: >-
  Outer candidates drift into a single recycled hypothesis instead of grounding each edit in the specific
  inner failure the critique and transcripts show; noisy fitness from a small inner panel makes that drift
  easy.
upstream_context: >-
  Outer optimization loop generates mutation proposals for optimizer prompt fields; inner cycle executes with
  current optimizer prompts to produce outputs and compute scores.
downstream_context: >-
  Composite fitness scores are aggregated to select the best optimizer prompt configurations for the next outer
  iteration.
raw_description: |
  # Task: evolve PromptPotter's own optimizer prompts

  Goal: the outer cycle mutates the **inner** cycle's L1 / L1_CRITIQUE / L2 / L3
  optimizer prompts (four prose fields per inner node plus per-node panel layouts) so inner cycles
  converge **faster and further** on the proxy benchmark.

  ## What the inner cycle is solving (so you mutate toward the right behaviour)

  The inner benchmark is **justlogic deductive reasoning** (NOT
  arithmetic; the specific depth mix is the dataset's, in `inner_tasks.yaml` — not
  restated here, where a stale number would only anchor you). Each inner sample is
  a set of premises plus a candidate conclusion;
  the inner model must answer **TRUE / FALSE / Uncertain** — TRUE/FALSE when the
  premises strictly determine the conclusion, `Uncertain` only when they are
  genuinely indeterminate. The task is hard for the inner model *as currently
  prompted*, which is the point: a task it looks bad at is a task it has not been
  tuned for yet, not a task with a low ceiling. Assume the room to improve is
  large. The goal is to improve, not to reach any particular number — there is no
  target score, and nothing here counts rounds to one.

  Do NOT assume a failure mode — read one from the evidence. The critique and
  sample transcripts show what the inner loop actually did (which candidates it
  generated, what its critique diagnosed, where its rounds stalled); each outer
  candidate must name the observed inner deficiency it attacks. Note the label
  space is three-way and ground-truth labels include genuine `Uncertain` cases —
  an edit that suppresses one answer class trades one error class for another.
  Mutate the inner optimizer prompt fields to make the inner *optimizer* better at
  finding the discipline; do not hard-code task answers into it.

  ## Fitness

  ONE number, in ``campaign.yaml::scoring``:

  - ``mean_round_delta`` — the mean, over the inner rounds, of the ability the
    parent that round ADOPTED, minus where the search started; in logits on one
    difficulty-adjusted ruler. Linearly re-anchored into [0,1].

  Better = the inner optimizer adopted a stronger prompt EARLY and kept it. The mean
  rewards the shape a healthy search has — most cells lift in round 1, about half
  again in round 2, the stragglers land in round 3, thinning as they saturate — and a
  search that flatlines for three rounds then jumps scores below one that climbed
  steadily to the same place. There is no quality modulator and no efficiency
  modulator: a campaign that breaks its own measurement is floored, and a collapsed
  arm is eliminated — both structurally, before scoring. So do not optimize for
  looking tidy or cheap; optimize for the inner search climbing sooner.

  ## Mutation surface

  - Per-node prose fields: ``persona``, ``task_intent``, ``instruction``,
    ``thinking_style`` — plus a panel ``layout`` on the nodes that declare one
  - The per-node set is ``pipeline.yaml::nodes.{node}.optimizer.param_keys``;
    outer L1 may mutate any subset per round
  - ``problem_description`` and ``answer_format`` carry the injection slots and
    output contract, so they are not levers
  - Out of scope (belongs to inner cycle): inner ``pipeline_params``,
    inner ``optimizer_llm``

  ## Intuition (don't bake in — algo should rediscover)

  - Dimensionality is non-uniform across the fields:
    - bool / categorical slot → doubles state space
    - free-prose slot (``instruction``, ``thinking_style``, ...) →
      explodes it → more signal AND more noise per round
  - Corollary: L2 / L3 shouldn't read early variance on a high-dim slot
    as "axis unstable, avoid" — that's the slot doing what high-dim
    slots do

  ## Proxy realism

  The committed inner config (``inner_tasks.yaml`` — the source of truth for the
  inner geometry; don't restate its numbers here) keeps each outer "sample" at
  order-of-minutes. Trade-off is signal quality — bump sample count + rounds before
  publication runs. Cost shape + what remains:
  ``docs/specs/l4-outer-loop.md`` § Cost + § Open.
