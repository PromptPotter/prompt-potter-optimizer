name: PromptPotter-self-e2e
version: v0.1
description: >-
  The browser walk's L4 fixture — the same graph as `promptpotter-self`, run over the degenerate
  one-cell panel in this directory's `inner_tasks.yaml`. It exists to prove the recursion still
  spawns and scores end to end, cheaply enough to run often. It measures nothing.
# A THIRD COPY OF ONE GRAPH, and the cost is real: `promptpotter-self/pipeline.yaml` already
# mirrors the llm nodes of `promptpotter/assets/optimizers/potter/pipeline.yaml`, and this is a
# second mirror of that mirror. Nothing checks the three agree — a node-set comparison would red
# on every rename and never on a wrong number — so an edit to the optimizer manifest has to reach
# all three in the same commit, and a graph that disagrees fails at the first inner round.
#
# It is duplicated rather than shared because a dataset OWNS its pipeline (`datasets/CLAUDE.md`):
# there is no include, and the connector resolves per dataset directory. If a fourth copy is ever
# wanted, that is the signal to build sharing instead of copying again.
backend_name: PromptPotter
backend_type: promptpotter
available_models:
  - deepseek/deepseek-v4-flash:nitro
  - qwen/qwen3.8-27b:nitro
  - openai/gpt-oss-120b
# No node declares `prompt_info`, deliberately: none of these accepts a rendered target
# prompt. The mutation surface IS `optimizer.param_keys` — each node's own PromptTemplate
# fields, merged onto the manifest base by `resolve_node_override`. Declaring it made
# `prompt_node_names()` name them, so `to_job_search_point` wrote the outer searchpoint's
# render into `pipeline_params` where the connector drops it: an inert lever the generator
# was still offered, beside a `CURRENT PROMPT` panel that showed it and nothing else.
#
# `problem_description` and `answer_format` are absent from the four loop nodes' `param_keys` for the
# reason a lever is never advertised and then forbidden: they carry the injection slots and
# the output contract, so an edit there severs a channel rather than steering one. That was
# prose in potter's self-optimizing prompt family asking the generator not to; it is now a
# surface it cannot reach.
nodes:
  l1_generate:
    type: llm
    runtime: in_process
    node_role: candidate_source
    description: >-
      Inner cycle's L1-generate optimizer prompt — produces inner candidate variants from inner panels (critique,
      escalation_panel, axis_memory, origin_strengths).
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - output_schema_field_names
      param_types:
        output_schema_field_names: object
      param_allowed_values: {}
      observation_name: l1_generate
      observation_mappings: []
  l1_score:
    type: measurement
    runtime: in_process
    node_role: ''
    description: >-
      Scores the inner candidates l1_generate produced. Declared so the pipeline reads as the chain it
      actually runs; it carries no prompt and no tunable param, so the optimizer cannot move it and the
      surface draws it locked. Adding it left every other node's tunable set byte-identical, which is
      why it does not re-key banked measurements.
    config: {}
  l1_critique:
    type: llm
    runtime: in_process
    node_role: ranker
    description: >-
      Inner cycle's L1-critique optimizer prompt — distils failure_highlights, a priority_fix and suggested_axes.
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - layout
      param_types:
        layout: object
      param_allowed_values: {}
      observation_name: l1_critique
      observation_mappings:
        - pipeline_key: final_ranking
        - pipeline_key: mean_round_delta
  l2_context:
    type: llm
    runtime: in_process
    node_role: enricher
    description: >-
      Inner cycle's L2 optimizer prompt — moves inner L1's panels (l1_layout) and exploration width
      (l1_overrides) on inner-L1 stall.
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - layout
      param_types:
        layout: object
      param_allowed_values: {}
      observation_name: l2_context
      observation_mappings: []
  l3_plan:
    type: llm
    runtime: in_process
    node_role: enricher
    description: Inner cycle's L3 optimizer prompt — replans strategy on inner-L2 stall.
    config: {}
    optimizer:
      param_keys:
        - persona
        - task_intent
        - instruction
        - thinking_style
        - layout
      param_types:
        layout: object
      param_allowed_values: {}
      observation_name: l3_plan
      observation_mappings: []
# Mirrors the llm and measurement nodes of `promptpotter/assets/optimizers/potter/pipeline.yaml`,
# because this dataset IS that optimizer seen as a target: an edit evolved on one layer lifts onto
# the other only while both declare the same graph — edit one, mirror it in the same commit. Potter's
# sampler, eliminator, selector and controller carry no prompt, so there is nothing here to tune on
# them. Not pinned by a test: a node-id set comparison across two declarations reds on every rename
# and never on a wrong number, and a graph that disagrees fails loudly at the first inner round.
#
# `default` is the ROUND, not the tunable set. What the outer loop may EDIT is every node under
# `nodes:` (`PipelineSchema.config_nodes`), so `l2_context` and `l3_plan` stay tunable while
# sitting off the chain a round runs.
pipelines:
  default:
    - l1_generate
    - l1_score
    - l1_critique
  l2_escalation:
    - l2_context
    - l1_generate
    - l1_score
    - l1_critique
  l3_escalation:
    - l3_plan
    - l2_context
    - l1_generate
    - l1_score
    - l1_critique
