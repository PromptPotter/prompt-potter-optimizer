name: Email Tagging (Pilot)
version: v0.1
description: >-
  Pilot: classify an inbound email into one of four routing categories (financial, actionable, informational,
  other). Single llm_only node against TermNorm /matches, exact-match scoring. Mirrors the
  live n8n subject-classifier-LM tagging decision.
backend_name: TermNorm
backend_type: termnorm
available_models:
  - openai/gpt-oss-20b
nodes:
  llm_only:
    type: llm
    runtime: backend
    node_role: ranker
    description: >-
      Direct LLM generation: read the email, emit one category label.
    config:
      provider: openrouter
      model: openai/gpt-oss-20b
      temperature: 0.0
    optimizer:
      param_keys:
        - temperature
        - max_tokens
        - reasoning_effort
        - persona
        - task_intent
        - problem_description
        - instruction
        - thinking_style
        - answer_format
      observation_name: llm_only
      observation_mappings:
        - pipeline_key: final_ranking
          output_field: generated_text
          is_llm: true
pipelines:
  default:
    - llm_only
