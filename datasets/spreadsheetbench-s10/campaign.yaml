campaign_config:
  dataset_name: spreadsheetbench-s10
  exclude_nodes: []
  scoring:
    # The task's own verifier IS the score. Clamped because the formula's range is a contract the
    # δ ruler and PoBB both read, and a reward is upstream's number — SpreadsheetBench writes 0
    # or 1, but Harbor's channel permits any float and a task returning 3.0 would silently widen
    # it.
    per_sample: max(0.0, min(1.0, env_reward))
    # The screen has now priced the ten, which is the condition this comment used to set. Cost is
    # charged in TOKENS, not seconds, for the reason `justlogic-d234` states and `sealqa` repeats:
    # an episode's wall clock is `turns x per-turn latency` and only the first factor is the
    # prompt's, so seconds charge the provider's weather.
    #
    # 56844 is C0's median `input + output` across `step_tokens`, n=10, re-pinned 2026-09-12 off
    # the first origin this dataset ever measured with the candidate's prompt actually DELIVERED.
    # The previous 29924 was measured on episodes that never opened the injected skill
    # (`connectors/harbor.py::_write_skill` wrote CRLF and terminus-2 dropped the frontmatter in
    # silence), so it priced a no-skill episode: reading the skill roughly DOUBLES the tokens.
    # Distribution here is wide — mean 63291, p90 113243 — and it is bimodal by outcome: every
    # miss is a high-token cell (77k / 113k / 163k) against every hit being lower, so an episode
    # that flails is an episode that burns. Census and the recompute path:
    # `docs/operations/dataset-selection-rationale.md` § What a cell costs.
    #
    # NO `skill_opened` term, and the absence is the decision. It is the OPEN half of this
    # dataset's `open -> adhere` schema and it is banked on every row as a required observation —
    # but on a healthy channel it is constant 1.0 (10/10 on this origin), so charging it here would
    # move nothing when things work and discount every arm UNIFORMLY when they break. That is
    # arithmetically invisible and reads exactly like a real finding, which is the one failure this
    # term exists to make impossible. It is enforced where it can be LOUD instead: the connector
    # warns per cell, and `required_observation_keys` raises at init if a dataset drops the mapping.
    per_cell: max(0.0, min(1.0, fitness * 56844.0 / (56844.0 + 0.5 * max(0.0, tokens - 56844.0))))
  optimization:
    # ORIGIN ONLY. `max_rounds: 0` is the declared "measure round 0 and stop" — this campaign is
    # an INSTRUMENT CHECK, not a search: it answers whether the model lands mid-range on these
    # ten cells. It must not, so it cannot, proceed to round 1: an arm that scores 0 on every
    # cell pins to a floor constant and every lift downstream reads 0.000, and an arm that scores
    # 1 on every cell leaves no room for a prompt to show anything. Either way there is nothing
    # for a round to win on, and finding that out AFTER paying for a round is the mistake this
    # file exists to avoid.
    max_rounds: 0
    n_variants: 2
    l1_patience: 3
    degradation_threshold: 0.4
    # A RAIL, not an estimate. One measured cell of this panel cost $0.0101 on a different model;
    # ten cells of a screen should land far under this, and the ceiling exists so that being
    # wrong about it costs less than the operator agreed to.
    spend_budget_usd: 2.00
