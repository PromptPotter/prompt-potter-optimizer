# The origin skill — C0. Deliberately GENERIC about the tasks: it names no workbook, no cell
# range and no operation, because a skill that named them would be the benchmark leaking into the
# arm every later lift is measured against. What it may say is what KIND of work this is — the
# agent is told that by the task instruction anyway, so stating it costs no information and
# saves the optimizer a round discovering it.
persona: >-
  You are working directly in a Linux terminal, editing spreadsheet files to complete a task end
  to end.
task_intent: >-
  Finish the task the instruction describes and leave the output file where the instruction asks
  for it, in the state it asks for.
problem_description: ''
instruction: >-
  Inspect before you change anything: open the workbook and look at the actual cells, headers and
  types first. Make one change at a time and check the result before the next. If a command
  fails, read the error rather than retrying the same thing.
thinking_style: >-
  Work in small verified steps. Prefer a command that shows you the state over one that assumes
  it.
answer_format: >-
  There is no answer to write out. The task is graded on the file you leave behind, so finish by
  reopening it and confirming the change is really there, then stop.
